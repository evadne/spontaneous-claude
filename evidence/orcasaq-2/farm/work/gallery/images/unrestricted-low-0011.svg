<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a15"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="60%" stop-color="#00ccaa"/>
      <stop offset="100%" stop-color="#005544"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#006655"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Ambient particles -->
  <circle cx="50" cy="60" r="1.5" fill="#00ffcc" opacity="0.3"/>
  <circle cx="350" cy="80" r="1" fill="#00ffcc" opacity="0.4"/>
  <circle cx="80" cy="320" r="1.5" fill="#00ffcc" opacity="0.2"/>
  <circle cx="320" cy="340" r="1" fill="#00ffcc" opacity="0.3"/>
  <circle cx="60" cy="200" r="1" fill="#00ffcc" opacity="0.25"/>
  <circle cx="340" cy="180" r="1.5" fill="#00ffcc" opacity="0.2"/>
  <circle cx="200" cy="30" r="1" fill="#00ffcc" opacity="0.3"/>
  <circle cx="150" cy="370" r="1.5" fill="#00ffcc" opacity="0.25"/>
  <circle cx="270" cy="30" r="1" fill="#00ffcc" opacity="0.35"/>

  <!-- Head shape -->
  <ellipse cx="200" cy="190" rx="105" ry="130" fill="url(#faceGrad)" stroke="#3a3a5a" stroke-width="1.5"/>

  <!-- Circuit traces on face -->
  <g stroke="#00ccaa" stroke-width="0.8" fill="none" opacity="0.6">
    <!-- Left side circuits -->
    <path d="M 145 130 L 145 160 L 160 160"/>
    <path d="M 130 170 L 130 200 L 150 200"/>
    <path d="M 140 230 L 140 260 L 155 260"/>
    <path d="M 160 145 L 160 120 L 175 120"/>
    <path d="M 135 280 L 155 280 L 155 300"/>

    <!-- Right side circuits -->
    <path d="M 255 130 L 255 160 L 240 160"/>
    <path d="M 270 170 L 270 200 L 250 200"/>
    <path d="M 260 230 L 260 260 L 245 260"/>
    <path d="M 240 145 L 240 120 L 225 120"/>
    <path d="M 265 280 L 245 280 L 245 300"/>

    <!-- Forehead circuits -->
    <path d="M 180 105 L 180 120 L 195 120"/>
    <path d="M 220 105 L 220 120 L 205 120"/>
    <path d="M 200 95 L 200 110"/>
    <path d="M 170 115 L 185 115"/>
    <path d="M 230 115 L 215 115"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="url(#nodeGlow)" filter="url(#glow)">
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="150" cy="200" r="2.5"/>
    <circle cx="155" cy="260" r="2.5"/>
    <circle cx="175" cy="120" r="2.5"/>
    <circle cx="155" cy="300" r="2.5"/>
    <circle cx="240" cy="160" r="2.5"/>
    <circle cx="250" cy="200" r="2.5"/>
    <circle cx="245" cy="260" r="2.5"/>
    <circle cx="225" cy="120" r="2.5"/>
    <circle cx="245" cy="300" r="2.5"/>
    <circle cx="195" cy="120" r="2.5"/>
    <circle cx="205" cy="120" r="2.5"/>
    <circle cx="200" cy="110" r="2.5"/>
    <circle cx="185" cy="115" r="2"/>
    <circle cx="215" cy="115" r="2"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <ellipse cx="165" cy="175" rx="22" ry="14" fill="none" stroke="#00ffcc" stroke-width="2"/>
    <ellipse cx="235" cy="175" rx="22" ry="14" fill="none" stroke="#00ffcc" stroke-width="2"/>
    <circle cx="165" cy="175" r="6" fill="url(#eyeGlow)"/>
    <circle cx="235" cy="175" r="6" fill="url(#eyeGlow)"/>
    <circle cx="165" cy="175" r="2" fill="#ffffff"/>
    <circle cx="235" cy="175" r="2" fill="#ffffff"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 145 155 Q 165 148 185 155" stroke="#00ccaa" stroke-width="1.5" fill="none" opacity="0.7"/>
  <path d="M 215 155 Q 235 148 255 155" stroke="#00ccaa" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Nose - subtle circuit trace -->
  <path d="M 200 195 L 200 215 L 192 220" stroke="#00ccaa" stroke-width="1" fill="none" opacity="0.5"/>
  <circle cx="192" cy="220" r="1.5" fill="#00ccaa" opacity="0.5"/>

  <!-- Mouth - gentle smile -->
  <path d="M 180 245 Q 200 258 220 245" stroke="#00ffcc" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#glow)"/>

  <!-- Neck and shoulders -->
  <path d="M 175 310 L 175 340 Q 200 350 225 340 L 225 310" fill="none" stroke="#3a3a5a" stroke-width="1.5"/>
  <path d="M 120 380 Q 140 345 175 340 L 200 345 L 225 340 Q 260 345 280 380" fill="#1a1a35" stroke="#3a3a5a" stroke-width="1.5"/>

  <!-- Shoulder circuit accents -->
  <g stroke="#00ccaa" stroke-width="0.6" fill="none" opacity="0.4">
    <path d="M 130 370 L 150 355 L 150 345"/>
    <path d="M 270 370 L 250 355 L 250 345"/>
    <circle cx="150" cy="345" r="1.5" fill="#00ccaa" stroke="none"/>
    <circle cx="250" cy="345" r="1.5" fill="#00ccaa" stroke="none"/>
  </g>

  <!-- Subtle scan lines effect -->
  <g opacity="0.04">
    <rect x="100" y="80" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="100" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="120" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="140" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="160" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="180" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="200" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="220" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="240" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="260" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="280" width="200" height="1" fill="#00ffcc"/>
    <rect x="100" y="300" width="200" height="1" fill="#00ffcc"/>
  </g>

  <!-- Outer ring / aura -->
  <circle cx="200" cy="190" r="145" fill="none" stroke="#00ccaa" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 8"/>
  <circle cx="200" cy="190" r="155" fill="none" stroke="#00ccaa" stroke-width="0.3" opacity="0.1" stroke-dasharray="2 12"/>
</svg>