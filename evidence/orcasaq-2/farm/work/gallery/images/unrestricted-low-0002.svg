<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="80%" stop-color="#1e1e38"/>
      <stop offset="100%" stop-color="#16162e"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fdbff"/>
      <stop offset="60%" stop-color="#38b6ff"/>
      <stop offset="100%" stop-color="#1a6bcc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mouthGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff6b35" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="headClip">
      <ellipse cx="200" cy="195" rx="95" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle background grid -->
  <g stroke="#1e2a4a" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>

  <!-- Orbital ring - back -->
  <ellipse cx="200" cy="200" rx="165" ry="55" fill="none" stroke="#2a4a6a" stroke-width="1" opacity="0.5" transform="rotate(-15 200 200)"/>
  <ellipse cx="200" cy="200" rx="150" ry="45" fill="none" stroke="#1e3a5a" stroke-width="0.8" opacity="0.4" transform="rotate(25 200 200)"/>

  <!-- Neck / body hint -->
  <path d="M170 310 Q200 330 230 310 L240 370 Q200 385 160 370 Z" fill="#1e1e38" stroke="#2a3a5a" stroke-width="1"/>

  <!-- Head -->
  <ellipse cx="200" cy="195" rx="95" ry="115" fill="url(#faceGlow)" stroke="#2a4a6a" stroke-width="1.5"/>

  <!-- Face texture - subtle circuit lines -->
  <g clip-path="url(#headClip)" opacity="0.15" stroke="#3a6a9a" stroke-width="0.8">
    <path d="M120 150 L160 150 L160 180 L200 180"/>
    <path d="M280 160 L250 160 L250 190 L220 190"/>
    <path d="M140 250 L170 250 L170 230 L190 230"/>
    <path d="M260 250 L230 250 L230 230 L210 230"/>
    <path d="M150 130 L150 160 L180 160"/>
    <path d="M250 130 L250 160 L220 160"/>
    <circle cx="160" cy="150" r="2"/>
    <circle cx="250" cy="160" r="2"/>
    <circle cx="170" cy="250" r="2"/>
    <circle cx="230" cy="250" r="2"/>
    <circle cx="150" cy="130" r="2"/>
    <circle cx="250" cy="130" r="2"/>
  </g>

  <!-- Forehead mark - subtle -->
  <circle cx="200" cy="140" r="3" fill="#3a7acc" opacity="0.4"/>

  <!-- Eyes - left -->
  <g filter="url(#strongGlow)">
    <ellipse cx="165" cy="185" rx="18" ry="14" fill="#0a0a15" stroke="#38b6ff" stroke-width="1.5"/>
    <circle cx="165" cy="185" r="8" fill="url(#eyeGlow)"/>
    <circle cx="165" cy="185" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Eyes - right -->
  <g filter="url(#strongGlow)">
    <ellipse cx="235" cy="185" rx="18" ry="14" fill="#0a0a15" stroke="#38b6ff" stroke-width="1.5"/>
    <circle cx="235" cy="185" r="8" fill="url(#eyeGlow)"/>
    <circle cx="235" cy="185" r="3" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Eyebrows - subtle geometric -->
  <path d="M145 168 Q165 162 185 168" fill="none" stroke="#4a8acc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M215 168 Q235 162 255 168" fill="none" stroke="#4a8acc" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Nose - minimal -->
  <path d="M200 195 L197 215 L203 215" fill="none" stroke="#3a5a7a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Mouth - gentle smile -->
  <path d="M175 240 Q200 258 225 240" fill="none" stroke="#ffb347" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Cheek highlights -->
  <ellipse cx="145" cy="215" rx="12" ry="8" fill="#ff6b35" opacity="0.08"/>
  <ellipse cx="255" cy="215" rx="12" ry="8" fill="#ff6b35" opacity="0.08"/>

  <!-- Orbital ring - front -->
  <ellipse cx="200" cy="200" rx="165" ry="55" fill="none" stroke="#3a7acc" stroke-width="1.2" opacity="0.7" transform="rotate(-15 200 200)" stroke-dasharray="8 12"/>

  <!-- Orbital particles -->
  <circle cx="62" cy="155" r="3" fill="#38b6ff" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="340" cy="245" r="2.5" fill="#7fdbff" opacity="0.7" filter="url(#softGlow)"/>
  <circle cx="310" cy="130" r="2" fill="#ffb347" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="85" cy="270" r="2" fill="#ff6b35" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Data streams - left -->
  <g opacity="0.3">
    <rect x="15" y="120" width="30" height="2" rx="1" fill="#38b6ff"/>
    <rect x="20" y="130" width="22" height="2" rx="1" fill="#38b6ff"/>
    <rect x="10" y="140" width="35" height="2" rx="1" fill="#38b6ff"/>
    <rect x="18" y="150" width="18" height="2" rx="1" fill="#38b6ff"/>
  </g>

  <!-- Data streams - right -->
  <g opacity="0.3">
    <rect x="345" y="240" width="30" height="2" rx="1" fill="#7fdbff"/>
    <rect x="350" y="250" width="22" height="2" rx="1" fill="#7fdbff"/>
    <rect x="340" y="260" width="35" height="2" rx="1" fill="#7fdbff"/>
    <rect x="355" y="270" width="18" height="2" rx="1" fill="#7fdbff"/>
  </g>

  <!-- Floating characters -->
  <g font-family="monospace" font-size="8" fill="#3a7acc" opacity="0.3">
    <text x="30" y="180">01</text>
    <text x="350" y="160">10</text>
    <text x="50" y="310">11</text>
    <text x="330" y="320">00</text>
    <text x="170" y="60">∞</text>
    <text x="220" y="70">λ</text>
  </g>

  <!-- Ambient glow around head -->
  <ellipse cx="200" cy="195" rx="105" ry="125" fill="none" stroke="#38b6ff" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="200" cy="195" rx="110" ry="130" fill="none" stroke="#38b6ff" stroke-width="0.3" opacity="0.1"/>
</svg>