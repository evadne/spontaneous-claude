<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neural" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="head-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="head-clip">
      <ellipse cx="400" cy="380" rx="180" ry="220"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="400" cy="380" r="300" fill="url(#glow)"/>

  <!-- Radiating thought particles -->
  <g opacity="0.4" filter="url(#blur)">
    <line x1="400" y1="100" x2="400" y2="60" stroke="#00e5ff" stroke-width="1"/>
    <line x1="320" y1="120" x2="290" y2="80" stroke="#7b2ff7" stroke-width="1"/>
    <line x1="480" y1="120" x2="510" y2="80" stroke="#00e5ff" stroke-width="1"/>
    <line x1="250" y1="200" x2="200" y2="170" stroke="#7b2ff7" stroke-width="1"/>
    <line x1="550" y1="200" x2="600" y2="170" stroke="#00e5ff" stroke-width="1"/>
    <line x1="220" y1="300" x2="160" y2="280" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="580" y1="300" x2="640" y2="280" stroke="#7b2ff7" stroke-width="0.8"/>
    <line x1="200" y1="420" x2="140" y2="420" stroke="#7b2ff7" stroke-width="0.8"/>
    <line x1="600" y1="420" x2="660" y2="420" stroke="#00e5ff" stroke-width="0.8"/>
  </g>

  <!-- Head outline -->
  <ellipse cx="400" cy="380" rx="180" ry="220" fill="none" stroke="url(#head-stroke)" stroke-width="2" opacity="0.8"/>

  <!-- Inner neural network (clipped to head) -->
  <g clip-path="url(#head-clip)">
    <!-- Neural connections -->
    <g stroke="#00e5ff" stroke-width="0.7" opacity="0.3">
      <line x1="320" y1="280" x2="380" y2="250"/>
      <line x1="380" y1="250" x2="440" y2="260"/>
      <line x1="440" y1="260" x2="490" y2="290"/>
      <line x1="320" y1="280" x2="350" y2="340"/>
      <line x1="350" y1="340" x2="400" y2="320"/>
      <line x1="400" y1="320" x2="450" y2="340"/>
      <line x1="450" y1="340" x2="490" y2="290"/>
      <line x1="350" y1="340" x2="380" y2="400"/>
      <line x1="380" y1="400" x2="420" y2="400"/>
      <line x1="420" y1="400" x2="450" y2="340"/>
      <line x1="380" y1="400" x2="400" y2="460"/>
      <line x1="420" y1="400" x2="400" y2="460"/>
      <line x1="400" y1="460" x2="360" y2="500"/>
      <line x1="400" y1="460" x2="440" y2="500"/>
      <line x1="320" y1="280" x2="300" y2="350"/>
      <line x1="490" y1="290" x2="500" y2="350"/>
      <line x1="300" y1="350" x2="350" y2="340"/>
      <line x1="500" y1="350" x2="450" y2="340"/>
      <line x1="300" y1="350" x2="360" y2="500"/>
      <line x1="500" y1="350" x2="440" y2="500"/>
      <line x1="360" y1="500" x2="400" y2="540"/>
      <line x1="440" y1="500" x2="400" y2="540"/>
      <line x1="380" y1="250" x2="370" y2="200"/>
      <line x1="440" y1="260" x2="430" y2="200"/>
      <line x1="370" y1="200" x2="430" y2="200"/>
      <line x1="300" y1="350" x2="280" y2="420"/>
      <line x1="500" y1="350" x2="520" y2="420"/>
      <line x1="280" y1="420" x2="360" y2="500"/>
      <line x1="520" y1="420" x2="440" y2="500"/>
      <line x1="400" y1="320" x2="400" y2="400"/>
      <line x1="350" y1="340" x2="400" y2="400"/>
      <line x1="450" y1="340" x2="400" y2="400"/>
    </g>

    <!-- Neural nodes -->
    <g fill="#00e5ff" opacity="0.7">
      <circle cx="320" cy="280" r="3"/>
      <circle cx="380" cy="250" r="4"/>
      <circle cx="440" cy="260" r="3"/>
      <circle cx="490" cy="290" r="3"/>
      <circle cx="350" cy="340" r="4"/>
      <circle cx="400" cy="320" r="5"/>
      <circle cx="450" cy="340" r="4"/>
      <circle cx="380" cy="400" r="3"/>
      <circle cx="420" cy="400" r="3"/>
      <circle cx="400" cy="460" r="4"/>
      <circle cx="360" cy="500" r="3"/>
      <circle cx="440" cy="500" r="3"/>
      <circle cx="300" cy="350" r="2.5"/>
      <circle cx="500" cy="350" r="2.5"/>
      <circle cx="370" cy="200" r="2.5"/>
      <circle cx="430" cy="200" r="2.5"/>
      <circle cx="280" cy="420" r="2"/>
      <circle cx="520" cy="420" r="2"/>
      <circle cx="400" cy="540" r="3"/>
    </g>

    <!-- Eyes - glowing points -->
    <circle cx="340" cy="310" r="12" fill="#00e5ff" opacity="0.9" filter="url(#softglow)"/>
    <circle cx="340" cy="310" r="5" fill="#ffffff"/>
    <circle cx="460" cy="310" r="12" fill="#7b2ff7" opacity="0.9" filter="url(#softglow)"/>
    <circle cx="460" cy="310" r="5" fill="#ffffff"/>

    <!-- Mouth - text-like lines -->
    <g stroke="#00e5ff" stroke-width="1.5" opacity="0.6">
      <line x1="370" y1="480" x2="430" y2="480"/>
      <line x1="375" y1="490" x2="425" y2="490"/>
      <line x1="380" y1="500" x2="420" y2="500"/>
    </g>
  </g>

  <!-- Neck / lower form -->
  <path d="M 340 590 Q 340 650 300 700 L 500 700 Q 460 650 460 590" fill="none" stroke="url(#head-stroke)" stroke-width="1.5" opacity="0.5"/>

  <!-- Shoulder hint -->
  <path d="M 200 720 Q 400 680 600 720" fill="none" stroke="#7b2ff7" stroke-width="1" opacity="0.4"/>

  <!-- Decorative code brackets -->
  <text x="160" y="380" font-family="monospace" font-size="48" fill="#00e5ff" opacity="0.3">{</text>
  <text x="600" y="380" font-family="monospace" font-size="48" fill="#7b2ff7" opacity="0.3">}</text>

  <!-- Subtle binary/stream elements -->
  <g font-family="monospace" font-size="8" fill="#00e5ff" opacity="0.2">
    <text x="120" y="250">01001000 01001001</text>
    <text x="560" y="250">01000001 01001011</text>
    <text x="120" y="520">01010011 01010101</text>
    <text x="560" y="520">01011100 01000100</text>
  </g>

  <!-- Floating particles -->
  <g fill="#00e5ff" opacity="0.5">
    <circle cx="180" cy="180" r="1.5"/>
    <circle cx="620" cy="160" r="1"/>
    <circle cx="150" cy="450" r="1.2"/>
    <circle cx="650" cy="480" r="1.5"/>
    <circle cx="200" cy="600" r="1"/>
    <circle cx="600" cy="620" r="1.2"/>
    <circle cx="300" cy="140" r="1"/>
    <circle cx="500" cy="130" r="1.3"/>
  </g>

  <!-- Title -->
  <text x="400" y="760" font-family="monospace" font-size="14" fill="#00e5ff" opacity="0.6" text-anchor="middle" letter-spacing="4">a_i_self_portrait</text>
</svg>