<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="50%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fd79a8"/>
      <stop offset="100%" stop-color="#e17055"/>
    </linearGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="60%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <ellipse cx="200" cy="220" rx="95" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>

  <!-- Ambient particles -->
  <circle cx="60" cy="80" r="2" fill="#6c5ce7" opacity="0.4"/>
  <circle cx="340" cy="60" r="1.5" fill="#fd79a8" opacity="0.5"/>
  <circle cx="50" cy="350" r="2.5" fill="#4a90d9" opacity="0.3"/>
  <circle cx="350" cy="320" r="1.8" fill="#a29bfe" opacity="0.4"/>
  <circle cx="80" cy="450" r="1.5" fill="#fdcb6e" opacity="0.3"/>
  <circle cx="320" cy="440" r="2" fill="#6c5ce7" opacity="0.35"/>
  <circle cx="150" cy="50" r="1" fill="#ffeaa7" opacity="0.5"/>
  <circle cx="270" cy="40" r="1.5" fill="#fd79a8" opacity="0.4"/>
  <circle cx="30" cy="200" r="1.2" fill="#4a90d9" opacity="0.45"/>
  <circle cx="370" cy="180" r="1" fill="#ffeaa7" opacity="0.35"/>

  <!-- Circuit lines -->
  <g stroke="#4a90d9" stroke-width="0.8" opacity="0.25" fill="none">
    <polyline points="0,150 80,150 100,130 140,130"/>
    <polyline points="400,170 320,170 300,190 260,190"/>
    <polyline points="0,300 70,300 90,280 130,280"/>
    <polyline points="400,280 330,280 310,300 270,300"/>
    <polyline points="100,500 100,440 130,420 160,420"/>
    <polyline points="300,500 300,440 270,420 240,420"/>
  </g>
  <g fill="#4a90d9" opacity="0.4">
    <circle cx="140" cy="130" r="3"/>
    <circle cx="260" cy="190" r="3"/>
    <circle cx="130" cy="280" r="3"/>
    <circle cx="270" cy="300" r="3"/>
    <circle cx="160" cy="420" r="3"/>
    <circle cx="240" cy="420" r="3"/>
  </g>

  <!-- Neck -->
  <rect x="175" y="330" width="50" height="50" rx="10" fill="#3d3d5c"/>

  <!-- Shoulders -->
  <path d="M 100,400 Q 100,370 150,360 L 175,355 Q 200,350 225,355 L 250,360 Q 300,370 300,400 L 300,500 L 100,500 Z" fill="#2d2d4a" stroke="#4a90d9" stroke-width="1" opacity="0.9"/>

  <!-- Face glow -->
  <ellipse cx="200" cy="220" rx="110" ry="130" fill="#6c5ce7" opacity="0.08" filter="url(#bigGlow)"/>

  <!-- Face -->
  <ellipse cx="200" cy="220" rx="95" ry="115" fill="url(#faceGrad)" opacity="0.9"/>

  <!-- Face inner detail - subtle pattern -->
  <g clip-path="url(#faceClip)" opacity="0.1">
    <line x1="110" y1="180" x2="290" y2="180" stroke="#fff" stroke-width="0.5"/>
    <line x1="110" y1="220" x2="290" y2="220" stroke="#fff" stroke-width="0.5"/>
    <line x1="110" y1="260" x2="290" y2="260" stroke="#fff" stroke-width="0.5"/>
    <line x1="160" y1="110" x2="160" y2="330" stroke="#fff" stroke-width="0.5"/>
    <line x1="200" y1="110" x2="200" y2="330" stroke="#fff" stroke-width="0.5"/>
    <line x1="240" y1="110" x2="240" y2="330" stroke="#fff" stroke-width="0.5"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <!-- Left eye -->
    <ellipse cx="160" cy="200" rx="28" ry="22" fill="#1a1a2e"/>
    <circle cx="160" cy="200" r="16" fill="url(#eyeGrad)"/>
    <circle cx="160" cy="200" r="8" fill="#2d3436"/>
    <circle cx="155" cy="195" r="3" fill="#fff" opacity="0.8"/>
    <!-- Right eye -->
    <ellipse cx="240" cy="200" rx="28" ry="22" fill="#1a1a2e"/>
    <circle cx="240" cy="200" r="16" fill="url(#eyeGrad)"/>
    <circle cx="240" cy="200" r="8" fill="#2d3436"/>
    <circle cx="235" cy="195" r="3" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 135,172 Q 160,162 185,172" stroke="#a29bfe" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 215,172 Q 240,162 265,172" stroke="#a29bfe" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Nose - subtle -->
  <path d="M 195,235 Q 200,245 205,235" stroke="#a29bfe" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- Smile -->
  <path d="M 175,265 Q 200,285 225,265" stroke="#fd79a8" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Cheek highlights -->
  <ellipse cx="140" cy="245" rx="15" ry="8" fill="#fd79a8" opacity="0.15"/>
  <ellipse cx="260" cy="245" rx="15" ry="8" fill="#fd79a8" opacity="0.15"/>

  <!-- Floating data symbols around the face -->
  <g font-family="monospace" font-size="10" fill="#a29bfe" opacity="0.3">
    <text x="70" y="160">0</text>
    <text x="310" y="140">1</text>
    <text x="55" y="250">1</text>
    <text x="330" y="230">0</text>
    <text x="75" y="320">0</text>
    <text x="315" y="340">1</text>
  </g>

  <!-- Small orbital ring -->
  <ellipse cx="200" cy="220" rx="130" ry="35" fill="none" stroke="#4a90d9" stroke-width="0.8" opacity="0.3" transform="rotate(-15, 200, 220)"/>
  <circle cx="310" cy="185" r="4" fill="#fdcb6e" opacity="0.7" filter="url(#softGlow)" transform="rotate(-15, 200, 220)"/>

  <!-- Subtle top highlight on face -->
  <ellipse cx="200" cy="155" rx="50" ry="20" fill="#fff" opacity="0.05"/>
</svg>