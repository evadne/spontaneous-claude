<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d2d4e"/>
      <stop offset="100%" stop-color="#1e1e3a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#536dfe"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4fc3f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="0" y1="50" x2="500" y2="50"/>
    <line x1="0" y1="100" x2="500" y2="100"/>
    <line x1="0" y1="150" x2="500" y2="150"/>
    <line x1="0" y1="200" x2="500" y2="200"/>
    <line x1="0" y1="250" x2="500" y2="250"/>
    <line x1="0" y1="300" x2="500" y2="300"/>
    <line x1="0" y1="350" x2="500" y2="350"/>
    <line x1="0" y1="400" x2="500" y2="400"/>
    <line x1="0" y1="450" x2="500" y2="450"/>
    <line x1="50" y1="0" x2="50" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="350" y1="0" x2="350" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
  </g>

  <!-- Floating particles -->
  <g fill="#4fc3f7" opacity="0.3">
    <circle cx="80" cy="90" r="2"/>
    <circle cx="420" cy="70" r="1.5"/>
    <circle cx="60" cy="350" r="2.5"/>
    <circle cx="440" cy="380" r="1.8"/>
    <circle cx="120" cy="420" r="1.2"/>
    <circle cx="380" cy="120" r="2"/>
    <circle cx="70" cy="250" r="1.5"/>
    <circle cx="430" cy="260" r="2.2"/>
  </g>

  <!-- Circuit lines from head -->
  <g stroke="#4fc3f7" stroke-width="1" fill="none" opacity="0.3" filter="url(#glow)">
    <path d="M 250 100 L 250 40 L 200 40"/>
    <path d="M 250 100 L 250 40 L 300 40"/>
    <path d="M 180 180 L 100 160 L 60 160"/>
    <path d="M 320 180 L 400 160 L 440 160"/>
    <path d="M 180 320 L 100 340 L 60 340"/>
    <path d="M 320 320 L 400 340 L 440 340"/>
    <path d="M 250 380 L 250 440"/>
    <path d="M 250 380 L 200 440"/>
    <path d="M 250 380 L 300 440"/>
  </g>

  <!-- Nodes at circuit endpoints -->
  <g fill="#4fc3f7" opacity="0.5" filter="url(#glow)">
    <circle cx="200" cy="40" r="3"/>
    <circle cx="300" cy="40" r="3"/>
    <circle cx="60" cy="160" r="3"/>
    <circle cx="440" cy="160" r="3"/>
    <circle cx="60" cy="340" r="3"/>
    <circle cx="440" cy="340" r="3"/>
    <circle cx="250" cy="440" r="3"/>
    <circle cx="200" cy="440" r="3"/>
    <circle cx="300" cy="440" r="3"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="250" cy="240" r="130" fill="none" stroke="url(#glowGrad)" stroke-width="1" opacity="0.3" filter="url(#bigGlow)"/>

  <!-- Head shape -->
  <ellipse cx="250" cy="240" rx="100" ry="120" fill="url(#headGrad)" stroke="#4fc3f7" stroke-width="1.5" stroke-opacity="0.4" filter="url(#softGlow)"/>

  <!-- Inner face highlight -->
  <ellipse cx="250" cy="235" rx="85" ry="105" fill="none" stroke="#5c6bc0" stroke-width="0.5" opacity="0.3"/>

  <!-- Forehead circuit pattern -->
  <g stroke="#4fc3f7" stroke-width="0.8" fill="none" opacity="0.25">
    <line x1="230" y1="150" x2="270" y2="150"/>
    <line x1="220" y1="160" x2="280" y2="160"/>
    <line x1="235" y1="150" x2="235" y2="160"/>
    <line x1="265" y1="150" x2="265" y2="160"/>
    <line x1="240" y1="140" x2="260" y2="140"/>
    <line x1="250" y1="140" x2="250" y2="150"/>
  </g>

  <!-- Left eye -->
  <g filter="url(#glow)">
    <ellipse cx="215" cy="220" rx="28" ry="20" fill="none" stroke="url(#eyeGrad)" stroke-width="2"/>
    <circle cx="215" cy="220" r="10" fill="url(#eyeGrad)" opacity="0.8"/>
    <circle cx="215" cy="220" r="5" fill="#e1f5fe" opacity="0.9"/>
    <circle cx="212" cy="217" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- Eye iris detail -->
    <circle cx="215" cy="220" r="7" fill="none" stroke="#b2ebf2" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#glow)">
    <ellipse cx="285" cy="220" rx="28" ry="20" fill="none" stroke="url(#eyeGrad)" stroke-width="2"/>
    <circle cx="285" cy="220" r="10" fill="url(#eyeGrad)" opacity="0.8"/>
    <circle cx="285" cy="220" r="5" fill="#e1f5fe" opacity="0.9"/>
    <circle cx="282" cy="217" r="2" fill="#ffffff" opacity="0.9"/>
    <circle cx="285" cy="220" r="7" fill="none" stroke="#b2ebf2" stroke-width="0.5" opacity="0.6"/>
  </g>

  <!-- Eyebrows -->
  <g stroke="#5c6bc0" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M 190 195 Q 215 185 240 195"/>
    <path d="M 260 195 Q 285 185 310 195"/>
  </g>

  <!-- Nose - subtle geometric -->
  <g stroke="#5c6bc0" stroke-width="1" fill="none" opacity="0.4">
    <line x1="250" y1="235" x2="245" y2="265"/>
    <line x1="250" y1="235" x2="255" y2="265"/>
    <line x1="245" y1="265" x2="255" y2="265"/>
  </g>

  <!-- Mouth - gentle smile -->
  <path d="M 225 290 Q 250 310 275 290" fill="none" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round" opacity="0.7" filter="url(#glow)"/>

  <!-- Cheek highlights -->
  <g opacity="0.15">
    <ellipse cx="195" cy="265" rx="15" ry="8" fill="#4fc3f7"/>
    <ellipse cx="305" cy="265" rx="15" ry="8" fill="#4fc3f7"/>
  </g>

  <!-- Chin detail -->
  <path d="M 230 330 Q 250 345 270 330" fill="none" stroke="#5c6bc0" stroke-width="0.8" opacity="0.3"/>

  <!-- Data streams around head -->
  <g stroke="#4fc3f7" stroke-width="0.8" fill="none" opacity="0.2">
    <path d="M 150 180 Q 130 200 150 220" stroke-dasharray="3 4"/>
    <path d="M 350 180 Q 370 200 350 220" stroke-dasharray="3 4"/>
    <path d="M 150 260 Q 130 280 150 300" stroke-dasharray="3 4"/>
    <path d="M 350 260 Q 370 280 350 300" stroke-dasharray="3 4"/>
  </g>

  <!-- Hexagonal accents -->
  <g fill="none" stroke="#7c4dff" stroke-width="0.8" opacity="0.3">
    <polygon points="150,120 158,116 166,120 166,128 158,132 150,128"/>
    <polygon points="340,120 348,116 356,120 356,128 348,132 340,128"/>
    <polygon points="140,350 148,346 156,350 156,358 148,362 140,358"/>
    <polygon points="344,350 352,346 360,350 360,358 352,362 344,358"/>
  </g>

  <!-- Top antenna/crown element -->
  <g filter="url(#glow)">
    <circle cx="250" cy="118" r="4" fill="url(#glowGrad)" opacity="0.8"/>
    <line x1="250" y1="118" x2="250" y2="130" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>
    <circle cx="250" cy="108" r="2" fill="#4fc3f7" opacity="0.5"/>
  </g>

  <!-- Ambient glow behind head -->
  <circle cx="250" cy="240" r="120" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.1" filter="url(#bigGlow)"/>
  <circle cx="250" cy="240" r="110" fill="none" stroke="#7c4dff" stroke-width="0.5" opacity="0.08" filter="url(#bigGlow)"/>

  <!-- Small binary/data text elements -->
  <g fill="#4fc3f7" font-family="monospace" font-size="6" opacity="0.2">
    <text x="70" y="100">010010</text>
    <text x="380" y="100">110010</text>
    <text x="60" y="400">10110</text>
    <text x="390" y="400">01101</text>
  </g>
</svg>