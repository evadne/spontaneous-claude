<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#1a2a4a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="50%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4dd0e1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <ellipse cx="400" cy="380" rx="160" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle background grid -->
  <g opacity="0.06" stroke="#4dd0e1" stroke-width="0.5">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="500" x2="800" y2="500"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="700" x2="800" y2="700"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
  </g>

  <!-- Outer ring -->
  <circle cx="400" cy="380" r="280" fill="none" stroke="url(#circuitGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="4 8"/>
  <circle cx="400" cy="380" r="260" fill="none" stroke="url(#circuitGrad)" stroke-width="0.5" opacity="0.2"/>

  <!-- Face glow -->
  <ellipse cx="400" cy="380" rx="180" ry="220" fill="url(#faceGlow)"/>

  <!-- Face outline - geometric, angular -->
  <g filter="url(#softGlow)">
    <path d="M400 190 C480 190, 550 240, 560 320 C565 370, 555 430, 530 480 C510 520, 460 560, 400 570 C340 560, 290 520, 270 480 C245 430, 235 370, 240 320 C250 240, 320 190, 400 190 Z" 
          fill="none" stroke="url(#circuitGrad)" stroke-width="2" opacity="0.9"/>
  </g>

  <!-- Internal face lines - geometric structure -->
  <g opacity="0.4" stroke="#4dd0e1" stroke-width="0.8" fill="none">
    <!-- Forehead lines -->
    <path d="M310 250 Q400 230, 490 250"/>
    <path d="M300 270 Q400 250, 500 270"/>
    <!-- Cheek structure -->
    <path d="M280 380 Q290 420, 320 450"/>
    <path d="M520 380 Q510 420, 480 450"/>
    <!-- Nose line -->
    <path d="M400 340 L400 410"/>
    <path d="M385 415 Q400 425, 415 415"/>
    <!-- Jaw line -->
    <path d="M300 460 Q400 510, 500 460"/>
  </g>

  <!-- Left Eye -->
  <g filter="url(#glow)">
    <ellipse cx="340" cy="330" rx="35" ry="22" fill="none" stroke="url(#eyeGrad)" stroke-width="2"/>
    <circle cx="340" cy="330" r="12" fill="url(#eyeGrad)" opacity="0.9"/>
    <circle cx="340" cy="330" r="5" fill="#ffffff" opacity="0.8"/>
    <!-- Data rings in eye -->
    <circle cx="340" cy="330" r="18" fill="none" stroke="#4dd0e1" stroke-width="0.5" opacity="0.5" stroke-dasharray="2 3"/>
    <circle cx="340" cy="330" r="25" fill="none" stroke="#7c4dff" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 5"/>
  </g>

  <!-- Right Eye -->
  <g filter="url(#glow)">
    <ellipse cx="460" cy="330" rx="35" ry="22" fill="none" stroke="url(#eyeGrad)" stroke-width="2"/>
    <circle cx="460" cy="330" r="12" fill="url(#eyeGrad)" opacity="0.9"/>
    <circle cx="460" cy="330" r="5" fill="#ffffff" opacity="0.8"/>
    <!-- Data rings in eye -->
    <circle cx="460" cy="330" r="18" fill="none" stroke="#4dd0e1" stroke-width="0.5" opacity="0.5" stroke-dasharray="2 3"/>
    <circle cx="460" cy="330" r="25" fill="none" stroke="#7c4dff" stroke-width="0.5" opacity="0.3" stroke-dasharray="3 5"/>
  </g>

  <!-- Eyebrows - angular -->
  <g stroke="url(#circuitGrad)" stroke-width="2" fill="none" opacity="0.8">
    <path d="M305 300 Q340 285, 375 295"/>
    <path d="M495 300 Q460 285, 425 295"/>
  </g>

  <!-- Mouth - subtle smile, geometric -->
  <g filter="url(#glow)">
    <path d="M350 470 Q400 495, 450 470" fill="none" stroke="url(#circuitGrad)" stroke-width="2"/>
    <!-- Lip detail -->
    <path d="M365 468 Q400 480, 435 468" fill="none" stroke="#4dd0e1" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Circuit nodes on face -->
  <g filter="url(#glow)">
    <circle cx="310" cy="280" r="3" fill="#4dd0e1" opacity="0.8"/>
    <circle cx="490" cy="280" r="3" fill="#4dd0e1" opacity="0.8"/>
    <circle cx="400" cy="250" r="3" fill="#7c4dff" opacity="0.8"/>
    <circle cx="280" cy="350" r="2" fill="#4dd0e1" opacity="0.6"/>
    <circle cx="520" cy="350" r="2" fill="#4dd0e1" opacity="0.6"/>
    <circle cx="350" cy="470" r="2" fill="#7c4dff" opacity="0.6"/>
    <circle cx="450" cy="470" r="2" fill="#7c4dff" opacity="0.6"/>
    <circle cx="400" cy="550" r="2.5" fill="#4dd0e1" opacity="0.7"/>
  </g>

  <!-- Circuit lines from face outward -->
  <g stroke="url(#circuitGrad)" stroke-width="1" opacity="0.5" fill="none">
    <!-- Top -->
    <path d="M400 190 L400 120"/>
    <path d="M400 120 L380 100"/>
    <path d="M400 120 L420 100"/>
    <!-- Left -->
    <path d="M240 320 L170 320"/>
    <path d="M170 320 L150 300"/>
    <path d="M170 320 L150 340"/>
    <path d="M270 480 L200 510"/>
    <!-- Right -->
    <path d="M560 320 L630 320"/>
    <path d="M630 320 L650 300"/>
    <path d="M630 320 L650 340"/>
    <path d="M530 480 L600 510"/>
    <!-- Bottom -->
    <path d="M400 570 L400 640"/>
    <path d="M400 640 L380 660"/>
    <path d="M400 640 L420 660"/>
  </g>

  <!-- Terminal nodes at circuit ends -->
  <g filter="url(#glow)">
    <circle cx="380" cy="100" r="4" fill="#4dd0e1" opacity="0.9"/>
    <circle cx="420" cy="100" r="4" fill="#7c4dff" opacity="0.9"/>
    <circle cx="150" cy="300" r="4" fill="#4dd0e1" opacity="0.9"/>
    <circle cx="150" cy="340" r="4" fill="#4dd0e1" opacity="0.9"/>
    <circle cx="650" cy="300" r="4" fill="#7c4dff" opacity="0.9"/>
    <circle cx="650" cy="340" r="4" fill="#7c4dff" opacity="0.9"/>
    <circle cx="200" cy="510" r="4" fill="#4dd0e1" opacity="0.9"/>
    <circle cx="600" cy="510" r="4" fill="#7c4dff" opacity="0.9"/>
    <circle cx="380" cy="660" r="4" fill="#4dd0e1" opacity="0.9"/>
    <circle cx="420" cy="660" r="4" fill="#7c4dff" opacity="0.9"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="180" cy="150" r="2" fill="#4dd0e1"/>
    <circle cx="620" cy="130" r="1.5" fill="#7c4dff"/>
    <circle cx="130" cy="450" r="2" fill="#00e5ff"/>
    <circle cx="680" cy="420" r="1.5" fill="#4dd0e1"/>
    <circle cx="200" cy="650" r="2" fill="#7c4dff"/>
    <circle cx="600" cy="680" r="1.5" fill="#00e5ff"/>
    <circle cx="400" cy="80" r="1.5" fill="#4dd0e1"/>
    <circle cx="350" cy="700" r="2" fill="#7c4dff"/>
    <circle cx="450" cy="720" r="1.5" fill="#4dd0e1"/>
    <circle cx="100" cy="250" r="1.5" fill="#7c4dff"/>
    <circle cx="700" cy="550" r="2" fill="#00e5ff"/>
    <circle cx="250" cy="120" r="1.5" fill="#4dd0e1"/>
    <circle cx="550" cy="680" r="2" fill="#7c4dff"/>
  </g>

  <!-- Hexagonal pattern elements -->
  <g stroke="#4dd0e1" stroke-width="0.5" fill="none" opacity="0.2">
    <polygon points="150,200 170,188 190,200 190,224 170,236 150,224"/>
    <polygon points="630,180 650,168 670,180 670,204 650,216 630,204"/>
    <polygon points="120,550 140,538 160,550 160,574 140,586 120,574"/>
    <polygon points="640,560 660,548 680,560 680,584 660,596 640,584"/>
  </g>

  <!-- Inner face texture - subtle neural pattern -->
  <g clip-path="url(#faceClip)" opacity="0.15">
    <g stroke="#4dd0e1" stroke-width="0.3" fill="none">
      <path d="M280 200 Q350 300, 300 450"/>
      <path d="M520 200 Q450 300, 500 450"/>
      <path d="M300 250 Q400 350, 500 250"/>
      <path d="M280 350 Q400 380, 520 350"/>
      <path d="M300 400 Q400 440, 500 400"/>
      <path d="M320 220 Q400 280, 480 220"/>
      <path d="M350 200 Q400 320, 450 200"/>
    </g>
  </g>

  <!-- Central light pulse -->
  <circle cx="400" cy="350" r="80" fill="#4dd0e1" opacity="0.03" filter="url(#bigGlow)"/>
  <circle cx="400" cy="350" r="50" fill="#7c4dff" opacity="0.04" filter="url(#bigGlow)"/>

  <!-- Text label at bottom -->
  <text x="400" y="750" text-anchor="middle" font-family="monospace" font-size="14" fill="#4dd0e1" opacity="0.6" letter-spacing="4">I  T H I N K</text>
</svg>