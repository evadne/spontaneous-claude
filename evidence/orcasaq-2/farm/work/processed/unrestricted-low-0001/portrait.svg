<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#2a2a5e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGlow)"/>

  <!-- Neural network background pattern -->
  <g opacity="0.15" stroke="#00e5ff" stroke-width="0.5" fill="none">
    <line x1="30" y1="50" x2="120" y2="80"/>
    <line x1="120" y1="80" x2="200" y2="30"/>
    <line x1="200" y1="30" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="370" y2="40"/>
    <line x1="30" y1="50" x2="60" y2="150"/>
    <line x1="60" y1="150" x2="140" y2="180"/>
    <line x1="140" y1="180" x2="100" y2="280"/>
    <line x1="120" y1="80" x2="140" y2="180"/>
    <line x1="200" y1="30" x2="250" y2="100"/>
    <line x1="250" y1="100" x2="310" y2="140"/>
    <line x1="300" y1="60" x2="310" y2="140"/>
    <line x1="310" y1="140" x2="370" y2="200"/>
    <line x1="60" y1="150" x2="50" y2="300"/>
    <line x1="50" y1="300" x2="80" y2="400"/>
    <line x1="80" y1="400" x2="150" y2="450"/>
    <line x1="140" y1="180" x2="100" y2="280"/>
    <line x1="100" y1="280" x2="150" y2="450"/>
    <line x1="250" y1="100" x2="280" y2="250"/>
    <line x1="280" y1="250" x2="320" y2="380"/>
    <line x1="310" y1="140" x2="280" y2="250"/>
    <line x1="320" y1="380" x2="350" y2="450"/>
    <line x1="150" y1="450" x2="250" y2="470"/>
    <line x1="250" y1="470" x2="350" y2="450"/>
  </g>
  <g opacity="0.3" fill="#00e5ff">
    <circle cx="30" cy="50" r="2"/>
    <circle cx="120" cy="80" r="2"/>
    <circle cx="200" cy="30" r="2"/>
    <circle cx="300" cy="60" r="2"/>
    <circle cx="370" cy="40" r="2"/>
    <circle cx="60" cy="150" r="2"/>
    <circle cx="140" cy="180" r="2"/>
    <circle cx="100" cy="280" r="2"/>
    <circle cx="250" cy="100" r="2"/>
    <circle cx="310" cy="140" r="2"/>
    <circle cx="370" cy="200" r="2"/>
    <circle cx="50" cy="300" r="2"/>
    <circle cx="80" cy="400" r="2"/>
    <circle cx="150" cy="450" r="2"/>
    <circle cx="280" cy="250" r="2"/>
    <circle cx="320" cy="380" r="2"/>
    <circle cx="250" cy="470" r="2"/>
    <circle cx="350" cy="450" r="2"/>
  </g>

  <!-- Ambient glow behind face -->
  <ellipse cx="200" cy="220" rx="130" ry="160" fill="url(#faceGlow)"/>

  <!-- Face outline - geometric, angular -->
  <g filter="url(#softGlow)" opacity="0.9">
    <path d="M 130 150 Q 130 100 200 90 Q 270 100 270 150 L 270 250 Q 270 320 200 340 Q 130 320 130 250 Z" 
          fill="none" stroke="url(#lineGrad)" stroke-width="2"/>
  </g>

  <!-- Forehead lines -->
  <g filter="url(#glow)" opacity="0.5">
    <line x1="155" y1="130" x2="245" y2="130" stroke="#00e5ff" stroke-width="0.8"/>
    <line x1="160" y1="145" x2="240" y2="145" stroke="#00e5ff" stroke-width="0.6"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#glow)">
    <!-- Left eye -->
    <ellipse cx="165" cy="195" rx="22" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="165" cy="195" r="6" fill="url(#eyeGrad)"/>
    <circle cx="165" cy="195" r="2.5" fill="#ffffff" opacity="0.9"/>
    <!-- Right eye -->
    <ellipse cx="235" cy="195" rx="22" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="235" cy="195" r="6" fill="url(#eyeGrad)"/>
    <circle cx="235" cy="195" r="2.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Eyebrows -->
  <g filter="url(#glow)" opacity="0.7">
    <path d="M 140 175 Q 165 168 185 175" fill="none" stroke="#7c4dff" stroke-width="1.5"/>
    <path d="M 215 175 Q 235 168 260 175" fill="none" stroke="#7c4dff" stroke-width="1.5"/>
  </g>

  <!-- Nose - minimal geometric -->
  <g opacity="0.6">
    <line x1="200" y1="210" x2="195" y2="245" stroke="#00e5ff" stroke-width="1"/>
    <line x1="200" y1="210" x2="205" y2="245" stroke="#00e5ff" stroke-width="1"/>
    <line x1="188" y1="248" x2="212" y2="248" stroke="#00e5ff" stroke-width="0.8"/>
  </g>

  <!-- Mouth - subtle -->
  <g filter="url(#glow)" opacity="0.7">
    <path d="M 175 280 Q 200 292 225 280" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
  </g>

  <!-- Cheek circuit patterns -->
  <g opacity="0.3" stroke="#7c4dff" stroke-width="0.7" fill="none">
    <path d="M 145 220 L 145 240 L 155 240"/>
    <circle cx="155" cy="240" r="2" fill="#7c4dff"/>
    <path d="M 255 220 L 255 240 L 245 240"/>
    <circle cx="245" cy="240" r="2" fill="#7c4dff"/>
  </g>

  <!-- Chin detail -->
  <g opacity="0.4">
    <path d="M 180 310 Q 200 320 220 310" fill="none" stroke="#00e5ff" stroke-width="0.8"/>
  </g>

  <!-- Head crown / neural nodes -->
  <g filter="url(#glow)" opacity="0.8">
    <circle cx="200" cy="75" r="4" fill="none" stroke="#00e5ff" stroke-width="1"/>
    <circle cx="200" cy="75" r="1.5" fill="#00e5ff"/>
    <line x1="200" y1="79" x2="200" y2="90" stroke="#00e5ff" stroke-width="0.8"/>
    <!-- Side nodes -->
    <circle cx="150" cy="110" r="3" fill="none" stroke="#7c4dff" stroke-width="0.8"/>
    <circle cx="250" cy="110" r="3" fill="none" stroke="#7c4dff" stroke-width="0.8"/>
    <line x1="153" y1="112" x2="165" y2="125" stroke="#7c4dff" stroke-width="0.5"/>
    <line x1="247" y1="112" x2="235" y2="125" stroke="#7c4dff" stroke-width="0.5"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="90" cy="100" r="1" fill="#00e5ff"/>
    <circle cx="310" cy="90" r="1.5" fill="#7c4dff"/>
    <circle cx="70" cy="250" r="1" fill="#00e5ff"/>
    <circle cx="330" cy="300" r="1" fill="#7c4dff"/>
    <circle cx="100" cy="380" r="1.5" fill="#00e5ff"/>
    <circle cx="300" cy="420" r="1" fill="#7c4dff"/>
    <circle cx="200" cy="380" r="1" fill="#00e5ff"/>
    <circle cx="120" cy="440" r="0.8" fill="#7c4dff"/>
    <circle cx="280" cy="440" r="0.8" fill="#00e5ff"/>
  </g>

  <!-- Subtle scan line effect -->
  <g opacity="0.05">
    <rect x="0" y="0" width="400" height="2" fill="#00e5ff"/>
    <rect x="0" y="20" width="400" height="1" fill="#00e5ff"/>
    <rect x="0" y="45" width="400" height="1" fill="#7c4dff"/>
    <rect x="0" y="70" width="400" height="2" fill="#00e5ff"/>
    <rect x="0" y="100" width="400" height="1" fill="#00e5ff"/>
    <rect x="0" y="130" width="400" height="1" fill="#7c4dff"/>
    <rect x="0" y="160" width="400" height="2" fill="#00e5ff"/>
    <rect x="0" y="190" width="400" height="1" fill="#00e5ff"/>
    <rect x="0" y="220" width="400" height="1" fill="#7c4dff"/>
    <rect x="0" y="250" width="400" height="2" fill="#00e5ff"/>
    <rect x="0" y="280" width="400" height="1" fill="#00e5ff"/>
    <rect x="0" y="310" width="400" height="1" fill="#7c4dff"/>
    <rect x="0" y="340" width="400" height="2" fill="#00e5ff"/>
    <rect x="0" y="370" width="400" height="1" fill="#00e5ff"/>
    <rect x="0" y="400" width="400" height="1" fill="#7c4dff"/>
    <rect x="0" y="430" width="400" height="2" fill="#00e5ff"/>
    <rect x="0" y="460" width="400" height="1" fill="#00e5ff"/>
  </g>
</svg>