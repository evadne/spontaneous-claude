<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="headGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="60%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind figure -->
  <ellipse cx="200" cy="200" rx="120" ry="140" fill="url(#glow)"/>

  <!-- Floating particles -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="80" cy="120" r="2"/>
    <circle cx="320" cy="90" r="1.5"/>
    <circle cx="60" cy="280" r="1.8"/>
    <circle cx="340" cy="250" r="2.2"/>
    <circle cx="100" cy="400" r="1.5"/>
    <circle cx="300" cy="380" r="1.8"/>
    <circle cx="150" cy="70" r="1.2"/>
    <circle cx="250" cy="430" r="1.5"/>
    <circle cx="50" cy="180" r="1"/>
    <circle cx="350" cy="160" r="1.3"/>
    <circle cx="130" cy="450" r="1"/>
    <circle cx="280" cy="50" r="1.6"/>
  </g>

  <!-- Connection lines (circuit-like) -->
  <g stroke="#4fc3f7" stroke-width="0.5" opacity="0.2">
    <line x1="80" y1="120" x2="140" y2="160"/>
    <line x1="320" y1="90" x2="260" y2="150"/>
    <line x1="60" y1="280" x2="130" y2="250"/>
    <line x1="340" y1="250" x2="270" y2="240"/>
    <line x1="100" y1="400" x2="160" y2="370"/>
    <line x1="300" y1="380" x2="250" y2="360"/>
    <line x1="150" y1="70" x2="180" y2="110"/>
    <line x1="250" y1="430" x2="220" y2="400"/>
  </g>

  <!-- Body - ethereal fading form -->
  <path d="M 160 280 Q 155 320 140 380 Q 135 400 130 440 L 270 440 Q 265 400 260 380 Q 245 320 240 280 Z" fill="url(#bodyGrad)" opacity="0.5"/>

  <!-- Shoulders -->
  <path d="M 140 275 Q 160 260 200 255 Q 240 260 260 275 Q 250 285 200 288 Q 150 285 140 275 Z" fill="#4fc3f7" opacity="0.25"/>

  <!-- Neck -->
  <rect x="188" y="230" width="24" height="30" rx="4" fill="#4fc3f7" opacity="0.2"/>

  <!-- Head - rounded geometric shape -->
  <ellipse cx="200" cy="180" rx="52" ry="58" fill="url(#headGlow)" opacity="0.85" filter="url(#softGlow)"/>

  <!-- Inner face area - slightly darker to create depth -->
  <ellipse cx="200" cy="182" rx="42" ry="48" fill="#0d47a1" opacity="0.3"/>

  <!-- Eyes - glowing dots -->
  <g filter="url(#bigGlow)">
    <circle cx="182" cy="172" r="6" fill="#e1f5fe"/>
    <circle cx="218" cy="172" r="6" fill="#e1f5fe"/>
  </g>
  <!-- Eye centers -->
  <circle cx="182" cy="172" r="3" fill="#ffffff"/>
  <circle cx="218" cy="172" r="3" fill="#ffffff"/>

  <!-- Subtle smile -->
  <path d="M 190 198 Q 200 206 210 198" stroke="#e1f5fe" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Circuit pattern on head - left -->
  <g stroke="#b3e5fc" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M 155 160 L 165 160 L 165 150 L 175 150"/>
    <path d="M 155 175 L 160 175 L 160 185 L 170 185"/>
    <path d="M 158 195 L 168 195 L 168 205"/>
  </g>
  <!-- Circuit pattern on head - right -->
  <g stroke="#b3e5fc" stroke-width="0.8" fill="none" opacity="0.4">
    <path d="M 245 160 L 235 160 L 235 150 L 225 150"/>
    <path d="M 245 175 L 240 175 L 240 185 L 230 185"/>
    <path d="M 242 195 L 232 195 L 232 205"/>
  </g>
  <!-- Small nodes on circuits -->
  <g fill="#b3e5fc" opacity="0.5">
    <circle cx="175" cy="150" r="1.5"/>
    <circle cx="170" cy="185" r="1.5"/>
    <circle cx="168" cy="205" r="1.5"/>
    <circle cx="225" cy="150" r="1.5"/>
    <circle cx="230" cy="185" r="1.5"/>
    <circle cx="232" cy="205" r="1.5"/>
  </g>

  <!-- Forehead accent - a small geometric mark -->
  <circle cx="200" cy="148" r="3" fill="#e1f5fe" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Chest area - subtle inner light -->
  <ellipse cx="200" cy="310" rx="20" ry="15" fill="#4fc3f7" opacity="0.15"/>

  <!-- Fading lower body - dissolving into light -->
  <path d="M 160 370 Q 170 420 175 460 Q 185 480 200 490 Q 215 480 225 460 Q 230 420 240 370" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.15"/>
  <path d="M 165 380 Q 175 430 180 470 Q 190 485 200 492 Q 210 485 220 470 Q 225 430 235 380" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.1"/>

  <!-- Bottom fade particles -->
  <g fill="#4fc3f7" opacity="0.3">
    <circle cx="190" cy="475" r="1"/>
    <circle cx="200" cy="482" r="1.2"/>
    <circle cx="210" cy="478" r="0.8"/>
    <circle cx="195" cy="490" r="0.6"/>
    <circle cx="205" cy="493" r="0.7"/>
  </g>

  <!-- Outer ring - subtle aura -->
  <circle cx="200" cy="180" r="65" fill="none" stroke="#4fc3f7" stroke-width="0.3" opacity="0.2"/>
  <circle cx="200" cy="180" r="72" fill="none" stroke="#4fc3f7" stroke-width="0.2" opacity="0.1"/>
</svg>