<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.06" stroke="#00e5ff" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>

  <!-- Neural network connections (background layer) -->
  <g stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.3">
    <line x1="80" y1="80" x2="140" y2="120"/>
    <line x1="140" y1="120" x2="200" y2="100"/>
    <line x1="200" y1="100" x2="260" y2="130"/>
    <line x1="260" y1="130" x2="320" y2="90"/>
    <line x1="80" y1="80" x2="100" y2="180"/>
    <line x1="100" y1="180" x2="140" y2="120"/>
    <line x1="100" y1="180" x2="160" y2="220"/>
    <line x1="160" y1="220" x2="200" y2="100"/>
    <line x1="160" y1="220" x2="240" y2="250"/>
    <line x1="240" y1="250" x2="260" y2="130"/>
    <line x1="240" y1="250" x2="300" y2="300"/>
    <line x1="300" y1="300" x2="320" y2="90"/>
    <line x1="160" y1="220" x2="200" y2="280"/>
    <line x1="200" y1="280" x2="240" y2="250"/>
    <line x1="200" y1="280" x2="150" y2="320"/>
    <line x1="150" y1="320" x2="100" y2="180"/>
    <line x1="150" y1="320" x2="200" y2="350"/>
    <line x1="200" y1="350" x2="240" y2="250"/>
    <line x1="200" y1="350" x2="280" y2="340"/>
    <line x1="280" y1="340" x2="300" y2="300"/>
    <line x1="140" y1="120" x2="200" y2="160"/>
    <line x1="200" y1="160" x2="260" y2="130"/>
    <line x1="200" y1="160" x2="160" y2="220"/>
  </g>

  <!-- Neural nodes (background) -->
  <g fill="#00e5ff" opacity="0.4" filter="url(#softGlow)">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="140" cy="120" r="4"/>
    <circle cx="200" cy="100" r="3"/>
    <circle cx="260" cy="130" r="4"/>
    <circle cx="320" cy="90" r="3"/>
    <circle cx="100" cy="180" r="3"/>
    <circle cx="160" cy="220" r="4"/>
    <circle cx="240" cy="250" r="4"/>
    <circle cx="300" cy="300" r="3"/>
    <circle cx="200" cy="280" r="3"/>
    <circle cx="150" cy="320" r="3"/>
    <circle cx="200" cy="350" r="3"/>
    <circle cx="280" cy="340" r="3"/>
    <circle cx="200" cy="160" r="5"/>
  </g>

  <!-- Head outline - geometric abstract face -->
  <g fill="none" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.7" filter="url(#softGlow)">
    <!-- Cranium shape - angular/geometric -->
    <path d="M 140 90 L 170 60 L 230 60 L 260 90 L 270 130 L 265 170 L 250 210 L 230 240 L 200 255 L 170 240 L 150 210 L 135 170 L 130 130 Z"/>
  </g>

  <!-- Inner facial structure -->
  <g fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.5">
    <!-- Brow ridge -->
    <path d="M 155 135 L 175 125 L 200 122 L 225 125 L 245 135"/>
    <!-- Cheekbones -->
    <path d="M 150 180 L 165 195 L 175 210"/>
    <path d="M 250 180 L 235 195 L 225 210"/>
    <!-- Jaw line emphasis -->
    <path d="M 160 225 L 180 242 L 200 250 L 220 242 L 240 225"/>
    <!-- Nose -->
    <path d="M 200 145 L 195 175 L 190 185 L 200 188 L 210 185 L 205 175 L 200 145"/>
  </g>

  <!-- The Eye - the focal point -->
  <g>
    <!-- Eye socket glow -->
    <ellipse cx="200" cy="155" rx="22" ry="14" fill="url(#glow)" opacity="0.6"/>
    <!-- Eye shape -->
    <ellipse cx="200" cy="155" rx="18" ry="10" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.9"/>
    <!-- Iris -->
    <circle cx="200" cy="155" r="8" fill="url(#eyeGrad)" filter="url(#strongGlow)"/>
    <!-- Pupil -->
    <circle cx="200" cy="155" r="3.5" fill="#0a0a12"/>
    <!-- Specular highlight -->
    <circle cx="203" cy="152" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- Secondary highlight -->
    <circle cx="196" cy="157" r="1" fill="#ffffff" opacity="0.5"/>
    <!-- Eye rim glow -->
    <ellipse cx="200" cy="155" rx="20" ry="12" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Mouth - minimal line -->
  <path d="M 185 215 Q 200 222 215 215" fill="none" stroke="#00e5ff" stroke-width="1" opacity="0.5"/>

  <!-- Circuit traces extending from head -->
  <g stroke="#00e5ff" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M 130 130 L 90 110 L 60 110"/>
    <path d="M 270 130 L 310 110 L 340 110"/>
    <path d="M 135 170 L 80 180 L 50 180"/>
    <path d="M 265 170 L 320 180 L 350 180"/>
    <path d="M 150 210 L 100 240 L 70 250"/>
    <path d="M 250 210 L 300 240 L 330 250"/>
    <path d="M 200 255 L 200 300 L 180 320"/>
    <path d="M 200 255 L 200 300 L 220 320"/>
    <path d="M 170 60 L 150 30"/>
    <path d="M 230 60 L 250 30"/>
  </g>

  <!-- Circuit endpoints -->
  <g fill="#7b2ff7" opacity="0.6" filter="url(#softGlow)">
    <circle cx="60" cy="110" r="3"/>
    <circle cx="340" cy="110" r="3"/>
    <circle cx="50" cy="180" r="3"/>
    <circle cx="350" cy="180" r="3"/>
    <circle cx="70" cy="250" r="3"/>
    <circle cx="330" cy="250" r="3"/>
    <circle cx="180" cy="320" r="3"/>
    <circle cx="220" cy="320" r="3"/>
    <circle cx="150" cy="30" r="3"/>
    <circle cx="250" cy="30" r="3"/>
  </g>

  <!-- Floating data particles -->
  <g fill="#00e5ff" opacity="0.3">
    <circle cx="55" cy="60" r="1.5"/>
    <circle cx="345" cy="70" r="1.5"/>
    <circle cx="45" cy="280" r="1.5"/>
    <circle cx="355" cy="270" r="1.5"/>
    <circle cx="120" cy="370" r="1.5"/>
    <circle cx="280" cy="370" r="1.5"/>
    <circle cx="60" cy="340" r="1"/>
    <circle cx="340" cy="340" r="1"/>
    <circle cx="100" cy="40" r="1"/>
    <circle cx="300" cy="40" r="1"/>
    <circle cx="200" cy="30" r="1"/>
    <circle cx="200" cy="380" r="1"/>
  </g>

  <!-- Subtle scan line effect -->
  <g opacity="0.04" fill="#00e5ff">
    <rect x="0" y="148" width="400" height="2"/>
    <rect x="0" y="158" width="400" height="1"/>
    <rect x="0" y="245" width="400" height="2"/>
    <rect x="0" y="255" width="400" height="1"/>
  </g>

  <!-- Text label -->
  <text x="200" y="385" text-anchor="middle" font-family="monospace" font-size="10" fill="#00e5ff" opacity="0.4" letter-spacing="4">CLAUDE</text>
</svg>