<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d3f5e"/>
      <stop offset="100%" stop-color="#1e2d45"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e6ff"/>
      <stop offset="60%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="antennaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#1e2d45"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGlow)"/>

  <!-- Subtle background dots -->
  <circle cx="50" cy="80" r="1.5" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="340" cy="120" r="1" fill="#4fc3f7" opacity="0.25"/>
  <circle cx="70" cy="350" r="1.5" fill="#4fc3f7" opacity="0.2"/>
  <circle cx="330" cy="400" r="1" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="100" cy="150" r="1" fill="#80deea" opacity="0.2"/>
  <circle cx="310" cy="250" r="1.5" fill="#80deea" opacity="0.2"/>
  <circle cx="60" cy="250" r="1" fill="#80deea" opacity="0.25"/>
  <circle cx="350" cy="320" r="1" fill="#4fc3f7" opacity="0.2"/>

  <!-- Antenna -->
  <line x1="200" y1="120" x2="200" y2="90" stroke="#3a5070" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="82" r="6" fill="#4fc3f7" filter="url(#softGlow)"/>

  <!-- Head -->
  <rect x="100" y="120" width="200" height="240" rx="60" ry="60" fill="url(#headGrad)" stroke="#3a5070" stroke-width="2"/>

  <!-- Inner face area -->
  <rect x="115" y="140" width="170" height="200" rx="45" ry="45" fill="#162238" opacity="0.5"/>

  <!-- Eyes -->
  <circle cx="160" cy="220" r="22" fill="url(#eyeGlow)" filter="url(#bigGlow)"/>
  <circle cx="240" cy="220" r="22" fill="url(#eyeGlow)" filter="url(#bigGlow)"/>

  <!-- Eye highlights -->
  <circle cx="166" cy="214" r="6" fill="white" opacity="0.7"/>
  <circle cx="246" cy="214" r="6" fill="white" opacity="0.7"/>
  <circle cx="155" cy="228" r="3" fill="white" opacity="0.3"/>
  <circle cx="235" cy="228" r="3" fill="white" opacity="0.3"/>

  <!-- Smile -->
  <path d="M 175 280 Q 200 305 225 280" fill="none" stroke="#4fc3f7" stroke-width="3" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Cheek dots -->
  <circle cx="145" cy="260" r="4" fill="#ff8a80" opacity="0.3"/>
  <circle cx="255" cy="260" r="4" fill="#ff8a80" opacity="0.3"/>

  <!-- Ear pods -->
  <rect x="85" y="200" width="18" height="40" rx="9" fill="#1e2d45" stroke="#3a5070" stroke-width="1.5"/>
  <rect x="297" y="200" width="18" height="40" rx="9" fill="#1e2d45" stroke="#3a5070" stroke-width="1.5"/>
  <circle cx="94" cy="220" r="3" fill="#4fc3f7" opacity="0.5"/>
  <circle cx="306" cy="220" r="3" fill="#4fc3f7" opacity="0.5"/>

  <!-- Neck / body hint -->
  <rect x="170" y="360" width="60" height="30" rx="5" fill="#1e2d45" stroke="#3a5070" stroke-width="1.5"/>
  <path d="M 130 420 Q 200 380 270 420 L 260 470 Q 200 440 140 470 Z" fill="url(#headGrad)" stroke="#3a5070" stroke-width="2"/>

  <!-- Chest light -->
  <circle cx="200" cy="435" r="8" fill="#4fc3f7" opacity="0.6" filter="url(#softGlow)"/>
  <circle cx="200" cy="435" r="4" fill="#a8e6ff" opacity="0.8"/>

  <!-- Subtle circuit lines on head -->
  <line x1="130" y1="160" x2="150" y2="160" stroke="#4fc3f7" stroke-width="0.8" opacity="0.3"/>
  <line x1="150" y1="160" x2="150" y2="175" stroke="#4fc3f7" stroke-width="0.8" opacity="0.3"/>
  <circle cx="130" cy="160" r="1.5" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="150" cy="175" r="1.5" fill="#4fc3f7" opacity="0.3"/>

  <line x1="270" y1="160" x2="250" y2="160" stroke="#4fc3f7" stroke-width="0.8" opacity="0.3"/>
  <line x1="250" y1="160" x2="250" y2="175" stroke="#4fc3f7" stroke-width="0.8" opacity="0.3"/>
  <circle cx="270" cy="160" r="1.5" fill="#4fc3f7" opacity="0.3"/>
  <circle cx="250" cy="175" r="1.5" fill="#4fc3f7" opacity="0.3"/>
</svg>