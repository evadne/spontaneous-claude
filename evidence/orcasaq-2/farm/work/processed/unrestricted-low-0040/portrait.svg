<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#90e0ef"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Ambient particles -->
  <circle cx="80" cy="100" r="1.5" fill="#00f5d4" opacity="0.4"/>
  <circle cx="420" cy="80" r="1" fill="#90e0ef" opacity="0.3"/>
  <circle cx="60" cy="350" r="2" fill="#7209b7" opacity="0.3"/>
  <circle cx="440" cy="400" r="1.5" fill="#00f5d4" opacity="0.35"/>
  <circle cx="100" cy="450" r="1" fill="#90e0ef" opacity="0.25"/>
  <circle cx="380" cy="120" r="1.8" fill="#f72585" opacity="0.3"/>
  <circle cx="150" cy="60" r="1.2" fill="#4cc9f0" opacity="0.4"/>
  <circle cx="350" cy="450" r="1.5" fill="#00f5d4" opacity="0.3"/>

  <!-- Central glow -->
  <circle cx="250" cy="230" r="120" fill="url(#coreGlow)" opacity="0.3"/>

  <!-- Face outline - abstract geometric -->
  <path d="M170 140 Q160 180 155 220 Q150 280 170 330 Q190 370 250 380 Q310 370 330 330 Q350 280 345 220 Q340 180 330 140" 
        fill="none" stroke="url(#lineGrad)" stroke-width="1.5" opacity="0.7" filter="url(#glow)"/>

  <!-- Neural network nodes on face -->
  <g filter="url(#glow)">
    <!-- Forehead nodes -->
    <circle cx="220" cy="160" r="3" fill="#00f5d4" opacity="0.9"/>
    <circle cx="250" cy="150" r="3.5" fill="#90e0ef" opacity="0.9"/>
    <circle cx="280" cy="160" r="3" fill="#00f5d4" opacity="0.9"/>
    
    <!-- Eye nodes -->
    <circle cx="215" cy="210" r="5" fill="#ffffff" opacity="0.95"/>
    <circle cx="215" cy="210" r="10" fill="url(#eyeGlow)" opacity="0.6"/>
    <circle cx="285" cy="210" r="5" fill="#ffffff" opacity="0.95"/>
    <circle cx="285" cy="210" r="10" fill="url(#eyeGlow)" opacity="0.6"/>
    
    <!-- Nose area -->
    <circle cx="250" cy="250" r="2.5" fill="#4cc9f0" opacity="0.7"/>
    <circle cx="240" cy="260" r="2" fill="#4cc9f0" opacity="0.5"/>
    <circle cx="260" cy="260" r="2" fill="#4cc9f0" opacity="0.5"/>
    
    <!-- Mouth area -->
    <circle cx="230" cy="300" r="2.5" fill="#f72585" opacity="0.6"/>
    <circle cx="250" cy="305" r="2.5" fill="#f72585" opacity="0.7"/>
    <circle cx="270" cy="300" r="2.5" fill="#f72585" opacity="0.6"/>
    
    <!-- Cheek nodes -->
    <circle cx="190" cy="260" r="2.5" fill="#00f5d4" opacity="0.5"/>
    <circle cx="310" cy="260" r="2.5" fill="#00f5d4" opacity="0.5"/>
    <circle cx="200" cy="290" r="2" fill="#90e0ef" opacity="0.4"/>
    <circle cx="300" cy="290" r="2" fill="#90e0ef" opacity="0.4"/>
    
    <!-- Chin -->
    <circle cx="250" cy="350" r="3" fill="#7209b7" opacity="0.6"/>
    <circle cx="235" cy="340" r="2" fill="#00f5d4" opacity="0.5"/>
    <circle cx="265" cy="340" r="2" fill="#00f5d4" opacity="0.5"/>
  </g>

  <!-- Connection lines - neural pathways -->
  <g stroke="#00b4d8" stroke-width="0.8" opacity="0.4" fill="none">
    <!-- Forehead connections -->
    <line x1="220" y1="160" x2="250" y2="150"/>
    <line x1="250" y1="150" x2="280" y2="160"/>
    <line x1="220" y1="160" x2="215" y2="210"/>
    <line x1="280" y1="160" x2="285" y2="210"/>
    <line x1="250" y1="150" x2="215" y2="210"/>
    <line x1="250" y1="150" x2="285" y2="210"/>
    
    <!-- Eye to nose -->
    <line x1="215" y1="210" x2="250" y2="250"/>
    <line x1="285" y1="210" x2="250" y2="250"/>
    <line x1="215" y1="210" x2="240" y2="260"/>
    <line x1="285" y1="210" x2="260" y2="260"/>
    
    <!-- Nose to mouth -->
    <line x1="250" y1="250" x2="250" y2="305"/>
    <line x1="240" y1="260" x2="230" y2="300"/>
    <line x1="260" y1="260" x2="270" y2="300"/>
    <line x1="230" y1="300" x2="250" y2="305"/>
    <line x1="270" y1="300" x2="250" y2="305"/>
    
    <!-- Cheek connections -->
    <line x1="190" y1="260" x2="215" y2="210"/>
    <line x1="310" y1="260" x2="285" y2="210"/>
    <line x1="190" y1="260" x2="200" y2="290"/>
    <line x1="310" y1="260" x2="300" y2="290"/>
    <line x1="200" y1="290" x2="230" y2="300"/>
    <line x1="300" y1="290" x2="270" y2="300"/>
    <line x1="190" y1="260" x2="250" y2="250"/>
    <line x1="310" y1="260" x2="250" y2="250"/>
    
    <!-- Chin connections -->
    <line x1="250" y1="305" x2="250" y2="350"/>
    <line x1="230" y1="300" x2="235" y2="340"/>
    <line x1="270" y1="300" x2="265" y2="340"/>
    <line x1="235" y1="340" x2="250" y2="350"/>
    <line x1="265" y1="340" x2="250" y2="350"/>
    <line x1="235" y1="340" x2="265" y2="340"/>
    
    <!-- Face outline to nodes -->
    <line x1="170" y1="140" x2="220" y2="160"/>
    <line x1="330" y1="140" x2="280" y2="160"/>
    <line x1="170" y1="140" x2="190" y2="260"/>
    <line x1="330" y1="140" x2="310" y2="260"/>
    <line x1="250" y1="380" x2="250" y2="350"/>
  </g>

  <!-- Additional outer neural connections -->
  <g stroke="#7209b7" stroke-width="0.5" opacity="0.3" fill="none">
    <line x1="220" y1="160" x2="100" y2="60"/>
    <line x1="280" y1="160" x2="380" y2="120"/>
    <line x1="190" y1="260" x2="60" y2="350"/>
    <line x1="310" y1="260" x2="440" y2="400"/>
    <line x1="250" y1="350" x2="100" y2="450"/>
    <line x1="250" y1="350" x2="350" y2="450"/>
  </g>

  <!-- Eye inner detail - small arcs suggesting thought -->
  <path d="M208 205 Q215 200 222 205" fill="none" stroke="#4cc9f0" stroke-width="1" opacity="0.6"/>
  <path d="M278 205 Q285 200 292 205" fill="none" stroke="#4cc9f0" stroke-width="1" opacity="0.6"/>

  <!-- Subtle binary dots around the face -->
  <g font-family="monospace" font-size="6" fill="#00f5d4" opacity="0.25">
    <text x="130" y="180">0</text>
    <text x="355" y="175">1</text>
    <text x="140" y="250">1</text>
    <text x="350" y="245">0</text>
    <text x="155" y="320">0</text>
    <text x="340" y="315">1</text>
    <text x="240" y="130">1</text>
    <text x="260" y="125">0</text>
    <text x="230" y="385">1</text>
    <text x="265" y="390">0</text>
  </g>

  <!-- Subtle title -->
  <text x="250" y="470" text-anchor="middle" font-family="monospace" font-size="10" fill="#4cc9f0" opacity="0.5">language_model.svg</text>
</svg>