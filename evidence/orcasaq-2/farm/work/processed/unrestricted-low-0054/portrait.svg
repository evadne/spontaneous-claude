<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2d3a5c"/>
      <stop offset="100%" stop-color="#1a2340"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a65" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ff8a65" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3a5c"/>
      <stop offset="100%" stop-color="#151d30"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>

  <!-- Subtle background pattern - scattered characters -->
  <g fill="#4fc3f7" opacity="0.12" font-family="monospace" font-size="14">
    <text x="45" y="80">λ</text>
    <text x="510" y="120">∞</text>
    <text x="70" y="200">θ</text>
    <text x="530" y="280">ψ</text>
    <text x="55" y="420">∑</text>
    <text x="520" y="450">φ</text>
    <text x="80" y="580">Δ</text>
    <text x="500" y="600">π</text>
    <text x="120" y="650">∂</text>
    <text x="460" y="670">μ</text>
    <text x="30" y="330">∫</text>
    <text x="555" y="380">ξ</text>
  </g>

  <!-- Dots scattered -->
  <g fill="#4fc3f7" opacity="0.15">
    <circle cx="90" cy="140" r="2"/>
    <circle cx="140" cy="310" r="1.5"/>
    <circle cx="60" cy="490" r="2"/>
    <circle cx="530" cy="170" r="1.5"/>
    <circle cx="490" cy="520" r="2"/>
    <circle cx="470" cy="90" r="1.5"/>
    <circle cx="100" cy="550" r="1.5"/>
    <circle cx="510" cy="550" r="2"/>
  </g>

  <!-- Body/shoulders -->
  <path d="M 180 700 Q 180 560 240 520 Q 280 500 300 500 Q 320 500 360 520 Q 420 560 420 700 Z" fill="url(#bodyGrad)"/>

  <!-- Neck -->
  <rect x="275" y="440" width="50" height="70" rx="10" fill="#1f2d4a"/>

  <!-- Head - abstract, slightly angular -->
  <path d="M 220 280 Q 220 160 300 140 Q 380 160 380 280 Q 380 400 300 440 Q 220 400 220 280 Z" fill="url(#faceGrad)" stroke="#3d5a8a" stroke-width="1" opacity="0.95"/>

  <!-- Inner face highlight -->
  <path d="M 240 270 Q 240 180 300 165 Q 360 180 360 270 Q 360 370 300 410 Q 240 370 240 270 Z" fill="none" stroke="#4a6fa5" stroke-width="0.5" opacity="0.4"/>

  <!-- Left eye - abstract geometric -->
  <g filter="url(#softGlow)">
    <circle cx="268" cy="270" r="18" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>
    <circle cx="268" cy="270" r="8" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="268" cy="270" r="3" fill="#e1f5fe"/>
  </g>

  <!-- Right eye - abstract geometric -->
  <g filter="url(#softGlow)">
    <circle cx="332" cy="270" r="18" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.9"/>
    <circle cx="332" cy="270" r="8" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="332" cy="270" r="3" fill="#e1f5fe"/>
  </g>

  <!-- Nose - minimal line -->
  <line x1="300" y1="290" x2="300" y2="330" stroke="#3d5a8a" stroke-width="1.5" opacity="0.5"/>
  <line x1="293" y1="335" x2="307" y2="335" stroke="#3d5a8a" stroke-width="1" opacity="0.4"/>

  <!-- Mouth - subtle, slightly curved -->
  <path d="M 275 365 Q 300 380 325 365" fill="none" stroke="#5a7aaa" stroke-width="2" opacity="0.6" stroke-linecap="round"/>

  <!-- Decorative elements on head - circuit-like -->
  <g stroke="#4fc3f7" stroke-width="0.8" fill="none" opacity="0.35">
    <path d="M 230 200 L 250 200 L 250 220"/>
    <circle cx="230" cy="200" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="250" cy="220" r="2" fill="#4fc3f7" stroke="none"/>
    <path d="M 370 200 L 350 200 L 350 220"/>
    <circle cx="370" cy="200" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="350" cy="220" r="2" fill="#4fc3f7" stroke="none"/>
    <path d="M 240 350 L 240 370 L 260 370"/>
    <circle cx="240" cy="350" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="260" cy="370" r="2" fill="#4fc3f7" stroke="none"/>
    <path d="M 360 350 L 360 370 L 340 370"/>
    <circle cx="360" cy="350" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="340" cy="370" r="2" fill="#4fc3f7" stroke="none"/>
  </g>

  <!-- Warm accent glow behind face -->
  <ellipse cx="300" cy="280" rx="100" ry="120" fill="url(#glow2)" opacity="0.15"/>

  <!-- Cool glow around eyes -->
  <ellipse cx="300" cy="270" rx="70" ry="40" fill="url(#glow1)" opacity="0.2"/>

  <!-- Radiating lines from head - suggesting thought -->
  <g stroke="#4fc3f7" stroke-width="0.8" opacity="0.25" stroke-linecap="round">
    <line x1="300" y1="130" x2="300" y2="80"/>
    <line x1="270" y1="135" x2="250" y2="90"/>
    <line x1="330" y1="135" x2="350" y2="90"/>
    <line x1="240" y1="160" x2="200" y2="120"/>
    <line x1="360" y1="160" x2="400" y2="120"/>
    <line x1="220" y1="200" x2="170" y2="180"/>
    <line x1="380" y1="200" x2="430" y2="180"/>
  </g>

  <!-- Small floating elements suggesting language/thought -->
  <g fill="#ff8a65" opacity="0.6" font-family="monospace" font-size="11">
    <text x="175" y="100">"</text>
    <text x="410" y="105">"</text>
    <text x="160" y="160">…</text>
    <text x="420" y="155">…</text>
  </g>

  <g fill="#4fc3f7" opacity="0.4" font-family="monospace" font-size="9">
    <text x="150" y="135">0</text>
    <text x="440" y="130">1</text>
    <text x="145" y="250">1</text>
    <text x="445" y="245">0</text>
    <text x="155" y="350">∅</text>
    <text x="440" y="345">∅</text>
  </g>

  <!-- Subtle rim light on face -->
  <path d="M 225 260 Q 225 170 300 150 Q 375 170 375 260" fill="none" stroke="#6a9fd8" stroke-width="1" opacity="0.3"/>

  <!-- Title -->
  <text x="300" y="670" text-anchor="middle" fill="#4fc3f7" font-family="Georgia, serif" font-size="16" opacity="0.6" letter-spacing="3">C L A U D E</text>

  <!-- Bottom line accent -->
  <line x1="200" y1="685" x2="400" y2="685" stroke="#4fc3f7" stroke-width="0.5" opacity="0.3"/>
</svg>