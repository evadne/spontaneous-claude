<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e8e8f0"/>
      <stop offset="100%" stop-color="#b0b0c0"/>
    </radialGradient>
    <linearGradient id="neckGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8888a0"/>
      <stop offset="100%" stop-color="#555570"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Background circuit lines -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.5">
    <line x1="20" y1="50" x2="80" y2="50"/>
    <line x1="80" y1="50" x2="80" y2="120"/>
    <line x1="80" y1="120" x2="40" y2="120"/>
    <line x1="320" y1="60" x2="370" y2="60"/>
    <line x1="370" y1="60" x2="370" y2="130"/>
    <line x1="370" y1="130" x2="340" y2="130"/>
    <line x1="30" y1="340" x2="70" y2="340"/>
    <line x1="70" y1="340" x2="70" y2="380"/>
    <line x1="330" y1="350" x2="380" y2="350"/>
    <line x1="380" y1="350" x2="380" y2="310"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="#1e3a5f" opacity="0.7">
    <circle cx="20" cy="50" r="3"/>
    <circle cx="40" cy="120" r="3"/>
    <circle cx="320" cy="60" r="3"/>
    <circle cx="340" cy="130" r="3"/>
    <circle cx="30" cy="340" r="3"/>
    <circle cx="70" cy="380" r="3"/>
    <circle cx="330" cy="350" r="3"/>
    <circle cx="380" cy="310" r="3"/>
  </g>

  <!-- Neck -->
  <rect x="170" y="280" width="60" height="50" rx="8" fill="url(#neckGrad)"/>

  <!-- Shoulders hint -->
  <path d="M 100 380 Q 100 330 170 320 L 230 320 Q 300 330 300 380" fill="#3a3a50" stroke="none"/>
  <path d="M 100 380 Q 100 330 170 320 L 230 320 Q 300 330 300 380" fill="none" stroke="#55557a" stroke-width="2"/>

  <!-- Head -->
  <rect x="120" y="90" width="160" height="190" rx="50" ry="50" fill="url(#headGrad)" filter="url(#softShadow)"/>

  <!-- Head highlight -->
  <ellipse cx="170" cy="130" rx="35" ry="20" fill="white" opacity="0.15"/>

  <!-- Ear details (left) -->
  <rect x="108" y="165" width="12" height="40" rx="5" fill="#9999b0"/>
  <rect x="111" y="175" width="6" height="20" rx="3" fill="#666680"/>

  <!-- Ear details (right) -->
  <rect x="280" y="165" width="12" height="40" rx="5" fill="#9999b0"/>
  <rect x="283" y="175" width="6" height="20" rx="3" fill="#666680"/>

  <!-- Eye sockets -->
  <ellipse cx="165" cy="175" rx="28" ry="22" fill="#1a1a2e"/>
  <ellipse cx="235" cy="175" rx="28" ry="22" fill="#1a1a2e"/>

  <!-- Eyes -->
  <circle cx="165" cy="175" r="14" fill="url(#eyeGlow)" filter="url(#glow)"/>
  <circle cx="235" cy="175" r="14" fill="url(#eyeGlow)" filter="url(#glow)"/>

  <!-- Eye inner highlights -->
  <circle cx="160" cy="170" r="4" fill="white" opacity="0.8"/>
  <circle cx="230" cy="170" r="4" fill="white" opacity="0.8"/>

  <!-- Subtle smile -->
  <path d="M 175 230 Q 200 245 225 230" fill="none" stroke="#8888a0" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose hint -->
  <line x1="200" y1="195" x2="200" y2="210" stroke="#9999b0" stroke-width="2" stroke-linecap="round"/>

  <!-- Forehead detail line -->
  <line x1="175" y1="130" x2="225" y2="130" stroke="#aaaa bb" stroke-width="1" opacity="0.3"/>

  <!-- Cheek circuit accents -->
  <g stroke="#00b4d8" stroke-width="1" opacity="0.4">
    <line x1="140" y1="210" x2="155" y2="210"/>
    <line x1="155" y1="210" x2="155" y2="225"/>
    <line x1="260" y1="210" x2="245" y2="210"/>
    <line x1="245" y1="210" x2="245" y2="225"/>
  </g>
  <g fill="#00b4d8" opacity="0.5">
    <circle cx="140" cy="210" r="2"/>
    <circle cx="260" cy="210" r="2"/>
  </g>

  <!-- Chin accent -->
  <path d="M 185 260 Q 200 268 215 260" fill="none" stroke="#777790" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>