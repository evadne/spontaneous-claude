<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2d2d4e"/>
      <stop offset="100%" stop-color="#1e1e3a"/>
    </radialGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="50%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#64b5f6"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#4a90d9" stroke-width="0.5">
    <line x1="0" y1="50" x2="400" y2="50"/>
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="150" x2="400" y2="150"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="250" x2="400" y2="250"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="350" x2="400" y2="350"/>
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
  </g>

  <!-- Floating nodes in background -->
  <g opacity="0.3" filter="url(#nodeGlow)">
    <circle cx="50" cy="60" r="3" fill="#4a90d9"/>
    <circle cx="340" cy="45" r="2" fill="#7ec8e3"/>
    <circle cx="30" cy="200" r="2.5" fill="#64b5f6"/>
    <circle cx="370" cy="180" r="3" fill="#4a90d9"/>
    <circle cx="60" cy="340" r="2" fill="#7ec8e3"/>
    <circle cx="340" cy="350" r="2.5" fill="#64b5f6"/>
    <circle cx="200" cy="30" r="2" fill="#90caf9"/>
    <circle cx="15" cy="120" r="2" fill="#4a90d9"/>
    <circle cx="385" cy="290" r="2" fill="#7ec8e3"/>
  </g>

  <!-- Connection lines from background -->
  <g opacity="0.1" stroke="#4a90d9" stroke-width="0.5">
    <line x1="50" y1="60" x2="120" y2="140"/>
    <line x1="340" y1="45" x2="280" y2="130"/>
    <line x1="30" y1="200" x2="110" y2="200"/>
    <line x1="370" y1="180" x2="290" y2="195"/>
    <line x1="60" y1="340" x2="140" y2="310"/>
    <line x1="340" y1="350" x2="260" y2="320"/>
  </g>

  <!-- Main head shape - soft rounded rectangle -->
  <rect x="105" y="95" width="190" height="210" rx="55" ry="55" fill="url(#faceGrad)" stroke="#3a3a5e" stroke-width="1.5"/>

  <!-- Inner face highlight -->
  <rect x="115" y="105" width="170" height="190" rx="48" ry="48" fill="none" stroke="#3d3d60" stroke-width="0.5" opacity="0.5"/>

  <!-- Left eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="160" cy="185" rx="22" ry="24" fill="none" stroke="url(#eyeGlow)" stroke-width="2"/>
    <circle cx="160" cy="185" r="8" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="163" cy="181" r="3" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="240" cy="185" rx="22" ry="24" fill="none" stroke="url(#eyeGlow)" stroke-width="2"/>
    <circle cx="240" cy="185" r="8" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="243" cy="181" r="3" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Gentle smile -->
  <path d="M 165 240 Q 200 265 235 240" fill="none" stroke="url(#smileGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Small cheek dots -->
  <circle cx="140" cy="230" r="5" fill="#4a90d9" opacity="0.15"/>
  <circle cx="260" cy="230" r="5" fill="#4a90d9" opacity="0.15"/>

  <!-- Decorative antenna/sprout on top -->
  <g opacity="0.8">
    <line x1="200" y1="95" x2="200" y2="70" stroke="#4a90d9" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="200" cy="65" r="5" fill="none" stroke="#7ec8e3" stroke-width="1.5" filter="url(#nodeGlow)"/>
    <circle cx="200" cy="65" r="2" fill="#7ec8e3"/>
  </g>

  <!-- Side nodes (like ears) -->
  <g filter="url(#nodeGlow)">
    <circle cx="105" cy="195" r="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
    <circle cx="105" cy="195" r="1.5" fill="#4a90d9"/>
    <circle cx="295" cy="195" r="4" fill="none" stroke="#4a90d9" stroke-width="1.5"/>
    <circle cx="295" cy="195" r="1.5" fill="#4a90d9"/>
  </g>

  <!-- Connection lines from side nodes -->
  <g opacity="0.2" stroke="#4a90d9" stroke-width="0.5">
    <line x1="105" y1="195" x2="60" y2="180"/>
    <line x1="105" y1="195" x2="50" y2="210"/>
    <line x1="295" y1="195" x2="340" y2="180"/>
    <line x1="295" y1="195" x2="350" y2="210"/>
  </g>

  <!-- Subtle inner pattern - text fragments -->
  <g opacity="0.04" fill="#7ec8e3" font-family="monospace" font-size="8">
    <text x="130" y="140">01</text>
    <text x="250" y="140">10</text>
    <text x="170" y="290">11</text>
    <text x="220" y="290">01</text>
  </g>

  <!-- Bottom connection to body suggestion -->
  <g opacity="0.4">
    <rect x="155" y="305" width="90" height="30" rx="10" fill="url(#faceGrad)" stroke="#3a3a5e" stroke-width="1"/>
    <line x1="200" y1="335" x2="200" y2="360" stroke="#3a3a5e" stroke-width="1" opacity="0.5"/>
    <circle cx="200" cy="365" r="3" fill="#4a90d9" opacity="0.4"/>
  </g>

  <!-- Subtle outer glow ring -->
  <circle cx="200" cy="195" r="155" fill="none" stroke="#4a90d9" stroke-width="0.3" opacity="0.1"/>
  <circle cx="200" cy="195" r="165" fill="none" stroke="#4a90d9" stroke-width="0.2" opacity="0.05"/>
</svg>