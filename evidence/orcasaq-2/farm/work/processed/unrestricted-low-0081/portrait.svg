<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#7b68ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b68ee"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b68ee" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="2"/>
      <feComposite operator="out" in="SourceGraphic"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="400" y2="50" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="400" y2="100" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="400" y2="150" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="400" y2="250" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="400" y2="350" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="400" y2="400" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="400" y2="450" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="50" y1="0" x2="50" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="250" y1="0" x2="250" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
    <line x1="350" y1="0" x2="350" y2="500" stroke="#4a90d9" stroke-width="0.5"/>
  </g>

  <!-- Head/face shape - abstract geometric -->
  <path d="M200 80 C260 80, 290 120, 290 180 C290 240, 270 290, 240 320 C225 335, 215 340, 200 340 C185 340, 175 335, 160 320 C130 290, 110 240, 110 180 C110 120, 140 80, 200 80 Z" fill="url(#face)" opacity="0.9" filter="url(#softGlow)"/>

  <!-- Inner face structure - geometric lines -->
  <g stroke="#00d4ff" stroke-width="1" fill="none" opacity="0.4">
    <line x1="140" y1="160" x2="260" y2="160"/>
    <line x1="140" y1="200" x2="260" y2="200"/>
    <line x1="140" y1="240" x2="260" y2="240"/>
    <line x1="140" y1="280" x2="260" y2="280"/>
    <line x1="160" y1="120" x2="160" y2="310"/>
    <line x1="200" y1="100" x2="200" y2="330"/>
    <line x1="240" y1="120" x2="240" y2="310"/>
  </g>

  <!-- Left eye - geometric diamond -->
  <g transform="translate(160, 185)">
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#00d4ff" opacity="0.8"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Right eye - geometric diamond -->
  <g transform="translate(240, 185)">
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#softGlow)"/>
    <circle cx="0" cy="0" r="4" fill="#00d4ff" opacity="0.8"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.5"/>
  </g>

  <!-- Nose - subtle geometric hint -->
  <line x1="200" y1="195" x2="195" y2="230" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="195" x2="205" y2="230" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <line x1="195" y1="230" x2="205" y2="230" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>

  <!-- Mouth - subtle curve -->
  <path d="M175 260 Q200 275 225 260" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Neck and shoulders -->
  <path d="M170 335 L170 370 Q170 380 160 385 L80 420 Q70 425 70 440 L70 500 L330 500 L330 440 Q330 425 320 420 L240 385 Q230 380 230 370 L230 335" fill="url(#face)" opacity="0.7"/>

  <!-- Shoulder geometric details -->
  <g stroke="#00d4ff" stroke-width="0.8" fill="none" opacity="0.3">
    <line x1="90" y1="430" x2="180" y2="390"/>
    <line x1="310" y1="430" x2="220" y2="390"/>
    <line x1="100" y1="460" x2="190" y2="420"/>
    <line x1="300" y1="460" x2="210" y2="420"/>
  </g>

  <!-- Thought/circuit patterns emanating from head -->
  <g opacity="0.5" filter="url(#softGlow)">
    <!-- Left side circuits -->
    <circle cx="70" cy="130" r="3" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="50" cy="110" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="60" cy="90" r="1.5" fill="#00d4ff" opacity="0.4"/>
    <line x1="70" y1="130" x2="50" y2="110" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="50" y1="110" x2="60" y2="90" stroke="#00d4ff" stroke-width="0.8"/>

    <!-- Right side circuits -->
    <circle cx="330" cy="130" r="3" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="350" cy="110" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="340" cy="90" r="1.5" fill="#00d4ff" opacity="0.4"/>
    <line x1="330" y1="130" x2="350" y2="110" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="350" y1="110" x2="340" y2="90" stroke="#00d4ff" stroke-width="0.8"/>

    <!-- Top circuits -->
    <circle cx="200" cy="50" r="3" fill="none" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="180" cy="35" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="220" cy="35" r="2" fill="#00d4ff" opacity="0.6"/>
    <line x1="200" y1="50" x2="180" y2="35" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="200" y1="50" x2="220" y2="35" stroke="#00d4ff" stroke-width="0.8"/>
  </g>

  <!-- Floating data particles -->
  <g fill="#00d4ff">
    <circle cx="80" cy="200" r="1" opacity="0.3"/>
    <circle cx="60" cy="250" r="1.5" opacity="0.2"/>
    <circle cx="320" cy="200" r="1" opacity="0.3"/>
    <circle cx="340" cy="250" r="1.5" opacity="0.2"/>
    <circle cx="100" cy="80" r="1" opacity="0.25"/>
    <circle cx="300" cy="80" r="1" opacity="0.25"/>
    <circle cx="45" cy="160" r="1" opacity="0.2"/>
    <circle cx="355" cy="160" r="1" opacity="0.2"/>
  </g>

  <!-- Subtle aura/glow around head -->
  <ellipse cx="200" cy="200" rx="120" ry="140" fill="none" stroke="url(#accent)" stroke-width="0.5" opacity="0.2"/>
  <ellipse cx="200" cy="200" rx="130" ry="150" fill="none" stroke="url(#accent)" stroke-width="0.3" opacity="0.1"/>

  <!-- Binary/digital text hints -->
  <g font-family="monospace" font-size="6" fill="#00d4ff" opacity="0.15">
    <text x="30" y="300">01</text>
    <text x="30" y="320">10</text>
    <text x="30" y="340">11</text>
    <text x="370" y="300">01</text>
    <text x="365" y="320">10</text>
    <text x="370" y="340">11</text>
  </g>
</svg>