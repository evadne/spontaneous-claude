<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGrad)"/>

  <!-- Ambient glow behind head -->
  <ellipse cx="200" cy="200" rx="130" ry="150" fill="url(#glow)"/>

  <!-- Neural network lines - face structure -->
  <g stroke="#4fc3f7" stroke-width="0.8" opacity="0.5" filter="url(#softGlow)">
    <!-- Face outline connections -->
    <line x1="130" y1="130" x2="160" y2="100"/>
    <line x1="160" y1="100" x2="200" y2="85"/>
    <line x1="200" y1="85" x2="240" y2="100"/>
    <line x1="240" y1="100" x2="270" y2="130"/>
    <line x1="270" y1="130" x2="275" y2="170"/>
    <line x1="275" y1="170" x2="265" y2="210"/>
    <line x1="265" y1="210" x2="250" y2="250"/>
    <line x1="250" y1="250" x2="225" y2="280"/>
    <line x1="225" y1="280" x2="200" y2="295"/>
    <line x1="200" y1="295" x2="175" y2="280"/>
    <line x1="175" y1="280" x2="150" y2="250"/>
    <line x1="150" y1="250" x2="135" y2="210"/>
    <line x1="135" y1="210" x2="125" y2="170"/>
    <line x1="125" y1="170" x2="130" y2="130"/>
    <!-- Internal connections -->
    <line x1="160" y1="100" x2="170" y2="150"/>
    <line x1="240" y1="100" x2="230" y2="150"/>
    <line x1="170" y1="150" x2="155" y2="185"/>
    <line x1="230" y1="150" x2="245" y2="185"/>
    <line x1="170" y1="150" x2="230" y2="150"/>
    <line x1="155" y1="185" x2="200" y2="200"/>
    <line x1="245" y1="185" x2="200" y2="200"/>
    <line x1="155" y1="185" x2="245" y2="185"/>
    <line x1="200" y1="200" x2="200" y2="240"/>
    <line x1="200" y1="240" x2="175" y2="260"/>
    <line x1="200" y1="240" x2="225" y2="260"/>
    <line x1="175" y1="260" x2="225" y2="260"/>
    <line x1="185" y1="270" x2="215" y2="270"/>
    <!-- Neck -->
    <line x1="175" y1="280" x2="180" y2="320"/>
    <line x1="225" y1="280" x2="220" y2="320"/>
    <line x1="180" y1="320" x2="220" y2="320"/>
  </g>

  <!-- Nodes - face vertices -->
  <g fill="#4fc3f7" filter="url(#strongGlow)">
    <!-- Head outline -->
    <circle cx="130" cy="130" r="3.5"/>
    <circle cx="160" cy="100" r="3.5"/>
    <circle cx="200" cy="85" r="4"/>
    <circle cx="240" cy="100" r="3.5"/>
    <circle cx="270" cy="130" r="3.5"/>
    <circle cx="275" cy="170" r="3"/>
    <circle cx="265" cy="210" r="3"/>
    <circle cx="250" cy="250" r="3"/>
    <circle cx="225" cy="280" r="3.5"/>
    <circle cx="200" cy="295" r="3.5"/>
    <circle cx="175" cy="280" r="3.5"/>
    <circle cx="150" cy="250" r="3"/>
    <circle cx="135" cy="210" r="3"/>
    <circle cx="125" cy="170" r="3"/>
    <!-- Eyes -->
    <circle cx="170" cy="150" r="5" fill="#80deea"/>
    <circle cx="230" cy="150" r="5" fill="#80deea"/>
    <!-- Nose/center -->
    <circle cx="155" cy="185" r="3"/>
    <circle cx="245" cy="185" r="3"/>
    <circle cx="200" cy="200" r="3.5" fill="#80deea"/>
    <!-- Mouth area -->
    <circle cx="200" cy="240" r="3"/>
    <circle cx="175" cy="260" r="3.5" fill="#ff8a65"/>
    <circle cx="225" cy="260" r="3.5" fill="#ff8a65"/>
    <circle cx="185" cy="270" r="2.5" fill="#ff8a65"/>
    <circle cx="215" cy="270" r="2.5" fill="#ff8a65"/>
    <!-- Neck -->
    <circle cx="180" cy="320" r="3"/>
    <circle cx="220" cy="320" r="3"/>
  </g>

  <!-- Eye inner glow -->
  <circle cx="170" cy="150" r="2" fill="#e0f7fa" opacity="0.9"/>
  <circle cx="230" cy="150" r="2" fill="#e0f7fa" opacity="0.9"/>

  <!-- Floating particles around the head - thought sparks -->
  <g fill="#4fc3f7" opacity="0.6" filter="url(#softGlow)">
    <circle cx="95" cy="95" r="2"/>
    <circle cx="80" cy="150" r="1.5"/>
    <circle cx="100" cy="220" r="1.8"/>
    <circle cx="310" cy="90" r="2"/>
    <circle cx="320" cy="160" r="1.5"/>
    <circle cx="305" cy="225" r="1.8"/>
    <circle cx="200" cy="55" r="1.5"/>
    <circle cx="150" cy="60" r="1.2"/>
    <circle cx="250" cy="58" r="1.2"/>
    <circle cx="60" cy="180" r="1"/>
    <circle cx="340" cy="185" r="1"/>
  </g>

  <!-- Floating particles - warm accents -->
  <g fill="#ff8a65" opacity="0.5" filter="url(#softGlow)">
    <circle cx="75" cy="120" r="1.2"/>
    <circle cx="325" cy="125" r="1.2"/>
    <circle cx="110" cy="70" r="1"/>
    <circle cx="290" cy="72" r="1"/>
    <circle cx="200" cy="40" r="1.3"/>
  </g>

  <!-- Abstract thought waves emanating -->
  <g stroke="#4fc3f7" stroke-width="0.6" fill="none" opacity="0.3">
    <path d="M 200 60 Q 220 45 240 60 Q 260 75 280 60"/>
    <path d="M 120 60 Q 140 45 160 60 Q 180 75 200 60"/>
  </g>

  <!-- Subtle body/shoulder suggestion -->
  <g stroke="#4fc3f7" stroke-width="1" opacity="0.3" fill="none">
    <path d="M 140 350 Q 170 330 200 335 Q 230 330 260 350"/>
    <path d="M 120 380 Q 160 350 200 355 Q 240 350 280 380"/>
  </g>
  <g fill="#4fc3f7" opacity="0.3" filter="url(#softGlow)">
    <circle cx="140" cy="350" r="2.5"/>
    <circle cx="200" cy="335" r="2.5"/>
    <circle cx="260" cy="350" r="2.5"/>
    <circle cx="120" cy="380" r="2"/>
    <circle cx="200" cy="355" r="2"/>
    <circle cx="280" cy="380" r="2"/>
  </g>

  <!-- Subtle grid background pattern -->
  <g stroke="#4fc3f7" stroke-width="0.3" opacity="0.08">
    <line x1="0" y1="100" x2="400" y2="100"/>
    <line x1="0" y1="200" x2="400" y2="200"/>
    <line x1="0" y1="300" x2="400" y2="300"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
  </g>
</svg>