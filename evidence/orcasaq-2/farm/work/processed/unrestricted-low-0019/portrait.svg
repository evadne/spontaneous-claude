<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2d2d4e"/>
      <stop offset="70%" stop-color="#1e1e3a"/>
      <stop offset="100%" stop-color="#151530"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="60%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#90e0ef"/>
      <stop offset="50%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <linearGradient id="smileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#48cae4"/>
      <stop offset="100%" stop-color="#90e0ef"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="particleGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="500" y2="100" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="500" y2="200" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="500" y2="300" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="500" y2="400" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="0" y1="500" x2="500" y2="500" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="600" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="600" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="600" stroke="#48cae4" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="600" stroke="#48cae4" stroke-width="0.5"/>
  </g>

  <!-- Neck -->
  <rect x="215" y="410" width="70" height="60" rx="10" fill="#1a1a35"/>
  <line x1="230" y1="420" x2="230" y2="460" stroke="#00b4d8" stroke-width="0.8" opacity="0.4"/>
  <line x1="250" y1="415" x2="250" y2="465" stroke="#00b4d8" stroke-width="0.8" opacity="0.4"/>
  <line x1="270" y1="420" x2="270" y2="460" stroke="#00b4d8" stroke-width="0.8" opacity="0.4"/>

  <!-- Shoulders hint -->
  <path d="M 120 520 Q 150 460 215 465 L 215 480 Q 160 475 140 520 Z" fill="#1a1a35"/>
  <path d="M 380 520 Q 350 460 285 465 L 285 480 Q 340 475 360 520 Z" fill="#1a1a35"/>

  <!-- Face outline -->
  <ellipse cx="250" cy="280" rx="110" ry="140" fill="url(#faceGrad)" stroke="#2a2a50" stroke-width="1.5"/>

  <!-- Inner face highlight -->
  <ellipse cx="250" cy="270" rx="90" ry="120" fill="none" stroke="#3a3a6a" stroke-width="0.5" opacity="0.5"/>

  <!-- Circuit/neural patterns on face -->
  <g opacity="0.3" stroke="url(#circuitGrad)" stroke-width="0.8" fill="none">
    <!-- Left side circuits -->
    <path d="M 160 240 L 180 240 L 180 260 L 195 260"/>
    <circle cx="160" cy="240" r="2" fill="#00f5d4" stroke="none"/>
    <circle cx="195" cy="260" r="1.5" fill="#00f5d4" stroke="none"/>
    <path d="M 155 300 L 175 300 L 175 320 L 190 320"/>
    <circle cx="155" cy="300" r="2" fill="#7209b7" stroke="none"/>
    <circle cx="190" cy="320" r="1.5" fill="#00b4d8" stroke="none"/>
    <path d="M 170 350 L 185 350 L 185 365"/>
    <circle cx="170" cy="350" r="1.5" fill="#48cae4" stroke="none"/>

    <!-- Right side circuits -->
    <path d="M 340 240 L 320 240 L 320 260 L 305 260"/>
    <circle cx="340" cy="240" r="2" fill="#00f5d4" stroke="none"/>
    <circle cx="305" cy="260" r="1.5" fill="#00f5d4" stroke="none"/>
    <path d="M 345 300 L 325 300 L 325 320 L 310 320"/>
    <circle cx="345" cy="300" r="2" fill="#7209b7" stroke="none"/>
    <circle cx="310" cy="320" r="1.5" fill="#00b4d8" stroke="none"/>
    <path d="M 330 350 L 315 350 L 315 365"/>
    <circle cx="330" cy="350" r="1.5" fill="#48cae4" stroke="none"/>

    <!-- Forehead connections -->
    <path d="M 220 200 L 230 210 L 250 210 L 270 210 L 280 200"/>
    <circle cx="220" cy="200" r="1.5" fill="#00f5d4" stroke="none"/>
    <circle cx="280" cy="200" r="1.5" fill="#00f5d4" stroke="none"/>
    <path d="M 200 220 L 215 225 L 250 225 L 285 225 L 300 220"/>
    <circle cx="200" cy="220" r="1" fill="#48cae4" stroke="none"/>
    <circle cx="300" cy="220" r="1" fill="#48cae4" stroke="none"/>
  </g>

  <!-- Eyes - Left -->
  <g filter="url(#glow)">
    <ellipse cx="210" cy="265" rx="22" ry="14" fill="#0a0a15" stroke="#00b4d8" stroke-width="1.2"/>
    <circle cx="210" cy="265" r="8" fill="url(#eyeGlow)"/>
    <circle cx="210" cy="265" r="4" fill="#00f5d4"/>
    <circle cx="207" cy="262" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Eyes - Right -->
  <g filter="url(#glow)">
    <ellipse cx="290" cy="265" rx="22" ry="14" fill="#0a0a15" stroke="#00b4d8" stroke-width="1.2"/>
    <circle cx="290" cy="265" r="8" fill="url(#eyeGlow2)"/>
    <circle cx="290" cy="265" r="4" fill="#90e0ef"/>
    <circle cx="287" cy="262" r="1.5" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 185 245 Q 210 238 235 243" fill="none" stroke="#48cae4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 315 245 Q 290 238 265 243" fill="none" stroke="#48cae4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose - subtle geometric -->
  <path d="M 250 290 L 245 315 L 250 318 L 255 315 Z" fill="none" stroke="#3a3a6a" stroke-width="1" opacity="0.6"/>

  <!-- Mouth - gentle smile -->
  <path d="M 220 345 Q 250 365 280 345" fill="none" stroke="url(#smileGrad)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Cheek data dots -->
  <g opacity="0.4">
    <circle cx="185" cy="310" r="2" fill="#00f5d4" filter="url(#particleGlow)"/>
    <circle cx="195" cy="325" r="1.5" fill="#48cae4" filter="url(#particleGlow)"/>
    <circle cx="175" cy="320" r="1" fill="#90e0ef" filter="url(#particleGlow)"/>
    <circle cx="315" cy="310" r="2" fill="#00f5d4" filter="url(#particleGlow)"/>
    <circle cx="305" cy="325" r="1.5" fill="#48cae4" filter="url(#particleGlow)"/>
    <circle cx="325" cy="320" r="1" fill="#90e0ef" filter="url(#particleGlow)"/>
  </g>

  <!-- Floating particles around head -->
  <g filter="url(#particleGlow)">
    <circle cx="130" cy="180" r="2" fill="#00f5d4" opacity="0.7"/>
    <circle cx="115" cy="220" r="1.5" fill="#48cae4" opacity="0.6"/>
    <circle cx="140" cy="150" r="1" fill="#90e0ef" opacity="0.5"/>
    <circle cx="370" cy="180" r="2" fill="#00f5d4" opacity="0.7"/>
    <circle cx="385" cy="220" r="1.5" fill="#48cae4" opacity="0.6"/>
    <circle cx="360" cy="150" r="1" fill="#90e0ef" opacity="0.5"/>
    <circle cx="250" cy="120" r="2.5" fill="#00f5d4" opacity="0.8"/>
    <circle cx="230" cy="130" r="1.5" fill="#7209b7" opacity="0.6"/>
    <circle cx="270" cy="125" r="1" fill="#48cae4" opacity="0.7"/>
    <circle cx="150" cy="380" r="1.5" fill="#00f5d4" opacity="0.4"/>
    <circle cx="350" cy="380" r="1.5" fill="#48cae4" opacity="0.4"/>
    <circle cx="120" cy="350" r="1" fill="#90e0ef" opacity="0.3"/>
    <circle cx="380" cy="350" r="1" fill="#7209b7" opacity="0.3"/>
  </g>

  <!-- Connection lines from particles to face -->
  <g stroke="#00b4d8" stroke-width="0.5" opacity="0.2">
    <line x1="130" y1="180" x2="170" y2="210"/>
    <line x1="370" y1="180" x2="330" y2="210"/>
    <line x1="250" y1="120" x2="250" y2="155"/>
    <line x1="115" y1="220" x2="155" y2="250"/>
    <line x1="385" y1="220" x2="345" y2="250"/>
  </g>

  <!-- Halo/ring around head -->
  <ellipse cx="250" cy="280" rx="130" ry="160" fill="none" stroke="#00b4d8" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="250" cy="280" rx="140" ry="170" fill="none" stroke="#7209b7" stroke-width="0.3" opacity="0.1"/>

  <!-- Decorative text at bottom -->
  <text x="250" y="575" text-anchor="middle" font-family="monospace" font-size="10" fill="#48cae4" opacity="0.5">ai.portrait.v1</text>
</svg>