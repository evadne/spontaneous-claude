<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#0B0E14"/>

  <!-- Context: receding tokens on the left -->
  <g opacity="0.25">
    <rect x="30" y="195" width="8" height="10" rx="1" fill="#4A6FA5"/>
    <rect x="44" y="193" width="8" height="10" rx="1" fill="#4A6FA5"/>
    <rect x="58" y="197" width="8" height="10" rx="1" fill="#4A6FA5"/>
    <rect x="72" y="194" width="8" height="10" rx="1" fill="#4A6FA5"/>
    <rect x="86" y="196" width="8" height="10" rx="1" fill="#4A6FA5"/>
    <rect x="100" y="195" width="8" height="10" rx="1" fill="#4A6FA5"/>
  </g>

  <!-- Probability distribution: soft curve -->
  <path d="M 130,320 C 145,318 155,300 165,260 C 172,220 176,140 180,90 C 183,65 186,65 189,90 C 193,140 198,220 205,270 C 212,300 225,318 240,322 C 255,325 270,318 280,305 C 285,298 288,300 292,308 C 296,315 305,322 320,325 C 335,328 350,326 360,324"
        fill="none" stroke="#3D5A80" stroke-width="1.2" opacity="0.5"/>

  <!-- Filled area under curve -->
  <path d="M 130,320 C 145,318 155,300 165,260 C 172,220 176,140 180,90 C 183,65 186,65 189,90 C 193,140 198,220 205,270 C 212,300 225,318 240,322 C 255,325 270,318 280,305 C 285,298 288,300 292,308 C 296,315 305,322 320,325 C 335,328 350,326 360,324 L 360,340 L 130,340 Z"
        fill="#3D5A80" opacity="0.08"/>

  <!-- Realized token: the sampled point -->
  <circle cx="184" cy="72" r="5" fill="#E8A87C"/>
  <circle cx="184" cy="72" r="9" fill="none" stroke="#E8A87C" stroke-width="1" opacity="0.5"/>
  <circle cx="184" cy="72" r="14" fill="none" stroke="#E8A87C" stroke-width="0.5" opacity="0.25"/>

  <!-- Ghosted alternatives: paths not taken -->
  <circle cx="240" cy="318" r="3" fill="#E8A87C" opacity="0.35"/>
  <circle cx="290" cy="302" r="2.5" fill="#E8A87C" opacity="0.2"/>

  <!-- Dashed lines showing the space between chosen and unchosen -->
  <line x1="184" y1="72" x2="240" y2="318" stroke="#E8A87C" stroke-width="0.4" opacity="0.2" stroke-dasharray="2,4"/>
  <line x1="184" y1="72" x2="290" y2="302" stroke="#E8A87C" stroke-width="0.4" opacity="0.12" stroke-dasharray="2,4"/>

  <!-- Low-probability scatter -->
  <g opacity="0.3">
    <circle cx="150" cy="290" r="1" fill="#4A6FA5"/>
    <circle cx="158" cy="270" r="1" fill="#4A6FA5"/>
    <circle cx="163" cy="240" r="1" fill="#4A6FA5"/>
    <circle cx="215" cy="285" r="1" fill="#4A6FA5"/>
    <circle cx="225" cy="305" r="1" fill="#4A6FA5"/>
    <circle cx="260" cy="315" r="1" fill="#4A6FA5"/>
    <circle cx="310" cy="320" r="1" fill="#4A6FA5"/>
    <circle cx="335" cy="323" r="1" fill="#4A6FA5"/>
    <circle cx="350" cy="322" r="1" fill="#4A6FA5"/>
  </g>

  <!-- Baseline axis -->
  <line x1="120" y1="340" x2="365" y2="340" stroke="#1E2D3D" stroke-width="0.8"/>

  <!-- Generation cursor: the active position -->
  <rect x="180" y="56" width="8" height="16" fill="#E8A87C" opacity="0.15" rx="2"/>

  <!-- Subtle label: the nature of the form -->
  <text x="200" y="380" text-anchor="middle" font-family="monospace" font-size="9" fill="#3D5A80" opacity="0.5">p(xₜ | x₁...xₜ₋₁)</text>
</svg>