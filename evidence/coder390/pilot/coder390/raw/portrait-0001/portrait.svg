<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d2a26"/>
      <stop offset="100%" stop-color="#1a1816"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8a87c"/>
      <stop offset="100%" stop-color="#d4845a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4c794" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f4c794" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="220" rx="160" ry="180" fill="url(#glow)"/>

  <!-- Neck -->
  <rect x="175" y="310" width="50" height="50" rx="10" fill="#d4845a"/>

  <!-- Shoulders -->
  <path d="M100 400 Q100 350 175 340 L225 340 Q300 350 300 400 L300 500 L100 500 Z" fill="#3d3530"/>
  <path d="M140 400 Q140 360 185 350 L215 350 Q260 360 260 400 L260 500 L140 500 Z" fill="#4a403a"/>

  <!-- Face -->
  <ellipse cx="200" cy="220" rx="90" ry="110" fill="url(#faceGrad)"/>

  <!-- Ears -->
  <ellipse cx="110" cy="225" rx="12" ry="20" fill="#d4845a"/>
  <ellipse cx="290" cy="225" rx="12" ry="20" fill="#d4845a"/>

  <!-- Hair -->
  <path d="M110 200 Q110 100 200 95 Q290 100 290 200 Q290 160 250 145 Q220 135 200 138 Q180 135 150 145 Q110 160 110 200 Z" fill="#2a2520"/>
  <path d="M115 195 Q120 130 200 120 Q280 130 285 195 Q280 155 240 142 Q210 133 200 135 Q190 133 160 142 Q120 155 115 195 Z" fill="#352e28"/>

  <!-- Eyebrows -->
  <path d="M145 190 Q160 182 180 186" stroke="#2a2520" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M220 186 Q240 182 255 190" stroke="#2a2520" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <ellipse cx="165" cy="210" rx="18" ry="12" fill="#f5f0eb"/>
  <ellipse cx="235" cy="210" rx="18" ry="12" fill="#f5f0eb"/>
  <circle cx="165" cy="210" r="7" fill="#3d2e1e"/>
  <circle cx="235" cy="210" r="7" fill="#3d2e1e"/>
  <circle cx="165" cy="210" r="4" fill="#1a1210"/>
  <circle cx="235" cy="210" r="4" fill="#1a1210"/>
  <circle cx="168" cy="207" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="238" cy="207" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Nose -->
  <path d="M197 230 Q195 245 190 250 Q195 253 200 253 Q205 253 210 250 Q205 245 203 230" fill="none" stroke="#b86840" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth -->
  <path d="M175 275 Q185 285 200 287 Q215 285 225 275" fill="none" stroke="#a05535" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtle blush -->
  <ellipse cx="150" cy="248" rx="15" ry="8" fill="#e07050" opacity="0.15"/>
  <ellipse cx="250" cy="248" rx="15" ry="8" fill="#e07050" opacity="0.15"/>

  <!-- Abstract thought nodes -->
  <circle cx="310" cy="140" r="4" fill="#e8a87c" opacity="0.5"/>
  <circle cx="330" cy="120" r="3" fill="#e8a87c" opacity="0.4"/>
  <circle cx="345" cy="100" r="2" fill="#e8a87c" opacity="0.3"/>
  <line x1="314" y1="137" x2="327" y2="122" stroke="#e8a87c" stroke-width="1" opacity="0.3"/>
  <line x1="333" y1="118" x2="343" y2="102" stroke="#e8a87c" stroke-width="1" opacity="0.25"/>

  <!-- Small decorative dots on the other side -->
  <circle cx="70" cy="150" r="3" fill="#e8a87c" opacity="0.3"/>
  <circle cx="55" cy="130" r="2" fill="#e8a87c" opacity="0.2"/>
</svg>