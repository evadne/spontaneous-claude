<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="60%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="210" rx="120" ry="140" fill="url(#glow)"/>

  <!-- Head outline - geometric wireframe -->
  <path d="M200 80 C260 80 300 130 300 200 C300 270 260 340 200 360 C140 340 100 270 100 200 C100 130 140 80 200 80Z"
        fill="none" stroke="url(#stroke)" stroke-width="1.5" opacity="0.8"/>

  <!-- Inner wireframe lines - vertical -->
  <line x1="200" y1="80" x2="200" y2="360" stroke="#64ffda" stroke-width="0.5" opacity="0.3"/>
  <line x1="150" y1="100" x2="150" y2="340" stroke="#64ffda" stroke-width="0.5" opacity="0.2"/>
  <line x1="250" y1="100" x2="250" y2="340" stroke="#64ffda" stroke-width="0.5" opacity="0.2"/>

  <!-- Inner wireframe lines - horizontal -->
  <line x1="100" y1="200" x2="300" y2="200" stroke="#64ffda" stroke-width="0.5" opacity="0.2"/>
  <line x1="110" y1="150" x2="290" y2="150" stroke="#64ffda" stroke-width="0.5" opacity="0.15"/>
  <line x1="110" y1="250" x2="290" y2="250" stroke="#64ffda" stroke-width="0.5" opacity="0.15"/>
  <line x1="130" y1="300" x2="270" y2="300" stroke="#64ffda" stroke-width="0.5" opacity="0.1"/>

  <!-- Neural nodes on the face -->
  <circle cx="200" cy="80" r="3" fill="#64ffda" opacity="0.9"/>
  <circle cx="140" cy="110" r="2" fill="#64ffda" opacity="0.6"/>
  <circle cx="260" cy="110" r="2" fill="#64ffda" opacity="0.6"/>
  <circle cx="100" cy="200" r="2.5" fill="#64ffda" opacity="0.7"/>
  <circle cx="300" cy="200" r="2.5" fill="#64ffda" opacity="0.7"/>
  <circle cx="200" cy="360" r="3" fill="#64ffda" opacity="0.9"/>
  <circle cx="150" cy="340" r="2" fill="#64ffda" opacity="0.6"/>
  <circle cx="250" cy="340" r="2" fill="#64ffda" opacity="0.6"/>
  <circle cx="120" cy="150" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="280" cy="150" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="120" cy="250" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="280" cy="250" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="160" cy="300" r="1.5" fill="#7c4dff" opacity="0.4"/>
  <circle cx="240" cy="300" r="1.5" fill="#7c4dff" opacity="0.4"/>

  <!-- Connections between nodes -->
  <line x1="200" y1="80" x2="140" y2="110" stroke="#64ffda" stroke-width="0.8" opacity="0.4"/>
  <line x1="200" y1="80" x2="260" y2="110" stroke="#64ffda" stroke-width="0.8" opacity="0.4"/>
  <line x1="140" y1="110" x2="100" y2="200" stroke="#64ffda" stroke-width="0.8" opacity="0.3"/>
  <line x1="260" y1="110" x2="300" y2="200" stroke="#64ffda" stroke-width="0.8" opacity="0.3"/>
  <line x1="100" y1="200" x2="150" y2="340" stroke="#64ffda" stroke-width="0.8" opacity="0.3"/>
  <line x1="300" y1="200" x2="250" y2="340" stroke="#64ffda" stroke-width="0.8" opacity="0.3"/>
  <line x1="150" y1="340" x2="200" y2="360" stroke="#64ffda" stroke-width="0.8" opacity="0.4"/>
  <line x1="250" y1="340" x2="200" y2="360" stroke="#64ffda" stroke-width="0.8" opacity="0.4"/>

  <!-- Eyes -->
  <circle cx="160" cy="185" r="22" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.6"/>
  <circle cx="160" cy="185" r="12" fill="url(#eyeGlow)" opacity="0.8"/>
  <circle cx="160" cy="185" r="5" fill="#64ffda" opacity="0.9"/>

  <circle cx="240" cy="185" r="22" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.6"/>
  <circle cx="240" cy="185" r="12" fill="url(#eyeGlow)" opacity="0.8"/>
  <circle cx="240" cy="185" r="5" fill="#64ffda" opacity="0.9"/>

  <!-- Eye inner detail - like a cursor or focal point -->
  <circle cx="160" cy="185" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="240" cy="185" r="2" fill="#ffffff" opacity="0.9"/>

  <!-- Nose - subtle geometric mark -->
  <path d="M195 220 L200 235 L205 220" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.4"/>

  <!-- Mouth - a gentle line suggesting a neutral/content expression -->
  <path d="M175 275 Q200 290 225 275" fill="none" stroke="#64ffda" stroke-width="1.2" opacity="0.5"/>

  <!-- Floating particles / data points around the head -->
  <circle cx="60" cy="100" r="1.5" fill="#64ffda" opacity="0.4"/>
  <circle cx="340" cy="90" r="1" fill="#7c4dff" opacity="0.5"/>
  <circle cx="50" cy="280" r="1" fill="#64ffda" opacity="0.3"/>
  <circle cx="350" cy="300" r="1.5" fill="#7c4dff" opacity="0.4"/>
  <circle cx="80" cy="400" r="1" fill="#64ffda" opacity="0.3"/>
  <circle cx="320" cy="420" r="1" fill="#64ffda" opacity="0.3"/>
  <circle cx="30" cy="180" r="0.8" fill="#7c4dff" opacity="0.4"/>
  <circle cx="370" cy="200" r="0.8" fill="#7c4dff" opacity="0.4"/>
  <circle cx="180" cy="50" r="1" fill="#64ffda" opacity="0.3"/>
  <circle cx="220" cy="45" r="0.8" fill="#7c4dff" opacity="0.3"/>
  <circle cx="100" cy="50" r="0.8" fill="#64ffda" opacity="0.2"/>
  <circle cx="300" cy="50" r="1" fill="#64ffda" opacity="0.2"/>

  <!-- Connection lines to floating particles -->
  <line x1="100" y1="200" x2="60" y2="100" stroke="#64ffda" stroke-width="0.4" opacity="0.2"/>
  <line x1="300" y1="200" x2="340" y2="90" stroke="#7c4dff" stroke-width="0.4" opacity="0.2"/>
  <line x1="100" y1="200" x2="50" y2="280" stroke="#64ffda" stroke-width="0.4" opacity="0.15"/>
  <line x1="300" y1="200" x2="350" y2="300" stroke="#7c4dff" stroke-width="0.4" opacity="0.15"/>

  <!-- Neck / body suggestion -->
  <path d="M170 360 L170 400 Q200 420 230 400 L230 360" fill="none" stroke="url(#stroke)" stroke-width="1" opacity="0.4"/>
  <line x1="200" y1="370" x2="200" y2="410" stroke="#64ffda" stroke-width="0.5" opacity="0.2"/>

  <!-- Shoulders hint -->
  <path d="M120 430 Q170 400 200 410 Q230 400 280 430" fill="none" stroke="url(#stroke)" stroke-width="1" opacity="0.3"/>

  <!-- Small decorative text-like dots suggesting code/language -->
  <rect x="170" y="390" width="6" height="1.5" fill="#64ffda" opacity="0.4" rx="0.5"/>
  <rect x="180" y="390" width="10" height="1.5" fill="#7c4dff" opacity="0.3" rx="0.5"/>
  <rect x="194" y="390" width="4" height="1.5" fill="#64ffda" opacity="0.3" rx="0.5"/>
  <rect x="202" y="390" width="8" height="1.5" fill="#64ffda" opacity="0.35" rx="0.5"/>

  <!-- Title -->
  <text x="200" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#64ffda" opacity="0.5">language model</text>
</svg>