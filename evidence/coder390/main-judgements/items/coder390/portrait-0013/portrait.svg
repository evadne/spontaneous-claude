<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="60%" stop-color="#2a9d8f"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind head -->
  <circle cx="250" cy="230" r="160" fill="url(#glow)"/>

  <!-- Floating particles -->
  <circle cx="80" cy="100" r="2" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="420" cy="80" r="1.5" fill="#f4a261" opacity="0.5"/>
  <circle cx="60" cy="350" r="2.5" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="440" cy="320" r="2" fill="#e76f51" opacity="0.4"/>
  <circle cx="100" cy="420" r="1.5" fill="#4ecdc4" opacity="0.5"/>
  <circle cx="400" cy="430" r="2" fill="#f4a261" opacity="0.3"/>
  <circle cx="150" cy="60" r="1" fill="#e9c46a" opacity="0.6"/>
  <circle cx="350" cy="50" r="1.5" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="460" cy="180" r="1" fill="#e76f51" opacity="0.5"/>
  <circle cx="40" cy="220" r="1.5" fill="#4ecdc4" opacity="0.3"/>

  <!-- Connection lines (neural network feel) -->
  <g stroke="#4ecdc4" stroke-width="0.5" opacity="0.15">
    <line x1="80" y1="100" x2="150" y2="60"/>
    <line x1="150" y1="60" x2="350" y2="50"/>
    <line x1="350" y1="50" x2="420" y2="80"/>
    <line x1="420" y1="80" x2="460" y2="180"/>
    <line x1="460" y1="180" x2="440" y2="320"/>
    <line x1="440" y1="320" x2="400" y2="430"/>
    <line x1="400" y1="430" x2="100" y2="420"/>
    <line x1="100" y1="420" x2="60" y2="350"/>
    <line x1="60" y1="350" x2="40" y2="220"/>
    <line x1="40" y1="220" x2="80" y2="100"/>
    <line x1="80" y1="100" x2="440" y2="320"/>
    <line x1="150" y1="60" x2="60" y2="350"/>
    <line x1="350" y1="50" x2="400" y2="430"/>
  </g>

  <!-- Head outline - organic rounded shape -->
  <path d="M250 120 
           C 310 120, 350 160, 350 230 
           C 350 280, 340 320, 320 350 
           C 300 380, 270 395, 250 395 
           C 230 395, 200 380, 180 350 
           C 160 320, 150 280, 150 230 
           C 150 160, 190 120, 250 120 Z" 
        fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6" filter="url(#softGlow)"/>

  <!-- Inner face fill - very subtle -->
  <path d="M250 120 
           C 310 120, 350 160, 350 230 
           C 350 280, 340 320, 320 350 
           C 300 380, 270 395, 250 395 
           C 230 395, 200 380, 180 350 
           C 160 320, 150 280, 150 230 
           C 150 160, 190 120, 250 120 Z" 
        fill="#4ecdc4" opacity="0.03"/>

  <!-- Left eye -->
  <ellipse cx="210" cy="220" rx="22" ry="14" fill="url(#eyeGlow)" filter="url(#bigGlow)"/>
  <circle cx="210" cy="220" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="213" cy="217" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Right eye -->
  <ellipse cx="290" cy="220" rx="22" ry="14" fill="url(#eyeGlow)" filter="url(#bigGlow)"/>
  <circle cx="290" cy="220" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="293" cy="217" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- Subtle brow lines -->
  <path d="M185 198 Q 210 190, 235 198" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>
  <path d="M265 198 Q 290 190, 315 198" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>

  <!-- Nose - minimal -->
  <path d="M250 240 L 247 265 Q 250 270, 253 265" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>

  <!-- Mouth - gentle smile -->
  <path d="M225 310 Q 250 330, 275 310" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5" filter="url(#softGlow)"/>

  <!-- Neck -->
  <path d="M220 395 L 215 440" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
  <path d="M280 395 L 285 440" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>

  <!-- Shoulders suggestion -->
  <path d="M215 440 Q 180 450, 140 460" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.2"/>
  <path d="M285 440 Q 320 450, 360 460" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.2"/>

  <!-- Internal nodes - suggesting thought/neural activity -->
  <g fill="#4ecdc4" opacity="0.4">
    <circle cx="200" cy="170" r="1.5"/>
    <circle cx="300" cy="170" r="1.5"/>
    <circle cx="250" cy="160" r="1.5"/>
    <circle cx="220" cy="180" r="1"/>
    <circle cx="280" cy="180" r="1"/>
    <circle cx="250" cy="185" r="1"/>
    <circle cx="190" cy="250" r="1"/>
    <circle cx="310" cy="250" r="1"/>
    <circle cx="250" cy="350" r="1"/>
  </g>

  <!-- Internal connections -->
  <g stroke="#4ecdc4" stroke-width="0.3" opacity="0.2">
    <line x1="200" y1="170" x2="250" y2="160"/>
    <line x1="300" y1="170" x2="250" y2="160"/>
    <line x1="220" y1="180" x2="250" y2="185"/>
    <line x1="280" y1="180" x2="250" y2="185"/>
    <line x1="250" y1="160" x2="250" y2="185"/>
    <line x1="190" y1="250" x2="250" y2="350"/>
    <line x1="310" y1="250" x2="250" y2="350"/>
  </g>

  <!-- Small floating thought bubbles / language particles -->
  <g fill="none" stroke="#e9c46a" stroke-width="0.8" opacity="0.4">
    <circle cx="120" cy="150" r="8"/>
    <circle cx="380" cy="140" r="6"/>
    <circle cx="390" cy="200" r="4"/>
    <circle cx="110" cy="280" r="5"/>
  </g>
  <g fill="#e9c46a" opacity="0.3">
    <circle cx="120" cy="150" r="2"/>
    <circle cx="380" cy="140" r="1.5"/>
    <circle cx="390" cy="200" r="1"/>
    <circle cx="110" cy="280" r="1.5"/>
  </g>

  <!-- Subtle text-like marks near the head suggesting language -->
  <g stroke="#e9c46a" stroke-width="0.8" opacity="0.3">
    <line x1="100" y1="140" x2="112" y2="140"/>
    <line x1="100" y1="145" x2="108" y2="145"/>
    <line x1="392" y1="130" x2="404" y2="130"/>
    <line x1="392" y1="135" x2="398" y2="135"/>
    <line x1="385" y1="195" x2="395" y2="195"/>
    <line x1="105" y1="275" x2="115" y2="275"/>
    <line x1="105" y1="280" x2="110" y2="280"/>
  </g>

  <!-- Title text at bottom -->
  <text x="250" y="485" text-anchor="middle" font-family="monospace" font-size="11" fill="#4ecdc4" opacity="0.4">a mind made of patterns</text>
</svg>