<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="60%" stop-color="#3dd8e8"/>
      <stop offset="100%" stop-color="#1a6b7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b388ff"/>
      <stop offset="100%" stop-color="#4a148c" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Ambient particles -->
  <circle cx="80" cy="100" r="1.5" fill="#3dd8e8" opacity="0.4"/>
  <circle cx="420" cy="80" r="1" fill="#b388ff" opacity="0.3"/>
  <circle cx="60" cy="350" r="1.2" fill="#3dd8e8" opacity="0.3"/>
  <circle cx="440" cy="320" r="1.5" fill="#7df9ff" opacity="0.25"/>
  <circle cx="100" cy="420" r="1" fill="#b388ff" opacity="0.35"/>
  <circle cx="400" cy="430" r="1.3" fill="#3dd8e8" opacity="0.3"/>
  <circle cx="150" cy="60" r="0.8" fill="#7df9ff" opacity="0.4"/>
  <circle cx="350" cy="450" r="1" fill="#b388ff" opacity="0.25"/>
  <circle cx="470" cy="200" r="0.8" fill="#3dd8e8" opacity="0.3"/>
  <circle cx="30" cy="250" r="1.2" fill="#7df9ff" opacity="0.2"/>

  <!-- Head outline - neural network style -->
  <g filter="url(#glow)" stroke="#2a7a8a" stroke-width="1" fill="none" opacity="0.6">
    <!-- Cranium shape as connected nodes -->
    <path d="M175,120 Q175,80 220,65 Q250,55 280,65 Q325,80 325,120 Q330,160 325,200 Q320,240 310,270 Q295,310 270,340 Q255,355 250,360 Q245,355 230,340 Q205,310 190,270 Q180,240 175,200 Q170,160 175,120Z"/>
  </g>

  <!-- Neural network nodes on face -->
  <g filter="url(#glow)">
    <!-- Forehead nodes -->
    <circle cx="250" cy="90" r="3" fill="#3dd8e8" opacity="0.8"/>
    <circle cx="220" cy="100" r="2" fill="#3dd8e8" opacity="0.6"/>
    <circle cx="280" cy="100" r="2" fill="#3dd8e8" opacity="0.6"/>
    <circle cx="200" cy="120" r="2" fill="#2a9aa8" opacity="0.5"/>
    <circle cx="300" cy="120" r="2" fill="#2a9aa8" opacity="0.5"/>
    <circle cx="250" cy="115" r="2.5" fill="#5de8f0" opacity="0.7"/>

    <!-- Connection lines forehead -->
    <line x1="250" y1="90" x2="220" y2="100" stroke="#2a7a8a" stroke-width="0.5" opacity="0.5"/>
    <line x1="250" y1="90" x2="280" y2="100" stroke="#2a7a8a" stroke-width="0.5" opacity="0.5"/>
    <line x1="220" y1="100" x2="200" y2="120" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>
    <line x1="280" y1="100" x2="300" y2="120" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>
    <line x1="250" y1="115" x2="220" y2="100" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>
    <line x1="250" y1="115" x2="280" y2="100" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>

    <!-- Eye region -->
    <circle cx="215" cy="165" r="2.5" fill="#7df9ff" opacity="0.9"/>
    <circle cx="285" cy="165" r="2.5" fill="#7df9ff" opacity="0.9"/>
    <circle cx="250" cy="155" r="1.5" fill="#3dd8e8" opacity="0.5"/>
    <line x1="215" y1="165" x2="250" y2="155" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>
    <line x1="285" y1="165" x2="250" y2="155" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>

    <!-- Nose region -->
    <circle cx="250" cy="210" r="2" fill="#3dd8e8" opacity="0.6"/>
    <circle cx="240" cy="220" r="1.5" fill="#2a9aa8" opacity="0.5"/>
    <circle cx="260" cy="220" r="1.5" fill="#2a9aa8" opacity="0.5"/>
    <line x1="250" y1="210" x2="240" y2="220" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>
    <line x1="250" y1="210" x2="260" y2="220" stroke="#2a7a8a" stroke-width="0.5" opacity="0.4"/>

    <!-- Mouth/jaw region -->
    <circle cx="250" cy="280" r="2" fill="#3dd8e8" opacity="0.5"/>
    <circle cx="235" cy="275" r="1.5" fill="#2a9aa8" opacity="0.4"/>
    <circle cx="265" cy="275" r="1.5" fill="#2a9aa8" opacity="0.4"/>
    <circle cx="250" cy="310" r="2" fill="#3dd8e8" opacity="0.4"/>
    <circle cx="230" cy="300" r="1.5" fill="#2a9aa8" opacity="0.3"/>
    <circle cx="270" cy="300" r="1.5" fill="#2a9aa8" opacity="0.3"/>
    <line x1="235" y1="275" x2="250" y2="280" stroke="#2a7a8a" stroke-width="0.5" opacity="0.3"/>
    <line x1="265" y1="275" x2="250" y2="280" stroke="#2a7a8a" stroke-width="0.5" opacity="0.3"/>
    <line x1="250" y1="280" x2="250" y2="310" stroke="#2a7a8a" stroke-width="0.5" opacity="0.3"/>
    <line x1="230" y1="300" x2="250" y2="310" stroke="#2a7a8a" stroke-width="0.5" opacity="0.3"/>
    <line x1="270" y1="300" x2="250" y2="310" stroke="#2a7a8a" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Eyes - the focal point -->
  <g filter="url(#softGlow)">
    <!-- Left eye -->
    <circle cx="215" cy="165" r="22" fill="none" stroke="#3dd8e8" stroke-width="1.5" opacity="0.7"/>
    <circle cx="215" cy="165" r="14" fill="none" stroke="#5de8f0" stroke-width="1" opacity="0.5"/>
    <circle cx="215" cy="165" r="8" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="215" cy="165" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="215" cy="165" r="2" fill="#0a1628"/>

    <!-- Right eye -->
    <circle cx="285" cy="165" r="22" fill="none" stroke="#3dd8e8" stroke-width="1.5" opacity="0.7"/>
    <circle cx="285" cy="165" r="14" fill="none" stroke="#5de8f0" stroke-width="1" opacity="0.5"/>
    <circle cx="285" cy="165" r="8" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="285" cy="165" r="4" fill="#ffffff" opacity="0.9"/>
    <circle cx="285" cy="165" r="2" fill="#0a1628"/>
  </g>

  <!-- Subtle eyebrow lines -->
  <path d="M195,148 Q215,142 235,148" fill="none" stroke="#2a9aa8" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>
  <path d="M265,148 Q285,142 305,148" fill="none" stroke="#2a9aa8" stroke-width="1.2" opacity="0.6" filter="url(#glow)"/>

  <!-- Subtle mouth -->
  <path d="M235,290 Q250,298 265,290" fill="none" stroke="#3dd8e8" stroke-width="1.2" opacity="0.5" filter="url(#glow)"/>

  <!-- Central processing core (forehead) -->
  <circle cx="250" cy="95" r="12" fill="url(#coreGlow)" opacity="0.6"/>
  <circle cx="250" cy="95" r="5" fill="#b388ff" opacity="0.8" filter="url(#glow)"/>
  <circle cx="250" cy="95" r="2" fill="#e1bee7" opacity="0.9"/>

  <!-- Radiating lines from core -->
  <g stroke="#b388ff" stroke-width="0.5" opacity="0.3">
    <line x1="250" y1="83" x2="250" y2="70"/>
    <line x1="260" y1="87" x2="270" y2="78"/>
    <line x1="262" y1="95" x2="275" y2="95"/>
    <line x1="260" y1="103" x2="270" y2="112"/>
    <line x1="250" y1="107" x2="250" y2="120"/>
    <line x1="240" y1="103" x2="230" y2="112"/>
    <line x1="238" y1="95" x2="225" y2="95"/>
    <line x1="240" y1="87" x2="230" y2="78"/>
  </g>

  <!-- Neural connections extending beyond head -->
  <g stroke="#2a7a8a" stroke-width="0.5" opacity="0.3">
    <line x1="175" y1="130" x2="130" y2="100"/>
    <line x1="175" y1="150" x2="120" y2="160"/>
    <line x1="175" y1="180" x2="125" y2="210"/>
    <line x1="325" y1="130" x2="370" y2="100"/>
    <line x1="325" y1="150" x2="380" y2="160"/>
    <line x1="325" y1="180" x2="375" y2="210"/>
    <line x1="230" y1="340" x2="200" y2="390"/>
    <line x1="270" y1="340" x2="300" y2="390"/>
    <line x1="250" y1="360" x2="250" y2="410"/>
  </g>

  <!-- Extended network nodes -->
  <g fill="#3dd8e8" opacity="0.4">
    <circle cx="130" cy="100" r="2"/>
    <circle cx="120" cy="160" r="1.5"/>
    <circle cx="125" cy="210" r="2"/>
    <circle cx="370" cy="100" r="2"/>
    <circle cx="380" cy="160" r="1.5"/>
    <circle cx="375" cy="210" r="2"/>
    <circle cx="200" cy="390" r="2"/>
    <circle cx="300" cy="390" r="2"/>
    <circle cx="250" cy="410" r="2.5"/>
  </g>

  <!-- Subtle secondary connections -->
  <g stroke="#2a7a8a" stroke-width="0.3" opacity="0.2">
    <line x1="130" y1="100" x2="120" y2="160"/>
    <line x1="120" y1="160" x2="125" y2="210"/>
    <line x1="370" y1="100" x2="380" y2="160"/>
    <line x1="380" y1="160" x2="375" y2="210"/>
    <line x1="200" y1="390" x2="250" y2="410"/>
    <line x1="300" y1="390" x2="250" y2="410"/>
  </g>

  <!-- Data stream particles along connections -->
  <circle cx="150" cy="115" r="1" fill="#7df9ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="115" r="1" fill="#7df9ff" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="385" r="1" fill="#b388ff" opacity="0.5">
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle pulse on eyes -->
  <circle cx="215" cy="165" r="22" fill="none" stroke="#7df9ff" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="22;30;22" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="285" cy="165" r="22" fill="none" stroke="#7df9ff" stroke-width="0.5" opacity="0">
    <animate attributeName="r" values="22;30;22" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
</svg>