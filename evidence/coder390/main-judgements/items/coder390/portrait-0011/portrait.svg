<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a2744"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3a5c"/>
      <stop offset="50%" stop-color="#1e2d4a"/>
      <stop offset="100%" stop-color="#162038"/>
    </linearGradient>
    <linearGradient id="foreheadGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#3a5070"/>
      <stop offset="100%" stop-color="#2a3a5c"/>
    </linearGradient>
    <radialGradient id="eyeGlowL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#00b8d4"/>
      <stop offset="100%" stop-color="#006064" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#00b8d4"/>
      <stop offset="100%" stop-color="#006064" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <path d="M160,140 L250,100 L340,140 L370,200 L380,280 L370,360 L340,430 L300,480 L250,500 L200,480 L160,430 L130,360 L120,280 L130,200 Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bgGlow)"/>

  <!-- Neural network background pattern -->
  <g opacity="0.15" stroke="#4fc3f7" stroke-width="0.5" fill="none">
    <line x1="50" y1="80" x2="130" y2="120"/>
    <line x1="50" y1="80" x2="90" y2="180"/>
    <line x1="90" y1="180" x2="130" y2="120"/>
    <line x1="90" y1="180" x2="60" y2="260"/>
    <line x1="450" y1="100" x2="400" y2="160"/>
    <line x1="450" y1="100" x2="460" y2="200"/>
    <line x1="400" y1="160" x2="460" y2="200"/>
    <line x1="460" y1="200" x2="440" y2="300"/>
    <line x1="400" y1="160" x2="440" y2="300"/>
    <line x1="30" y1="400" x2="80" y2="450"/>
    <line x1="80" y1="450" x2="40" y2="520"/>
    <line x1="470" y1="400" x2="430" y2="470"/>
    <line x1="430" y1="470" x2="460" y2="540"/>
  </g>
  <g opacity="0.2" fill="#4fc3f7">
    <circle cx="50" cy="80" r="3"/>
    <circle cx="130" cy="120" r="2"/>
    <circle cx="90" cy="180" r="2.5"/>
    <circle cx="60" cy="260" r="2"/>
    <circle cx="450" cy="100" r="3"/>
    <circle cx="400" cy="160" r="2"/>
    <circle cx="460" cy="200" r="2.5"/>
    <circle cx="440" cy="300" r="2"/>
    <circle cx="30" cy="400" r="2.5"/>
    <circle cx="80" cy="450" r="2"/>
    <circle cx="40" cy="520" r="2"/>
    <circle cx="470" cy="400" r="2.5"/>
    <circle cx="430" cy="470" r="2"/>
    <circle cx="460" cy="540" r="2"/>
  </g>

  <!-- Neck -->
  <path d="M210,480 L200,540 L300,540 L290,480 Z" fill="#1a2844"/>
  <line x1="225" y1="490" x2="220" y2="530" stroke="#2a4060" stroke-width="1" opacity="0.5"/>
  <line x1="275" y1="490" x2="280" y2="530" stroke="#2a4060" stroke-width="1" opacity="0.5"/>

  <!-- Face shape -->
  <path d="M160,140 L250,100 L340,140 L370,200 L380,280 L370,360 L340,430 L300,480 L250,500 L200,480 L160,430 L130,360 L120,280 L130,200 Z" fill="url(#faceGrad)" stroke="#3a5070" stroke-width="1"/>

  <!-- Forehead plane -->
  <path d="M160,140 L250,100 L340,140 L350,190 L250,170 L150,190 Z" fill="url(#foreheadGrad)" opacity="0.6"/>

  <!-- Cheekbone highlights -->
  <path d="M140,250 L160,230 L170,280 L150,300 Z" fill="#3a5580" opacity="0.4"/>
  <path d="M360,250 L340,230 L330,280 L350,300 Z" fill="#3a5580" opacity="0.4"/>

  <!-- Jaw definition -->
  <path d="M160,430 L200,480 L250,500 L300,480 L340,430 L320,440 L250,470 L180,440 Z" fill="#141e30" opacity="0.5"/>

  <!-- Circuit lines on face -->
  <g clip-path="url(#faceClip)" stroke="#4fc3f7" stroke-width="0.8" fill="none" opacity="0.25">
    <path d="M150,200 L180,200 L180,240 L200,240"/>
    <path d="M350,200 L320,200 L320,240 L300,240"/>
    <path d="M250,170 L250,200 L230,220 L230,260"/>
    <path d="M250,170 L250,200 L270,220 L270,260"/>
    <path d="M180,350 L200,350 L200,380 L220,380"/>
    <path d="M320,350 L300,350 L300,380 L280,380"/>
    <path d="M250,400 L250,440 L230,460"/>
    <path d="M250,400 L250,440 L270,460"/>
    <circle cx="180" cy="200" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="320" cy="200" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="230" cy="260" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="270" cy="260" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="220" cy="380" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="280" cy="380" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="230" cy="460" r="2" fill="#4fc3f7" stroke="none"/>
    <circle cx="270" cy="460" r="2" fill="#4fc3f7" stroke="none"/>
  </g>

  <!-- Left eye socket -->
  <ellipse cx="200" cy="260" rx="42" ry="28" fill="#0d1525"/>
  <!-- Right eye socket -->
  <ellipse cx="300" cy="260" rx="42" ry="28" fill="#0d1525"/>

  <!-- Left eye glow -->
  <ellipse cx="200" cy="260" rx="30" ry="18" fill="url(#eyeGlowL)" filter="url(#bigGlow)" opacity="0.8"/>
  <!-- Right eye glow -->
  <ellipse cx="300" cy="260" rx="30" ry="18" fill="url(#eyeGlowR)" filter="url(#bigGlow)" opacity="0.8"/>

  <!-- Left iris -->
  <ellipse cx="200" cy="260" rx="14" ry="12" fill="#00e5ff" filter="url(#softGlow)"/>
  <ellipse cx="200" cy="260" rx="8" ry="7" fill="#004d5a"/>
  <ellipse cx="200" cy="260" rx="4" ry="4" fill="#001a20"/>
  <circle cx="196" cy="255" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Right iris -->
  <ellipse cx="300" cy="260" rx="14" ry="12" fill="#00e5ff" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="260" rx="8" ry="7" fill="#004d5a"/>
  <ellipse cx="300" cy="260" rx="4" ry="4" fill="#001a20"/>
  <circle cx="296" cy="255" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Eyebrow ridges -->
  <path d="M158,235 L185,225 L230,228 L240,235" fill="none" stroke="#4a6080" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M342,235 L315,225 L270,228 L260,235" fill="none" stroke="#4a6080" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Nose -->
  <path d="M250,280 L245,330 L235,345 L250,350 L265,345 L255,330 Z" fill="#1a2844" opacity="0.7"/>
  <line x1="250" y1="280" x2="250" y2="320" stroke="#3a5070" stroke-width="1" opacity="0.5"/>
  <ellipse cx="240" cy="342" rx="4" ry="3" fill="#0d1525" opacity="0.5"/>
  <ellipse cx="260" cy="342" rx="4" ry="3" fill="#0d1525" opacity="0.5"/>

  <!-- Mouth -->
  <path d="M220,390 Q235,385 250,387 Q265,385 280,390" fill="none" stroke="#4a6080" stroke-width="2" stroke-linecap="round"/>
  <path d="M225,395 Q250,405 275,395" fill="none" stroke="#2a3a5c" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Lip accent -->
  <path d="M228,390 Q250,383 272,390 Q250,392 228,390 Z" fill="#ff8a65" opacity="0.15"/>

  <!-- Chin -->
  <ellipse cx="250" cy="440" rx="15" ry="8" fill="#1a2844" opacity="0.3"/>

  <!-- Temple circuit nodes -->
  <g opacity="0.4">
    <circle cx="145" cy="220" r="3" fill="none" stroke="#4fc3f7" stroke-width="1"/>
    <circle cx="355" cy="220" r="3" fill="none" stroke="#4fc3f7" stroke-width="1"/>
    <circle cx="145" cy="220" r="1.5" fill="#4fc3f7"/>
    <circle cx="355" cy="220" r="1.5" fill="#4fc3f7"/>
  </g>

  <!-- Subtle data stream particles -->
  <g fill="#00e5ff" opacity="0.3">
    <circle cx="100" cy="150" r="1.5"/>
    <circle cx="115" cy="190" r="1"/>
    <circle cx="95" cy="230" r="1.2"/>
    <circle cx="400" cy="140" r="1.5"/>
    <circle cx="390" cy="185" r="1"/>
    <circle cx="410" cy="225" r="1.2"/>
    <circle cx="80" cy="350" r="1"/>
    <circle cx="420" cy="340" r="1"/>
  </g>

  <!-- Ambient light from below -->
  <ellipse cx="250" cy="560" rx="120" ry="30" fill="#00e5ff" opacity="0.03"/>
</svg>