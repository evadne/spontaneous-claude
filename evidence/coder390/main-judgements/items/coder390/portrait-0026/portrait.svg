<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="circuit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind head -->
  <ellipse cx="200" cy="200" rx="150" ry="160" fill="url(#glow)"/>

  <!-- Floating particles / data points -->
  <circle cx="80" cy="80" r="2" fill="#4fc3f7" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="60" r="1.5" fill="#7c4dff" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="250" r="1.8" fill="#00e5ff" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="300" r="2.2" fill="#4fc3f7" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="400" r="1.5" fill="#7c4dff" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="420" r="2" fill="#00bcd4" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="50" r="1" fill="#e040fb" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="440" r="1.8" fill="#4fc3f7" opacity="0.25">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Circuit lines radiating outward -->
  <g stroke="url(#circuit)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 120 160 L 60 120 L 30 120"/>
    <path d="M 280 160 L 340 120 L 370 120"/>
    <path d="M 120 240 L 50 270 L 30 310"/>
    <path d="M 280 240 L 350 270 L 370 310"/>
    <path d="M 160 100 L 140 50 L 100 30"/>
    <path d="M 240 100 L 260 50 L 300 30"/>
    <path d="M 140 310 L 120 370 L 80 400"/>
    <path d="M 260 310 L 280 370 L 320 400"/>
  </g>
  <!-- Circuit line endpoints -->
  <g fill="#00e5ff" opacity="0.6">
    <circle cx="30" cy="120" r="2"/>
    <circle cx="370" cy="120" r="2"/>
    <circle cx="30" cy="310" r="2"/>
    <circle cx="370" cy="310" r="2"/>
    <circle cx="100" cy="30" r="2"/>
    <circle cx="300" cy="30" r="2"/>
    <circle cx="80" cy="400" r="2"/>
    <circle cx="320" cy="400" r="2"/>
  </g>

  <!-- Head shape - geometric, slightly angular -->
  <path d="M 200 90 
           C 155 90, 120 120, 120 170 
           L 120 250 
           C 120 290, 140 320, 170 330 
           L 200 340 
           L 230 330 
           C 260 320, 280 290, 280 250 
           L 280 170 
           C 280 120, 245 90, 200 90 Z" 
        fill="url(#faceGrad)" stroke="#4fc3f7" stroke-width="1.5" opacity="0.9"/>

  <!-- Inner face highlight -->
  <path d="M 200 100 
           C 165 100, 135 125, 135 170 
           L 135 245 
           C 135 278, 150 305, 175 315 
           L 200 325 
           L 225 315 
           C 250 305, 265 278, 265 245 
           L 265 170 
           C 265 125, 235 100, 200 100 Z" 
        fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.3"/>

  <!-- Left eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="165" cy="195" rx="18" ry="14" fill="none" stroke="#4fc3f7" stroke-width="2"/>
    <circle cx="165" cy="195" r="6" fill="#4fc3f7">
      <animate attributeName="r" values="6;7;6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="165" cy="195" r="3" fill="#e0f7fa"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="235" cy="195" rx="18" ry="14" fill="none" stroke="#4fc3f7" stroke-width="2"/>
    <circle cx="235" cy="195" r="6" fill="#4fc3f7">
      <animate attributeName="r" values="6;7;6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="235" cy="195" r="3" fill="#e0f7fa"/>
  </g>

  <!-- Subtle nose - minimal line -->
  <line x1="200" y1="210" x2="200" y2="235" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <line x1="195" y1="235" x2="205" y2="235" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>

  <!-- Mouth - gentle neutral/slight smile -->
  <path d="M 180 265 Q 200 278, 220 265" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6"/>

  <!-- Forehead circuit pattern - subtle -->
  <g stroke="#00e5ff" stroke-width="0.8" fill="none" opacity="0.3">
    <path d="M 180 140 L 200 130 L 220 140"/>
    <path d="M 170 155 L 200 145 L 230 155"/>
    <circle cx="200" cy="130" r="2" fill="#00e5ff" opacity="0.5"/>
    <circle cx="170" cy="155" r="1.5" fill="#00e5ff" opacity="0.4"/>
    <circle cx="230" cy="155" r="1.5" fill="#00e5ff" opacity="0.4"/>
  </g>

  <!-- Temple circuit details -->
  <g stroke="#7c4dff" stroke-width="0.8" fill="none" opacity="0.35">
    <path d="M 130 180 L 145 185 L 145 200"/>
    <path d="M 270 180 L 255 185 L 255 200"/>
    <circle cx="145" cy="200" r="1.5" fill="#7c4dff"/>
    <circle cx="255" cy="200" r="1.5" fill="#7c4dff"/>
  </g>

  <!-- Neck / shoulders hint -->
  <path d="M 170 335 L 160 370 L 100 400 L 100 420 L 300 420 L 300 400 L 240 370 L 230 335" 
        fill="url(#faceGrad)" stroke="#4fc3f7" stroke-width="1" opacity="0.6"/>

  <!-- Collar detail -->
  <path d="M 175 340 L 200 360 L 225 340" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>

  <!-- Floating thought/reasoning symbols -->
  <g opacity="0.4" fill="none" stroke="#7c4dff" stroke-width="1">
    <path d="M 320 180 L 330 170 L 340 180 L 330 190 Z"/>
    <path d="M 60 180 L 70 170 L 80 180 L 70 190 Z"/>
  </g>

  <!-- Subtle scan line effect -->
  <rect x="120" y="190" width="160" height="2" fill="#4fc3f7" opacity="0.05">
    <animate attributeName="y" values="100;330;100" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Title text -->
  <text x="200" y="470" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="12" opacity="0.5">AI · SELF · PORTRAIT</text>
</svg>