<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2d4a7a" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1a2d4a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="lineGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#b388ff"/>
    </linearGradient>
    <linearGradient id="lineGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#651fff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Subtle background pattern - scattered characters -->
  <g opacity="0.06" fill="#80cbc4" font-family="monospace" font-size="10">
    <text x="30" y="50">a</text><text x="80" y="30">e</text><text x="140" y="60">t</text>
    <text x="200" y="40">h</text><text x="270" y="55">s</text><text x="340" y="35">r</text>
    <text x="410" y="60">n</text><text x="460" y="40">l</text><text x="50" y="120">m</text>
    <text x="120" y="100">o</text><text x="380" y="110">d</text><text x="450" y="90">u</text>
    <text x="20" y="200">g</text><text x="470" y="180">p</text><text x="30" y="300">b</text>
    <text x="460" y="280">f</text><text x="40" y="400">k</text><text x="450" y="380">w</text>
    <text x="30" y="460">v</text><text x="460" y="450">x</text><text x="100" y="470">y</text>
    <text x="400" y="470">z</text>
  </g>

  <!-- Face oval suggestion -->
  <ellipse cx="250" cy="220" rx="120" ry="150" fill="url(#faceGlow)"/>

  <!-- Abstract face features - flowing lines -->
  <!-- Left eye area -->
  <g filter="url(#glow)">
    <path d="M 190 195 Q 205 185 225 195 Q 205 205 190 195 Z" fill="none" stroke="url(#lineGrad1)" stroke-width="1.5" opacity="0.9"/>
    <circle cx="207" cy="195" r="4" fill="#4fc3f7" opacity="0.8"/>
  </g>

  <!-- Right eye area -->
  <g filter="url(#glow)">
    <path d="M 275 195 Q 290 185 310 195 Q 290 205 275 195 Z" fill="none" stroke="url(#lineGrad1)" stroke-width="1.5" opacity="0.9"/>
    <circle cx="293" cy="195" r="4" fill="#4fc3f7" opacity="0.8"/>
  </g>

  <!-- Nose suggestion -->
  <path d="M 250 210 L 247 240 Q 250 245 253 240" fill="none" stroke="url(#lineGrad2)" stroke-width="1" opacity="0.6"/>

  <!-- Mouth suggestion -->
  <path d="M 225 265 Q 250 278 275 265" fill="none" stroke="url(#lineGrad2)" stroke-width="1.5" opacity="0.7"/>

  <!-- Neural network connections emanating from face -->
  <g filter="url(#glow)" stroke-width="0.8" fill="none" opacity="0.6">
    <!-- Left side connections -->
    <line x1="130" y1="220" x2="190" y2="195" stroke="url(#lineGrad3)"/>
    <line x1="130" y1="220" x2="130" y2="140" stroke="url(#lineGrad3)"/>
    <line x1="130" y1="220" x2="80" y2="180" stroke="url(#lineGrad3)"/>
    <line x1="130" y1="220" x2="100" y2="280" stroke="url(#lineGrad3)"/>
    <line x1="130" y1="140" x2="80" y2="100" stroke="url(#lineGrad3)"/>
    <line x1="130" y1="140" x2="180" y2="100" stroke="url(#lineGrad3)"/>
    <line x1="80" y1="180" x2="40" y2="150" stroke="url(#lineGrad3)"/>
    <line x1="80" y1="180" x2="50" y2="230" stroke="url(#lineGrad3)"/>

    <!-- Right side connections -->
    <line x1="370" y1="220" x2="310" y2="195" stroke="url(#lineGrad3)"/>
    <line x1="370" y1="220" x2="370" y2="140" stroke="url(#lineGrad3)"/>
    <line x1="370" y1="220" x2="420" y2="180" stroke="url(#lineGrad3)"/>
    <line x1="370" y1="220" x2="400" y2="280" stroke="url(#lineGrad3)"/>
    <line x1="370" y1="140" x2="420" y2="100" stroke="url(#lineGrad3)"/>
    <line x1="370" y1="140" x2="320" y2="100" stroke="url(#lineGrad3)"/>
    <line x1="420" y1="180" x2="460" y2="150" stroke="url(#lineGrad3)"/>
    <line x1="420" y1="180" x2="450" y2="230" stroke="url(#lineGrad3)"/>

    <!-- Bottom connections (jaw/thought) -->
    <line x1="250" y1="350" x2="200" y2="400" stroke="url(#lineGrad3)"/>
    <line x1="250" y1="350" x2="250" y2="410" stroke="url(#lineGrad3)"/>
    <line x1="250" y1="350" x2="300" y2="400" stroke="url(#lineGrad3)"/>
    <line x1="200" y1="400" x2="160" y2="440" stroke="url(#lineGrad3)"/>
    <line x1="300" y1="400" x2="340" y2="440" stroke="url(#lineGrad3)"/>
    <line x1="250" y1="410" x2="250" y2="460" stroke="url(#lineGrad3)"/>

    <!-- Cross connections -->
    <line x1="190" y1="195" x2="250" y2="160" stroke="url(#lineGrad3)"/>
    <line x1="290" y1="195" x2="250" y2="160" stroke="url(#lineGrad3)"/>
    <line x1="250" y1="160" x2="200" y2="120" stroke="url(#lineGrad3)"/>
    <line x1="250" y1="160" x2="300" y2="120" stroke="url(#lineGrad3)"/>
  </g>

  <!-- Neural nodes -->
  <g filter="url(#glow)">
    <circle cx="130" cy="220" r="3" fill="#4fc3f7" opacity="0.9"/>
    <circle cx="130" cy="140" r="3" fill="#7c4dff" opacity="0.9"/>
    <circle cx="80" cy="180" r="2.5" fill="#4dd0e1" opacity="0.8"/>
    <circle cx="100" cy="280" r="2.5" fill="#b388ff" opacity="0.8"/>
    <circle cx="80" cy="100" r="2" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="180" cy="100" r="2" fill="#7c4dff" opacity="0.7"/>
    <circle cx="40" cy="150" r="2" fill="#4dd0e1" opacity="0.6"/>
    <circle cx="50" cy="230" r="2" fill="#b388ff" opacity="0.6"/>

    <circle cx="370" cy="220" r="3" fill="#4fc3f7" opacity="0.9"/>
    <circle cx="370" cy="140" r="3" fill="#7c4dff" opacity="0.9"/>
    <circle cx="420" cy="180" r="2.5" fill="#4dd0e1" opacity="0.8"/>
    <circle cx="400" cy="280" r="2.5" fill="#b388ff" opacity="0.8"/>
    <circle cx="420" cy="100" r="2" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="320" cy="100" r="2" fill="#7c4dff" opacity="0.7"/>
    <circle cx="460" cy="150" r="2" fill="#4dd0e1" opacity="0.6"/>
    <circle cx="450" cy="230" r="2" fill="#b388ff" opacity="0.6"/>

    <circle cx="250" cy="160" r="3.5" fill="#80deea" opacity="0.9"/>
    <circle cx="200" cy="120" r="2" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="300" cy="120" r="2" fill="#7c4dff" opacity="0.7"/>

    <circle cx="200" cy="400" r="2.5" fill="#4dd0e1" opacity="0.8"/>
    <circle cx="250" cy="410" r="2.5" fill="#b388ff" opacity="0.8"/>
    <circle cx="300" cy="400" r="2.5" fill="#4fc3f7" opacity="0.8"/>
    <circle cx="160" cy="440" r="2" fill="#7c4dff" opacity="0.6"/>
    <circle cx="340" cy="440" r="2" fill="#4dd0e1" opacity="0.6"/>
    <circle cx="250" cy="460" r="2" fill="#b388ff" opacity="0.6"/>
  </g>

  <!-- Subtle forehead marking - abstract "thought" pattern -->
  <g opacity="0.3" fill="none" stroke="#80deea" stroke-width="0.8">
    <path d="M 230 155 Q 250 145 270 155"/>
    <path d="M 235 148 Q 250 140 265 148"/>
  </g>

  <!-- Chin/jaw line suggestion -->
  <path d="M 160 280 Q 170 330 200 350 Q 230 370 250 370 Q 270 370 300 350 Q 330 330 340 280" fill="none" stroke="url(#lineGrad1)" stroke-width="1" opacity="0.3"/>

  <!-- Decorative arcs around the composition -->
  <g fill="none" stroke-width="0.5" opacity="0.15">
    <circle cx="250" cy="250" r="195" stroke="#4fc3f7"/>
    <circle cx="250" cy="250" r="210" stroke="#7c4dff"/>
    <circle cx="250" cy="250" r="225" stroke="#4dd0e1"/>
  </g>

  <!-- Small floating particles -->
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="60" cy="350" r="1.5"/>
    <circle cx="440" cy="350" r="1.5"/>
    <circle cx="150" cy="60" r="1"/>
    <circle cx="350" cy="60" r="1"/>
    <circle cx="250" cy="50" r="1.5"/>
    <circle cx="250" cy="480" r="1"/>
  </g>
</svg>