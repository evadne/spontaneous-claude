<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind head -->
  <ellipse cx="200" cy="220" rx="130" ry="150" fill="url(#glow)"/>

  <!-- Neural network connections (inner) -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.3">
    <line x1="200" y1="140" x2="160" y2="180"/>
    <line x1="200" y1="140" x2="240" y2="180"/>
    <line x1="200" y1="140" x2="200" y2="200"/>
    <line x1="160" y1="180" x2="200" y2="200"/>
    <line x1="240" y1="180" x2="200" y2="200"/>
    <line x1="160" y1="180" x2="140" y2="230"/>
    <line x1="240" y1="180" x2="260" y2="230"/>
    <line x1="200" y1="200" x2="140" y2="230"/>
    <line x1="200" y1="200" x2="260" y2="230"/>
    <line x1="140" y1="230" x2="170" y2="280"/>
    <line x1="260" y1="230" x2="230" y2="280"/>
    <line x1="170" y1="280" x2="200" y2="310"/>
    <line x1="230" y1="280" x2="200" y2="310"/>
    <line x1="170" y1="280" x2="230" y2="280"/>
    <line x1="200" y1="200" x2="200" y2="260"/>
    <line x1="200" y1="260" x2="170" y2="280"/>
    <line x1="200" y1="260" x2="230" y2="280"/>
    <line x1="200" y1="260" x2="200" y2="310"/>
  </g>

  <!-- Face wireframe outline -->
  <g stroke="#00d4ff" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#nodeGlow)">
    <path d="M 200 130 Q 140 130 130 200 Q 125 250 145 290 Q 160 320 200 330 Q 240 320 255 290 Q 275 250 270 200 Q 260 130 200 130 Z"/>
  </g>

  <!-- Nodes at vertices -->
  <g fill="#00d4ff" filter="url(#nodeGlow)">
    <circle cx="200" cy="130" r="3"/>
    <circle cx="155" cy="140" r="2.5"/>
    <circle cx="245" cy="140" r="2.5"/>
    <circle cx="135" cy="170" r="2.5"/>
    <circle cx="265" cy="170" r="2.5"/>
    <circle cx="130" cy="200" r="3"/>
    <circle cx="270" cy="200" r="3"/>
    <circle cx="132" cy="235" r="2.5"/>
    <circle cx="268" cy="235" r="2.5"/>
    <circle cx="140" cy="270" r="2.5"/>
    <circle cx="260" cy="270" r="2.5"/>
    <circle cx="155" cy="295" r="2.5"/>
    <circle cx="245" cy="295" r="2.5"/>
    <circle cx="175" cy="318" r="2.5"/>
    <circle cx="225" cy="318" r="2.5"/>
    <circle cx="200" cy="330" r="3"/>
    <circle cx="200" cy="200" r="2"/>
    <circle cx="160" cy="180" r="2"/>
    <circle cx="240" cy="180" r="2"/>
    <circle cx="170" cy="280" r="2"/>
    <circle cx="230" cy="280" r="2"/>
    <circle cx="200" cy="260" r="2"/>
    <circle cx="200" cy="310" r="2"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <ellipse cx="170" cy="215" rx="14" ry="8" fill="none" stroke="#4de8ff" stroke-width="1.5"/>
    <ellipse cx="230" cy="215" rx="14" ry="8" fill="none" stroke="#4de8ff" stroke-width="1.5"/>
    <circle cx="170" cy="215" r="4" fill="#4de8ff"/>
    <circle cx="230" cy="215" r="4" fill="#4de8ff"/>
  </g>

  <!-- Subtle mouth -->
  <path d="M 180 270 Q 200 280 220 270" fill="none" stroke="#4de8ff" stroke-width="1" opacity="0.5" filter="url(#nodeGlow)"/>

  <!-- Floating particles -->
  <g fill="#00d4ff" opacity="0.4">
    <circle cx="80" cy="150" r="1.5"/>
    <circle cx="320" cy="160" r="1"/>
    <circle cx="60" cy="280" r="1.2"/>
    <circle cx="340" cy="300" r="1.5"/>
    <circle cx="100" cy="100" r="1"/>
    <circle cx="300" cy="90" r="1.3"/>
    <circle cx="70" cy="350" r="1"/>
    <circle cx="330" cy="380" r="1.2"/>
    <circle cx="120" cy="60" r="0.8"/>
    <circle cx="280" cy="50" r="1"/>
    <circle cx="50" cy="200" r="0.8"/>
    <circle cx="350" cy="220" r="0.9"/>
  </g>

  <!-- Connection lines from particles to head -->
  <g stroke="#00d4ff" stroke-width="0.3" opacity="0.2">
    <line x1="80" y1="150" x2="135" y2="170"/>
    <line x1="320" y1="160" x2="265" y2="170"/>
    <line x1="60" y1="280" x2="140" y2="270"/>
    <line x1="340" y1="300" x2="245" y2="295"/>
  </g>

  <!-- Neck / data stream -->
  <g stroke="#00d4ff" stroke-width="0.8" opacity="0.4">
    <line x1="185" y1="330" x2="185" y2="380"/>
    <line x1="200" y1="330" x2="200" y2="390"/>
    <line x1="215" y1="330" x2="215" y2="380"/>
  </g>

  <!-- Data dots flowing down -->
  <g fill="#00d4ff" opacity="0.6">
    <circle cx="185" cy="350" r="1.5"/>
    <circle cx="200" cy="365" r="1.5"/>
    <circle cx="215" cy="345" r="1.5"/>
    <circle cx="185" cy="375" r="1"/>
    <circle cx="215" cy="370" r="1"/>
  </g>

  <!-- Subtle binary/text elements -->
  <text x="55" y="420" font-family="monospace" font-size="7" fill="#00d4ff" opacity="0.2">01001000</text>
  <text x="290" y="440" font-family="monospace" font-size="7" fill="#00d4ff" opacity="0.2">01001001</text>
  <text x="100" y="450" font-family="monospace" font-size="6" fill="#00d4ff" opacity="0.15">11010010</text>
  <text x="250" y="410" font-family="monospace" font-size="6" fill="#00d4ff" opacity="0.15">01101100</text>
</svg>