<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#050d18"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dd9e8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4dd9e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0f2440"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4dd9e8"/>
      <stop offset="100%" stop-color="#2a7a9c"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="250" cy="230" r="180" fill="url(#glow)"/>

  <!-- Background network nodes -->
  <g opacity="0.15" stroke="#4dd9e8" stroke-width="0.5" fill="none">
    <line x1="50" y1="80" x2="120" y2="45"/>
    <line x1="120" y1="45" x2="200" y2="70"/>
    <line x1="50" y1="80" x2="30" y2="160"/>
    <line x1="450" y1="90" x2="380" y2="50"/>
    <line x1="380" y1="50" x2="310" y2="75"/>
    <line x1="450" y1="90" x2="470" y2="170"/>
    <line x1="60" y1="420" x2="130" y2="450"/>
    <line x1="130" y1="450" x2="200" y2="430"/>
    <line x1="440" y1="410" x2="370" y2="445"/>
    <line x1="370" y1="445" x2="300" y2="420"/>
  </g>
  <g opacity="0.2" fill="#4dd9e8">
    <circle cx="50" cy="80" r="2"/>
    <circle cx="120" cy="45" r="2"/>
    <circle cx="200" cy="70" r="2"/>
    <circle cx="30" cy="160" r="2"/>
    <circle cx="450" cy="90" r="2"/>
    <circle cx="380" cy="50" r="2"/>
    <circle cx="310" cy="75" r="2"/>
    <circle cx="470" cy="170" r="2"/>
    <circle cx="60" cy="420" r="2"/>
    <circle cx="130" cy="450" r="2"/>
    <circle cx="200" cy="430" r="2"/>
    <circle cx="440" cy="410" r="2"/>
    <circle cx="370" cy="445" r="2"/>
    <circle cx="300" cy="420" r="2"/>
  </g>

  <!-- Face outline - angular geometric -->
  <path d="M 250 90 
           L 320 120 
           L 350 180 
           L 355 250 
           L 340 310 
           L 310 350 
           L 280 380 
           L 250 395 
           L 220 380 
           L 190 350 
           L 160 310 
           L 145 250 
           L 150 180 
           L 180 120 Z" 
        fill="url(#face)" stroke="url(#stroke)" stroke-width="1.5" opacity="0.8"/>

  <!-- Internal face structure lines -->
  <g stroke="#2a6a8a" stroke-width="0.5" opacity="0.4" fill="none">
    <line x1="250" y1="90" x2="250" y2="395"/>
    <line x1="150" y1="180" x2="350" y2="180"/>
    <line x1="145" y1="250" x2="355" y2="250"/>
    <line x1="160" y1="310" x2="340" y2="310"/>
    <line x1="180" y1="120" x2="320" y2="120"/>
    <line x1="190" y1="350" x2="310" y2="350"/>
  </g>

  <!-- Left eye - node with connections -->
  <g filter="url(#softGlow)">
    <circle cx="210" cy="210" r="18" fill="none" stroke="#4dd9e8" stroke-width="1.5"/>
    <circle cx="210" cy="210" r="8" fill="#4dd9e8" opacity="0.9"/>
    <circle cx="210" cy="210" r="3" fill="#ffffff"/>
  </g>
  <!-- Left eye connections -->
  <g stroke="#4dd9e8" stroke-width="0.8" opacity="0.5">
    <line x1="210" y1="192" x2="210" y2="170"/>
    <line x1="228" y1="210" x2="250" y2="210"/>
    <line x1="192" y1="210" x2="170" y2="210"/>
    <line x1="210" y1="228" x2="210" y2="250"/>
    <line x1="197" y1="197" x2="185" y2="185"/>
    <line x1="223" y1="197" x2="235" y2="185"/>
  </g>
  <g fill="#4dd9e8" opacity="0.6">
    <circle cx="210" cy="170" r="2"/>
    <circle cx="250" cy="210" r="2"/>
    <circle cx="170" cy="210" r="2"/>
    <circle cx="210" cy="250" r="2"/>
    <circle cx="185" cy="185" r="2"/>
    <circle cx="235" cy="185" r="2"/>
  </g>

  <!-- Right eye - node with connections -->
  <g filter="url(#softGlow)">
    <circle cx="290" cy="210" r="18" fill="none" stroke="#4dd9e8" stroke-width="1.5"/>
    <circle cx="290" cy="210" r="8" fill="#4dd9e8" opacity="0.9"/>
    <circle cx="290" cy="210" r="3" fill="#ffffff"/>
  </g>
  <!-- Right eye connections -->
  <g stroke="#4dd9e8" stroke-width="0.8" opacity="0.5">
    <line x1="290" y1="192" x2="290" y2="170"/>
    <line x1="308" y1="210" x2="330" y2="210"/>
    <line x1="272" y1="210" x2="250" y2="210"/>
    <line x1="290" y1="228" x2="290" y2="250"/>
    <line x1="277" y1="197" x2="265" y2="185"/>
    <line x1="303" y1="197" x2="315" y2="185"/>
  </g>
  <g fill="#4dd9e8" opacity="0.6">
    <circle cx="290" cy="170" r="2"/>
    <circle cx="330" cy="210" r="2"/>
    <circle cx="265" cy="185" r="2"/>
    <circle cx="315" cy="185" r="2"/>
    <circle cx="290" cy="250" r="2"/>
  </g>

  <!-- Bridge of nose -->
  <line x1="250" y1="195" x2="250" y2="260" stroke="#2a7a9c" stroke-width="1" opacity="0.6"/>
  <circle cx="250" cy="260" r="2" fill="#2a7a9c" opacity="0.6"/>

  <!-- Mouth - a series of connected nodes suggesting speech/language -->
  <g filter="url(#softGlow)">
    <path d="M 215 310 Q 230 325 250 325 Q 270 325 285 310" 
          fill="none" stroke="#4dd9e8" stroke-width="1.5" opacity="0.8"/>
  </g>
  <!-- Mouth nodes -->
  <g fill="#4dd9e8" opacity="0.7">
    <circle cx="215" cy="310" r="2.5"/>
    <circle cx="230" cy="318" r="2"/>
    <circle cx="240" cy="322" r="2"/>
    <circle cx="250" cy="325" r="2.5"/>
    <circle cx="260" cy="322" r="2"/>
    <circle cx="270" cy="318" r="2"/>
    <circle cx="285" cy="310" r="2.5"/>
  </g>

  <!-- Neural connections across face -->
  <g stroke="#4dd9e8" stroke-width="0.4" opacity="0.25">
    <line x1="210" y1="210" x2="290" y2="210"/>
    <line x1="210" y1="228" x2="250" y2="260"/>
    <line x1="290" y1="228" x2="250" y2="260"/>
    <line x1="250" y1="260" x2="215" y2="310"/>
    <line x1="250" y1="260" x2="285" y2="310"/>
    <line x1="210" y1="192" x2="250" y2="150"/>
    <line x1="290" y1="192" x2="250" y2="150"/>
    <line x1="250" y1="150" x2="250" y2="90"/>
  </g>
  <g fill="#4dd9e8" opacity="0.4">
    <circle cx="250" cy="150" r="2"/>
  </g>

  <!-- Forehead - thought/data nodes -->
  <g filter="url(#bigGlow)" opacity="0.6">
    <circle cx="250" cy="140" r="4" fill="#4dd9e8"/>
  </g>
  <g stroke="#4dd9e8" stroke-width="0.6" opacity="0.4">
    <line x1="250" y1="140" x2="220" y2="120"/>
    <line x1="250" y1="140" x2="280" y2="120"/>
    <line x1="250" y1="140" x2="250" y2="110"/>
    <line x1="220" y1="120" x2="200" y2="105"/>
    <line x1="280" y1="120" x2="300" y2="105"/>
  </g>
  <g fill="#4dd9e8" opacity="0.5">
    <circle cx="220" cy="120" r="1.5"/>
    <circle cx="280" cy="120" r="1.5"/>
    <circle cx="250" cy="110" r="1.5"/>
    <circle cx="200" cy="105" r="1.5"/>
    <circle cx="300" cy="105" r="1.5"/>
  </g>

  <!-- Radiating connections from face outward -->
  <g stroke="#4dd9e8" stroke-width="0.5" opacity="0.3">
    <line x1="355" y1="250" x2="400" y2="240"/>
    <line x1="355" y1="250" x2="390" y2="270"/>
    <line x1="145" y1="250" x2="100" y2="240"/>
    <line x1="145" y1="250" x2="110" y2="270"/>
    <line x1="250" y1="395" x2="250" y2="440"/>
    <line x1="250" y1="395" x2="220" y2="430"/>
    <line x1="250" y1="395" x2="280" y2="430"/>
  </g>
  <g fill="#4dd9e8" opacity="0.4">
    <circle cx="400" cy="240" r="2"/>
    <circle cx="390" cy="270" r="2"/>
    <circle cx="100" cy="240" r="2"/>
    <circle cx="110" cy="270" r="2"/>
    <circle cx="250" cy="440" r="2"/>
    <circle cx="220" cy="430" r="2"/>
    <circle cx="280" cy="430" r="2"/>
  </g>

  <!-- Subtle text elements suggesting language -->
  <g font-family="monospace" fill="#4dd9e8" opacity="0.15" font-size="6">
    <text x="30" y="300">01001000</text>
    <text x="30" y="312">01000101</text>
    <text x="420" y="300">1101001</text>
    <text x="420" y="312">1101000</text>
  </g>

  <!-- Subtle hexagonal pattern overlay on face -->
  <g stroke="#4dd9e8" stroke-width="0.3" opacity="0.1" fill="none">
    <polygon points="250,170 265,178 265,194 250,202 235,194 235,178"/>
    <polygon points="250,202 265,210 265,226 250,234 235,226 235,210"/>
    <polygon points="250,234 265,242 265,258 250,266 235,258 235,242"/>
    <polygon points="220,270 235,278 235,294 220,302 205,294 205,278"/>
    <polygon points="280,270 295,278 295,294 280,302 265,294 265,278"/>
  </g>

  <!-- Outer frame accent -->
  <rect x="10" y="10" width="480" height="480" fill="none" stroke="#1a3a5c" stroke-width="1" rx="4"/>
  <rect x="15" y="15" width="470" height="470" fill="none" stroke="#1a3a5c" stroke-width="0.5" rx="3" opacity="0.5"/>

  <!-- Corner accents -->
  <g stroke="#4dd9e8" stroke-width="1" opacity="0.4">
    <line x1="10" y1="30" x2="10" y2="10" x3="30" y3="10" fill="none"/>
    <line x1="470" y1="10" x2="490" y2="10" x3="490" y3="30" fill="none"/>
    <line x1="490" y1="470" x2="490" y2="490" x3="470" y3="490" fill="none"/>
    <line x1="30" y1="490" x2="10" y2="490" x3="10" y3="470" fill="none"/>
  </g>
</svg>