<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="200" cy="220" rx="120" ry="140" fill="url(#glow)"/>

  <!-- Neural network background nodes -->
  <g opacity="0.15" stroke="#64ffda" stroke-width="0.5" fill="none">
    <line x1="50" y1="80" x2="100" y2="120"/>
    <line x1="100" y1="120" x2="80" y2="200"/>
    <line x1="350" y1="80" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="320" y2="200"/>
    <line x1="50" y1="80" x2="120" y2="60"/>
    <line x1="350" y1="80" x2="280" y2="60"/>
    <line x1="80" y1="200" x2="120" y2="280"/>
    <line x1="320" y1="200" x2="280" y2="280"/>
    <line x1="120" y1="280" x2="160" y2="350"/>
    <line x1="280" y1="280" x2="240" y2="350"/>
    <line x1="160" y1="350" x2="200" y2="420"/>
    <line x1="240" y1="350" x2="200" y2="420"/>
  </g>
  <g opacity="0.25" fill="#64ffda">
    <circle cx="50" cy="80" r="2"/>
    <circle cx="100" cy="120" r="2"/>
    <circle cx="80" cy="200" r="2"/>
    <circle cx="350" cy="80" r="2"/>
    <circle cx="300" cy="120" r="2"/>
    <circle cx="320" cy="200" r="2"/>
    <circle cx="120" cy="60" r="2"/>
    <circle cx="280" cy="60" r="2"/>
    <circle cx="120" cy="280" r="2"/>
    <circle cx="280" cy="280" r="2"/>
    <circle cx="160" cy="350" r="2"/>
    <circle cx="240" cy="350" r="2"/>
    <circle cx="200" cy="420" r="2"/>
  </g>

  <!-- Face outline - geometric, angular -->
  <g filter="url(#softGlow)">
    <!-- Head shape - hexagonal/angular face -->
    <path d="M 200 100 
             L 260 120 
             L 280 180 
             L 270 250 
             L 240 300 
             L 200 320 
             L 160 300 
             L 130 250 
             L 120 180 
             L 140 120 Z" 
          fill="none" stroke="url(#faceGrad)" stroke-width="1.5" opacity="0.8"/>

    <!-- Inner face structure -->
    <path d="M 200 115 
             L 250 132 
             L 268 185 
             L 258 245 
             L 232 288 
             L 200 305 
             L 168 288 
             L 142 245 
             L 132 185 
             L 150 132 Z" 
          fill="none" stroke="#64ffda" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Eyes - geometric -->
  <g filter="url(#softGlow)">
    <!-- Left eye -->
    <path d="M 155 190 L 175 182 L 190 190 L 175 198 Z" 
          fill="none" stroke="#64ffda" stroke-width="1.5"/>
    <circle cx="172" cy="190" r="3" fill="#64ffda" opacity="0.9"/>
    
    <!-- Right eye -->
    <path d="M 210 190 L 225 182 L 245 190 L 225 198 Z" 
          fill="none" stroke="#64ffda" stroke-width="1.5"/>
    <circle cx="228" cy="190" r="3" fill="#64ffda" opacity="0.9"/>
  </g>

  <!-- Nose - minimal line -->
  <line x1="200" y1="200" x2="200" y2="225" stroke="#64ffda" stroke-width="1" opacity="0.5"/>
  <line x1="195" y1="225" x2="205" y2="225" stroke="#64ffda" stroke-width="1" opacity="0.5"/>

  <!-- Mouth - subtle geometric smile -->
  <path d="M 180 255 Q 200 268 220 255" fill="none" stroke="#64ffda" stroke-width="1.2" opacity="0.7"/>

  <!-- Forehead nodes - thinking/processing -->
  <g fill="#7c4dff" opacity="0.6">
    <circle cx="200" cy="140" r="2.5"/>
    <circle cx="180" cy="150" r="1.5"/>
    <circle cx="220" cy="150" r="1.5"/>
    <circle cx="190" cy="160" r="1"/>
    <circle cx="210" cy="160" r="1"/>
  </g>
  <g stroke="#7c4dff" stroke-width="0.5" opacity="0.4">
    <line x1="200" y1="140" x2="180" y2="150"/>
    <line x1="200" y1="140" x2="220" y2="150"/>
    <line x1="180" y1="150" x2="190" y2="160"/>
    <line x1="220" y1="150" x2="210" y2="160"/>
    <line x1="190" y1="160" x2="200" y2="140"/>
    <line x1="210" y1="160" x2="200" y2="140"/>
  </g>

  <!-- Temple circuit traces -->
  <g stroke="#7c4dff" stroke-width="0.8" opacity="0.5" fill="none">
    <!-- Left temple -->
    <path d="M 145 170 L 135 160 L 135 145 L 125 140"/>
    <path d="M 145 180 L 132 178 L 125 170"/>
    <!-- Right temple -->
    <path d="M 255 170 L 265 160 L 265 145 L 275 140"/>
    <path d="M 255 180 L 268 178 L 275 170"/>
  </g>
  <g fill="#7c4dff" opacity="0.7">
    <circle cx="125" cy="140" r="2"/>
    <circle cx="125" cy="170" r="1.5"/>
    <circle cx="275" cy="140" r="2"/>
    <circle cx="275" cy="170" r="1.5"/>
  </g>

  <!-- Jaw/chin nodes -->
  <g stroke="#64ffda" stroke-width="0.5" opacity="0.4">
    <line x1="160" y1="290" x2="170" y2="310"/>
    <line x1="240" y1="290" x2="230" y2="310"/>
    <line x1="200" y1="320" x2="200" y2="340"/>
  </g>
  <g fill="#64ffda" opacity="0.5">
    <circle cx="170" cy="310" r="1.5"/>
    <circle cx="230" cy="310" r="1.5"/>
    <circle cx="200" cy="340" r="2"/>
  </g>

  <!-- Floating particles around head -->
  <g fill="#64ffda" opacity="0.4">
    <circle cx="100" cy="150" r="1">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="150" r="1">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="250" r="0.8">
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="250" r="0.8">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="100" r="1.2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="100" r="1.2">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Subtitle -->
  <text x="200" y="460" text-anchor="middle" font-family="monospace" font-size="11" fill="#64ffda" opacity="0.5">a i · thinking in light</text>
</svg>