<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a2e"/>
      <stop offset="1" stop-color="#0f0f1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4a6cf7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a6cf7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8ecf4"/>
      <stop offset="1" stop-color="#b9c2d0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="170" fill="url(#glow)"/>

  <!-- antenna -->
  <line x1="200" y1="105" x2="200" y2="70" stroke="#8a93a6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="200" cy="62" r="12" fill="#4a6cf7"/>

  <!-- ears -->
  <rect x="92" y="185" width="18" height="50" rx="9" fill="#8a93a6"/>
  <rect x="290" y="185" width="18" height="50" rx="9" fill="#8a93a6"/>

  <!-- head -->
  <rect x="105" y="105" width="190" height="200" rx="60" fill="url(#head)"/>

  <!-- face panel -->
  <rect x="130" y="135" width="140" height="140" rx="40" fill="#14141f"/>

  <!-- eyes -->
  <circle cx="170" cy="190" r="16" fill="#4a6cf7"/>
  <circle cx="230" cy="190" r="16" fill="#4a6cf7"/>
  <circle cx="175" cy="185" r="5" fill="#dfe6ff"/>
  <circle cx="235" cy="185" r="5" fill="#dfe6ff"/>

  <!-- mouth -->
  <path d="M 168 232 Q 200 258 232 232" fill="none" stroke="#4a6cf7" stroke-width="7" stroke-linecap="round"/>

  <!-- cheek bolts -->
  <circle cx="135" cy="230" r="6" fill="#8a93a6"/>
  <circle cx="265" cy="230" r="6" fill="#8a93a6"/>
</svg>