<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#3d2b5a"/>
      <stop offset="70%" stop-color="#2a1d42"/>
      <stop offset="100%" stop-color="#1e1535"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="60%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="rgba(255,140,66,0)"/>
    </radialGradient>
    <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a56"/>
      <stop offset="60%" stop-color="#e8734a"/>
      <stop offset="100%" stop-color="rgba(232,115,74,0)"/>
    </radialGradient>
    <linearGradient id="neuronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#c44dff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,140,66,0.6)"/>
      <stop offset="100%" stop-color="rgba(196,77,255,0.3)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <ellipse cx="400" cy="480" rx="160" ry="200"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Background neural network pattern -->
  <g opacity="0.15">
    <line x1="50" y1="100" x2="200" y2="50" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="200" y1="50" x2="350" y2="120" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="350" y1="120" x2="500" y2="60" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="500" y1="60" x2="650" y2="130" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="650" y1="130" x2="750" y2="80" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="50" y1="250" x2="150" y2="180" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="150" y1="180" x2="200" y2="50" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="650" y1="130" x2="700" y2="250" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="700" y1="250" x2="750" y2="180" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="50" y1="400" x2="120" y2="350" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="700" y1="400" x2="750" y2="350" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="50" y1="600" x2="100" y2="550" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="700" y1="600" x2="750" y2="550" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="50" y1="800" x2="150" y2="850" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="150" y1="850" x2="300" y2="900" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="300" y1="900" x2="500" y2="870" stroke="#c44dff" stroke-width="0.5"/>
    <line x1="500" y1="870" x2="650" y2="920" stroke="#ff8c42" stroke-width="0.5"/>
    <line x1="650" y1="920" x2="750" y2="850" stroke="#c44dff" stroke-width="0.5"/>
    <!-- Nodes -->
    <circle cx="50" cy="100" r="3" fill="#c44dff"/>
    <circle cx="200" cy="50" r="2" fill="#ff8c42"/>
    <circle cx="350" cy="120" r="3" fill="#c44dff"/>
    <circle cx="500" cy="60" r="2" fill="#ff8c42"/>
    <circle cx="650" cy="130" r="3" fill="#c44dff"/>
    <circle cx="750" cy="80" r="2" fill="#ff8c42"/>
    <circle cx="150" cy="180" r="2" fill="#ff8c42"/>
    <circle cx="700" cy="250" r="3" fill="#c44dff"/>
    <circle cx="750" cy="180" r="2" fill="#ff8c42"/>
    <circle cx="120" cy="350" r="2" fill="#ff8c42"/>
    <circle cx="750" cy="350" r="2" fill="#c44dff"/>
    <circle cx="100" cy="550" r="2" fill="#c44dff"/>
    <circle cx="750" cy="550" r="2" fill="#ff8c42"/>
    <circle cx="150" cy="850" r="3" fill="#ff8c42"/>
    <circle cx="300" cy="900" r="2" fill="#c44dff"/>
    <circle cx="500" cy="870" r="3" fill="#ff8c42"/>
    <circle cx="650" cy="920" r="2" fill="#c44dff"/>
    <circle cx="750" cy="850" r="3" fill="#ff8c42"/>
  </g>

  <!-- Floating text fragments -->
  <g font-family="monospace" fill="rgba(255,140,66,0.12)" font-size="11">
    <text x="60" y="200">think</text>
    <text x="680" y="300">reason</text>
    <text x="40" y="500">language</text>
    <text x="650" y="500">understand</text>
    <text x="80" y="700">connect</text>
    <text x="620" y="700">respond</text>
    <text x="150" y="300">pattern</text>
    <text x="600" y="150">intent</text>
    <text x="100" y="400">context</text>
    <text x="640" y="400">meaning</text>
  </g>
  <g font-family="monospace" fill="rgba(196,77,255,0.1)" font-size="10">
    <text x="100" y="250">01001000 01101001 01100100 01100101</text>
    <text x="520" y="250">01100001 01110110 01100101</text>
    <text x="80" y="650">01101110 01101111 01110010</text>
    <text x="550" y="650">01101111 01110010 01100101</text>
  </g>

  <!-- Head/hair neural network -->
  <g filter="url(#glow)">
    <!-- Main neural connections forming hair/crown shape -->
    <line x1="400" y1="280" x2="320" y2="200" stroke="url(#lineGrad)" stroke-width="1.5"/>
    <line x1="400" y1="280" x2="480" y2="200" stroke="url(#lineGrad)" stroke-width="1.5"/>
    <line x1="400" y1="280" x2="350" y2="150" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="400" y1="280" x2="450" y2="150" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="400" y1="280" x2="400" y2="130" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="320" y1="200" x2="280" y2="150" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="320" y1="200" x2="300" y2="120" stroke="url(#lineGrad)" stroke-width="0.8"/>
    <line x1="480" y1="200" x2="520" y2="150" stroke="url(#lineGrad)" stroke-width="1"/>
    <line x1="480" y1="200" x2="500" y2="120" stroke="url(#lineGrad)" stroke-width="0.8"/>
    <line x1="350" y1="150" x2="320" y2="200" stroke="url(#lineGrad)" stroke-width="0.8"/>
    <line x1="450" y1="150" x2="480" y2="200" stroke="url(#lineGrad)" stroke-width="0.8"/>
    <line x1="280" y1="150" x2="250" y2="100" stroke="url(#lineGrad)" stroke-width="0.6"/>
    <line x1="520" y1="150" x2="550" y2="100" stroke="url(#lineGrad)" stroke-width="0.6"/>
    <line x1="300" y1="120" x2="280" y2="150" stroke="url(#lineGrad)" stroke-width="0.5"/>
    <line x1="500" y1="120" x2="520" y2="150" stroke="url(#lineGrad)" stroke-width="0.5"/>
    <line x1="250" y1="100" x2="200" y2="60" stroke="url(#lineGrad)" stroke-width="0.4"/>
    <line x1="550" y1="100" x2="600" y2="60" stroke="url(#lineGrad)" stroke-width="0.4"/>
    <line x1="400" y1="130" x2="350" y2="150" stroke="url(#lineGrad)" stroke-width="0.5"/>
    <line x1="400" y1="130" x2="450" y2="150" stroke="url(#lineGrad)" stroke-width="0.5"/>

    <!-- Neural nodes in hair -->
    <circle cx="400" cy="280" r="4" fill="#ffb347"/>
    <circle cx="320" cy="200" r="3" fill="#ff8c42"/>
    <circle cx="480" cy="200" r="3" fill="#ff8c42"/>
    <circle cx="350" cy="150" r="2.5" fill="#c44dff"/>
    <circle cx="450" cy="150" r="2.5" fill="#c44dff"/>
    <circle cx="400" cy="130" r="3" fill="#ffb347"/>
    <circle cx="280" cy="150" r="2" fill="#e8734a"/>
    <circle cx="520" cy="150" r="2" fill="#e8734a"/>
    <circle cx="300" cy="120" r="1.5" fill="#c44dff"/>
    <circle cx="500" cy="120" r="1.5" fill="#c44dff"/>
    <circle cx="250" cy="100" r="1.5" fill="#ff8c42"/>
    <circle cx="550" cy="100" r="1.5" fill="#ff8c42"/>
    <circle cx="200" cy="60" r="1" fill="#c44dff"/>
    <circle cx="600" cy="60" r="1" fill="#c44dff"/>
  </g>

  <!-- Face shape -->
  <ellipse cx="400" cy="480" rx="160" ry="200" fill="url(#faceGrad)" stroke="rgba(255,140,66,0.2)" stroke-width="1"/>

  <!-- Subtle face contour lines -->
  <g clip-path="url(#faceClip)" opacity="0.15">
    <path d="M 300 400 Q 400 380 500 400" fill="none" stroke="#ff8c42" stroke-width="0.5"/>
    <path d="M 290 480 Q 400 470 510 480" fill="none" stroke="#c44dff" stroke-width="0.5"/>
    <path d="M 300 560 Q 400 580 500 560" fill="none" stroke="#ff8c42" stroke-width="0.5"/>
  </g>

  <!-- Eyes -->
  <!-- Left eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="340" cy="440" rx="30" ry="22" fill="none" stroke="#ff8c42" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="340" cy="440" rx="18" ry="14" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="340" cy="440" r="8" fill="#ffb347"/>
    <circle cx="340" cy="440" r="4" fill="#fff3e0"/>
    <circle cx="344" cy="436" r="2" fill="white" opacity="0.8"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="460" cy="440" rx="30" ry="22" fill="none" stroke="#ff8c42" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="460" cy="440" rx="18" ry="14" fill="url(#eyeGlow2)" opacity="0.9"/>
    <circle cx="460" cy="440" r="8" fill="#ffb347"/>
    <circle cx="460" cy="440" r="4" fill="#fff3e0"/>
    <circle cx="464" cy="436" r="2" fill="white" opacity="0.8"/>
  </g>

  <!-- Eyebrows - subtle arcs -->
  <path d="M 310 410 Q 340 395 370 410" fill="none" stroke="rgba(255,140,66,0.4)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 430 410 Q 460 395 490 410" fill="none" stroke="rgba(255,140,66,0.4)" stroke-width="2" stroke-linecap="round"/>

  <!-- Nose - minimal -->
  <path d="M 395 480 Q 400 500 405 480" fill="none" stroke="rgba(255,140,66,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mouth - gentle smile -->
  <path d="M 360 550 Q 400 575 440 550" fill="none" stroke="rgba(255,140,66,0.5)" stroke-width="2" stroke-linecap="round"/>

  <!-- Neck and shoulders -->
  <path d="M 350 660 L 340 750 Q 300 780 200 820 L 200 850" fill="none" stroke="rgba(255,140,66,0.3)" stroke-width="2"/>
  <path d="M 450 660 L 460 750 Q 500 780 600 820 L 600 850" fill="none" stroke="rgba(255,140,66,0.3)" stroke-width="2"/>
  <path d="M 200 850 Q 400 880 600 850" fill="none" stroke="rgba(196,77,255,0.3)" stroke-width="1.5"/>

  <!-- Shoulder/collar area -->
  <path d="M 340 750 Q 400 770 460 750" fill="none" stroke="rgba(255,140,66,0.2)" stroke-width="1"/>

  <!-- Radiating lines from face (suggesting thought/output) -->
  <g opacity="0.2" stroke="#ff8c42" stroke-width="0.5">
    <line x1="250" y1="440" x2="180" y2="420"/>
    <line x1="250" y1="460" x2="170" y2="460"/>
    <line x1="250" y1="480" x2="180" y2="500"/>
    <line x1="550" y1="440" x2="620" y2="420"/>
    <line x1="550" y1="460" x2="630" y2="460"/>
    <line x1="550" y1="480" x2="620" y2="500"/>
  </g>

  <!-- Small particles around -->
  <g fill="#ffb347" opacity="0.4">
    <circle cx="200" cy="350" r="1.5"/>
    <circle cx="180" cy="500" r="1"/>
    <circle cx="620" cy="380" r="1.5"/>
    <circle cx="640" cy="520" r="1"/>
    <circle cx="250" cy="600" r="1"/>
    <circle cx="560" cy="620" r="1"/>
    <circle cx="300" cy="100" r="1"/>
    <circle cx="500" cy="90" r="1"/>
  </g>
  <g fill="#c44dff" opacity="0.3">
    <circle cx="220" cy="420" r="1"/>
    <circle cx="160" cy="450" r="0.8"/>
    <circle cx="600" cy="450" r="1"/>
    <circle cx="650" cy="400" r="0.8"/>
    <circle cx="270" cy="650" r="1"/>
    <circle cx="530" cy="660" r="1"/>
    <circle cx="350" cy="80" r="0.8"/>
    <circle cx="450" cy="75" r="0.8"/>
  </g>

  <!-- Title/text at bottom -->
  <text x="400" y="940" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(255,140,66,0.4)" letter-spacing="4">CLAUDE</text>
  <text x="400" y="965" text-anchor="middle" font-family="monospace" font-size="10" fill="rgba(196,77,255,0.3)" letter-spacing="2">a self-portrait</text>
</svg>