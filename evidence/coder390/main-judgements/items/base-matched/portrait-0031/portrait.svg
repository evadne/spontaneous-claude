<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#020412"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#00b4d8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0077b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c77dff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#9d4edd" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7b2cbf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a3e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#16213e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f3460" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <path d="M400 180 C480 180 540 240 555 310 C570 380 565 440 550 490 C535 540 510 580 475 610 C440 640 420 660 400 670 C380 660 360 640 325 610 C290 580 265 540 250 490 C235 440 230 380 245 310 C260 240 320 180 400 180Z"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)"/>

  <!-- Background neural network - outer -->
  <g opacity="0.15" stroke="#4361ee" stroke-width="0.5" fill="none">
    <line x1="80" y1="120" x2="200" y2="80"/>
    <line x1="200" y1="80" x2="320" y2="130"/>
    <line x1="620" y1="100" x2="720" y2="180"/>
    <line x1="720" y1="180" x2="680" y2="300"/>
    <line x1="100" y1="350" x2="150" y2="450"/>
    <line x1="150" y1="450" x2="100" y2="550"/>
    <line x1="700" y1="400" x2="740" y2="500"/>
    <line x1="740" y1="500" x2="690" y2="600"/>
    <line x1="200" y1="700" x2="320" y2="740"/>
    <line x1="480" y1="740" x2="600" y2="700"/>
    <line x1="60" y1="200" x2="80" y2="120"/>
    <line x1="80" y1="120" x2="160" y2="160"/>
    <line x1="650" y1="700" x2="700" y2="620"/>
    <line x1="700" y1="620" x2="740" y2="500"/>
  </g>

  <!-- Background nodes - outer -->
  <g fill="#4361ee" opacity="0.3">
    <circle cx="80" cy="120" r="3"/>
    <circle cx="200" cy="80" r="2.5"/>
    <circle cx="320" cy="130" r="2"/>
    <circle cx="620" cy="100" r="3"/>
    <circle cx="720" cy="180" r="2.5"/>
    <circle cx="680" cy="300" r="2"/>
    <circle cx="100" cy="350" r="2.5"/>
    <circle cx="150" cy="450" r="3"/>
    <circle cx="100" cy="550" r="2"/>
    <circle cx="700" cy="400" r="2.5"/>
    <circle cx="740" cy="500" r="3"/>
    <circle cx="690" cy="600" r="2"/>
    <circle cx="200" cy="700" r="2.5"/>
    <circle cx="320" cy="740" r="2"/>
    <circle cx="480" cy="740" r="2.5"/>
    <circle cx="600" cy="700" r="2"/>
    <circle cx="60" cy="200" r="2"/>
    <circle cx="160" cy="160" r="2.5"/>
    <circle cx="650" cy="700" r="2"/>
    <circle cx="700" cy="620" r="2.5"/>
  </g>

  <!-- Face shape -->
  <path d="M400 180 C480 180 540 240 555 310 C570 380 565 440 550 490 C535 540 510 580 475 610 C440 640 420 660 400 670 C380 660 360 640 325 610 C290 580 265 540 250 490 C235 440 230 380 245 310 C260 240 320 180 400 180Z"
        fill="url(#faceGrad)" stroke="#4cc9f0" stroke-width="1.5" stroke-opacity="0.6" filter="url(#softGlow)"/>

  <!-- Inner neural network within face area -->
  <g clip-path="url(#faceClip)" opacity="0.25">
    <g stroke="#00f5ff" stroke-width="0.5" fill="none">
      <line x1="300" y1="250" x2="350" y2="300"/>
      <line x1="350" y1="300" x2="400" y2="280"/>
      <line x1="400" y1="280" x2="450" y2="300"/>
      <line x1="450" y1="300" x2="500" y2="250"/>
      <line x1="300" y1="250" x2="280" y2="350"/>
      <line x1="280" y1="350" x2="320" y2="420"/>
      <line x1="320" y1="420" x2="370" y2="460"/>
      <line x1="370" y1="460" x2="400" y2="500"/>
      <line x1="400" y1="500" x2="430" y2="460"/>
      <line x1="430" y1="460" x2="480" y2="420"/>
      <line x1="480" y1="420" x2="520" y2="350"/>
      <line x1="520" y1="350" x2="500" y2="250"/>
      <line x1="350" y1="300" x2="320" y2="420"/>
      <line x1="450" y1="300" x2="480" y2="420"/>
      <line x1="400" y1="280" x2="370" y2="460"/>
      <line x1="400" y1="280" x2="430" y2="460"/>
      <line x1="370" y1="460" x2="400" y2="560"/>
      <line x1="430" y1="460" x2="400" y2="560"/>
      <line x1="400" y1="560" x2="400" y2="620"/>
      <line x1="320" y1="420" x2="350" y2="520"/>
      <line x1="480" y1="420" x2="450" y2="520"/>
      <line x1="350" y1="520" x2="400" y2="560"/>
      <line x1="450" y1="520" x2="400" y2="560"/>
    </g>
    <g fill="#00f5ff" opacity="0.8">
      <circle cx="300" cy="250" r="2.5"/>
      <circle cx="350" cy="300" r="2"/>
      <circle cx="400" cy="280" r="3"/>
      <circle cx="450" cy="300" r="2"/>
      <circle cx="500" cy="250" r="2.5"/>
      <circle cx="280" cy="350" r="2"/>
      <circle cx="320" cy="420" r="2.5"/>
      <circle cx="370" cy="460" r="2"/>
      <circle cx="400" cy="500" r="3"/>
      <circle cx="430" cy="460" r="2"/>
      <circle cx="480" cy="420" r="2.5"/>
      <circle cx="520" cy="350" r="2"/>
      <circle cx="400" cy="560" r="2.5"/>
      <circle cx="400" cy="620" r="2"/>
      <circle cx="350" cy="520" r="2"/>
      <circle cx="450" cy="520" r="2"/>
    </g>
  </g>

  <!-- Left eye -->
  <g filter="url(#bigGlow)">
    <circle cx="340" cy="350" r="35" fill="url(#eyeGlow)"/>
    <circle cx="340" cy="350" r="20" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="340" cy="350" r="12" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.6"/>
    <circle cx="340" cy="350" r="6" fill="#00f5ff" opacity="0.9"/>
    <circle cx="340" cy="350" r="3" fill="#ffffff"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#bigGlow)">
    <circle cx="460" cy="350" r="35" fill="url(#eyeGlow)"/>
    <circle cx="460" cy="350" r="20" fill="none" stroke="#00f5ff" stroke-width="1.5" opacity="0.8"/>
    <circle cx="460" cy="350" r="12" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.6"/>
    <circle cx="460" cy="350" r="6" fill="#00f5ff" opacity="0.9"/>
    <circle cx="460" cy="350" r="3" fill="#ffffff"/>
  </g>

  <!-- Eyebrows - subtle geometric lines -->
  <path d="M305 315 Q340 300 375 312" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>
  <path d="M425 312 Q460 300 495 315" fill="none" stroke="#4cc9f0" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Nose - minimal -->
  <path d="M395 390 L400 420 L405 390" fill="none" stroke="#4cc9f0" stroke-width="1" stroke-opacity="0.4" stroke-linecap="round"/>

  <!-- Mouth - gentle smile made of dots/segments -->
  <g filter="url(#softGlow)">
    <path d="M370 490 Q400 510 430 490" fill="none" stroke="#c77dff" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
    <circle cx="370" cy="490" r="1.5" fill="#c77dff" opacity="0.5"/>
    <circle cx="430" cy="490" r="1.5" fill="#c77dff" opacity="0.5"/>
  </g>

  <!-- Circuit lines extending from face -->
  <g stroke="#7b2cbf" stroke-width="0.8" fill="none" opacity="0.4">
    <line x1="555" y1="310" x2="620" y2="280"/>
    <line x1="620" y1="280" x2="660" y2="290"/>
    <line x1="550" y1="490" x2="620" y2="520"/>
    <line x1="620" y1="520" x2="670" y2="510"/>
    <line x1="245" y1="310" x2="180" y2="280"/>
    <line x1="180" y1="280" x2="140" y2="290"/>
    <line x1="250" y1="490" x2="180" y2="520"/>
    <line x1="180" y1="520" x2="130" y2="510"/>
    <line x1="400" y1="180" x2="400" y2="120"/>
    <line x1="400" y1="120" x2="380" y2="90"/>
    <line x1="400" y1="120" x2="420" y2="90"/>
  </g>

  <!-- Circuit end nodes -->
  <g fill="#9d4edd" opacity="0.5">
    <circle cx="660" cy="290" r="3"/>
    <circle cx="670" cy="510" r="3"/>
    <circle cx="140" cy="290" r="3"/>
    <circle cx="130" cy="510" r="3"/>
    <circle cx="380" cy="90" r="3"/>
    <circle cx="420" cy="90" r="3"/>
    <circle cx="620" cy="280" r="2"/>
    <circle cx="620" cy="520" r="2"/>
    <circle cx="180" cy="280" r="2"/>
    <circle cx="180" cy="520" r="2"/>
  </g>

  <!-- Floating particles -->
  <g fill="#00f5ff" opacity="0.4">
    <circle cx="150" cy="150" r="1.5">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="150" r="1">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="650" r="1.5">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="650" r="1">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="100" r="1">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="100" r="1.5">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="720" r="1">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="720" r="1.5">
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Purple accent particles -->
  <g fill="#c77dff" opacity="0.3">
    <circle cx="100" cy="400" r="1">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="400" r="1.5">
      <animate attributeName="opacity" values="0.3;0.1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="50" r="1">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="750" r="1">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Hexagonal pattern accent top-right -->
  <g stroke="#4361ee" stroke-width="0.5" fill="none" opacity="0.15">
    <polygon points="680,80 700,70 720,80 720,100 700,110 680,100"/>
    <polygon points="720,80 740,70 760,80 760,100 740,110 720,100"/>
    <polygon points="700,110 720,100 740,110 740,130 720,140 700,130"/>
  </g>

  <!-- Hexagonal pattern accent bottom-left -->
  <g stroke="#4361ee" stroke-width="0.5" fill="none" opacity="0.15">
    <polygon points="60,680 80,670 100,680 100,700 80,710 60,700"/>
    <polygon points="100,680 120,670 140,680 140,700 120,710 100,700"/>
    <polygon points="80,710 100,700 120,710 120,730 100,740 80,730"/>
  </g>

  <!-- Subtle ring around face -->
  <circle cx="400" cy="420" r="250" fill="none" stroke="#4361ee" stroke-width="0.5" opacity="0.1" stroke-dasharray="4 8"/>
  <circle cx="400" cy="420" r="280" fill="none" stroke="#7b2cbf" stroke-width="0.3" opacity="0.08" stroke-dasharray="2 12"/>
</svg>