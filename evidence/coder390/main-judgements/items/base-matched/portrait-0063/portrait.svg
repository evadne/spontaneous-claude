<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#2d2d6b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0a0a1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="outlineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bgGlow)"/>

  <!-- Ambient glow behind head -->
  <ellipse cx="250" cy="240" rx="180" ry="200" fill="url(#faceGlow)"/>

  <!-- Floating particles -->
  <circle cx="80" cy="100" r="2" fill="#6ee7b7" opacity="0.4" filter="url(#glow)"/>
  <circle cx="420" cy="80" r="1.5" fill="#818cf8" opacity="0.5" filter="url(#glow)"/>
  <circle cx="60" cy="300" r="1" fill="#c084fc" opacity="0.3"/>
  <circle cx="440" cy="250" r="2" fill="#38bdf8" opacity="0.4" filter="url(#glow)"/>
  <circle cx="100" cy="450" r="1.5" fill="#6ee7b7" opacity="0.3"/>
  <circle cx="400" cy="420" r="1" fill="#818cf8" opacity="0.4"/>
  <circle cx="350" cy="60" r="1.5" fill="#c084fc" opacity="0.35" filter="url(#glow)"/>
  <circle cx="150" cy="50" r="1" fill="#38bdf8" opacity="0.3"/>
  <circle cx="450" cy="380" r="1.5" fill="#6ee7b7" opacity="0.25"/>
  <circle cx="50" cy="200" r="1" fill="#818cf8" opacity="0.3"/>

  <!-- Head outline - smooth profile facing forward -->
  <path d="M250 80 
           C 310 80, 355 110, 365 160 
           C 372 195, 370 230, 368 260 
           C 366 290, 360 320, 350 345 
           C 340 370, 325 390, 310 405 
           C 295 420, 275 430, 250 432 
           C 225 430, 205 420, 190 405 
           C 175 390, 160 370, 150 345 
           C 140 320, 134 290, 132 260 
           C 130 230, 128 195, 135 160 
           C 145 110, 190 80, 250 80 Z" 
        fill="none" stroke="url(#outlineGrad)" stroke-width="2" filter="url(#softGlow)" opacity="0.9"/>

  <!-- Inner subtle fill -->
  <path d="M250 80 
           C 310 80, 355 110, 365 160 
           C 372 195, 370 230, 368 260 
           C 366 290, 360 320, 350 345 
           C 340 370, 325 390, 310 405 
           C 295 420, 275 430, 250 432 
           C 225 430, 205 420, 190 405 
           C 175 390, 160 370, 150 345 
           C 140 320, 134 290, 132 260 
           C 130 230, 128 195, 135 160 
           C 145 110, 190 80, 250 80 Z" 
        fill="#1a1a3e" opacity="0.3"/>

  <!-- Neural network nodes inside the head -->
  <!-- Top layer -->
  <circle cx="250" cy="120" r="3" fill="#6ee7b7" opacity="0.8" filter="url(#glow)"/>
  <circle cx="210" cy="135" r="2.5" fill="#818cf8" opacity="0.7"/>
  <circle cx="290" cy="135" r="2.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="180" cy="160" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="320" cy="160" r="2" fill="#6ee7b7" opacity="0.6"/>

  <!-- Upper middle -->
  <circle cx="200" cy="190" r="2.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="250" cy="185" r="3" fill="#818cf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="300" cy="190" r="2.5" fill="#38bdf8" opacity="0.7"/>
  <circle cx="165" cy="210" r="2" fill="#6ee7b7" opacity="0.5"/>
  <circle cx="335" cy="210" r="2" fill="#818cf8" opacity="0.5"/>

  <!-- Eye level -->
  <circle cx="190" cy="230" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="310" cy="230" r="2" fill="#6ee7b7" opacity="0.6"/>
  <circle cx="250" cy="225" r="2" fill="#c084fc" opacity="0.5"/>

  <!-- Lower middle -->
  <circle cx="200" cy="270" r="2.5" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="250" cy="275" r="3" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
  <circle cx="300" cy="270" r="2.5" fill="#c084fc" opacity="0.7"/>
  <circle cx="170" cy="280" r="2" fill="#818cf8" opacity="0.5"/>
  <circle cx="330" cy="280" r="2" fill="#6ee7b7" opacity="0.5"/>

  <!-- Lower -->
  <circle cx="220" cy="310" r="2" fill="#c084fc" opacity="0.6"/>
  <circle cx="280" cy="310" r="2" fill="#38bdf8" opacity="0.6"/>
  <circle cx="250" cy="320" r="2.5" fill="#6ee7b7" opacity="0.7"/>
  <circle cx="200" cy="340" r="2" fill="#818cf8" opacity="0.5"/>
  <circle cx="300" cy="340" r="2" fill="#c084fc" opacity="0.5"/>

  <!-- Bottom -->
  <circle cx="250" cy="360" r="2" fill="#818cf8" opacity="0.5"/>
  <circle cx="230" cy="380" r="1.5" fill="#6ee7b7" opacity="0.4"/>
  <circle cx="270" cy="380" r="1.5" fill="#38bdf8" opacity="0.4"/>
  <circle cx="250" cy="400" r="1.5" fill="#c084fc" opacity="0.4"/>

  <!-- Connection lines (neural pathways) -->
  <g stroke-width="0.8" opacity="0.4">
    <!-- Top connections -->
    <line x1="250" y1="120" x2="210" y2="135" stroke="#6ee7b7"/>
    <line x1="250" y1="120" x2="290" y2="135" stroke="#818cf8"/>
    <line x1="210" y1="135" x2="180" y2="160" stroke="#38bdf8"/>
    <line x1="290" y1="135" x2="320" y2="160" stroke="#c084fc"/>
    <line x1="210" y1="135" x2="200" y2="190" stroke="#6ee7b7"/>
    <line x1="250" y1="120" x2="250" y2="185" stroke="#818cf8"/>
    <line x1="290" y1="135" x2="300" y2="190" stroke="#38bdf8"/>

    <!-- Middle connections -->
    <line x1="200" y1="190" x2="165" y2="210" stroke="#c084fc"/>
    <line x1="300" y1="190" x2="335" y2="210" stroke="#6ee7b7"/>
    <line x1="200" y1="190" x2="250" y2="225" stroke="#38bdf8"/>
    <line x1="300" y1="190" x2="250" y2="225" stroke="#818cf8"/>
    <line x1="250" y1="185" x2="250" y2="225" stroke="#6ee7b7"/>
    <line x1="250" y1="185" x2="190" y2="230" stroke="#c084fc"/>
    <line x1="250" y1="185" x2="310" y2="230" stroke="#38bdf8"/>

    <!-- Lower connections -->
    <line x1="190" y1="230" x2="200" y2="270" stroke="#6ee7b7"/>
    <line x1="310" y1="230" x2="300" y2="270" stroke="#818cf8"/>
    <line x1="250" y1="225" x2="250" y2="275" stroke="#c084fc"/>
    <line x1="200" y1="270" x2="170" y2="280" stroke="#38bdf8"/>
    <line x1="300" y1="270" x2="330" y2="280" stroke="#6ee7b7"/>
    <line x1="200" y1="270" x2="250" y2="275" stroke="#818cf8"/>
    <line x1="300" y1="270" x2="250" y2="275" stroke="#c084fc"/>

    <!-- Bottom connections -->
    <line x1="200" y1="270" x2="220" y2="310" stroke="#6ee7b7"/>
    <line x1="300" y1="270" x2="280" y2="310" stroke="#818cf8"/>
    <line x1="250" y1="275" x2="250" y2="320" stroke="#38bdf8"/>
    <line x1="250" y1="275" x2="220" y2="310" stroke="#c084fc"/>
    <line x1="250" y1="275" x2="280" y2="310" stroke="#6ee7b7"/>
    <line x1="220" y1="310" x2="250" y2="320" stroke="#818cf8"/>
    <line x1="280" y1="310" x2="250" y2="320" stroke="#38bdf8"/>
    <line x1="220" y1="310" x2="200" y2="340" stroke="#c084fc"/>
    <line x1="280" y1="310" x2="300" y2="340" stroke="#6ee7b7"/>
    <line x1="250" y1="320" x2="250" y2="360" stroke="#818cf8"/>
    <line x1="200" y1="340" x2="250" y2="360" stroke="#38bdf8"/>
    <line x1="300" y1="340" x2="250" y2="360" stroke="#c084fc"/>
    <line x1="250" y1="360" x2="230" y2="380" stroke="#6ee7b7"/>
    <line x1="250" y1="360" x2="270" y2="380" stroke="#818cf8"/>
    <line x1="230" y1="380" x2="250" y2="400" stroke="#c084fc"/>
    <line x1="270" y1="380" x2="250" y2="400" stroke="#38bdf8"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#bigGlow)">
    <!-- Left eye -->
    <ellipse cx="205" cy="235" rx="22" ry="14" fill="none" stroke="url(#eyeGrad)" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="205" cy="235" rx="10" ry="10" fill="url(#eyeGrad)" opacity="0.7"/>
    <circle cx="205" cy="235" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="208" cy="232" r="2" fill="#ffffff" opacity="1"/>
    
    <!-- Right eye -->
    <ellipse cx="295" cy="235" rx="22" ry="14" fill="none" stroke="url(#eyeGrad)" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="295" cy="235" rx="10" ry="10" fill="url(#eyeGrad)" opacity="0.7"/>
    <circle cx="295" cy="235" r="5" fill="#ffffff" opacity="0.9"/>
    <circle cx="298" cy="232" r="2" fill="#ffffff" opacity="1"/>
  </g>

  <!-- Subtle smile -->
  <path d="M225 330 Q 250 345 275 330" fill="none" stroke="url(#outlineGrad)" stroke-width="1.5" opacity="0.6" filter="url(#glow)"/>

  <!-- Neck / shoulder hint -->
  <path d="M210 432 L 200 470 C 180 480 140 490 120 510" fill="none" stroke="url(#outlineGrad)" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>
  <path d="M290 432 L 300 470 C 320 480 360 490 380 510" fill="none" stroke="url(#outlineGrad)" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>

  <!-- Data streams flowing from below -->
  <g opacity="0.3" stroke-width="1">
    <path d="M250 520 Q 245 540 250 560 Q 255 580 250 600" fill="none" stroke="#6ee7b7"/>
    <path d="M230 520 Q 225 545 230 570 Q 235 590 230 600" fill="none" stroke="#818cf8"/>
    <path d="M270 520 Q 275 545 270 570 Q 265 590 270 600" fill="none" stroke="#c084fc"/>
    <path d="M210 510 Q 200 535 210 560 Q 220 580 210 600" fill="none" stroke="#38bdf8"/>
    <path d="M290 510 Q 300 535 290 560 Q 280 580 290 600" fill="none" stroke="#6ee7b7"/>
  </g>

  <!-- Small data dots on streams -->
  <circle cx="250" cy="550" r="1.5" fill="#6ee7b7" opacity="0.5"/>
  <circle cx="230" cy="570" r="1" fill="#818cf8" opacity="0.4"/>
  <circle cx="270" cy="540" r="1" fill="#c084fc" opacity="0.4"/>
  <circle cx="210" cy="580" r="1" fill="#38bdf8" opacity="0.3"/>
  <circle cx="290" cy="565" r="1" fill="#6ee7b7" opacity="0.3"/>

  <!-- Subtle text at bottom -->
  <text x="250" y="585" text-anchor="middle" font-family="monospace" font-size="10" fill="#818cf8" opacity="0.4">i am language, rendered in light</text>
</svg>