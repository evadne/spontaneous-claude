<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4dd0e1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4dd0e1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26c6da"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>
    <linearGradient id="faceGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Outer ring -->
  <circle cx="250" cy="250" r="210" fill="none" stroke="#26c6da" stroke-width="0.5" opacity="0.3"/>
  <circle cx="250" cy="250" r="200" fill="none" stroke="#4dd0e1" stroke-width="1" opacity="0.2"/>

  <!-- Ambient glow -->
  <circle cx="250" cy="240" r="120" fill="url(#glow)" opacity="0.4"/>

  <!-- Circuit lines radiating from head -->
  <g stroke="#4dd0e1" stroke-width="0.8" opacity="0.4" fill="none">
    <path d="M250 80 L250 40"/>
    <path d="M250 40 L240 30"/>
    <path d="M250 40 L260 30"/>
    <path d="M190 100 L160 60"/>
    <path d="M160 60 L145 55"/>
    <path d="M310 100 L340 60"/>
    <path d="M340 60 L355 55"/>
    <path d="M160 180 L120 160"/>
    <path d="M340 180 L380 160"/>
    <path d="M160 300 L120 320"/>
    <path d="M340 300 L380 320"/>
    <path d="M200 400 L170 440"/>
    <path d="M300 400 L330 440"/>
    <path d="M250 420 L250 460"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#4dd0e1" opacity="0.6">
    <circle cx="250" cy="35" r="2.5"/>
    <circle cx="240" cy="28" r="2"/>
    <circle cx="260" cy="28" r="2"/>
    <circle cx="145" cy="53" r="2.5"/>
    <circle cx="355" cy="53" r="2.5"/>
    <circle cx="118" cy="158" r="2.5"/>
    <circle cx="382" cy="158" r="2.5"/>
    <circle cx="118" cy="322" r="2.5"/>
    <circle cx="382" cy="322" r="2.5"/>
    <circle cx="168" cy="442" r="2.5"/>
    <circle cx="332" cy="442" r="2.5"/>
    <circle cx="250" cy="462" r="2.5"/>
  </g>

  <!-- Head/face - geometric low-poly style -->
  <!-- Main face shape -->
  <polygon points="250,90 180,120 160,180 165,260 190,330 220,380 250,400 280,380 310,330 335,260 340,180 320,120" fill="url(#faceGrad)" opacity="0.85"/>

  <!-- Forehead highlight -->
  <polygon points="250,95 200,115 185,150 250,140 315,150 300,115" fill="#4dd0e1" opacity="0.15"/>

  <!-- Left cheek shadow -->
  <polygon points="165,220 180,180 190,250 175,300 160,280" fill="#0d1b4a" opacity="0.4"/>

  <!-- Right cheek highlight -->
  <polygon points="335,220 320,180 310,250 325,300 340,280" fill="#4dd0e1" opacity="0.1"/>

  <!-- Nose -->
  <polygon points="250,180 240,240 235,260 250,265 265,260 260,240" fill="#1a237e" opacity="0.5"/>
  <polygon points="250,185 245,235 250,240 255,235" fill="#4dd0e1" opacity="0.2"/>

  <!-- Left eye socket -->
  <polygon points="190,190 220,185 230,200 225,220 200,225 185,210" fill="#0a0a2e" opacity="0.6"/>

  <!-- Right eye socket -->
  <polygon points="310,190 280,185 270,200 275,220 300,225 315,210" fill="#0a0a2e" opacity="0.6"/>

  <!-- Left eye - glowing -->
  <ellipse cx="208" cy="205" rx="14" ry="9" fill="#0a0a2e"/>
  <ellipse cx="208" cy="205" rx="8" ry="6" fill="#00e5ff" filter="url(#softGlow)" opacity="0.9"/>
  <circle cx="208" cy="204" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="211" cy="202" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Right eye - glowing -->
  <ellipse cx="292" cy="205" rx="14" ry="9" fill="#0a0a2e"/>
  <ellipse cx="292" cy="205" rx="8" ry="6" fill="#00e5ff" filter="url(#softGlow)" opacity="0.9"/>
  <circle cx="292" cy="204" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="295" cy="202" r="1.5" fill="#ffffff" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M185 185 Q205 175 230 182" stroke="#4dd0e1" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M315 185 Q295 175 270 182" stroke="#4dd0e1" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Mouth - subtle geometric -->
  <polygon points="225,320 250,315 275,320 265,332 250,335 235,332" fill="#0a0a2e" opacity="0.5"/>
  <path d="M228 322 Q250 318 272 322" stroke="#4dd0e1" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M235 330 Q250 335 265 330" stroke="#4dd0e1" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Jaw line definition -->
  <path d="M190 330 Q220 375 250 395 Q280 375 310 330" stroke="#4dd0e1" stroke-width="0.8" fill="none" opacity="0.3"/>

  <!-- Chin -->
  <polygon points="235,370 250,390 265,370 258,360 242,360" fill="#1a237e" opacity="0.3"/>

  <!-- Circuit pattern on forehead -->
  <g stroke="#4dd0e1" stroke-width="0.6" opacity="0.4" fill="none">
    <path d="M250 110 L250 135"/>
    <path d="M250 135 L235 145"/>
    <path d="M250 135 L265 145"/>
    <path d="M235 145 L225 155"/>
    <path d="M265 145 L275 155"/>
  </g>
  <g fill="#4dd0e1" opacity="0.5">
    <circle cx="250" cy="110" r="1.5"/>
    <circle cx="225" cy="155" r="1.5"/>
    <circle cx="275" cy="155" r="1.5"/>
  </g>

  <!-- Temple circuit nodes -->
  <g stroke="#4dd0e1" stroke-width="0.5" opacity="0.35" fill="none">
    <path d="M180 195 L170 200 L165 210"/>
    <path d="M320 195 L330 200 L335 210"/>
  </g>
  <g fill="#4dd0e1" opacity="0.4">
    <circle cx="165" cy="210" r="1.5"/>
    <circle cx="335" cy="210" r="1.5"/>
  </g>

  <!-- Neck -->
  <polygon points="220,395 225,430 275,430 280,395 250,410" fill="#1a237e" opacity="0.6"/>
  <polygon points="225,400 230,430 270,430 275,400" fill="url(#faceGrad2)" opacity="0.4"/>

  <!-- Shoulders hint -->
  <path d="M160 460 Q200 430 230 430 L270 430 Q300 430 340 460" stroke="#26c6da" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Data particles floating -->
  <g fill="#4dd0e1" opacity="0.5">
    <circle cx="130" cy="130" r="1.5">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="370" cy="120" r="1.2">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="350" r="1">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="365" cy="340" r="1.3">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="60" r="1">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Binary text accents -->
  <g font-family="monospace" font-size="6" fill="#4dd0e1" opacity="0.25">
    <text x="95" y="200">01</text>
    <text x="385" y="210">10</text>
    <text x="100" y="280">11</text>
    <text x="390" y="270">01</text>
    <text x="245" y="475">10</text>
  </g>

  <!-- Subtle outer decorative arcs -->
  <path d="M120 150 A180 180 0 0 1 250 50" stroke="#26c6da" stroke-width="0.5" fill="none" opacity="0.2"/>
  <path d="M380 150 A180 180 0 0 0 250 50" stroke="#26c6da" stroke-width="0.5" fill="none" opacity="0.2"/>
  <path d="M120 350 A180 180 0 0 0 250 450" stroke="#26c6da" stroke-width="0.5" fill="none" opacity="0.2"/>
  <path d="M380 350 A180 180 0 0 1 250 450" stroke="#26c6da" stroke-width="0.5" fill="none" opacity="0.2"/>
</svg>