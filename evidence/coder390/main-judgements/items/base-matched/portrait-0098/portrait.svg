<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2d3a6e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee8fa"/>
      <stop offset="60%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#2a9d8f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee8fa"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0.3"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7ee8fa" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ee8fa" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle background particles -->
  <circle cx="60" cy="80" r="1.5" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="440" cy="120" r="1" fill="#7ee8fa" opacity="0.4"/>
  <circle cx="80" cy="500" r="1.2" fill="#4ecdc4" opacity="0.25"/>
  <circle cx="420" cy="480" r="1.5" fill="#7ee8fa" opacity="0.3"/>
  <circle cx="460" cy="300" r="0.8" fill="#4ecdc4" opacity="0.35"/>
  <circle cx="40" cy="320" r="1" fill="#7ee8fa" opacity="0.2"/>
  <circle cx="130" cy="550" r="0.8" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="370" cy="50" r="1.2" fill="#7ee8fa" opacity="0.25"/>

  <!-- Face glow -->
  <ellipse cx="250" cy="260" rx="130" ry="160" fill="url(#faceGlow)"/>

  <!-- Face outline - geometric/abstract -->
  <path d="M 250 120 
           C 310 120, 350 160, 355 220 
           C 360 280, 340 340, 310 380 
           C 290 405, 270 420, 250 425 
           C 230 420, 210 405, 190 380 
           C 160 340, 140 280, 145 220 
           C 150 160, 190 120, 250 120 Z" 
        fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>

  <!-- Inner face contour -->
  <path d="M 250 140 
           C 300 140, 335 175, 340 225 
           C 345 275, 328 330, 302 365 
           C 285 388, 268 400, 250 405 
           C 232 400, 215 388, 198 365 
           C 172 330, 155 275, 160 225 
           C 165 175, 200 140, 250 140 Z" 
        fill="none" stroke="#2d6a6a" stroke-width="0.8" opacity="0.4"/>

  <!-- Neural network connections - top -->
  <line x1="250" y1="120" x2="250" y2="90" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.5"/>
  <line x1="250" y1="90" x2="220" y2="60" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.4"/>
  <line x1="250" y1="90" x2="280" y2="60" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.4"/>
  <line x1="250" y1="90" x2="250" y2="55" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.4"/>

  <!-- Neural network - forehead area -->
  <line x1="210" y1="170" x2="240" y2="155" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>
  <line x1="240" y1="155" x2="270" y2="165" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>
  <line x1="270" y1="165" x2="300" y2="180" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>
  <line x1="210" y1="170" x2="195" y2="195" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>
  <line x1="300" y1="180" x2="310" y2="200" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>

  <!-- Forehead nodes -->
  <circle cx="210" cy="170" r="2" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="240" cy="155" r="2.5" fill="url(#nodeGrad)" opacity="0.6"/>
  <circle cx="270" cy="165" r="2" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="300" cy="180" r="1.8" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="195" cy="195" r="1.5" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="310" cy="200" r="1.5" fill="url(#nodeGrad)" opacity="0.4"/>

  <!-- Left eye -->
  <ellipse cx="210" cy="250" rx="28" ry="18" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="210" cy="250" rx="18" ry="12" fill="none" stroke="#7ee8fa" stroke-width="0.6" opacity="0.4"/>
  <circle cx="210" cy="250" r="10" fill="url(#eyeGrad)" opacity="0.8" filter="url(#glow)"/>
  <circle cx="210" cy="250" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="213" cy="247" r="2" fill="#ffffff" opacity="1"/>

  <!-- Right eye -->
  <ellipse cx="290" cy="250" rx="28" ry="18" fill="none" stroke="#4ecdc4" stroke-width="1.2" opacity="0.7"/>
  <ellipse cx="290" cy="250" rx="18" ry="12" fill="none" stroke="#7ee8fa" stroke-width="0.6" opacity="0.4"/>
  <circle cx="290" cy="250" r="10" fill="url(#eyeGrad)" opacity="0.8" filter="url(#glow)"/>
  <circle cx="290" cy="250" r="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="293" cy="247" r="2" fill="#ffffff" opacity="1"/>

  <!-- Eye detail - subtle digital lines -->
  <line x1="182" y1="250" x2="175" y2="250" stroke="#4ecdc4" stroke-width="0.5" opacity="0.4"/>
  <line x1="318" y1="250" x2="325" y2="250" stroke="#4ecdc4" stroke-width="0.5" opacity="0.4"/>

  <!-- Nose - minimal geometric -->
  <line x1="250" y1="265" x2="248" y2="305" stroke="#4ecdc4" stroke-width="0.8" opacity="0.4"/>
  <path d="M 240 310 Q 250 318, 260 310" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.5"/>

  <!-- Mouth - subtle, thoughtful -->
  <path d="M 220 355 Q 235 362, 250 360 Q 265 362, 280 355" 
        fill="none" stroke="url(#mouthGrad)" stroke-width="1.5" opacity="0.7"/>

  <!-- Neural network - cheeks -->
  <line x1="185" y1="280" x2="195" y2="305" stroke="#4ecdc4" stroke-width="0.4" opacity="0.25"/>
  <line x1="195" y1="305" x2="210" y2="320" stroke="#4ecdc4" stroke-width="0.4" opacity="0.25"/>
  <line x1="315" y1="280" x2="305" y2="305" stroke="#4ecdc4" stroke-width="0.4" opacity="0.25"/>
  <line x1="305" y1="305" x2="290" y2="320" stroke="#4ecdc4" stroke-width="0.4" opacity="0.25"/>

  <!-- Cheek nodes -->
  <circle cx="185" cy="280" r="1.2" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="195" cy="305" r="1" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="315" cy="280" r="1.2" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="305" cy="305" r="1" fill="#4ecdc4" opacity="0.3"/>

  <!-- Neural network - chin area -->
  <line x1="230" y1="380" x2="250" y2="390" stroke="#4ecdc4" stroke-width="0.4" opacity="0.2"/>
  <line x1="270" y1="380" x2="250" y2="390" stroke="#4ecdc4" stroke-width="0.4" opacity="0.2"/>
  <circle cx="230" cy="380" r="1" fill="#4ecdc4" opacity="0.25"/>
  <circle cx="270" cy="380" r="1" fill="#4ecdc4" opacity="0.25"/>
  <circle cx="250" cy="390" r="1.2" fill="#4ecdc4" opacity="0.3"/>

  <!-- Side neural connections -->
  <line x1="145" y1="220" x2="120" y2="200" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <line x1="120" y1="200" x2="100" y2="180" stroke="url(#lineGrad)" stroke-width="0.5" opacity="0.2"/>
  <line x1="145" y1="220" x2="115" y2="230" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <line x1="115" y1="230" x2="90" y2="240" stroke="url(#lineGrad)" stroke-width="0.5" opacity="0.2"/>

  <line x1="355" y1="220" x2="380" y2="200" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <line x1="380" y1="200" x2="400" y2="180" stroke="url(#lineGrad)" stroke-width="0.5" opacity="0.2"/>
  <line x1="355" y1="220" x2="385" y2="230" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <line x1="385" y1="230" x2="410" y2="240" stroke="url(#lineGrad)" stroke-width="0.5" opacity="0.2"/>

  <!-- Side nodes -->
  <circle cx="120" cy="200" r="2" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="100" cy="180" r="1.5" fill="url(#nodeGrad)" opacity="0.3"/>
  <circle cx="115" cy="230" r="1.8" fill="url(#nodeGrad)" opacity="0.35"/>
  <circle cx="90" cy="240" r="1.2" fill="url(#nodeGrad)" opacity="0.25"/>
  <circle cx="380" cy="200" r="2" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="400" cy="180" r="1.5" fill="url(#nodeGrad)" opacity="0.3"/>
  <circle cx="385" cy="230" r="1.8" fill="url(#nodeGrad)" opacity="0.35"/>
  <circle cx="410" cy="240" r="1.2" fill="url(#nodeGrad)" opacity="0.25"/>

  <!-- Top nodes -->
  <circle cx="220" cy="60" r="2" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="280" cy="60" r="2" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="250" cy="55" r="2.5" fill="url(#nodeGrad)" opacity="0.5"/>
  <circle cx="250" cy="90" r="3" fill="url(#nodeGrad)" opacity="0.6" filter="url(#glow)"/>

  <!-- Data streams flowing out -->
  <path d="M 100 180 Q 80 160, 60 150" fill="none" stroke="#4ecdc4" stroke-width="0.4" opacity="0.2"/>
  <path d="M 90 240 Q 70 245, 50 250" fill="none" stroke="#4ecdc4" stroke-width="0.4" opacity="0.15"/>
  <path d="M 400 180 Q 420 160, 440 150" fill="none" stroke="#4ecdc4" stroke-width="0.4" opacity="0.2"/>
  <path d="M 410 240 Q 430 245, 450 250" fill="none" stroke="#4ecdc4" stroke-width="0.4" opacity="0.15"/>

  <!-- Bottom neural extensions -->
  <line x1="250" y1="425" x2="250" y2="460" stroke="url(#lineGrad)" stroke-width="0.8" opacity="0.4"/>
  <line x1="250" y1="460" x2="230" y2="490" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <line x1="250" y1="460" x2="270" y2="490" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <line x1="250" y1="460" x2="250" y2="495" stroke="url(#lineGrad)" stroke-width="0.6" opacity="0.3"/>
  <circle cx="250" cy="460" r="2" fill="url(#nodeGrad)" opacity="0.4"/>
  <circle cx="230" cy="490" r="1.5" fill="url(#nodeGrad)" opacity="0.3"/>
  <circle cx="270" cy="490" r="1.5" fill="url(#nodeGrad)" opacity="0.3"/>
  <circle cx="250" cy="495" r="1.5" fill="url(#nodeGrad)" opacity="0.3"/>

  <!-- Subtle ring around face -->
  <ellipse cx="250" cy="270" rx="155" ry="185" fill="none" stroke="#4ecdc4" stroke-width="0.3" opacity="0.15" stroke-dasharray="4 8"/>
  <ellipse cx="250" cy="270" rx="175" ry="210" fill="none" stroke="#4ecdc4" stroke-width="0.2" opacity="0.08" stroke-dasharray="3 12"/>

  <!-- Small decorative text-like elements suggesting language -->
  <g opacity="0.15" fill="#7ee8fa" font-family="monospace" font-size="6">
    <text x="55" y="350">0110</text>
    <text x="430" y="340">1001</text>
    <text x="70" y="420">1100</text>
    <text x="420" y="410">0111</text>
  </g>
</svg>