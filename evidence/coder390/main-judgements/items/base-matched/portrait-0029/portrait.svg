<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#c8c8d0"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Background neural network pattern -->
  <g opacity="0.15" stroke="#4fc3f7" stroke-width="0.5" fill="none">
    <line x1="50" y1="80" x2="120" y2="40"/>
    <line x1="120" y1="40" x2="200" y2="70"/>
    <line x1="200" y1="70" x2="280" y2="35"/>
    <line x1="280" y1="35" x2="350" y2="90"/>
    <line x1="50" y1="420" x2="130" y2="460"/>
    <line x1="130" y1="460" x2="220" y2="430"/>
    <line x1="220" y1="430" x2="320" y2="470"/>
    <line x1="320" y1="470" x2="370" y2="400"/>
    <line x1="30" y1="250" x2="80" y2="200"/>
    <line x1="320" y1="180" x2="370" y2="250"/>
    <line x1="30" y1="300" x2="70" y2="350"/>
    <line x1="330" y1="300" x2="370" y2="350"/>
  </g>
  <g opacity="0.2" fill="#4fc3f7">
    <circle cx="50" cy="80" r="3"/>
    <circle cx="120" cy="40" r="2.5"/>
    <circle cx="200" cy="70" r="2"/>
    <circle cx="280" cy="35" r="3"/>
    <circle cx="350" cy="90" r="2.5"/>
    <circle cx="50" cy="420" r="2"/>
    <circle cx="130" cy="460" r="3"/>
    <circle cx="220" cy="430" r="2.5"/>
    <circle cx="320" cy="470" r="2"/>
    <circle cx="370" cy="400" r="3"/>
    <circle cx="30" cy="250" r="2.5"/>
    <circle cx="80" cy="200" r="2"/>
    <circle cx="320" cy="180" r="2"/>
    <circle cx="370" cy="250" r="2.5"/>
    <circle cx="30" cy="300" r="2"/>
    <circle cx="70" cy="350" r="2.5"/>
    <circle cx="330" cy="300" r="2"/>
    <circle cx="370" cy="350" r="2.5"/>
  </g>

  <!-- Neck -->
  <rect x="175" y="340" width="50" height="50" rx="10" fill="#b0b0b8"/>

  <!-- Shoulder/body hint -->
  <path d="M 100 500 Q 100 420 175 400 L 225 400 Q 300 420 300 500 Z" fill="#2a2a4a" stroke="#3a3a5a" stroke-width="1"/>
  <!-- Collar accent -->
  <path d="M 175 400 Q 200 430 225 400" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>

  <!-- Head -->
  <ellipse cx="200" cy="240" rx="110" ry="130" fill="url(#faceGrad)" stroke="#a0a0a8" stroke-width="1.5"/>

  <!-- Ear pieces / headband -->
  <rect x="78" y="210" width="18" height="50" rx="8" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <rect x="304" y="210" width="18" height="50" rx="8" fill="#2a2a4a" stroke="#4fc3f7" stroke-width="1.5"/>
  <line x1="96" y1="215" x2="96" y2="255" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>
  <line x1="304" y1="215" x2="304" y2="255" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>

  <!-- Forehead accent line -->
  <path d="M 140 170 Q 200 155 260 170" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.4"/>

  <!-- Eyes -->
  <g filter="url(#glow)">
    <!-- Left eye -->
    <ellipse cx="155" cy="235" rx="28" ry="30" fill="#1a1a2e"/>
    <ellipse cx="155" cy="235" rx="22" ry="24" fill="url(#eyeGrad)" opacity="0.9"/>
    <ellipse cx="155" cy="235" rx="12" ry="14" fill="#0d47a1"/>
    <ellipse cx="155" cy="235" rx="6" ry="7" fill="#0a0a1a"/>
    <circle cx="148" cy="227" r="4" fill="white" opacity="0.8"/>
    <circle cx="160" cy="240" r="2" fill="white" opacity="0.4"/>

    <!-- Right eye -->
    <ellipse cx="245" cy="235" rx="28" ry="30" fill="#1a1a2e"/>
    <ellipse cx="245" cy="235" rx="22" ry="24" fill="url(#eyeGrad)" opacity="0.9"/>
    <ellipse cx="245" cy="235" rx="12" ry="14" fill="#0d47a1"/>
    <ellipse cx="245" cy="235" rx="6" ry="7" fill="#0a0a1a"/>
    <circle cx="238" cy="227" r="4" fill="white" opacity="0.8"/>
    <circle cx="250" cy="240" r="2" fill="white" opacity="0.4"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 125 198 Q 155 188 180 195" fill="none" stroke="#808090" stroke-width="3" stroke-linecap="round"/>
  <path d="M 220 195 Q 245 188 275 198" fill="none" stroke="#808090" stroke-width="3" stroke-linecap="round"/>

  <!-- Nose (subtle) -->
  <path d="M 198 260 Q 200 275 198 280" fill="none" stroke="#a0a0a8" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Mouth (gentle smile) -->
  <path d="M 165 305 Q 185 325 200 322 Q 215 325 235 305" fill="none" stroke="#808090" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cheek accents (subtle) -->
  <ellipse cx="130" cy="280" rx="15" ry="8" fill="#4fc3f7" opacity="0.08"/>
  <ellipse cx="270" cy="280" rx="15" ry="8" fill="#7c4dff" opacity="0.08"/>

  <!-- Circuit traces on face -->
  <g stroke="#4fc3f7" stroke-width="0.8" fill="none" opacity="0.3">
    <path d="M 120 200 L 120 180 L 140 180"/>
    <path d="M 280 200 L 280 180 L 260 180"/>
    <path d="M 110 270 L 130 270 L 130 290"/>
    <path d="M 290 270 L 270 270 L 270 290"/>
  </g>
  <g fill="#4fc3f7" opacity="0.4">
    <circle cx="140" cy="180" r="2"/>
    <circle cx="260" cy="180" r="2"/>
    <circle cx="130" cy="290" r="2"/>
    <circle cx="270" cy="290" r="2"/>
  </g>

  <!-- Floating elements around head -->
  <g filter="url(#softGlow)">
    <!-- Left side -->
    <circle cx="60" cy="160" r="4" fill="#4fc3f7" opacity="0.6"/>
    <rect x="45" y="300" width="20" height="20" rx="3" fill="none" stroke="#7c4dff" stroke-width="1" opacity="0.4" transform="rotate(15, 55, 310)"/>
    <text x="50" y="145" font-family="monospace" font-size="10" fill="#4fc3f7" opacity="0.5">0</text>
    <text x="38" y="325" font-family="monospace" font-size="10" fill="#7c4dff" opacity="0.4">1</text>

    <!-- Right side -->
    <circle cx="340" cy="150" r="3" fill="#7c4dff" opacity="0.5"/>
    <rect x="330" y="280" width="16" height="16" rx="2" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4" transform="rotate(-10, 338, 288)"/>
    <text x="340" y="175" font-family="monospace" font-size="10" fill="#7c4dff" opacity="0.5">1</text>
    <text x="335" y="305" font-family="monospace" font-size="10" fill="#4fc3f7" opacity="0.4">0</text>
  </g>

  <!-- Top antenna -->
  <line x1="200" y1="110" x2="200" y2="85" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
  <circle cx="200" cy="80" r="6" fill="none" stroke="#4fc3f7" stroke-width="2" filter="url(#glow)"/>
  <circle cx="200" cy="80" r="2.5" fill="#4fc3f7"/>

  <!-- Subtle ring around head -->
  <ellipse cx="200" cy="240" rx="125" ry="140" fill="none" stroke="url(#accent)" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 6"/>
</svg>