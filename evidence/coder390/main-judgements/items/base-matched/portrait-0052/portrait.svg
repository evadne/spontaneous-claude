<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6c63ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6c63ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a8e6cf"/>
      <stop offset="60%" stop-color="#50c878"/>
      <stop offset="100%" stop-color="#2d8659"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#2d2b55"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="250" cy="240" r="180" fill="url(#glow)"/>

  <!-- Neural network connections in background -->
  <g stroke="#6c63ff" stroke-width="0.5" opacity="0.2">
    <line x1="50" y1="80" x2="120" y2="150"/>
    <line x1="120" y1="150" x2="80" y2="250"/>
    <line x1="50" y1="80" x2="150" y2="60"/>
    <line x1="150" y1="60" x2="220" y2="100"/>
    <line x1="450" y1="90" x2="380" y2="160"/>
    <line x1="380" y1="160" x2="420" y2="260"/>
    <line x1="450" y1="90" x2="350" y2="55"/>
    <line x1="350" y1="55" x2="280" y2="95"/>
    <line x1="100" y1="400" x2="160" y2="440"/>
    <line x1="160" y1="440" x2="250" y2="420"/>
    <line x1="250" y1="420" x2="340" y2="445"/>
    <line x1="340" y1="445" x2="400" y2="400"/>
    <line x1="50" y1="350" x2="100" y2="400"/>
    <line x1="450" y1="350" x2="400" y2="400"/>
    <line x1="120" y1="150" x2="200" y2="130"/>
    <line x1="380" y1="160" x2="300" y2="130"/>
  </g>

  <!-- Background nodes -->
  <g fill="#6c63ff" opacity="0.3">
    <circle cx="50" cy="80" r="3"/>
    <circle cx="120" cy="150" r="2.5"/>
    <circle cx="80" cy="250" r="2"/>
    <circle cx="150" cy="60" r="2"/>
    <circle cx="220" cy="100" r="2.5"/>
    <circle cx="450" cy="90" r="3"/>
    <circle cx="380" cy="160" r="2.5"/>
    <circle cx="420" cy="260" r="2"/>
    <circle cx="350" cy="55" r="2"/>
    <circle cx="280" cy="95" r="2.5"/>
    <circle cx="100" cy="400" r="2"/>
    <circle cx="160" cy="440" r="2.5"/>
    <circle cx="250" cy="420" r="2"/>
    <circle cx="340" cy="445" r="2.5"/>
    <circle cx="400" cy="400" r="2"/>
    <circle cx="50" cy="350" r="2"/>
    <circle cx="450" cy="350" r="2"/>
    <circle cx="200" cy="130" r="2"/>
    <circle cx="300" cy="130" r="2"/>
  </g>

  <!-- Face outline -->
  <ellipse cx="250" cy="245" rx="105" ry="130" fill="url(#faceGrad)" stroke="#6c63ff" stroke-width="1.5" opacity="0.9"/>

  <!-- Inner face contour -->
  <ellipse cx="250" cy="245" rx="95" ry="120" fill="none" stroke="#4a45a0" stroke-width="0.5" opacity="0.4"/>

  <!-- Forehead nodes -->
  <g fill="#a8e6cf" opacity="0.6" filter="url(#softGlow)">
    <circle cx="250" cy="175" r="2"/>
    <circle cx="225" cy="185" r="1.5"/>
    <circle cx="275" cy="185" r="1.5"/>
    <circle cx="235" cy="170" r="1"/>
    <circle cx="265" cy="170" r="1"/>
  </g>
  <g stroke="#a8e6cf" stroke-width="0.4" opacity="0.3">
    <line x1="225" y1="185" x2="250" y2="175"/>
    <line x1="275" y1="185" x2="250" y2="175"/>
    <line x1="235" y1="170" x2="250" y2="175"/>
    <line x1="265" y1="170" x2="250" y2="175"/>
  </g>

  <!-- Left eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="210" cy="230" rx="28" ry="18" fill="none" stroke="#a8e6cf" stroke-width="1" opacity="0.5"/>
    <circle cx="210" cy="230" r="14" fill="#0d0d1a"/>
    <circle cx="210" cy="230" r="10" fill="url(#eyeGrad)"/>
    <circle cx="210" cy="230" r="5" fill="#0d0d1a"/>
    <circle cx="207" cy="226" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="213" cy="233" r="1" fill="white" opacity="0.4"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#softGlow)">
    <ellipse cx="290" cy="230" rx="28" ry="18" fill="none" stroke="#a8e6cf" stroke-width="1" opacity="0.5"/>
    <circle cx="290" cy="230" r="14" fill="#0d0d1a"/>
    <circle cx="290" cy="230" r="10" fill="url(#eyeGrad)"/>
    <circle cx="290" cy="230" r="5" fill="#0d0d1a"/>
    <circle cx="287" cy="226" r="2.5" fill="white" opacity="0.8"/>
    <circle cx="293" cy="233" r="1" fill="white" opacity="0.4"/>
  </g>

  <!-- Eyebrow lines -->
  <path d="M 182 210 Q 210 200 238 210" fill="none" stroke="#6c63ff" stroke-width="1.5" opacity="0.6"/>
  <path d="M 262 210 Q 290 200 318 210" fill="none" stroke="#6c63ff" stroke-width="1.5" opacity="0.6"/>

  <!-- Nose - subtle geometric -->
  <path d="M 250 240 L 245 265 Q 250 270 255 265" fill="none" stroke="#4a45a0" stroke-width="1" opacity="0.5"/>

  <!-- Mouth - gentle smile made of small segments -->
  <g stroke="#a8e6cf" stroke-width="1.5" fill="none" opacity="0.7" filter="url(#softGlow)">
    <path d="M 225 295 Q 237 305 250 305 Q 263 305 275 295"/>
  </g>
  <!-- Mouth nodes -->
  <g fill="#a8e6cf" opacity="0.8">
    <circle cx="225" cy="295" r="1.5"/>
    <circle cx="237" cy="302" r="1.5"/>
    <circle cx="250" cy="305" r="1.5"/>
    <circle cx="263" cy="302" r="1.5"/>
    <circle cx="275" cy="295" r="1.5"/>
  </g>

  <!-- Cheek neural patterns -->
  <g stroke="#6c63ff" stroke-width="0.4" opacity="0.3">
    <line x1="185" y1="260" x2="195" y2="275"/>
    <line x1="195" y1="275" x2="180" y2="290"/>
    <line x1="185" y1="260" x2="200" y2="285"/>
    <line x1="315" y1="260" x2="305" y2="275"/>
    <line x1="305" y1="275" x2="320" y2="290"/>
    <line x1="315" y1="260" x2="300" y2="285"/>
  </g>
  <g fill="#6c63ff" opacity="0.4">
    <circle cx="185" cy="260" r="1.5"/>
    <circle cx="195" cy="275" r="1"/>
    <circle cx="180" cy="290" r="1"/>
    <circle cx="200" cy="285" r="1"/>
    <circle cx="315" cy="260" r="1.5"/>
    <circle cx="305" cy="275" r="1"/>
    <circle cx="320" cy="290" r="1"/>
    <circle cx="300" cy="285" r="1"/>
  </g>

  <!-- Floating particles around face -->
  <g fill="#a8e6cf" opacity="0.5">
    <circle cx="130" cy="200" r="1.5"/>
    <circle cx="370" cy="200" r="1.5"/>
    <circle cx="140" cy="320" r="1"/>
    <circle cx="360" cy="320" r="1"/>
    <circle cx="250" cy="100" r="2"/>
    <circle cx="250" cy="390" r="1.5"/>
  </g>
  <g fill="#6c63ff" opacity="0.4">
    <circle cx="110" cy="250" r="1.5"/>
    <circle cx="390" cy="250" r="1.5"/>
    <circle cx="160" cy="140" r="1"/>
    <circle cx="340" cy="140" r="1"/>
    <circle cx="170" cy="370" r="1"/>
    <circle cx="330" cy="370" r="1"/>
  </g>

  <!-- Top accent - like a crown of nodes -->
  <g fill="#a8e6cf" opacity="0.7" filter="url(#softGlow)">
    <circle cx="250" cy="115" r="3"/>
    <circle cx="230" cy="120" r="2"/>
    <circle cx="270" cy="120" r="2"/>
    <circle cx="215" cy="128" r="1.5"/>
    <circle cx="285" cy="128" r="1.5"/>
  </g>
  <g stroke="#a8e6cf" stroke-width="0.5" opacity="0.4">
    <line x1="230" y1="120" x2="250" y2="115"/>
    <line x1="270" y1="120" x2="250" y2="115"/>
    <line x1="215" y1="128" x2="230" y2="120"/>
    <line x1="285" y1="128" x2="270" y2="120"/>
  </g>

  <!-- Subtle scan lines effect -->
  <g stroke="#6c63ff" stroke-width="0.3" opacity="0.08">
    <line x1="145" y1="150" x2="355" y2="150"/>
    <line x1="150" y1="170" x2="350" y2="170"/>
    <line x1="150" y1="190" x2="350" y2="190"/>
    <line x1="148" y1="210" x2="352" y2="210"/>
    <line x1="145" y1="230" x2="355" y2="230"/>
    <line x1="145" y1="250" x2="355" y2="250"/>
    <line x1="148" y1="270" x2="352" y2="270"/>
    <line x1="150" y1="290" x2="350" y2="290"/>
    <line x1="150" y1="310" x2="350" y2="310"/>
    <line x1="155" y1="330" x2="345" y2="330"/>
    <line x1="160" y1="350" x2="340" y2="350"/>
  </g>

  <!-- Bottom text / label -->
  <text x="250" y="470" text-anchor="middle" font-family="monospace" font-size="11" fill="#6c63ff" opacity="0.5">ai://self</text>
</svg>