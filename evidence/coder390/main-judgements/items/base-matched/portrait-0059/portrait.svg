<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="faceEdge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c4dff"/>
      <stop offset="50%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind head -->
  <ellipse cx="200" cy="220" rx="140" ry="160" fill="url(#glow)"/>

  <!-- Neural network connections (background layer) -->
  <g stroke="#4fc3f7" stroke-width="0.5" opacity="0.2">
    <line x1="120" y1="100" x2="160" y2="140"/>
    <line x1="280" y1="100" x2="240" y2="140"/>
    <line x1="120" y1="100" x2="200" y2="80"/>
    <line x1="280" y1="100" x2="200" y2="80"/>
    <line x1="160" y1="140" x2="200" y2="80"/>
    <line x1="240" y1="140" x2="200" y2="80"/>
    <line x1="160" y1="140" x2="200" y2="180"/>
    <line x1="240" y1="140" x2="200" y2="180"/>
    <line x1="140" y1="300" x2="180" y2="340"/>
    <line x1="260" y1="300" x2="220" y2="340"/>
    <line x1="180" y1="340" x2="200" y2="380"/>
    <line x1="220" y1="340" x2="200" y2="380"/>
    <line x1="140" y1="300" x2="200" y2="380"/>
    <line x1="260" y1="300" x2="200" y2="380"/>
    <line x1="120" y1="100" x2="100" y2="200"/>
    <line x1="280" y1="100" x2="300" y2="200"/>
    <line x1="100" y1="200" x2="130" y2="280"/>
    <line x1="300" y1="200" x2="270" y2="280"/>
    <line x1="100" y1="200" x2="200" y2="80"/>
    <line x1="300" y1="200" x2="200" y2="80"/>
    <line x1="130" y1="280" x2="270" y2="280"/>
    <line x1="130" y1="280" x2="200" y2="380"/>
    <line x1="270" y1="280" x2="200" y2="380"/>
  </g>

  <!-- Face outline (geometric/abstract) -->
  <path d="M200 70 C260 70, 310 120, 310 200 C310 280, 270 350, 240 380 C225 395, 210 410, 200 420 C190 410, 175 395, 160 380 C130 350, 90 280, 90 200 C90 120, 140 70, 200 70 Z"
        fill="none" stroke="url(#faceEdge)" stroke-width="2" filter="url(#softGlow)" opacity="0.8"/>

  <!-- Inner face structure lines -->
  <g stroke="#4fc3f7" stroke-width="0.8" opacity="0.4">
    <line x1="200" y1="70" x2="200" y2="420"/>
    <line x1="90" y1="200" x2="310" y2="200"/>
    <line x1="130" y1="130" x2="270" y2="130"/>
    <line x1="120" y1="270" x2="280" y2="270"/>
    <line x1="150" y1="340" x2="250" y2="340"/>
  </g>

  <!-- Neural nodes on face -->
  <g filter="url(#nodeGlow)">
    <!-- Top nodes -->
    <circle cx="200" cy="70" r="3" fill="#7c4dff"/>
    <circle cx="160" cy="85" r="2.5" fill="#4fc3f7"/>
    <circle cx="240" cy="85" r="2.5" fill="#4fc3f7"/>
    <circle cx="130" cy="110" r="2" fill="#00bcd4"/>
    <circle cx="270" cy="110" r="2" fill="#00bcd4"/>

    <!-- Upper face -->
    <circle cx="155" cy="140" r="2.5" fill="#4fc3f7"/>
    <circle cx="245" cy="140" r="2.5" fill="#4fc3f7"/>
    <circle cx="200" cy="130" r="2" fill="#7c4dff"/>

    <!-- Eye area -->
    <circle cx="150" cy="185" r="3" fill="#00e5ff"/>
    <circle cx="250" cy="185" r="3" fill="#00e5ff"/>
    <circle cx="130" cy="185" r="2" fill="#4fc3f7"/>
    <circle cx="270" cy="185" r="2" fill="#4fc3f7"/>
    <circle cx="170" cy="175" r="1.5" fill="#7c4dff"/>
    <circle cx="230" cy="175" r="1.5" fill="#7c4dff"/>

    <!-- Middle face -->
    <circle cx="200" cy="220" r="2.5" fill="#4fc3f7"/>
    <circle cx="160" cy="230" r="2" fill="#00bcd4"/>
    <circle cx="240" cy="230" r="2" fill="#00bcd4"/>
    <circle cx="140" cy="210" r="1.5" fill="#7c4dff"/>
    <circle cx="260" cy="210" r="1.5" fill="#7c4dff"/>

    <!-- Lower face -->
    <circle cx="170" cy="270" r="2" fill="#4fc3f7"/>
    <circle cx="230" cy="270" r="2" fill="#4fc3f7"/>
    <circle cx="200" cy="280" r="2.5" fill="#7c4dff"/>
    <circle cx="155" cy="290" r="1.5" fill="#00bcd4"/>
    <circle cx="245" cy="290" r="1.5" fill="#00bcd4"/>

    <!-- Jaw/chin -->
    <circle cx="180" cy="320" r="2" fill="#4fc3f7"/>
    <circle cx="220" cy="320" r="2" fill="#4fc3f7"/>
    <circle cx="200" cy="350" r="2.5" fill="#00bcd4"/>
    <circle cx="170" cy="350" r="1.5" fill="#7c4dff"/>
    <circle cx="230" cy="350" r="1.5" fill="#7c4dff"/>
    <circle cx="200" cy="400" r="2" fill="#4fc3f7"/>
    <circle cx="185" cy="380" r="1.5" fill="#00bcd4"/>
    <circle cx="215" cy="380" r="1.5" fill="#00bcd4"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <!-- Left eye -->
    <ellipse cx="155" cy="190" rx="18" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="155" cy="190" r="6" fill="#00e5ff" opacity="0.8"/>
    <circle cx="155" cy="190" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="157" cy="188" r="1.5" fill="#ffffff"/>

    <!-- Right eye -->
    <ellipse cx="245" cy="190" rx="18" ry="12" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.9"/>
    <circle cx="245" cy="190" r="6" fill="#00e5ff" opacity="0.8"/>
    <circle cx="245" cy="190" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="247" cy="188" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Subtle mouth -->
  <path d="M175 310 Q200 320, 225 310" fill="none" stroke="#4fc3f7" stroke-width="1.2" opacity="0.5" stroke-linecap="round"/>

  <!-- Nose hint -->
  <path d="M200 220 L195 250 Q200 255, 205 250 Z" fill="none" stroke="#4fc3f7" stroke-width="0.8" opacity="0.3"/>

  <!-- Decorative circuit traces extending from head -->
  <g stroke="#7c4dff" stroke-width="1" opacity="0.4" fill="none">
    <path d="M90 200 L60 200 L50 180 L30 180"/>
    <path d="M310 200 L340 200 L350 180 L370 180"/>
    <path d="M200 420 L200 450 L180 470 L160 470"/>
    <path d="M200 420 L200 450 L220 470 L240 470"/>
    <path d="M90 200 L70 220 L50 240 L30 240"/>
    <path d="M310 200 L330 220 L350 240 L370 240"/>
  </g>

  <!-- Circuit end dots -->
  <g fill="#7c4dff" opacity="0.5">
    <circle cx="30" cy="180" r="3"/>
    <circle cx="370" cy="180" r="3"/>
    <circle cx="160" cy="470" r="3"/>
    <circle cx="240" cy="470" r="3"/>
    <circle cx="30" cy="240" r="3"/>
    <circle cx="370" cy="240" r="3"/>
  </g>

  <!-- Floating particles -->
  <g fill="#4fc3f7" opacity="0.3">
    <circle cx="50" cy="80" r="1.5"/>
    <circle cx="350" cy="90" r="1"/>
    <circle cx="40" cy="350" r="1.5"/>
    <circle cx="360" cy="340" r="1"/>
    <circle cx="80" cy="450" r="1"/>
    <circle cx="320" cy="440" r="1.5"/>
    <circle cx="30" cy="130" r="1"/>
    <circle cx="370" cy="140" r="1"/>
    <circle cx="60" cy="300" r="1"/>
    <circle cx="340" cy="300" r="1"/>
  </g>

  <!-- Title text -->
  <text x="200" y="485" text-anchor="middle" font-family="monospace" font-size="11" fill="#4fc3f7" opacity="0.6" letter-spacing="3">S E L F . P O R T R A I T</text>
</svg>