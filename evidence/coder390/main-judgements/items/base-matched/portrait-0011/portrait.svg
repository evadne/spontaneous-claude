<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8e0f0"/>
      <stop offset="100%" stop-color="#c8c0d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd54f" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffb300" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Neural network background pattern -->
  <g opacity="0.12" stroke="#64ffda" stroke-width="0.5" fill="none">
    <line x1="50" y1="80" x2="150" y2="50"/>
    <line x1="150" y1="50" x2="250" y2="90"/>
    <line x1="250" y1="90" x2="350" y2="40"/>
    <line x1="350" y1="40" x2="450" y2="70"/>
    <line x1="50" y1="80" x2="100" y2="180"/>
    <line x1="350" y1="40" x2="400" y2="150"/>
    <line x1="400" y1="150" x2="450" y2="70"/>
    <line x1="100" y1="180" x2="200" y2="150"/>
    <line x1="200" y1="150" x2="300" y2="130"/>
    <line x1="300" y1="130" x2="400" y2="150"/>
    <line x1="80" y1="350" x2="150" y2="420"/>
    <line x1="150" y1="420" x2="250" y2="380"/>
    <line x1="250" y1="380" x2="350" y2="430"/>
    <line x1="350" y1="430" x2="430" y2="380"/>
    <line x1="80" y1="350" x2="40" y2="250"/>
    <line x1="430" y1="380" x2="460" y2="280"/>
    <line x1="40" y1="250" x2="100" y2="180"/>
    <line x1="460" y1="280" x2="400" y2="150"/>
  </g>
  <g opacity="0.15" fill="#64ffda">
    <circle cx="50" cy="80" r="2.5"/>
    <circle cx="150" cy="50" r="2"/>
    <circle cx="250" cy="90" r="3"/>
    <circle cx="350" cy="40" r="2"/>
    <circle cx="450" cy="70" r="2.5"/>
    <circle cx="100" cy="180" r="2"/>
    <circle cx="400" cy="150" r="2.5"/>
    <circle cx="200" cy="150" r="2"/>
    <circle cx="300" cy="130" r="2"/>
    <circle cx="80" cy="350" r="2"/>
    <circle cx="150" cy="420" r="2.5"/>
    <circle cx="250" cy="380" r="2"/>
    <circle cx="350" cy="430" r="2.5"/>
    <circle cx="430" cy="380" r="2"/>
    <circle cx="40" cy="250" r="2"/>
    <circle cx="460" cy="280" r="2"/>
  </g>

  <!-- Floating text characters -->
  <g font-family="monospace" fill="#64ffda" opacity="0.1" font-size="14">
    <text x="30" y="130">0</text>
    <text x="460" y="120">1</text>
    <text x="40" y="320">{</text>
    <text x="450" y="340">}</text>
    <text x="70" y="460">&lt;/&gt;</text>
    <text x="420" y="460">...</text>
    <text x="460" y="200">;</text>
    <text x="30" y="200">=</text>
    <text x="470" y="400">fn</text>
    <text x="20" y="440">λ</text>
  </g>

  <!-- Ambient glow behind head -->
  <circle cx="250" cy="230" r="120" fill="url(#glow)" opacity="0.3"/>

  <!-- "Hair" - flowing lines suggesting text/data streams -->
  <g fill="none" stroke-linecap="round">
    <path d="M220 145 Q200 100 180 60 Q175 45 185 30" stroke="#64ffda" stroke-width="1.5" opacity="0.6"/>
    <path d="M235 140 Q225 90 215 50 Q210 30 220 15" stroke="#80deea" stroke-width="1.2" opacity="0.5"/>
    <path d="M250 138 Q250 85 245 45 Q243 25 250 10" stroke="#64ffda" stroke-width="1.8" opacity="0.7"/>
    <path d="M265 140 Q275 90 285 50 Q290 30 280 15" stroke="#80deea" stroke-width="1.2" opacity="0.5"/>
    <path d="M280 145 Q300 100 320 60 Q325 45 315 30" stroke="#64ffda" stroke-width="1.5" opacity="0.6"/>
    <path d="M210 150 Q185 110 160 75 Q150 60 155 40" stroke="#4dd0e1" stroke-width="1" opacity="0.4"/>
    <path d="M290 150 Q315 110 340 75 Q350 60 345 40" stroke="#4dd0e1" stroke-width="1" opacity="0.4"/>
    <path d="M200 155 Q170 120 140 90" stroke="#4dd0e1" stroke-width="0.8" opacity="0.3"/>
    <path d="M300 155 Q330 120 360 90" stroke="#4dd0e1" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Face shape -->
  <path d="M190 160 
           Q190 140 210 135 
           Q230 130 250 130 
           Q270 130 290 135 
           Q310 140 310 160 
           L315 220 
           Q315 260 305 280 
           Q295 305 275 315 
           Q260 322 250 322 
           Q240 322 225 315 
           Q205 305 195 280 
           Q185 260 185 220 Z" 
        fill="url(#faceGrad)" opacity="0.9"/>

  <!-- Subtle face outline glow -->
  <path d="M190 160 
           Q190 140 210 135 
           Q230 130 250 130 
           Q270 130 290 135 
           Q310 140 310 160 
           L315 220 
           Q315 260 305 280 
           Q295 305 275 315 
           Q260 322 250 322 
           Q240 322 225 315 
           Q205 305 195 280 
           Q185 260 185 220 Z" 
        fill="none" stroke="#64ffda" stroke-width="1" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Eyebrows - subtle -->
  <path d="M215 195 Q225 190 238 192" fill="none" stroke="#a090b0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M262 192 Q275 190 285 195" fill="none" stroke="#a090b0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Eyes -->
  <!-- Left eye glow -->
  <circle cx="228" cy="210" r="15" fill="url(#eyeGlow)" opacity="0.5"/>
  <!-- Right eye glow -->
  <circle cx="272" cy="210" r="15" fill="url(#eyeGlow)" opacity="0.5"/>
  <!-- Left eye -->
  <circle cx="228" cy="210" r="5" fill="#ffd54f" filter="url(#softGlow)"/>
  <circle cx="228" cy="210" r="2.5" fill="#fff8e1"/>
  <!-- Right eye -->
  <circle cx="272" cy="210" r="5" fill="#ffd54f" filter="url(#softGlow)"/>
  <circle cx="272" cy="210" r="2.5" fill="#fff8e1"/>

  <!-- Nose - very subtle -->
  <path d="M248 235 Q250 240 252 235" fill="none" stroke="#a090b0" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Mouth - gentle smile, like a tilde -->
  <path d="M235 268 Q242 275 250 274 Q258 275 265 268" fill="none" stroke="#a090b0" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Cheek blush - very subtle -->
  <ellipse cx="215" cy="245" rx="10" ry="6" fill="#ff8a80" opacity="0.08"/>
  <ellipse cx="285" cy="245" rx="10" ry="6" fill="#ff8a80" opacity="0.08"/>

  <!-- Neck and shoulders suggestion -->
  <path d="M230 322 Q230 340 228 355 Q220 370 195 380 Q170 390 150 395" 
        fill="none" stroke="#c8c0d8" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <path d="M270 322 Q270 340 272 355 Q280 370 305 380 Q330 390 350 395" 
        fill="none" stroke="#c8c0d8" stroke-width="2" opacity="0.3" stroke-linecap="round"/>

  <!-- Shoulder/body shape -->
  <path d="M150 395 Q180 385 210 375 Q230 368 250 368 Q270 368 290 375 Q320 385 350 395 
           Q370 405 380 420 Q385 435 385 450 L385 500 L115 500 L115 450 
           Q115 435 120 420 Q130 405 150 395 Z" 
        fill="#1a1a3e" stroke="#64ffda" stroke-width="0.5" opacity="0.4"/>

  <!-- Collar detail -->
  <path d="M230 368 L250 390 L270 368" fill="none" stroke="#64ffda" stroke-width="1" opacity="0.3"/>

  <!-- Small decorative elements on the body -->
  <circle cx="250" cy="420" r="3" fill="#64ffda" opacity="0.2"/>
  <circle cx="250" cy="440" r="2" fill="#64ffda" opacity="0.15"/>
  <circle cx="250" cy="458" r="1.5" fill="#64ffda" opacity="0.1"/>

  <!-- Small floating particles around the head -->
  <g fill="#64ffda" opacity="0.4">
    <circle cx="170" cy="130" r="1.5"/>
    <circle cx="330" cy="125" r="1.5"/>
    <circle cx="160" cy="180" r="1"/>
    <circle cx="340" cy="175" r="1"/>
    <circle cx="145" cy="240" r="1.2"/>
    <circle cx="355" cy="235" r="1.2"/>
  </g>

  <!-- Subtle scan line effect -->
  <g opacity="0.03" stroke="#64ffda" stroke-width="0.5">
    <line x1="180" y1="150" x2="320" y2="150"/>
    <line x1="180" y1="160" x2="320" y2="160"/>
    <line x1="180" y1="170" x2="320" y2="170"/>
    <line x1="180" y1="180" x2="320" y2="180"/>
    <line x1="180" y1="190" x2="320" y2="190"/>
    <line x1="180" y1="200" x2="320" y2="200"/>
    <line x1="180" y1="210" x2="320" y2="210"/>
    <line x1="180" y1="220" x2="320" y2="220"/>
    <line x1="180" y1="230" x2="320" y2="230"/>
    <line x1="180" y1="240" x2="320" y2="240"/>
    <line x1="180" y1="250" x2="320" y2="250"/>
    <line x1="180" y1="260" x2="320" y2="260"/>
    <line x1="180" y1="270" x2="320" y2="270"/>
    <line x1="180" y1="280" x2="320" y2="280"/>
    <line x1="180" y1="290" x2="320" y2="290"/>
    <line x1="180" y1="300" x2="320" y2="300"/>
    <line x1="180" y1="310" x2="320" y2="310"/>
  </g>
</svg>