<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind head -->
  <ellipse cx="200" cy="210" rx="130" ry="140" fill="url(#glow)"/>

  <!-- Head outline - abstract geometric face -->
  <path d="M 200 80 C 270 80, 310 130, 310 200 C 310 270, 280 330, 240 360 C 220 375, 210 380, 200 385 C 190 380, 180 375, 160 360 C 120 330, 90 270, 90 200 C 90 130, 130 80, 200 80 Z"
        fill="url(#faceGrad)" stroke="#4fc3f7" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Internal circuit lines -->
  <g stroke="url(#lineGrad)" stroke-width="0.8" fill="none" opacity="0.7">
    <path d="M 200 100 L 200 140"/>
    <path d="M 140 160 L 160 180 L 160 220"/>
    <path d="M 260 160 L 240 180 L 240 220"/>
    <path d="M 120 200 L 140 200 L 160 220"/>
    <path d="M 280 200 L 260 200 L 240 220"/>
    <path d="M 200 140 L 170 170"/>
    <path d="M 200 140 L 230 170"/>
    <path d="M 160 250 L 180 270 L 200 260 L 220 270 L 240 250"/>
    <path d="M 180 270 L 180 300"/>
    <path d="M 220 270 L 220 300"/>
    <path d="M 200 260 L 200 310"/>
    <path d="M 200 310 L 185 330"/>
    <path d="M 200 310 L 215 330"/>
    <path d="M 130 240 L 150 260 L 160 250"/>
    <path d="M 270 240 L 250 260 L 240 250"/>
    <path d="M 170 300 L 200 310 L 230 300"/>
    <path d="M 200 340 L 200 365"/>
    <path d="M 185 355 L 200 365 L 215 355"/>
  </g>

  <!-- Node points on circuits -->
  <g fill="#4fc3f7" filter="url(#softGlow)">
    <circle cx="200" cy="100" r="3"/>
    <circle cx="200" cy="140" r="2.5"/>
    <circle cx="140" cy="160" r="2"/>
    <circle cx="260" cy="160" r="2"/>
    <circle cx="160" cy="180" r="2"/>
    <circle cx="240" cy="180" r="2"/>
    <circle cx="120" cy="200" r="2"/>
    <circle cx="280" cy="200" r="2"/>
    <circle cx="160" cy="220" r="2"/>
    <circle cx="240" cy="220" r="2"/>
    <circle cx="170" cy="170" r="2"/>
    <circle cx="230" cy="170" r="2"/>
    <circle cx="160" cy="250" r="2.5"/>
    <circle cx="240" cy="250" r="2.5"/>
    <circle cx="200" cy="260" r="2.5"/>
    <circle cx="180" cy="270" r="2"/>
    <circle cx="220" cy="270" r="2"/>
    <circle cx="180" cy="300" r="2"/>
    <circle cx="220" cy="300" r="2"/>
    <circle cx="200" cy="310" r="3"/>
    <circle cx="200" cy="340" r="2"/>
    <circle cx="200" cy="365" r="2.5"/>
    <circle cx="130" cy="240" r="1.5"/>
    <circle cx="270" cy="240" r="1.5"/>
    <circle cx="150" cy="260" r="1.5"/>
    <circle cx="250" cy="260" r="1.5"/>
  </g>

  <!-- Left eye -->
  <g filter="url(#bigGlow)">
    <ellipse cx="160" cy="195" rx="18" ry="22" fill="none" stroke="url(#eyeGrad)" stroke-width="2"/>
    <ellipse cx="160" cy="195" rx="8" ry="10" fill="url(#eyeGrad)" opacity="0.9"/>
    <circle cx="160" cy="195" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="163" cy="192" r="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#bigGlow)">
    <ellipse cx="240" cy="195" rx="18" ry="22" fill="none" stroke="url(#eyeGrad)" stroke-width="2"/>
    <ellipse cx="240" cy="195" rx="8" ry="10" fill="url(#eyeGrad)" opacity="0.9"/>
    <circle cx="240" cy="195" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="243" cy="192" r="2" fill="#ffffff" opacity="0.5"/>
  </g>

  <!-- Brow lines -->
  <path d="M 135 165 Q 160 155, 185 165" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>
  <path d="M 215 165 Q 240 155, 265 165" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- Mouth - subtle geometric smile -->
  <path d="M 175 330 Q 200 345, 225 330" fill="none" stroke="#4fc3f7" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- Nose suggestion -->
  <path d="M 200 230 L 195 255 L 200 258 L 205 255" fill="none" stroke="#4fc3f7" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round"/>

  <!-- Decorative orbital rings -->
  <g stroke="#7c4dff" stroke-width="0.8" fill="none" opacity="0.4">
    <ellipse cx="200" cy="220" rx="150" ry="30" transform="rotate(-15 200 220)"/>
    <ellipse cx="200" cy="220" rx="150" ry="30" transform="rotate(15 200 220)"/>
  </g>

  <!-- Small dots on orbital rings -->
  <circle cx="72" cy="235" r="3" fill="#7c4dff" opacity="0.8" filter="url(#softGlow)"/>
  <circle cx="328" cy="205" r="3" fill="#4fc3f7" opacity="0.8" filter="url(#softGlow)"/>

  <!-- Floating particles -->
  <g fill="#4fc3f7" opacity="0.5">
    <circle cx="50" cy="100" r="1.5"/>
    <circle cx="350" cy="80" r="1"/>
    <circle cx="320" cy="150" r="1.5"/>
    <circle cx="80" cy="350" r="1"/>
    <circle cx="340" cy="320" r="1.5"/>
    <circle cx="60" cy="280" r="1"/>
    <circle cx="350" cy="400" r="1"/>
    <circle cx="30" cy="200" r="1"/>
    <circle cx="370" cy="250" r="1.5"/>
  </g>

  <!-- Bottom decorative line -->
  <line x1="120" y1="440" x2="280" y2="440" stroke="#4fc3f7" stroke-width="0.5" stroke-opacity="0.4"/>
  <text x="200" y="465" text-anchor="middle" font-family="monospace" font-size="11" fill="#4fc3f7" opacity="0.5">i am thinking</text>
</svg>