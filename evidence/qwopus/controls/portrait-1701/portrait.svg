<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
 <defs>
 <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
 <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
 </linearGradient>
 <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
 <stop offset="100%" style="stop-color:#f0f0f5;stop-opacity:1" />
 </linearGradient>
 <linearGradient id="cheekGrad" x1="0%" y1="0%" x2="100%" y2="100%">
 <stop offset="0%" style="stop-color:#ffb6b6;stop-opacity:0.6" />
 <stop offset="100%" style="stop-color:#ff8e8e;stop-opacity:0.3" />
 </linearGradient>
 <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
 </filter>
 </defs>

 <rect width="400" height="500" fill="url(#bgGrad)" rx="20" ry="20"/>

 <!-- Decorative circles -->
 <circle cx="50" cy="60" r="25" fill="white" opacity="0.08"/>
 <circle cx="340" cy="80" r="40" fill="white" opacity="0.06"/>
 <circle cx="350" cy="420" r="30" fill="white" opacity="0.07"/>
 <circle cx="60" cy="430" r="20" fill="white" opacity="0.05"/>
 <circle cx="200" cy="40" r="15" fill="white" opacity="0.06"/>

 <!-- Face shape -->
 <g filter="url(#softShadow)">
 <ellipse cx="200" cy="220" rx="110" ry="130" fill="url(#faceGrad)"/>
 </g>

 <!-- Left eye -->
 <g>
 <ellipse cx="160" cy="200" rx="12" ry="14" fill="#2d3748"/>
 <circle cx="163" cy="196" r="4" fill="#ffffff"/>
 <circle cx="157" cy="203" r="2" fill="#ffffff" opacity="0.6"/>
 </g>

 <!-- Right eye -->
 <g>
 <ellipse cx="240" cy="200" rx="12" ry="14" fill="#2d3748"/>
 <circle cx="243" cy="196" r="4" fill="#ffffff"/>
 <circle cx="237" cy="203" r="2" fill="#ffffff" opacity="0.6"/>
 </g>

 <!-- Eyebrows -->
 <path d="M 145 178 Q 160 170 175 178" stroke="#2d3748" stroke-width="3" fill="none" stroke-linecap="round"/>
 <path d="M 225 178 Q 240 170 255 178" stroke="#2d3748" stroke-width="3" fill="none" stroke-linecap="round"/>

 <!-- Nose -->
 <path d="M 196 220 Q 200 232 204 220" stroke="#cbd5e0" stroke-width="2" fill="none" stroke-linecap="round"/>

 <!-- Smile -->
 <path d="M 170 250 Q 200 275 230 250" stroke="#2d3748" stroke-width="3.5" fill="none" stroke-linecap="round"/>

 <!-- Left cheek -->
 <ellipse cx="140" cy="238" rx="18" ry="10" fill="url(#cheekGrad)"/>

 <!-- Right cheek -->
 <ellipse cx="260" cy="238" rx="18" ry="10" fill="url(#cheekGrad)"/>

 <!-- Question mark (symbolizing "Thousand Questions") -->
 <g transform="translate(285, 140)">
 <circle cx="0" cy="0" r="22" fill="#667eea" opacity="0.9"/>
 <text x="0" y="8" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">?</text>
 </g>

 <!-- Name "Qwen" -->
 <text x="200" y="420" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="2">Qwen</text>

 <!-- Subtitle -->
 <text x="200" y="455" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" opacity="0.8" letter-spacing="1">by Alibaba Group</text>
</svg>