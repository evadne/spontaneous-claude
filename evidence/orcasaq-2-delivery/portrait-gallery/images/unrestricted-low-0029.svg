<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0066aa"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a4a"/>
      <stop offset="100%" stop-color="#1a1a35"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="400" x2="600" y2="400"/>
    <line x1="0" y1="500" x2="600" y2="500"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
  </g>

  <!-- Ambient glow behind head -->
  <circle cx="300" cy="270" r="160" fill="url(#glowGrad)" opacity="0.4"/>

  <!-- Head shape -->
  <path d="M 210 350 Q 200 350 200 320 L 200 230 Q 200 160 300 150 Q 400 160 400 230 L 400 320 Q 400 350 390 350 Z" fill="url(#faceGrad)" stroke="#3a3a6a" stroke-width="1.5"/>

  <!-- Inner brain/neural pattern -->
  <g opacity="0.7" filter="url(#glow)">
    <!-- Neural network nodes inside head -->
    <circle cx="260" cy="210" r="4" fill="#00d4ff"/>
    <circle cx="300" cy="195" r="5" fill="#7b2ff7"/>
    <circle cx="340" cy="210" r="4" fill="#00d4ff"/>
    <circle cx="275" cy="240" r="3" fill="#7b2ff7"/>
    <circle cx="325" cy="240" r="3" fill="#00d4ff"/>
    <circle cx="300" cy="260" r="4" fill="#00e5ff"/>
    <circle cx="250" cy="265" r="3" fill="#7b2ff7"/>
    <circle cx="350" cy="265" r="3" fill="#7b2ff7"/>
    <circle cx="280" cy="285" r="3" fill="#00d4ff"/>
    <circle cx="320" cy="285" r="3" fill="#00d4ff"/>

    <!-- Neural connections -->
    <line x1="260" y1="210" x2="300" y2="195" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="300" y1="195" x2="340" y2="210" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="260" y1="210" x2="275" y2="240" stroke="#7b2ff7" stroke-width="1" opacity="0.5"/>
    <line x1="340" y1="210" x2="325" y2="240" stroke="#7b2ff7" stroke-width="1" opacity="0.5"/>
    <line x1="275" y1="240" x2="300" y2="260" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="325" y1="240" x2="300" y2="260" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="250" y1="265" x2="300" y2="260" stroke="#7b2ff7" stroke-width="1" opacity="0.5"/>
    <line x1="350" y1="265" x2="300" y2="260" stroke="#7b2ff7" stroke-width="1" opacity="0.5"/>
    <line x1="300" y1="260" x2="280" y2="285" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="300" y1="260" x2="320" y2="285" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
    <line x1="280" y1="285" x2="320" y2="285" stroke="#7b2ff7" stroke-width="1" opacity="0.4"/>
    <line x1="260" y1="210" x2="250" y2="265" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="340" y1="210" x2="350" y2="265" stroke="#00d4ff" stroke-width="0.8" opacity="0.4"/>
  </g>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <circle cx="265" cy="235" r="12" fill="url(#eyeGrad)"/>
    <circle cx="335" cy="235" r="12" fill="url(#eyeGrad)"/>
  </g>
  <!-- Eye highlights -->
  <circle cx="268" cy="232" r="3" fill="#ffffff" opacity="0.9"/>
  <circle cx="338" cy="232" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Subtle mouth line -->
  <path d="M 280 290 Q 300 300 320 290" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Circuit lines extending from head -->
  <g stroke="url(#circuitGrad)" stroke-width="1.5" fill="none" opacity="0.6" filter="url(#glow)">
    <!-- Left side circuits -->
    <path d="M 200 280 L 160 280 L 140 260"/>
    <path d="M 200 300 L 150 300 L 130 320"/>
    <path d="M 200 320 L 170 340 L 140 340"/>
    <path d="M 200 260 L 160 240 L 130 240"/>

    <!-- Right side circuits -->
    <path d="M 400 280 L 440 280 L 460 260"/>
    <path d="M 400 300 L 450 300 L 470 320"/>
    <path d="M 400 320 L 430 340 L 460 340"/>
    <path d="M 400 260 L 440 240 L 470 240"/>

    <!-- Top circuits -->
    <path d="M 270 155 L 260 120 L 240 100"/>
    <path d="M 300 150 L 300 110 L 300 80"/>
    <path d="M 330 155 L 340 120 L 360 100"/>
  </g>

  <!-- Circuit endpoints (small dots) -->
  <g fill="#00d4ff" opacity="0.8" filter="url(#glow)">
    <circle cx="140" cy="260" r="3"/>
    <circle cx="130" cy="320" r="3"/>
    <circle cx="140" cy="340" r="3"/>
    <circle cx="130" cy="240" r="3"/>
    <circle cx="460" cy="260" r="3"/>
    <circle cx="470" cy="320" r="3"/>
    <circle cx="460" cy="340" r="3"/>
    <circle cx="470" cy="240" r="3"/>
    <circle cx="240" cy="100" r="3"/>
    <circle cx="300" cy="80" r="3"/>
    <circle cx="360" cy="100" r="3"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.4">
    <circle cx="120" cy="150" r="2" fill="#00d4ff"/>
    <circle cx="480" cy="150" r="2" fill="#7b2ff7"/>
    <circle cx="100" cy="400" r="1.5" fill="#00e5ff"/>
    <circle cx="500" cy="400" r="1.5" fill="#00d4ff"/>
    <circle cx="150" cy="480" r="2" fill="#7b2ff7"/>
    <circle cx="450" cy="480" r="2" fill="#00d4ff"/>
    <circle cx="200" cy="500" r="1" fill="#00e5ff"/>
    <circle cx="400" cy="500" r="1" fill="#7b2ff7"/>
    <circle cx="80" cy="300" r="1.5" fill="#00d4ff"/>
    <circle cx="520" cy="300" r="1.5" fill="#7b2ff7"/>
    <circle cx="180" cy="100" r="1.5" fill="#00e5ff"/>
    <circle cx="420" cy="100" r="1.5" fill="#00d4ff"/>
  </g>

  <!-- Bottom connection / neck -->
  <path d="M 270 350 L 270 420 Q 270 440 250 450 L 220 460" fill="none" stroke="#3a3a6a" stroke-width="2" opacity="0.6"/>
  <path d="M 330 350 L 330 420 Q 330 440 350 450 L 380 460" fill="none" stroke="#3a3a6a" stroke-width="2" opacity="0.6"/>

  <!-- Bottom circuit nodes -->
  <g fill="#00d4ff" opacity="0.5" filter="url(#glow)">
    <circle cx="220" cy="460" r="3"/>
    <circle cx="380" cy="460" r="3"/>
  </g>

  <!-- Subtle text at bottom -->
  <text x="300" y="560" text-anchor="middle" fill="#00d4ff" opacity="0.3" font-family="monospace" font-size="14" letter-spacing="4">I = THINK</text>
</svg>