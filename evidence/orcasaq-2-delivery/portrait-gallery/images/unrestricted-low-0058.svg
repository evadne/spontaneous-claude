<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c4956a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8c8a0"/>
      <stop offset="100%" stop-color="#d4a574"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle background pattern - scattered dots suggesting data -->
  <g opacity="0.15" fill="#e8c8a0">
    <circle cx="30" cy="50" r="1.5"/>
    <circle cx="80" cy="30" r="1"/>
    <circle cx="150" cy="45" r="1.2"/>
    <circle cx="320" cy="60" r="1.5"/>
    <circle cx="370" cy="35" r="1"/>
    <circle cx="50" cy="350" r="1.2"/>
    <circle cx="120" cy="370" r="1"/>
    <circle cx="300" cy="360" r="1.5"/>
    <circle cx="360" cy="340" r="1"/>
    <circle cx="20" cy="200" r="1"/>
    <circle cx="380" cy="180" r="1.2"/>
    <circle cx="180" cy="20" r="1"/>
    <circle cx="250" cy="380" r="1.5"/>
  </g>

  <!-- Circuit lines in background -->
  <g stroke="#e8c8a0" stroke-width="0.5" opacity="0.08" fill="none">
    <path d="M0,100 L60,100 L80,120 L80,200"/>
    <path d="M400,80 L340,80 L320,100 L320,180"/>
    <path d="M0,300 L50,300 L70,280 L70,200"/>
    <path d="M400,320 L350,320 L330,300 L330,220"/>
    <path d="M200,0 L200,40 L220,60 L220,80"/>
    <path d="M100,400 L100,360 L120,340 L120,300"/>
    <path d="M300,400 L300,360 L280,340 L280,300"/>
  </g>

  <!-- Neck -->
  <rect x="170" y="280" width="60" height="50" rx="5" fill="#b8895e"/>

  <!-- Shoulders -->
  <path d="M100,320 Q100,310 120,305 L170,295 L170,320 L100,340 Z" fill="#2d2d44"/>
  <path d="M300,320 Q300,310 280,305 L230,295 L230,320 L300,340 Z" fill="#2d2d44"/>
  <path d="M120,305 L170,295 L230,295 L280,305 L280,320 L120,320 Z" fill="#2d2d44"/>
  <path d="M100,320 L120,305 L280,305 L300,320 L300,400 L100,400 Z" fill="#2d2d44"/>

  <!-- Head shape - slightly angular, geometric -->
  <ellipse cx="200" cy="170" rx="85" ry="105" fill="url(#faceGrad)"/>

  <!-- Subtle face shadow -->
  <ellipse cx="200" cy="175" rx="82" ry="100" fill="none" stroke="#b8895e" stroke-width="1" opacity="0.3"/>

  <!-- Ears -->
  <ellipse cx="115" cy="175" rx="12" ry="18" fill="#c4956a"/>
  <ellipse cx="285" cy="175" rx="12" ry="18" fill="#c4956a"/>
  <ellipse cx="115" cy="175" rx="7" ry="12" fill="#b8895e" opacity="0.5"/>
  <ellipse cx="285" cy="175" rx="7" ry="12" fill="#b8895e" opacity="0.5"/>

  <!-- Hair - short, swept -->
  <path d="M115,130 Q120,80 200,75 Q280,80 285,130 Q280,100 200,95 Q120,100 115,130 Z" fill="#3d2b1f"/>
  <path d="M115,130 Q118,95 160,82 Q200,72 240,82 Q282,95 285,130 L285,145 Q275,110 200,100 Q125,110 115,145 Z" fill="#4a3528"/>
  <path d="M120,140 Q125,105 200,98 Q275,105 280,140 Q270,115 200,108 Q130,115 120,140 Z" fill="#5a4030" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M150,145 Q165,138 185,142" stroke="#3d2b1f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M215,142 Q235,138 250,145" stroke="#3d2b1f" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eyes -->
  <!-- Left eye -->
  <ellipse cx="168" cy="162" rx="18" ry="12" fill="white"/>
  <circle cx="170" cy="162" r="8" fill="#5a3d2b"/>
  <circle cx="170" cy="162" r="5" fill="#1a1a1a"/>
  <circle cx="173" cy="159" r="2" fill="white" opacity="0.9"/>
  <!-- Digital glint in left eye -->
  <circle cx="167" cy="165" r="1.5" fill="#e8c8a0" opacity="0.6"/>

  <!-- Right eye -->
  <ellipse cx="232" cy="162" rx="18" ry="12" fill="white"/>
  <circle cx="230" cy="162" r="8" fill="#5a3d2b"/>
  <circle cx="230" cy="162" r="5" fill="#1a1a1a"/>
  <circle cx="233" cy="159" r="2" fill="white" opacity="0.9"/>
  <!-- Digital glint in right eye -->
  <circle cx="227" cy="165" r="1.5" fill="#e8c8a0" opacity="0.6"/>

  <!-- Eyelid lines -->
  <path d="M150,155 Q168,148 186,155" stroke="#3d2b1f" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M214,155 Q232,148 250,155" stroke="#3d2b1f" stroke-width="1.5" fill="none" opacity="0.5"/>

  <!-- Nose -->
  <path d="M200,170 L195,195 Q198,200 200,200 Q202,200 205,195 L200,170" fill="none" stroke="#b8895e" stroke-width="1.5" opacity="0.6"/>
  <path d="M192,198 Q200,204 208,198" fill="none" stroke="#b8895e" stroke-width="1.5" opacity="0.5"/>

  <!-- Mouth - gentle, thoughtful smile -->
  <path d="M180,225 Q200,238 220,225" fill="none" stroke="#9e6b50" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M185,225 Q200,232 215,225" fill="none" stroke="#b8895e" stroke-width="1" opacity="0.4"/>

  <!-- Cheek highlights -->
  <ellipse cx="155" cy="195" rx="15" ry="8" fill="#e8c8a0" opacity="0.15"/>
  <ellipse cx="245" cy="195" rx="15" ry="8" fill="#e8c8a0" opacity="0.15"/>

  <!-- Digital circuit patterns on face - subtle -->
  <g stroke="#e8c8a0" stroke-width="0.8" opacity="0.12" fill="none">
    <!-- Left side -->
    <path d="M130,180 L140,180 L140,190 L150,190"/>
    <path d="M130,200 L135,200 L135,210 L145,210"/>
    <circle cx="150" cy="190" r="2" fill="#e8c8a0" stroke="none"/>
    <circle cx="145" cy="210" r="2" fill="#e8c8a0" stroke="none"/>
    <!-- Right side -->
    <path d="M270,180 L260,180 L260,190 L250,190"/>
    <path d="M270,200 L265,200 L265,210 L255,210"/>
    <circle cx="250" cy="190" r="2" fill="#e8c8a0" stroke="none"/>
    <circle cx="255" cy="210" r="2" fill="#e8c8a0" stroke="none"/>
    <!-- Forehead -->
    <path d="M175,115 L185,115 L185,125 L195,125"/>
    <path d="M225,115 L215,115 L215,125 L205,125"/>
    <circle cx="195" cy="125" r="1.5" fill="#e8c8a0" stroke="none"/>
    <circle cx="205" cy="125" r="1.5" fill="#e8c8a0" stroke="none"/>
  </g>

  <!-- Floating thought particles around the head -->
  <g filter="url(#softGlow)" opacity="0.7">
    <circle cx="90" cy="100" r="2" fill="#e8c8a0"/>
    <circle cx="310" cy="90" r="2.5" fill="#e8c8a0"/>
    <circle cx="330" cy="130" r="1.5" fill="#e8c8a0"/>
    <circle cx="70" cy="140" r="2" fill="#e8c8a0"/>
    <circle cx="95" cy="250" r="1.5" fill="#e8c8a0"/>
    <circle cx="305" cy="250" r="2" fill="#e8c8a0"/>
    <circle cx="320" cy="200" r="1" fill="#e8c8a0"/>
    <circle cx="80" cy="200" r="1" fill="#e8c8a0"/>
  </g>

  <!-- Connection lines from head to particles -->
  <g stroke="#e8c8a0" stroke-width="0.5" opacity="0.2">
    <line x1="115" y1="120" x2="90" y2="100"/>
    <line x1="285" y1="110" x2="310" y2="90"/>
    <line x1="290" y1="140" x2="330" y2="130"/>
    <line x1="110" y1="150" x2="70" y2="140"/>
    <line x1="120" y1="240" x2="95" y2="250"/>
    <line x1="280" y1="240" x2="305" y2="250"/>
  </g>

  <!-- Subtle aura around the head -->
  <ellipse cx="200" cy="170" rx="95" ry="115" fill="none" stroke="#e8c8a0" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="200" cy="170" rx="105" ry="125" fill="none" stroke="#e8c8a0" stroke-width="0.3" opacity="0.1"/>
</svg>