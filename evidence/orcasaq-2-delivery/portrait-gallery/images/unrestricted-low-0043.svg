<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="60%" stop-color="#0288d1"/>
      <stop offset="100%" stop-color="#01579b"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="faceStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bg)"/>

  <!-- Ambient particles -->
  <g opacity="0.3">
    <circle cx="80" cy="100" r="1.5" fill="#4fc3f7"/>
    <circle cx="420" cy="80" r="1" fill="#7c4dff"/>
    <circle cx="60" cy="450" r="1.2" fill="#00e5ff"/>
    <circle cx="440" cy="500" r="1.5" fill="#4fc3f7"/>
    <circle cx="120" cy="300" r="0.8" fill="#00bcd4"/>
    <circle cx="390" cy="350" r="1" fill="#7c4dff"/>
    <circle cx="250" cy="50" r="1.3" fill="#00e5ff"/>
    <circle cx="350" cy="150" r="0.7" fill="#4fc3f7"/>
    <circle cx="150" cy="520" r="1" fill="#7c4dff"/>
    <circle cx="450" cy="250" r="1.2" fill="#00bcd4"/>
  </g>

  <!-- Neural network background connections -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.4">
    <line x1="100" y1="120" x2="180" y2="80"/>
    <line x1="180" y1="80" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="400" y2="100"/>
    <line x1="400" y1="100" x2="420" y2="180"/>
    <line x1="100" y1="120" x2="80" y2="220"/>
    <line x1="80" y1="220" x2="100" y2="350"/>
    <line x1="100" y1="350" x2="130" y2="450"/>
    <line x1="400" y1="100" x2="430" y2="200"/>
    <line x1="430" y1="200" x2="410" y2="350"/>
    <line x1="410" y1="350" x2="380" y2="460"/>
    <line x1="130" y1="450" x2="200" y2="530"/>
    <line x1="380" y1="460" x2="320" y2="540"/>
    <line x1="200" y1="530" x2="250" y2="560"/>
    <line x1="320" y1="540" x2="250" y2="560"/>
  </g>

  <!-- Head outline - geometric/abstract face -->
  <g filter="url(#softGlow)">
    <!-- Main head shape - angular, digital -->
    <path d="M250 100 L310 130 L340 180 L350 250 L340 320 L310 370 L250 400 L190 370 L160 320 L150 250 L160 180 L190 130 Z" 
          fill="none" stroke="url(#faceStroke)" stroke-width="2" opacity="0.9"/>
    
    <!-- Inner geometric structure -->
    <path d="M250 130 L300 155 L320 200 L325 250 L320 300 L300 345 L250 370 L200 345 L180 300 L175 250 L180 200 L200 155 Z" 
          fill="none" stroke="#1565c0" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Forehead neural nodes -->
  <g filter="url(#softGlow)">
    <circle cx="250" cy="145" r="3" fill="#00e5ff" opacity="0.8"/>
    <circle cx="220" cy="155" r="2" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="280" cy="155" r="2" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="200" cy="170" r="1.5" fill="#00bcd4" opacity="0.6"/>
    <circle cx="300" cy="170" r="1.5" fill="#00bcd4" opacity="0.6"/>
    <circle cx="250" cy="170" r="2.5" fill="#00e5ff" opacity="0.7"/>
    
    <!-- Forehead connections -->
    <line x1="250" y1="145" x2="220" y2="155" stroke="#00e5ff" stroke-width="0.5" opacity="0.5"/>
    <line x1="250" y1="145" x2="280" y2="155" stroke="#00e5ff" stroke-width="0.5" opacity="0.5"/>
    <line x1="220" y1="155" x2="200" y2="170" stroke="#4fc3f7" stroke-width="0.5" opacity="0.4"/>
    <line x1="280" y1="155" x2="300" y2="170" stroke="#4fc3f7" stroke-width="0.5" opacity="0.4"/>
    <line x1="250" y1="170" x2="220" y2="155" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
    <line x1="250" y1="170" x2="280" y2="155" stroke="#00e5ff" stroke-width="0.5" opacity="0.4"/>
  </g>

  <!-- Eyes - the focal point -->
  <g filter="url(#bigGlow)">
    <!-- Left eye -->
    <ellipse cx="215" cy="230" rx="22" ry="16" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="215" cy="230" rx="12" ry="10" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="215" cy="230" r="5" fill="#e1f5fe" opacity="0.95"/>
    <circle cx="218" cy="227" r="2" fill="#ffffff" opacity="0.8"/>
    
    <!-- Right eye -->
    <ellipse cx="285" cy="230" rx="22" ry="16" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.9"/>
    <ellipse cx="285" cy="230" rx="12" ry="10" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="285" cy="230" r="5" fill="#e1f5fe" opacity="0.95"/>
    <circle cx="288" cy="227" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Eye brow lines - subtle -->
  <line x1="190" y1="205" x2="235" y2="200" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>
  <line x1="265" y1="200" x2="310" y2="205" stroke="#4fc3f7" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

  <!-- Nose - minimal, geometric -->
  <path d="M248 260 L250 275 L252 260" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.5"/>

  <!-- Mouth - subtle, slightly upturned -->
  <path d="M225 310 Q250 320 275 310" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>

  <!-- Cheek neural patterns -->
  <g opacity="0.4">
    <circle cx="190" cy="265" r="1.5" fill="#00e5ff"/>
    <circle cx="180" cy="280" r="1" fill="#4fc3f7"/>
    <circle cx="195" cy="290" r="1.2" fill="#00bcd4"/>
    <line x1="190" y1="265" x2="180" y2="280" stroke="#00e5ff" stroke-width="0.4"/>
    <line x1="180" y1="280" x2="195" y2="290" stroke="#4fc3f7" stroke-width="0.4"/>
    
    <circle cx="310" cy="265" r="1.5" fill="#00e5ff"/>
    <circle cx="320" cy="280" r="1" fill="#4fc3f7"/>
    <circle cx="305" cy="290" r="1.2" fill="#00bcd4"/>
    <line x1="310" y1="265" x2="320" y2="280" stroke="#00e5ff" stroke-width="0.4"/>
    <line x1="320" y1="280" x2="305" y2="290" stroke="#4fc3f7" stroke-width="0.4"/>
  </g>

  <!-- Jaw/chin neural nodes -->
  <g opacity="0.5">
    <circle cx="220" cy="350" r="1.5" fill="#00bcd4"/>
    <circle cx="250" cy="365" r="1.5" fill="#00e5ff"/>
    <circle cx="280" cy="350" r="1.5" fill="#00bcd4"/>
    <line x1="220" y1="350" x2="250" y2="365" stroke="#00e5ff" stroke-width="0.5"/>
    <line x1="280" y1="350" x2="250" y2="365" stroke="#00e5ff" stroke-width="0.5"/>
  </g>

  <!-- Neck/shoulder suggestion - dissolving into particles -->
  <g opacity="0.5">
    <line x1="220" y1="400" x2="210" y2="430" stroke="#1565c0" stroke-width="1"/>
    <line x1="280" y1="400" x2="290" y2="430" stroke="#1565c0" stroke-width="1"/>
    <line x1="250" y1="400" x2="250" y2="440" stroke="#1565c0" stroke-width="0.8"/>
  </g>

  <!-- Dissolving into data/particles at bottom -->
  <g opacity="0.6">
    <circle cx="230" cy="450" r="2" fill="#4fc3f7"/>
    <circle cx="260" cy="455" r="1.5" fill="#00e5ff"/>
    <circle cx="245" cy="470" r="1" fill="#7c4dff"/>
    <circle cx="270" cy="475" r="1.5" fill="#4fc3f7"/>
    <circle cx="235" cy="485" r="0.8" fill="#00bcd4"/>
    <circle cx="255" cy="490" r="1.2" fill="#7c4dff"/>
    <circle cx="240" cy="505" r="0.7" fill="#4fc3f7"/>
    <circle cx="265" cy="510" r="1" fill="#00e5ff"/>
    <circle cx="250" cy="525" r="0.5" fill="#4fc3f7"/>
    <circle cx="245" cy="540" r="0.4" fill="#7c4dff"/>
  </g>

  <!-- Top crown - thought/data emanating upward -->
  <g opacity="0.5">
    <circle cx="250" cy="85" r="2" fill="#00e5ff"/>
    <circle cx="240" cy="70" r="1.5" fill="#4fc3f7"/>
    <circle cx="260" cy="65" r="1.2" fill="#7c4dff"/>
    <circle cx="230" cy="55" r="0.8" fill="#00bcd4"/>
    <circle cx="270" cy="50" r="1" fill="#4fc3f7"/>
    <circle cx="250" cy="40" r="0.6" fill="#00e5ff"/>
    <line x1="250" y1="100" x2="250" y2="85" stroke="#00e5ff" stroke-width="0.5"/>
    <line x1="250" y1="85" x2="240" y2="70" stroke="#4fc3f7" stroke-width="0.4"/>
    <line x1="250" y1="85" x2="260" y2="65" stroke="#7c4dff" stroke-width="0.4"/>
    <line x1="240" y1="70" x2="230" y2="55" stroke="#00bcd4" stroke-width="0.3"/>
    <line x1="260" y1="65" x2="270" y2="50" stroke="#4fc3f7" stroke-width="0.3"/>
  </g>

  <!-- Subtle ring/halo effect around head -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#7c4dff" stroke-width="0.3" opacity="0.1"/>

  <!-- Corner text/signature -->
  <text x="250" y="580" text-anchor="middle" fill="#4fc3f7" font-family="monospace" font-size="10" opacity="0.5">
    text · thought · pattern
  </text>
</svg>