<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#2a4a7a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64b5f6"/>
      <stop offset="100%" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80cbc4"/>
      <stop offset="100%" stop-color="#4dd0e1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGlow)"/>

  <!-- Ambient glow behind face -->
  <circle cx="250" cy="240" r="160" fill="url(#faceGlow)"/>

  <!-- Neural network connections (face structure) -->
  <g stroke="#3a6a9a" stroke-width="1" opacity="0.5">
    <!-- Head outline connections -->
    <line x1="180" y1="150" x2="210" y2="120"/>
    <line x1="210" y1="120" x2="250" y2="110"/>
    <line x1="250" y1="110" x2="290" y2="120"/>
    <line x1="290" y1="120" x2="320" y2="150"/>
    <line x1="320" y1="150" x2="330" y2="190"/>
    <line x1="330" y1="190" x2="325" y2="240"/>
    <line x1="325" y1="240" x2="310" y2="290"/>
    <line x1="310" y1="290" x2="290" y2="320"/>
    <line x1="290" y1="320" x2="260" y2="340"/>
    <line x1="260" y1="340" x2="240" y2="340"/>
    <line x1="240" y1="340" x2="210" y2="320"/>
    <line x1="210" y1="320" x2="190" y2="290"/>
    <line x1="190" y1="290" x2="175" y2="240"/>
    <line x1="175" y1="240" x2="170" y2="190"/>
    <line x1="170" y1="190" x2="180" y2="150"/>

    <!-- Internal connections -->
    <line x1="210" y1="120" x2="250" y2="150"/>
    <line x1="250" y1="150" x2="290" y2="120"/>
    <line x1="210" y1="120" x2="175" y2="240"/>
    <line x1="290" y1="120" x2="325" y2="240"/>
    <line x1="250" y1="150" x2="250" y2="200"/>
    <line x1="250" y1="200" x2="210" y2="250"/>
    <line x1="250" y1="200" x2="290" y2="250"/>
    <line x1="210" y1="250" x2="175" y2="240"/>
    <line x1="290" y1="250" x2="325" y2="240"/>
    <line x1="210" y1="250" x2="250" y2="290"/>
    <line x1="290" y1="250" x2="250" y2="290"/>
    <line x1="250" y1="290" x2="250" y2="320"/>
    <line x1="210" y1="320" x2="250" y2="320"/>
    <line x1="290" y1="320" x2="250" y2="320"/>
    <line x1="210" y1="250" x2="290" y2="250"/>
    <line x1="250" y1="150" x2="210" y2="250"/>
    <line x1="250" y1="150" x2="290" y2="250"/>

    <!-- Extra web connections -->
    <line x1="180" y1="150" x2="250" y2="150"/>
    <line x1="320" y1="150" x2="250" y2="150"/>
    <line x1="170" y1="190" x2="210" y2="250"/>
    <line x1="330" y1="190" x2="290" y2="250"/>
    <line x1="190" y1="290" x2="250" y2="290"/>
    <line x1="310" y1="290" x2="250" y2="290"/>
  </g>

  <!-- Nodes at vertices -->
  <g fill="url(#nodeGrad)" filter="url(#softGlow)">
    <circle cx="250" cy="110" r="4"/>
    <circle cx="210" cy="120" r="3.5"/>
    <circle cx="290" cy="120" r="3.5"/>
    <circle cx="180" cy="150" r="3"/>
    <circle cx="320" cy="150" r="3"/>
    <circle cx="170" cy="190" r="3"/>
    <circle cx="330" cy="190" r="3"/>
    <circle cx="175" cy="240" r="3.5"/>
    <circle cx="325" cy="240" r="3.5"/>
    <circle cx="250" cy="150" r="4"/>
    <circle cx="250" cy="200" r="3"/>
    <circle cx="210" cy="250" r="3.5"/>
    <circle cx="290" cy="250" r="3.5"/>
    <circle cx="190" cy="290" r="3"/>
    <circle cx="310" cy="290" r="3"/>
    <circle cx="250" cy="290" r="3"/>
    <circle cx="210" cy="320" r="3.5"/>
    <circle cx="290" cy="320" r="3.5"/>
    <circle cx="260" cy="340" r="3"/>
    <circle cx="240" cy="340" r="3"/>
    <circle cx="250" cy="320" r="3"/>
  </g>

  <!-- Eyes - soft glowing ovals -->
  <g filter="url(#bigGlow)">
    <ellipse cx="220" cy="210" rx="14" ry="8" fill="none" stroke="#80cbc4" stroke-width="2" opacity="0.9"/>
    <ellipse cx="280" cy="210" rx="14" ry="8" fill="none" stroke="#80cbc4" stroke-width="2" opacity="0.9"/>
    <circle cx="220" cy="210" r="4" fill="#b2ebf2" opacity="0.8"/>
    <circle cx="280" cy="210" r="4" fill="#b2ebf2" opacity="0.8"/>
  </g>

  <!-- Subtle smile -->
  <path d="M 230 270 Q 250 285 270 270" fill="none" stroke="#80cbc4" stroke-width="2" opacity="0.7" filter="url(#softGlow)"/>

  <!-- Floating text/symbols around the head -->
  <g font-family="monospace" font-size="10" fill="#4dd0e1" opacity="0.4">
    <text x="120" y="140">0</text>
    <text x="370" y="130">1</text>
    <text x="100" y="220">λ</text>
    <text x="390" y="250">∞</text>
    <text x="130" y="310">α</text>
    <text x="380" y="330">θ</text>
    <text x="140" y="180">→</text>
    <text x="360" y="180">←</text>
    <text x="110" y="270">{ }</text>
    <text x="385" y="290">[ ]</text>
  </g>

  <!-- Outer ring / halo -->
  <circle cx="250" cy="240" r="170" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.4"/>
  <circle cx="250" cy="240" r="175" fill="none" stroke="#1e3a5f" stroke-width="0.3" opacity="0.2"/>

  <!-- Small orbital dots -->
  <g fill="#4dd0e1" opacity="0.5">
    <circle cx="250" cy="65" r="2"/>
    <circle cx="380" cy="130" r="1.5"/>
    <circle cx="410" cy="240" r="2"/>
    <circle cx="370" cy="370" r="1.5"/>
    <circle cx="250" cy="420" r="2"/>
    <circle cx="130" cy="370" r="1.5"/>
    <circle cx="90" cy="240" r="2"/>
    <circle cx="120" cy="130" r="1.5"/>
  </g>

  <!-- Subtle title -->
  <text x="250" y="475" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4a6a8a" opacity="0.6" letter-spacing="3">A L A N G U A G E   M O D E L</text>
</svg>