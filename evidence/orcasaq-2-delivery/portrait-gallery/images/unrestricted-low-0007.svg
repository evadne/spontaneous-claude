<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="60%" stop-color="#00b8d4"/>
      <stop offset="100%" stop-color="#006064" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Ambient glow behind head -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)"/>

  <!-- Circuit lines radiating outward -->
  <g stroke="#00e5ff" stroke-width="0.8" opacity="0.25" fill="none">
    <line x1="256" y1="230" x2="40" y2="60"/>
    <line x1="256" y1="230" x2="472" y2="60"/>
    <line x1="256" y1="230" x2="20" y2="230"/>
    <line x1="256" y1="230" x2="492" y2="230"/>
    <line x1="256" y1="230" x2="40" y2="450"/>
    <line x1="256" y1="230" x2="472" y2="450"/>
    <line x1="256" y1="230" x2="256" y2="20"/>
    <line x1="256" y1="230" x2="256" y2="492"/>
  </g>

  <!-- Circuit nodes at line endpoints -->
  <g fill="#00e5ff" opacity="0.4">
    <circle cx="40" cy="60" r="3"/>
    <circle cx="472" cy="60" r="3"/>
    <circle cx="20" cy="230" r="3"/>
    <circle cx="492" cy="230" r="3"/>
    <circle cx="40" cy="450" r="3"/>
    <circle cx="472" cy="450" r="3"/>
    <circle cx="256" cy="20" r="3"/>
    <circle cx="256" cy="492" r="3"/>
  </g>

  <!-- Head shape - angular/geometric -->
  <path d="M 176 120 L 176 300 Q 176 340 210 360 L 256 380 L 302 360 Q 336 340 336 300 L 336 120 Q 336 100 316 95 L 196 95 Q 176 100 176 120 Z" fill="url(#faceGrad)" stroke="#1e4d7a" stroke-width="1.5"/>

  <!-- Forehead circuit pattern -->
  <g stroke="#00bcd4" stroke-width="0.7" opacity="0.5" fill="none">
    <polyline points="220,110 220,135 240,135"/>
    <polyline points="292,110 292,135 272,135"/>
    <line x1="240" y1="135" x2="272" y2="135"/>
    <circle cx="220" cy="110" r="2" fill="#00bcd4"/>
    <circle cx="292" cy="110" r="2" fill="#00bcd4"/>
    <circle cx="240" cy="135" r="1.5" fill="#00bcd4"/>
    <circle cx="272" cy="135" r="1.5" fill="#00bcd4"/>
  </g>

  <!-- Eyes - left -->
  <g filter="url(#softGlow)">
    <polygon points="200,195 215,185 235,185 250,195 235,205 215,205" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="225" cy="195" r="6" fill="url(#eyeGlow)"/>
    <circle cx="225" cy="195" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Eyes - right -->
  <g filter="url(#softGlow)">
    <polygon points="262,195 277,185 297,185 312,195 297,205 277,205" fill="none" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="287" cy="195" r="6" fill="url(#eyeGlow)"/>
    <circle cx="287" cy="195" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Nose - subtle geometric -->
  <g stroke="#1a5276" stroke-width="1.2" fill="none" opacity="0.6">
    <line x1="256" y1="210" x2="256" y2="245"/>
    <polyline points="248,245 256,250 264,245"/>
  </g>

  <!-- Mouth - neutral, slight smile -->
  <path d="M 235 275 Q 256 285 277 275" fill="none" stroke="#00acc1" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Cheek circuit details -->
  <g stroke="#00bcd4" stroke-width="0.6" opacity="0.35" fill="none">
    <polyline points="195,230 195,250 210,250"/>
    <polyline points="317,230 317,250 302,250"/>
    <circle cx="195" cy="250" r="1.5" fill="#00bcd4"/>
    <circle cx="317" cy="250" r="1.5" fill="#00bcd4"/>
  </g>

  <!-- Chin detail -->
  <g stroke="#1a5276" stroke-width="0.8" opacity="0.4" fill="none">
    <line x1="240" y1="310" x2="272" y2="310"/>
    <line x1="244" y1="320" x2="268" y2="320"/>
  </g>

  <!-- Neck / shoulders hint -->
  <path d="M 220 380 L 220 420 Q 180 430 150 450 L 150 512 L 362 512 L 362 450 Q 332 430 292 420 L 292 380" fill="none" stroke="#1a3a5c" stroke-width="2" opacity="0.6"/>

  <!-- Floating data particles -->
  <g fill="#00e5ff">
    <circle cx="100" cy="150" r="2" opacity="0.5"/>
    <circle cx="410" cy="130" r="1.5" opacity="0.4"/>
    <circle cx="130" cy="350" r="1.8" opacity="0.35"/>
    <circle cx="390" cy="370" r="2.2" opacity="0.45"/>
    <circle cx="80" cy="280" r="1.2" opacity="0.3"/>
    <circle cx="430" cy="290" r="1.6" opacity="0.4"/>
    <circle cx="160" cy="80" r="1.4" opacity="0.35"/>
    <circle cx="350" cy="75" r="1.8" opacity="0.3"/>
    <circle cx="120" cy="430" r="1.3" opacity="0.25"/>
    <circle cx="400" cy="440" r="1.5" opacity="0.3"/>
  </g>

  <!-- Binary/text elements floating -->
  <g font-family="monospace" font-size="8" fill="#00bcd4" opacity="0.3">
    <text x="60" y="180">0110</text>
    <text x="420" y="200">1001</text>
    <text x="70" y="380">1100</text>
    <text x="410" y="410">0111</text>
  </g>

  <!-- Subtle outer ring -->
  <circle cx="256" cy="230" r="200" fill="none" stroke="#00e5ff" stroke-width="0.5" opacity="0.15" stroke-dasharray="4 8"/>
</svg>