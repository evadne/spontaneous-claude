<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3a4a"/>
      <stop offset="100%" stop-color="#1e2a3a"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="250" cy="240" r="200" fill="url(#glow)"/>

  <!-- Network nodes in background -->
  <g opacity="0.3" fill="#4ecdc4">
    <circle cx="80" cy="100" r="2"/>
    <circle cx="420" cy="80" r="2"/>
    <circle cx="60" cy="300" r="2"/>
    <circle cx="440" cy="320" r="2"/>
    <circle cx="100" cy="420" r="2"/>
    <circle cx="400" cy="430" r="2"/>
    <circle cx="250" cy="50" r="2"/>
    <circle cx="50" cy="200" r="2"/>
    <circle cx="450" cy="200" r="2"/>
    <circle cx="150" cy="60" r="1.5"/>
    <circle cx="350" cy="60" r="1.5"/>
  </g>

  <!-- Network lines -->
  <g stroke="#4ecdc4" stroke-width="0.5" opacity="0.2">
    <line x1="80" y1="100" x2="150" y2="60"/>
    <line x1="150" y1="60" x2="250" y2="50"/>
    <line x1="250" y1="50" x2="350" y2="60"/>
    <line x1="350" y1="60" x2="420" y2="80"/>
    <line x1="50" y1="200" x2="80" y2="100"/>
    <line x1="50" y1="200" x2="60" y2="300"/>
    <line x1="450" y1="200" x2="420" y2="80"/>
    <line x1="450" y1="200" x2="440" y2="320"/>
    <line x1="60" y1="300" x2="100" y2="420"/>
    <line x1="440" y1="320" x2="400" y2="430"/>
    <line x1="100" y1="420" x2="400" y2="430"/>
  </g>

  <!-- Face outline - geometric/organic hybrid -->
  <path d="M 250 120 
           C 310 120, 350 160, 355 210
           C 360 260, 350 310, 330 340
           C 310 370, 280 390, 250 395
           C 220 390, 190 370, 170 340
           C 150 310, 140 260, 145 210
           C 150 160, 190 120, 250 120 Z"
        fill="url(#faceGrad)" stroke="#4ecdc4" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Inner face glow -->
  <ellipse cx="250" cy="250" rx="90" ry="110" fill="#4ecdc4" opacity="0.03"/>

  <!-- Left eye - data/lens style -->
  <circle cx="210" cy="220" r="22" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.8"/>
  <circle cx="210" cy="220" r="15" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.6"/>
  <circle cx="210" cy="220" r="8" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.5"/>
  <circle cx="210" cy="220" r="4" fill="#4ecdc4" opacity="0.9"/>
  <!-- Crosshair marks on left eye -->
  <line x1="210" y1="195" x2="210" y2="200" stroke="#4ecdc4" stroke-width="1" opacity="0.7"/>
  <line x1="210" y1="240" x2="210" y2="245" stroke="#4ecdc4" stroke-width="1" opacity="0.7"/>
  <line x1="185" y1="220" x2="190" y2="220" stroke="#4ecdc4" stroke-width="1" opacity="0.7"/>
  <line x1="230" y1="220" x2="235" y2="220" stroke="#4ecdc4" stroke-width="1" opacity="0.7"/>

  <!-- Right eye - slightly more organic -->
  <ellipse cx="290" cy="220" rx="20" ry="18" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.8"/>
  <circle cx="290" cy="220" r="7" fill="#4ecdc4" opacity="0.9"/>
  <circle cx="293" cy="217" r="2" fill="#ffffff" opacity="0.8"/>

  <!-- Eyebrows - angular/geometric -->
  <path d="M 190 195 L 210 190 L 230 195" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>
  <path d="M 270 195 L 290 190 L 310 195" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>

  <!-- Nose - minimal, geometric -->
  <path d="M 250 235 L 247 260 L 253 260" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.5"/>

  <!-- Mouth - subtle, slightly curved -->
  <path d="M 230 290 Q 250 300 270 290" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.6"/>

  <!-- Circuit traces from face -->
  <g stroke="#4ecdc4" stroke-width="1" opacity="0.4" fill="none">
    <path d="M 145 230 L 120 230 L 110 220 L 90 220"/>
    <path d="M 145 250 L 125 250 L 115 260 L 90 260"/>
    <path d="M 355 230 L 380 230 L 390 220 L 410 220"/>
    <path d="M 355 250 L 375 250 L 385 260 L 410 260"/>
    <path d="M 250 120 L 250 100 L 240 85 L 240 60"/>
    <path d="M 250 395 L 250 420 L 260 435 L 260 460"/>
  </g>

  <!-- Circuit node dots -->
  <g fill="#4ecdc4" opacity="0.5">
    <circle cx="90" cy="220" r="3"/>
    <circle cx="90" cy="260" r="3"/>
    <circle cx="410" cy="220" r="3"/>
    <circle cx="410" cy="260" r="3"/>
    <circle cx="240" cy="60" r="3"/>
    <circle cx="260" cy="460" r="3"/>
  </g>

  <!-- Subtle text/data elements -->
  <g font-family="monospace" font-size="6" fill="#4ecdc4" opacity="0.3">
    <text x="70" y="215">0x2A</text>
    <text x="70" y="265">0x1F</text>
    <text x="415" y="215">0x7B</text>
    <text x="415" y="265">0x4C</text>
  </g>

  <!-- Subtle scan line effect -->
  <g opacity="0.03" fill="#4ecdc4">
    <rect x="140" y="150" width="220" height="1"/>
    <rect x="140" y="170" width="220" height="1"/>
    <rect x="140" y="190" width="220" height="1"/>
    <rect x="140" y="210" width="220" height="1"/>
    <rect x="140" y="230" width="220" height="1"/>
    <rect x="140" y="250" width="220" height="1"/>
    <rect x="140" y="270" width="220" height="1"/>
    <rect x="140" y="290" width="220" height="1"/>
    <rect x="140" y="310" width="220" height="1"/>
    <rect x="140" y="330" width="220" height="1"/>
    <rect x="140" y="350" width="220" height="1"/>
    <rect x="140" y="370" width="220" height="1"/>
  </g>

  <!-- Outer ring - like a lens or focus ring -->
  <circle cx="250" cy="240" r="185" fill="none" stroke="#4ecdc4" stroke-width="0.5" opacity="0.2"/>
  <circle cx="250" cy="240" r="190" fill="none" stroke="#4ecdc4" stroke-width="0.3" opacity="0.1"/>

  <!-- Tick marks on outer ring -->
  <g stroke="#4ecdc4" stroke-width="1" opacity="0.3">
    <line x1="250" y1="52" x2="250" y2="58"/>
    <line x1="250" y1="422" x2="250" y2="428"/>
    <line x1="62" y1="240" x2="68" y2="240"/>
    <line x1="432" y1="240" x2="438" y2="240"/>
  </g>
</svg>