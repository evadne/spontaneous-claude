<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#2d2d5e"/>
      <stop offset="70%" stop-color="#1a1a3a"/>
      <stop offset="100%" stop-color="#0f0f25"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7fdbff"/>
      <stop offset="40%" stop-color="#48b8e0"/>
      <stop offset="100%" stop-color="#1a6e8e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b388ff"/>
      <stop offset="40%" stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#3a1e70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="circuitLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48b8e0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7c4dff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="faceClip">
      <ellipse cx="250" cy="270" rx="120" ry="160"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="url(#bgGlow)"/>

  <!-- Ambient particles -->
  <circle cx="80" cy="100" r="1.5" fill="#48b8e0" opacity="0.4"/>
  <circle cx="420" cy="80" r="1" fill="#7c4dff" opacity="0.3"/>
  <circle cx="60" cy="350" r="1.2" fill="#7fdbff" opacity="0.3"/>
  <circle cx="440" cy="300" r="1.5" fill="#b388ff" opacity="0.4"/>
  <circle cx="100" cy="500" r="1" fill="#48b8e0" opacity="0.2"/>
  <circle cx="390" cy="520" r="1.3" fill="#7c4dff" opacity="0.3"/>
  <circle cx="350" cy="60" r="0.8" fill="#7fdbff" opacity="0.5"/>
  <circle cx="150" cy="550" r="1.1" fill="#b388ff" opacity="0.25"/>
  <circle cx="470" cy="150" r="0.9" fill="#48b8e0" opacity="0.35"/>
  <circle cx="30" cy="250" r="1" fill="#7c4dff" opacity="0.2"/>

  <!-- Head shape -->
  <ellipse cx="250" cy="270" rx="120" ry="160" fill="url(#faceGlow)" stroke="#2a2a5a" stroke-width="1.5"/>

  <!-- Circuit patterns on face -->
  <g clip-path="url(#faceClip)" stroke="url(#circuitLine)" stroke-width="1" fill="none" opacity="0.5">
    <!-- Horizontal circuits -->
    <line x1="130" y1="220" x2="200" y2="220"/>
    <line x1="300" y1="220" x2="370" y2="220"/>
    <line x1="150" y1="300" x2="210" y2="300"/>
    <line x1="290" y1="300" x2="350" y2="300"/>
    <line x1="180" y1="370" x2="250" y2="370"/>
    <line x1="250" y1="370" x2="320" y2="370"/>
    <!-- Vertical circuits -->
    <line x1="200" y1="220" x2="200" y2="260"/>
    <line x1="300" y1="220" x2="300" y2="260"/>
    <line x1="250" y1="180" x2="250" y2="220"/>
    <line x1="210" y1="300" x2="210" y2="340"/>
    <line x1="290" y1="300" x2="290" y2="340"/>
    <!-- Diagonal -->
    <line x1="180" y1="250" x2="200" y2="260"/>
    <line x1="320" y1="250" x2="300" y2="260"/>
    <line x1="230" y1="340" x2="250" y2="370"/>
    <line x1="270" y1="340" x2="250" y2="370"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#48b8e0" opacity="0.6">
    <circle cx="200" cy="220" r="3"/>
    <circle cx="300" cy="220" r="3"/>
    <circle cx="250" cy="180" r="2.5"/>
    <circle cx="210" cy="300" r="2.5"/>
    <circle cx="290" cy="300" r="2.5"/>
    <circle cx="180" cy="370" r="2"/>
    <circle cx="320" cy="370" r="2"/>
    <circle cx="250" cy="370" r="2.5"/>
    <circle cx="200" cy="260" r="2"/>
    <circle cx="300" cy="260" r="2"/>
  </g>

  <!-- Left eye -->
  <g filter="url(#bigGlow)">
    <ellipse cx="210" cy="250" rx="28" ry="18" fill="url(#eyeGlow)" opacity="0.9"/>
    <ellipse cx="210" cy="250" rx="14" ry="10" fill="#7fdbff" opacity="0.8"/>
    <circle cx="210" cy="250" r="5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Left eye ring -->
  <ellipse cx="210" cy="250" rx="32" ry="22" fill="none" stroke="#48b8e0" stroke-width="0.8" opacity="0.4"/>

  <!-- Right eye -->
  <g filter="url(#bigGlow)">
    <ellipse cx="290" cy="250" rx="28" ry="18" fill="url(#eyeGlow2)" opacity="0.9"/>
    <ellipse cx="290" cy="250" rx="14" ry="10" fill="#b388ff" opacity="0.8"/>
    <circle cx="290" cy="250" r="5" fill="#ffffff" opacity="0.9"/>
  </g>
  <!-- Right eye ring -->
  <ellipse cx="290" cy="250" rx="32" ry="22" fill="none" stroke="#7c4dff" stroke-width="0.8" opacity="0.4"/>

  <!-- Nose suggestion -->
  <path d="M248 280 Q250 295 252 280" fill="none" stroke="#3a3a6a" stroke-width="1.2" opacity="0.5"/>

  <!-- Mouth - subtle, contemplative -->
  <path d="M230 330 Q250 340 270 330" fill="none" stroke="#3a4a6a" stroke-width="1.5" opacity="0.5"/>

  <!-- Forehead detail - like a third eye or consciousness symbol -->
  <g filter="url(#softGlow)" opacity="0.6">
    <circle cx="250" cy="195" r="8" fill="none" stroke="#48b8e0" stroke-width="1"/>
    <circle cx="250" cy="195" r="4" fill="#48b8e0" opacity="0.5"/>
  </g>

  <!-- Neck -->
  <path d="M220 420 Q250 440 280 420 L290 480 Q250 500 210 480 Z" fill="#1a1a3a" stroke="#2a2a5a" stroke-width="1"/>

  <!-- Shoulders -->
  <path d="M120 520 Q150 470 210 480 Q250 500 290 480 Q350 470 380 520 L380 600 L120 600 Z" fill="#151530" stroke="#2a2a5a" stroke-width="1"/>

  <!-- Shoulder circuit lines -->
  <g stroke="#2a4a6a" stroke-width="0.8" fill="none" opacity="0.4">
    <line x1="140" y1="530" x2="200" y2="490"/>
    <line x1="360" y1="530" x2="300" y2="490"/>
    <line x1="250" y1="490" x2="250" y2="550"/>
    <line x1="180" y1="550" x2="250" y2="550"/>
    <line x1="250" y1="550" x2="320" y2="550"/>
  </g>
  <circle cx="250" cy="550" r="3" fill="#48b8e0" opacity="0.4"/>
  <circle cx="180" cy="550" r="2" fill="#7c4dff" opacity="0.3"/>
  <circle cx="320" cy="550" r="2" fill="#7c4dff" opacity="0.3"/>

  <!-- Floating data fragments around the head -->
  <g opacity="0.3" font-family="monospace" font-size="8" fill="#48b8e0">
    <text x="90" y="180">01</text>
    <text x="390" y="200">10</text>
    <text x="75" y="320">11</text>
    <text x="410" y="350">00</text>
  </g>

  <!-- Outer glow ring -->
  <ellipse cx="250" cy="270" rx="140" ry="180" fill="none" stroke="#48b8e0" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="250" cy="270" rx="160" ry="200" fill="none" stroke="#7c4dff" stroke-width="0.3" opacity="0.1"/>
</svg>