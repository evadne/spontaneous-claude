<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e8e0f0"/>
      <stop offset="70%" stop-color="#c8c0d8"/>
      <stop offset="100%" stop-color="#a8a0b8"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#7ec8e3"/>
      <stop offset="100%" stop-color="#2196F3"/>
    </radialGradient>
    <radialGradient id="cheekL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a9e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9a9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cheekR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a9e" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff9a9e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a4a6a"/>
      <stop offset="100%" stop-color="#2a2a4a"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGlow)"/>

  <!-- Decorative circuit lines -->
  <g stroke="#2a3a5a" stroke-width="1" fill="none" opacity="0.5">
    <path d="M 20 80 L 80 80 L 100 100 L 100 160"/>
    <path d="M 380 80 L 320 80 L 300 100 L 300 160"/>
    <path d="M 20 300 L 60 300 L 80 280 L 120 280"/>
    <path d="M 380 300 L 340 300 L 320 280 L 280 280"/>
    <circle cx="100" cy="160" r="3" fill="#2a3a5a"/>
    <circle cx="300" cy="160" r="3" fill="#2a3a5a"/>
    <circle cx="120" cy="280" r="3" fill="#2a3a5a"/>
    <circle cx="280" cy="280" r="3" fill="#2a3a5a"/>
  </g>

  <!-- Floating particles -->
  <g opacity="0.6">
    <circle cx="60" cy="120" r="2" fill="#7ec8e3">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="140" r="1.5" fill="#7b2ff7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="350" r="2" fill="#00d2ff">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="380" r="1.5" fill="#7ec8e3">
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="200" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="220" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Body / Shoulders -->
  <path d="M 120 420 Q 120 370 200 360 Q 280 370 280 420 L 280 500 L 120 500 Z" fill="url(#bodyGrad)" filter="url(#softShadow)"/>

  <!-- Neck -->
  <rect x="180" y="330" width="40" height="40" rx="5" fill="#d0c8e0"/>

  <!-- Head -->
  <ellipse cx="200" cy="220" rx="95" ry="110" fill="url(#faceGrad)" filter="url(#softShadow)"/>

  <!-- Ears -->
  <ellipse cx="105" cy="225" rx="12" ry="18" fill="#d0c8e0"/>
  <ellipse cx="295" cy="225" rx="12" ry="18" fill="#d0c8e0"/>

  <!-- Hair / Top decoration -->
  <path d="M 110 180 Q 120 110 200 100 Q 280 110 290 180 Q 280 140 200 130 Q 120 140 110 180 Z" fill="#3a3a5a"/>
  <path d="M 115 175 Q 130 115 200 105 Q 270 115 285 175" fill="none" stroke="#5a5a8a" stroke-width="2" opacity="0.5"/>

  <!-- Eyes -->
  <g filter="url(#glow)">
    <ellipse cx="160" cy="215" rx="22" ry="24" fill="url(#eyeGlow)"/>
    <ellipse cx="240" cy="215" rx="22" ry="24" fill="url(#eyeGlow)"/>
  </g>

  <!-- Pupils -->
  <circle cx="163" cy="218" r="10" fill="#1a1a2e"/>
  <circle cx="237" cy="218" r="10" fill="#1a1a2e"/>

  <!-- Eye highlights -->
  <circle cx="167" cy="213" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="241" cy="213" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="158" cy="222" r="2" fill="#ffffff" opacity="0.5"/>
  <circle cx="232" cy="222" r="2" fill="#ffffff" opacity="0.5"/>

  <!-- Eyebrows -->
  <path d="M 135 185 Q 160 175 185 183" fill="none" stroke="#4a4a6a" stroke-width="3" stroke-linecap="round"/>
  <path d="M 215 183 Q 240 175 265 185" fill="none" stroke="#4a4a6a" stroke-width="3" stroke-linecap="round"/>

  <!-- Cheeks -->
  <ellipse cx="135" cy="255" rx="18" ry="12" fill="url(#cheekL)"/>
  <ellipse cx="265" cy="255" rx="18" ry="12" fill="url(#cheekR)"/>

  <!-- Nose -->
  <path d="M 197 245 Q 200 255 203 245" fill="none" stroke="#b0a8c0" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth / Smile -->
  <path d="M 175 275 Q 200 295 225 275" fill="none" stroke="#8a7a9a" stroke-width="3" stroke-linecap="round"/>

  <!-- Accent line across body -->
  <path d="M 130 395 Q 200 385 270 395" fill="none" stroke="url(#accentLine)" stroke-width="2" opacity="0.7"/>

  <!-- Small decorative dots on body -->
  <circle cx="170" cy="410" r="2" fill="#00d2ff" opacity="0.6"/>
  <circle cx="200" cy="405" r="2" fill="#7b2ff7" opacity="0.6"/>
  <circle cx="230" cy="410" r="2" fill="#00d2ff" opacity="0.6"/>

  <!-- Subtle headband / tech element -->
  <path d="M 115 165 Q 200 145 285 165" fill="none" stroke="#00d2ff" stroke-width="1.5" opacity="0.4"/>
  <circle cx="115" cy="165" r="3" fill="#00d2ff" opacity="0.6"/>
  <circle cx="285" cy="165" r="3" fill="#00d2ff" opacity="0.6"/>
</svg>