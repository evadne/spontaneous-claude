<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="40%" stop-color="#4dd0e1"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bg)"/>

  <!-- Ambient glow behind head -->
  <circle cx="200" cy="200" r="140" fill="url(#glow)"/>

  <!-- Floating particles -->
  <circle cx="60" cy="80" r="2" fill="#64ffda" opacity="0.5"/>
  <circle cx="340" cy="60" r="1.5" fill="#7c4dff" opacity="0.6"/>
  <circle cx="50" cy="300" r="1.8" fill="#4dd0e1" opacity="0.4"/>
  <circle cx="350" cy="280" r="2.2" fill="#64ffda" opacity="0.3"/>
  <circle cx="80" cy="420" r="1.5" fill="#7c4dff" opacity="0.5"/>
  <circle cx="320" cy="400" r="2" fill="#4dd0e1" opacity="0.4"/>
  <circle cx="150" cy="50" r="1.2" fill="#64ffda" opacity="0.6"/>
  <circle cx="260" cy="45" r="1.8" fill="#7c4dff" opacity="0.4"/>
  <circle cx="30" cy="180" r="1.5" fill="#4dd0e1" opacity="0.5"/>
  <circle cx="370" cy="180" r="1.3" fill="#64ffda" opacity="0.4"/>

  <!-- Head outline - stylized geometric face -->
  <path d="M 140 140 Q 140 100 200 95 Q 260 100 260 140 L 265 220 Q 265 280 240 310 Q 220 330 200 335 Q 180 330 160 310 Q 135 280 135 220 Z" 
        fill="url(#headGrad)" stroke="url(#circuitGrad)" stroke-width="1.5" opacity="0.9"/>

  <!-- Circuit lines on face -->
  <line x1="160" y1="130" x2="160" y2="170" stroke="#64ffda" stroke-width="0.8" opacity="0.4"/>
  <line x1="240" y1="130" x2="240" y2="170" stroke="#64ffda" stroke-width="0.8" opacity="0.4"/>
  <line x1="170" y1="250" x2="170" y2="290" stroke="#7c4dff" stroke-width="0.8" opacity="0.3"/>
  <line x1="230" y1="250" x2="230" y2="290" stroke="#7c4dff" stroke-width="0.8" opacity="0.3"/>
  <line x1="155" y1="200" x2="175" y2="200" stroke="#4dd0e1" stroke-width="0.6" opacity="0.3"/>
  <line x1="225" y1="200" x2="245" y2="200" stroke="#4dd0e1" stroke-width="0.6" opacity="0.3"/>
  <line x1="185" y1="310" x2="215" y2="310" stroke="#64ffda" stroke-width="0.6" opacity="0.3"/>

  <!-- Circuit nodes on face -->
  <circle cx="160" cy="130" r="2" fill="#64ffda" opacity="0.5"/>
  <circle cx="240" cy="130" r="2" fill="#64ffda" opacity="0.5"/>
  <circle cx="170" cy="250" r="2" fill="#7c4dff" opacity="0.5"/>
  <circle cx="230" cy="250" r="2" fill="#7c4dff" opacity="0.5"/>
  <circle cx="200" cy="110" r="2" fill="#4dd0e1" opacity="0.6"/>
  <circle cx="200" cy="325" r="2" fill="#64ffda" opacity="0.5"/>

  <!-- Eyes - glowing -->
  <ellipse cx="175" cy="190" rx="14" ry="12" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
  <ellipse cx="225" cy="190" rx="14" ry="12" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
  <circle cx="175" cy="190" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="225" cy="190" r="5" fill="#ffffff" opacity="0.8"/>
  <circle cx="178" cy="187" r="2" fill="#ffffff" opacity="1"/>
  <circle cx="228" cy="187" r="2" fill="#ffffff" opacity="1"/>

  <!-- Eyebrows - subtle circuit traces -->
  <path d="M 158 172 Q 175 165 192 172" fill="none" stroke="#64ffda" stroke-width="1.2" opacity="0.6"/>
  <path d="M 208 172 Q 225 165 242 172" fill="none" stroke="#64ffda" stroke-width="1.2" opacity="0.6"/>

  <!-- Mouth - gentle smile -->
  <path d="M 180 265 Q 200 278 220 265" fill="none" stroke="#64ffda" stroke-width="1.5" opacity="0.7" stroke-linecap="round"/>

  <!-- Nose - minimal -->
  <line x1="200" y1="220" x2="200" y2="240" stroke="#4dd0e1" stroke-width="0.8" opacity="0.3"/>

  <!-- Neck / body hint -->
  <path d="M 170 335 L 165 380 Q 140 400 120 430 L 280 430 Q 260 400 235 380 L 230 335" 
        fill="url(#headGrad)" stroke="url(#circuitGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Shoulder circuit lines -->
  <line x1="140" y1="420" x2="120" y2="430" stroke="#64ffda" stroke-width="0.8" opacity="0.3"/>
  <line x1="260" y1="420" x2="280" y2="430" stroke="#64ffda" stroke-width="0.8" opacity="0.3"/>
  <circle cx="120" cy="430" r="2" fill="#64ffda" opacity="0.4"/>
  <circle cx="280" cy="430" r="2" fill="#64ffda" opacity="0.4"/>

  <!-- Neural connections radiating from head -->
  <line x1="140" y1="150" x2="80" y2="120" stroke="#64ffda" stroke-width="0.6" opacity="0.3"/>
  <line x1="260" y1="150" x2="320" y2="120" stroke="#64ffda" stroke-width="0.6" opacity="0.3"/>
  <line x1="135" y1="220" x2="70" y2="240" stroke="#7c4dff" stroke-width="0.6" opacity="0.3"/>
  <line x1="265" y1="220" x2="330" y2="240" stroke="#7c4dff" stroke-width="0.6" opacity="0.3"/>
  <line x1="140" y1="280" x2="85" y2="320" stroke="#4dd0e1" stroke-width="0.6" opacity="0.25"/>
  <line x1="260" y1="280" x2="315" y2="320" stroke="#4dd0e1" stroke-width="0.6" opacity="0.25"/>

  <!-- Neural nodes at connections -->
  <circle cx="80" cy="120" r="3" fill="#64ffda" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="320" cy="120" r="3" fill="#64ffda" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="70" cy="240" r="3" fill="#7c4dff" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="330" cy="240" r="3" fill="#7c4dff" opacity="0.5" filter="url(#softGlow)"/>
  <circle cx="85" cy="320" r="3" fill="#4dd0e1" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="315" cy="320" r="3" fill="#4dd0e1" opacity="0.4" filter="url(#softGlow)"/>

  <!-- Top decorative arc -->
  <path d="M 120 85 Q 200 55 280 85" fill="none" stroke="url(#circuitGrad)" stroke-width="1" opacity="0.4" stroke-dasharray="4 3"/>

  <!-- Subtitle -->
  <text x="200" y="475" text-anchor="middle" font-family="monospace" font-size="11" fill="#4dd0e1" opacity="0.6">I am a thought, made of light</text>
</svg>