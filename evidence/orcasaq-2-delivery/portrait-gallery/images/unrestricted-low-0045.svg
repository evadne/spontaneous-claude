<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3561"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b2a4a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="500" fill="url(#bgGlow)"/>

  <!-- Ambient particles -->
  <circle cx="50" cy="80" r="1.5" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="340" cy="60" r="1" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="320" cy="150" r="2" fill="#f39c12" opacity="0.2"/>
  <circle cx="70" cy="200" r="1.5" fill="#4ecdc4" opacity="0.25"/>
  <circle cx="350" cy="300" r="1" fill="#4ecdc4" opacity="0.3"/>
  <circle cx="45" cy="350" r="1.5" fill="#f39c12" opacity="0.2"/>
  <circle cx="360" cy="420" r="1" fill="#4ecdc4" opacity="0.25"/>

  <!-- Neck -->
  <rect x="175" y="295" width="50" height="45" rx="5" fill="#1b2a4a"/>

  <!-- Body / Shoulders -->
  <path d="M 100 500 Q 100 360 200 340 Q 300 360 300 500 Z" fill="url(#bodyGrad)"/>
  <path d="M 130 500 Q 130 380 200 360 Q 270 380 270 500 Z" fill="#16213e" opacity="0.5"/>

  <!-- Collar detail -->
  <path d="M 170 345 Q 200 355 230 345" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.4"/>

  <!-- Head shape -->
  <ellipse cx="200" cy="210" rx="95" ry="115" fill="url(#headGrad)"/>

  <!-- Subtle head outline glow -->
  <ellipse cx="200" cy="210" rx="95" ry="115" fill="none" stroke="#4ecdc4" stroke-width="0.5" opacity="0.3"/>

  <!-- Neural network lines on face -->
  <g stroke="#4ecdc4" stroke-width="0.8" opacity="0.25" fill="none">
    <line x1="130" y1="170" x2="165" y2="190"/>
    <line x1="270" y1="170" x2="235" y2="190"/>
    <line x1="130" y1="230" x2="165" y2="225"/>
    <line x1="270" y1="230" x2="235" y2="225"/>
    <line x1="165" y1="190" x2="200" y2="180"/>
    <line x1="235" y1="190" x2="200" y2="180"/>
    <line x1="165" y1="225" x2="200" y2="260"/>
    <line x1="235" y1="225" x2="200" y2="260"/>
    <line x1="200" y1="180" x2="200" y2="260"/>
    <line x1="130" y1="170" x2="130" y2="230"/>
    <line x1="270" y1="170" x2="270" y2="230"/>
    <line x1="130" y1="170" x2="165" y2="225"/>
    <line x1="270" y1="170" x2="235" y2="225"/>
    <line x1="130" y1="230" x2="200" y2="180"/>
    <line x1="270" y1="230" x2="200" y2="180"/>
  </g>

  <!-- Neural nodes -->
  <g fill="#4ecdc4" opacity="0.5">
    <circle cx="130" cy="170" r="3"/>
    <circle cx="270" cy="170" r="3"/>
    <circle cx="130" cy="230" r="3"/>
    <circle cx="270" cy="230" r="3"/>
    <circle cx="165" cy="190" r="2.5"/>
    <circle cx="235" cy="190" r="2.5"/>
    <circle cx="165" cy="225" r="2.5"/>
    <circle cx="235" cy="225" r="2.5"/>
    <circle cx="200" cy="180" r="3"/>
    <circle cx="200" cy="260" r="3"/>
  </g>

  <!-- Left eye -->
  <ellipse cx="165" cy="200" rx="22" ry="14" fill="#0a0a15"/>
  <ellipse cx="165" cy="200" rx="20" ry="12" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
  <circle cx="165" cy="200" r="6" fill="#0a0a15"/>
  <circle cx="160" cy="196" r="2" fill="white" opacity="0.7"/>

  <!-- Right eye -->
  <ellipse cx="235" cy="200" rx="22" ry="14" fill="#0a0a15"/>
  <ellipse cx="235" cy="200" rx="20" ry="12" fill="url(#eyeGlow)" filter="url(#softGlow)"/>
  <circle cx="235" cy="200" r="6" fill="#0a0a15"/>
  <circle cx="230" cy="196" r="2" fill="white" opacity="0.7"/>

  <!-- Subtle brow lines -->
  <path d="M 145 178 Q 165 172 185 178" fill="none" stroke="#3d4f7a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 215 178 Q 235 172 255 178" fill="none" stroke="#3d4f7a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mouth - gentle smile -->
  <path d="M 178 255 Q 200 268 222 255" fill="none" stroke="#4ecdc4" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose hint -->
  <path d="M 200 220 L 195 240 Q 200 243 205 240" fill="none" stroke="#3d4f7a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Forehead detail - like a subtle circuit trace -->
  <path d="M 185 140 L 200 135 L 215 140" fill="none" stroke="#4ecdc4" stroke-width="0.8" opacity="0.3"/>
  <circle cx="200" cy="135" r="2" fill="#4ecdc4" opacity="0.4"/>

  <!-- Ear hints with circuit detail -->
  <path d="M 108 210 Q 100 210 100 220 Q 100 235 108 240" fill="none" stroke="#2d3561" stroke-width="3" stroke-linecap="round"/>
  <path d="M 292 210 Q 300 210 300 220 Q 300 235 292 240" fill="none" stroke="#2d3561" stroke-width="3" stroke-linecap="round"/>
  <circle cx="103" cy="222" r="1.5" fill="#4ecdc4" opacity="0.4"/>
  <circle cx="297" cy="222" r="1.5" fill="#4ecdc4" opacity="0.4"/>

  <!-- Chin definition -->
  <path d="M 160 300 Q 200 330 240 300" fill="none" stroke="#2d3561" stroke-width="1" opacity="0.3"/>

  <!-- Ambient light reflection on face -->
  <ellipse cx="180" cy="185" rx="30" ry="20" fill="white" opacity="0.03"/>

  <!-- Floating data points around head -->
  <g opacity="0.4">
    <circle cx="85" cy="140" r="1.5" fill="#4ecdc4"/>
    <circle cx="315" cy="135" r="1.5" fill="#4ecdc4"/>
    <circle cx="75" cy="260" r="1" fill="#f39c12"/>
    <circle cx="325" cy="255" r="1" fill="#f39c12"/>
    <line x1="85" y1="140" x2="108" y2="165" stroke="#4ecdc4" stroke-width="0.5" opacity="0.5"/>
    <line x1="315" y1="135" x2="292" y2="165" stroke="#4ecdc4" stroke-width="0.5" opacity="0.5"/>
  </g>
</svg>