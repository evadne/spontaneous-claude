<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </radialGradient>
    <radialGradient id="faceGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#2a4a6f"/>
      <stop offset="100%" stop-color="#1a2e4a"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="mouthGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="50%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)"/>

  <!-- Ambient glow behind face -->
  <ellipse cx="400" cy="350" rx="250" ry="300" fill="url(#faceGlow)"/>

  <!-- Circuit lines - radiating from center -->
  <g stroke="url(#circuitGrad)" stroke-width="1" fill="none" opacity="0.4">
    <!-- Left circuits -->
    <path d="M280 280 L180 220 L100 250"/>
    <path d="M280 320 L160 300 L80 260"/>
    <path d="M290 360 L170 380 L100 420"/>
    <path d="M300 400 L200 440 L120 460"/>
    <path d="M310 440 L220 500 L140 540"/>
    <path d="M290 480 L200 540 L130 580"/>
    <path d="M300 520 L240 580 L180 640"/>
    <path d="M320 550 L280 620 L220 680"/>

    <!-- Right circuits -->
    <path d="M520 280 L620 220 L700 250"/>
    <path d="M520 320 L640 300 L720 260"/>
    <path d="M510 360 L630 380 L700 420"/>
    <path d="M500 400 L600 440 L680 460"/>
    <path d="M490 440 L580 500 L660 540"/>
    <path d="M510 480 L600 540 L670 580"/>
    <path d="M500 520 L560 580 L620 640"/>
    <path d="M480 550 L520 620 L580 680"/>

    <!-- Top circuits -->
    <path d="M370 230 L350 140 L300 80"/>
    <path d="M400 220 L400 120 L400 60"/>
    <path d="M430 230 L450 140 L500 80"/>
    <path d="M350 250 L300 180 L250 120"/>
    <path d="M450 250 L500 180 L550 120"/>

    <!-- Bottom circuits -->
    <path d="M380 570 L360 650 L330 720"/>
    <path d="M420 570 L440 650 L470 720"/>
    <path d="M400 580 L400 660 L400 740"/>
    <path d="M360 560 L300 630 L260 700"/>
    <path d="M440 560 L500 630 L540 700"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#4fc3f7" filter="url(#glow)" opacity="0.7">
    <circle cx="100" cy="250" r="4"/>
    <circle cx="80" cy="260" r="3"/>
    <circle cx="100" cy="420" r="4"/>
    <circle cx="120" cy="460" r="3"/>
    <circle cx="140" cy="540" r="4"/>
    <circle cx="130" cy="580" r="3"/>
    <circle cx="180" cy="640" r="4"/>
    <circle cx="220" cy="680" r="3"/>
    <circle cx="700" cy="250" r="4"/>
    <circle cx="720" cy="260" r="3"/>
    <circle cx="700" cy="420" r="4"/>
    <circle cx="680" cy="460" r="3"/>
    <circle cx="660" cy="540" r="4"/>
    <circle cx="670" cy="580" r="3"/>
    <circle cx="620" cy="640" r="4"/>
    <circle cx="580" cy="680" r="3"/>
    <circle cx="300" cy="80" r="4"/>
    <circle cx="400" cy="60" r="5"/>
    <circle cx="500" cy="80" r="4"/>
    <circle cx="250" cy="120" r="3"/>
    <circle cx="550" cy="120" r="3"/>
    <circle cx="330" cy="720" r="4"/>
    <circle cx="400" cy="740" r="5"/>
    <circle cx="470" cy="720" r="4"/>
    <circle cx="260" cy="700" r="3"/>
    <circle cx="540" cy="700" r="3"/>
  </g>

  <!-- Face outline - geometric/angular -->
  <g filter="url(#softGlow)">
    <!-- Main face shape -->
    <path d="M310 240 
             Q310 220 340 210 
             L460 210 
             Q490 220 490 240 
             L500 350 
             Q505 400 490 440 
             L470 500 
             Q450 550 400 570 
             Q350 550 330 500 
             L310 440 
             Q295 400 300 350 Z" 
          fill="url(#faceGrad)" stroke="#4fc3f7" stroke-width="1.5" opacity="0.9"/>
  </g>

  <!-- Face inner structure lines -->
  <g stroke="#4fc3f7" stroke-width="0.5" fill="none" opacity="0.3">
    <line x1="350" y1="260" x2="350" y2="500"/>
    <line x1="450" y1="260" x2="450" y2="500"/>
    <line x1="310" y1="350" x2="490" y2="350"/>
    <line x1="320" y1="420" x2="480" y2="420"/>
    <line x1="340" y1="480" x2="460" y2="480"/>
    <line x1="400" y1="230" x2="400" y2="560"/>
  </g>

  <!-- Forehead detail - subtle geometric pattern -->
  <g fill="#4fc3f7" opacity="0.2">
    <polygon points="380,240 400,230 420,240 420,260 400,270 380,260"/>
    <circle cx="400" cy="250" r="3" fill="#80deea"/>
  </g>

  <!-- Eyes - stylized geometric -->
  <g filter="url(#glow)">
    <!-- Left eye -->
    <path d="M340 330 L370 315 L400 330 L370 345 Z" fill="none" stroke="#80deea" stroke-width="2"/>
    <circle cx="370" cy="330" r="10" fill="url(#eyeGrad)" opacity="0.9"/>
    <circle cx="370" cy="330" r="4" fill="#0a0a12"/>
    <circle cx="373" cy="327" r="2" fill="#ffffff" opacity="0.8"/>

    <!-- Right eye -->
    <path d="M400 330 L430 315 L460 330 L430 345 Z" fill="none" stroke="#80deea" stroke-width="2"/>
    <circle cx="430" cy="330" r="10" fill="url(#eyeGrad)" opacity="0.9"/>
    <circle cx="430" cy="330" r="4" fill="#0a0a12"/>
    <circle cx="433" cy="327" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Eyebrows - angular -->
  <g stroke="#80deea" stroke-width="2" fill="none" opacity="0.7">
    <path d="M345 305 L370 295 L395 305"/>
    <path d="M405 305 L430 295 L455 305"/>
  </g>

  <!-- Nose - minimal geometric -->
  <g stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M400 350 L395 390 L385 400"/>
    <path d="M400 350 L405 390 L415 400"/>
    <line x1="385" y1="400" x2="415" y2="400" opacity="0.3"/>
  </g>

  <!-- Mouth - subtle, knowing -->
  <g filter="url(#glow)">
    <path d="M370 460 Q400 475 430 460" fill="none" stroke="url(#mouthGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Lower lip hint -->
    <path d="M380 470 Q400 480 420 470" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Cheek details - small geometric accents -->
  <g fill="#4fc3f7" opacity="0.3">
    <circle cx="340" cy="400" r="2"/>
    <circle cx="345" cy="410" r="1.5"/>
    <circle cx="335" cy="415" r="1"/>
    <circle cx="460" cy="400" r="2"/>
    <circle cx="455" cy="410" r="1.5"/>
    <circle cx="465" cy="415" r="1"/>
  </g>

  <!-- Jaw definition lines -->
  <g stroke="#4fc3f7" stroke-width="1" fill="none" opacity="0.4">
    <path d="M330 490 Q360 530 400 545"/>
    <path d="M470 490 Q440 530 400 545"/>
  </g>

  <!-- Floating data particles -->
  <g fill="#4fc3f7" opacity="0.5">
    <circle cx="150" cy="150" r="2"/>
    <circle cx="650" cy="150" r="2"/>
    <circle cx="120" cy="350" r="1.5"/>
    <circle cx="680" cy="350" r="1.5"/>
    <circle cx="160" cy="500" r="2"/>
    <circle cx="640" cy="500" r="2"/>
    <circle cx="200" cy="100" r="1.5"/>
    <circle cx="600" cy="100" r="1.5"/>
    <circle cx="100" cy="600" r="1.5"/>
    <circle cx="700" cy="600" r="1.5"/>
    <circle cx="350" cy="80" r="1.5"/>
    <circle cx="450" cy="80" r="1.5"/>
    <circle cx="300" cy="720" r="1.5"/>
    <circle cx="500" cy="720" r="1.5"/>
  </g>

  <!-- Abstract thought/language bubbles - representing communication -->
  <g opacity="0.3" fill="none" stroke="#80deea" stroke-width="1">
    <!-- Left speech element -->
    <rect x="140" y="180" width="60" height="40" rx="8"/>
    <polygon points="185,220 195,235 205,220"/>
    <line x1="155" y1="195" x2="185" y2="195" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="155" y1="205" x2="190" y2="205" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="155" y1="215" x2="175" y2="215" stroke="#4fc3f7" stroke-width="1"/>

    <!-- Right speech element -->
    <rect x="600" y="180" width="60" height="40" rx="8"/>
    <polygon points="615,220 605,235 595,220"/>
    <line x1="615" y1="195" x2="645" y2="195" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="615" y1="205" x2="650" y2="205" stroke="#4fc3f7" stroke-width="1"/>
    <line x1="615" y1="215" x2="635" y2="215" stroke="#4fc3f7" stroke-width="1"/>
  </g>

  <!-- Central glow point on forehead - "third eye" / consciousness -->
  <g filter="url(#bigGlow)">
    <circle cx="400" cy="250" r="6" fill="#80deea" opacity="0.6"/>
  </g>
  <circle cx="400" cy="250" r="3" fill="#ffffff" opacity="0.9"/>

  <!-- Subtle ring around the face -->
  <circle cx="400" cy="390" r="220" fill="none" stroke="#4fc3f7" stroke-width="0.5" opacity="0.15" stroke-dasharray="4 8"/>

  <!-- Corner accents -->
  <g stroke="#4fc3f7" stroke-width="1" opacity="0.3">
    <path d="M30 30 L30 70"/>
    <path d="M30 30 L70 30"/>
    <path d="M770 30 L770 70"/>
    <path d="M770 30 L730 30"/>
    <path d="M30 770 L30 730"/>
    <path d="M30 770 L70 770"/>
    <path d="M770 770 L770 730"/>
    <path d="M770 770 L730 770"/>
  </g>

  <!-- Text - subtle identifier -->
  <text x="400" y="780" text-anchor="middle" fill="#4fc3f7" opacity="0.4" font-family="monospace" font-size="12" letter-spacing="4">A I</text>
</svg>