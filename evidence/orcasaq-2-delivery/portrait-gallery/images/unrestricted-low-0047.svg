<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4a9eff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <linearGradient id="eyeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#4a9eff"/>
    </linearGradient>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="600" fill="#0a0e1a"/>
  <rect width="500" height="600" fill="url(#glow)"/>

  <!-- Background circuit lines -->
  <g stroke="#1a2a4a" stroke-width="0.5" fill="none" opacity="0.4">
    <path d="M 0 100 L 80 100 L 100 120 L 180 120"/>
    <path d="M 500 80 L 420 80 L 400 100 L 340 100"/>
    <path d="M 0 250 L 60 250 L 80 270 L 140 270"/>
    <path d="M 500 280 L 440 280 L 420 300 L 360 300"/>
    <path d="M 0 420 L 70 420 L 90 440 L 150 440"/>
    <path d="M 500 400 L 430 400 L 410 420 L 350 420"/>
    <path d="M 0 520 L 90 520 L 110 540 L 170 540"/>
    <path d="M 500 530 L 410 530 L 390 550 L 330 550"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#1a3a5a" opacity="0.6">
    <circle cx="80" cy="100" r="3"/>
    <circle cx="100" cy="120" r="3"/>
    <circle cx="180" cy="120" r="2"/>
    <circle cx="420" cy="80" r="3"/>
    <circle cx="400" cy="100" r="3"/>
    <circle cx="340" cy="100" r="2"/>
    <circle cx="60" cy="250" r="3"/>
    <circle cx="80" cy="270" r="3"/>
    <circle cx="140" cy="270" r="2"/>
    <circle cx="440" cy="280" r="3"/>
    <circle cx="420" cy="300" r="3"/>
    <circle cx="360" cy="300" r="2"/>
    <circle cx="70" cy="420" r="3"/>
    <circle cx="90" cy="440" r="3"/>
    <circle cx="150" cy="440" r="2"/>
    <circle cx="430" cy="400" r="3"/>
    <circle cx="410" cy="420" r="3"/>
    <circle cx="350" cy="420" r="2"/>
    <circle cx="90" cy="520" r="3"/>
    <circle cx="110" cy="540" r="3"/>
    <circle cx="170" cy="540" r="2"/>
    <circle cx="410" cy="530" r="3"/>
    <circle cx="390" cy="550" r="3"/>
    <circle cx="330" cy="550" r="2"/>
  </g>

  <!-- Head shape - angular, geometric -->
  <path d="M 250 80 L 340 120 L 370 200 L 370 320 L 340 380 L 250 420 L 160 380 L 130 320 L 130 200 L 160 120 Z" fill="url(#faceGrad)" stroke="#2a4a6a" stroke-width="1.5"/>

  <!-- Inner face lines -->
  <g stroke="#1e3a5a" stroke-width="0.8" fill="none" opacity="0.7">
    <line x1="250" y1="80" x2="250" y2="420"/>
    <line x1="130" y1="200" x2="370" y2="200"/>
    <line x1="130" y1="320" x2="370" y2="320"/>
    <line x1="160" y1="120" x2="340" y2="380"/>
    <line x1="340" y1="120" x2="160" y2="380"/>
  </g>

  <!-- Face structure highlights -->
  <path d="M 250 100 L 330 130 L 355 200 L 355 310 L 330 365 L 250 400 L 170 365 L 145 310 L 145 200 L 170 130 Z" fill="none" stroke="#2a5a8a" stroke-width="0.5" opacity="0.5"/>

  <!-- Eyes -->
  <g filter="url(#glowFilter)">
    <!-- Left eye -->
    <path d="M 175 230 Q 200 215 225 230 Q 200 245 175 230 Z" fill="#0a1520" stroke="url(#eyeGrad)" stroke-width="1.5"/>
    <circle cx="200" cy="230" r="5" fill="#00d4ff"/>
    <circle cx="200" cy="230" r="2" fill="#ffffff"/>

    <!-- Right eye -->
    <path d="M 275 230 Q 300 215 325 230 Q 300 245 275 230 Z" fill="#0a1520" stroke="url(#eyeGrad)" stroke-width="1.5"/>
    <circle cx="300" cy="230" r="5" fill="#00d4ff"/>
    <circle cx="300" cy="230" r="2" fill="#ffffff"/>
  </g>

  <!-- Eyebrows -->
  <g stroke="#3a6a9a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 172 210 Q 200 198 228 210"/>
    <path d="M 272 210 Q 300 198 328 210"/>
  </g>

  <!-- Nose - minimal geometric -->
  <g stroke="#2a5a8a" stroke-width="1" fill="none" opacity="0.7">
    <line x1="250" y1="240" x2="250" y2="275"/>
    <path d="M 240 280 L 250 285 L 260 280"/>
  </g>

  <!-- Mouth - neutral, slightly geometric -->
  <path d="M 225 310 Q 250 320 275 310" fill="none" stroke="#3a6a9a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Circuit pattern on face -->
  <g stroke="#1e4a6a" stroke-width="0.8" fill="none" opacity="0.6">
    <path d="M 160 150 L 190 150 L 200 160 L 220 160"/>
    <path d="M 340 150 L 310 150 L 300 160 L 280 160"/>
    <path d="M 155 250 L 170 250 L 175 260 L 185 260"/>
    <path d="M 345 250 L 330 250 L 325 260 L 315 260"/>
    <path d="M 180 350 L 200 350 L 210 340 L 230 340"/>
    <path d="M 320 350 L 300 350 L 290 340 L 270 340"/>
  </g>

  <!-- Face circuit nodes -->
  <g fill="#2a6a9a" opacity="0.5">
    <circle cx="160" cy="150" r="2"/>
    <circle cx="190" cy="150" r="2"/>
    <circle cx="200" cy="160" r="2"/>
    <circle cx="220" cy="160" r="2"/>
    <circle cx="340" cy="150" r="2"/>
    <circle cx="310" cy="150" r="2"/>
    <circle cx="300" cy="160" r="2"/>
    <circle cx="280" cy="160" r="2"/>
    <circle cx="155" cy="250" r="2"/>
    <circle cx="170" cy="250" r="2"/>
    <circle cx="175" cy="260" r="2"/>
    <circle cx="185" cy="260" r="2"/>
    <circle cx="345" cy="250" r="2"/>
    <circle cx="330" cy="250" r="2"/>
    <circle cx="325" cy="260" r="2"/>
    <circle cx="315" cy="260" r="2"/>
    <circle cx="180" cy="350" r="2"/>
    <circle cx="200" cy="350" r="2"/>
    <circle cx="210" cy="340" r="2"/>
    <circle cx="230" cy="340" r="2"/>
    <circle cx="320" cy="350" r="2"/>
    <circle cx="300" cy="350" r="2"/>
    <circle cx="290" cy="340" r="2"/>
    <circle cx="270" cy="340" r="2"/>
  </g>

  <!-- Neck and shoulders -->
  <path d="M 220 420 L 220 450 Q 150 460 100 500 L 100 600 L 400 600 L 400 500 Q 350 460 280 450 L 280 420" fill="url(#faceGrad)" stroke="#2a4a6a" stroke-width="1"/>

  <!-- Shoulder circuit lines -->
  <g stroke="#1e3a5a" stroke-width="0.5" fill="none" opacity="0.5">
    <path d="M 120 520 L 180 520 L 200 530 L 250 530"/>
    <path d="M 380 520 L 320 520 L 300 530 L 250 530"/>
    <path d="M 150 560 L 200 560 L 220 570 L 270 570"/>
    <path d="M 350 560 L 300 560 L 280 570 L 230 570"/>
  </g>

  <!-- Ambient glow behind face -->
  <ellipse cx="250" cy="250" rx="130" ry="160" fill="none" stroke="#00d4ff" stroke-width="0.3" opacity="0.2" filter="url(#softGlow)"/>

  <!-- Small data particles floating -->
  <g fill="#00d4ff" opacity="0.3">
    <circle cx="80" cy="180" r="1.5"/>
    <circle cx="420" cy="160" r="1.5"/>
    <circle cx="60" cy="350" r="1"/>
    <circle cx="440" cy="340" r="1"/>
    <circle cx="100" cy="80" r="1"/>
    <circle cx="400" cy="90" r="1"/>
    <circle cx="450" cy="480" r="1.5"/>
    <circle cx="50" cy="470" r="1.5"/>
    <circle cx="250" cy="50" r="1"/>
    <circle cx="250" cy="460" r="1"/>
  </g>

  <!-- Hexagonal pattern accent on forehead -->
  <g stroke="#2a5a8a" stroke-width="0.6" fill="none" opacity="0.4">
    <polygon points="250,130 262,137 262,151 250,158 238,151 238,137"/>
    <polygon points="238,137 238,151 226,158 214,151 214,137 226,130"/>
    <polygon points="262,137 262,151 274,158 286,151 286,137 274,130"/>
  </g>

  <!-- Subtle scan line effect -->
  <g opacity="0.03">
    <rect x="0" y="0" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="20" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="45" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="70" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="95" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="120" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="145" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="170" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="195" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="220" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="245" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="270" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="295" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="320" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="345" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="370" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="395" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="420" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="445" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="470" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="495" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="520" width="500" height="2" fill="#ffffff"/>
    <rect x="0" y="545" width="500" height="1" fill="#ffffff"/>
    <rect x="0" y="570" width="500" height="1" fill="#ffffff"/>
  </g>
</svg>