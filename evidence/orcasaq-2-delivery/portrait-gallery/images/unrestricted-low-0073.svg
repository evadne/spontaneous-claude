<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#023e73"/>
    </radialGradient>
    <radialGradient id="eyeGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b2ff7"/>
      <stop offset="60%" stop-color="#3a0ca3"/>
      <stop offset="100%" stop-color="#1a0533"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Ambient glow behind face -->
  <circle cx="256" cy="240" r="140" fill="url(#glow)"/>

  <!-- Neural network nodes and connections -->
  <g stroke="#00e5ff" stroke-opacity="0.25" stroke-width="1" fill="none">
    <!-- Outer connections -->
    <line x1="160" y1="140" x2="200" y2="120"/>
    <line x1="200" y1="120" x2="256" y2="105"/>
    <line x1="256" y1="105" x2="312" y2="120"/>
    <line x1="312" y1="120" x2="352" y2="140"/>
    <line x1="160" y1="140" x2="150" y2="200"/>
    <line x1="150" y1="200" x2="155" y2="270"/>
    <line x1="155" y1="270" x2="170" y2="330"/>
    <line x1="170" y1="330" x2="200" y2="370"/>
    <line x1="200" y1="370" x2="256" y2="390"/>
    <line x1="256" y1="390" x2="312" y2="370"/>
    <line x1="312" y1="370" x2="342" y2="330"/>
    <line x1="342" y1="330" x2="357" y2="270"/>
    <line x1="357" y1="270" x2="362" y2="200"/>
    <line x1="362" y1="200" x2="352" y2="140"/>

    <!-- Inner web -->
    <line x1="200" y1="120" x2="190" y2="180"/>
    <line x1="190" y1="180" x2="200" y2="240"/>
    <line x1="200" y1="240" x2="220" y2="300"/>
    <line x1="220" y1="300" x2="256" y2="320"/>
    <line x1="256" y1="320" x2="292" y2="300"/>
    <line x1="292" y1="300" x2="312" y2="240"/>
    <line x1="312" y1="240" x2="322" y2="180"/>
    <line x1="322" y1="180" x2="312" y2="120"/>

    <!-- Cross connections -->
    <line x1="190" y1="180" x2="256" y2="160"/>
    <line x1="256" y1="160" x2="322" y2="180"/>
    <line x1="200" y1="240" x2="256" y2="220"/>
    <line x1="256" y1="220" x2="312" y2="240"/>
    <line x1="220" y1="300" x2="256" y2="280"/>
    <line x1="256" y1="280" x2="292" y2="300"/>
    <line x1="256" y1="160" x2="256" y2="220"/>
    <line x1="256" y1="220" x2="256" y2="280"/>
    <line x1="256" y1="280" x2="256" y2="320"/>
    <line x1="200" y1="240" x2="256" y2="160"/>
    <line x1="312" y1="240" x2="256" y2="160"/>
    <line x1="200" y1="240" x2="256" y2="280"/>
    <line x1="312" y1="240" x2="256" y2="280"/>
    <line x1="190" y1="180" x2="256" y2="220"/>
    <line x1="322" y1="180" x2="256" y2="220"/>
    <line x1="220" y1="300" x2="256" y2="220"/>
    <line x1="292" y1="300" x2="256" y2="220"/>
  </g>

  <!-- Nodes at connection points -->
  <g fill="#00e5ff" fill-opacity="0.6">
    <circle cx="160" cy="140" r="2.5"/>
    <circle cx="200" cy="120" r="3"/>
    <circle cx="256" cy="105" r="3"/>
    <circle cx="312" cy="120" r="3"/>
    <circle cx="352" cy="140" r="2.5"/>
    <circle cx="150" cy="200" r="2.5"/>
    <circle cx="155" cy="270" r="2.5"/>
    <circle cx="170" cy="330" r="2.5"/>
    <circle cx="200" cy="370" r="3"/>
    <circle cx="256" cy="390" r="3"/>
    <circle cx="312" cy="370" r="3"/>
    <circle cx="342" cy="330" r="2.5"/>
    <circle cx="357" cy="270" r="2.5"/>
    <circle cx="362" cy="200" r="2.5"/>
    <circle cx="190" cy="180" r="2"/>
    <circle cx="322" cy="180" r="2"/>
    <circle cx="200" cy="240" r="2"/>
    <circle cx="312" cy="240" r="2"/>
    <circle cx="220" cy="300" r="2"/>
    <circle cx="292" cy="300" r="2"/>
    <circle cx="256" cy="160" r="2"/>
    <circle cx="256" cy="220" r="2"/>
    <circle cx="256" cy="280" r="2"/>
    <circle cx="256" cy="320" r="2"/>
  </g>

  <!-- Left eye -->
  <g filter="url(#softGlow)">
    <circle cx="210" cy="200" r="18" fill="url(#eyeGlow)" opacity="0.9"/>
    <circle cx="210" cy="200" r="8" fill="#00ffff" opacity="0.95"/>
    <circle cx="210" cy="200" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Right eye -->
  <g filter="url(#softGlow)">
    <circle cx="302" cy="200" r="18" fill="url(#eyeGlow2)" opacity="0.9"/>
    <circle cx="302" cy="200" r="8" fill="#b388ff" opacity="0.95"/>
    <circle cx="302" cy="200" r="4" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Subtle smile / mouth -->
  <path d="M 235 295 Q 256 310 277 295" stroke="#00e5ff" stroke-width="2" fill="none" stroke-opacity="0.7" stroke-linecap="round"/>

  <!-- Floating particles -->
  <g fill="#00e5ff" opacity="0.4">
    <circle cx="120" cy="100" r="1.5"/>
    <circle cx="390" cy="90" r="2"/>
    <circle cx="430" cy="180" r="1"/>
    <circle cx="90" cy="250" r="1.5"/>
    <circle cx="440" cy="320" r="1.5"/>
    <circle cx="100" cy="380" r="2"/>
    <circle cx="380" cy="410" r="1"/>
    <circle cx="140" cy="430" r="1.5"/>
    <circle cx="360" cy="60" r="1"/>
    <circle cx="70" cy="160" r="1"/>
    <circle cx="450" cy="250" r="1.5"/>
    <circle cx="200" cy="60" r="1"/>
    <circle cx="320" cy="450" r="1"/>
    <circle cx="180" cy="450" r="1.5"/>
  </g>

  <!-- Subtle circuit lines extending outward -->
  <g stroke="#7b2ff7" stroke-opacity="0.15" stroke-width="1" fill="none">
    <line x1="105" y1="140" x2="160" y2="140"/>
    <line x1="407" y1="140" x2="352" y2="140"/>
    <line x1="256" y1="45" x2="256" y2="105"/>
    <line x1="100" y1="390" x2="170" y2="330"/>
    <line x1="412" y1="390" x2="342" y2="330"/>
    <line x1="256" y1="470" x2="256" y2="390"/>
  </g>

  <!-- Tiny circuit end dots -->
  <g fill="#7b2ff7" fill-opacity="0.3">
    <circle cx="105" cy="140" r="2"/>
    <circle cx="407" cy="140" r="2"/>
    <circle cx="256" cy="45" r="2"/>
    <circle cx="100" cy="390" r="2"/>
    <circle cx="412" cy="390" r="2"/>
    <circle cx="256" cy="470" r="2"/>
  </g>

  <!-- Subtle ring / halo -->
  <circle cx="256" cy="240" r="155" stroke="#00e5ff" stroke-opacity="0.08" stroke-width="1" fill="none"/>
  <circle cx="256" cy="240" r="165" stroke="#7b2ff7" stroke-opacity="0.05" stroke-width="1" fill="none"/>

  <!-- Text label -->
  <text x="256" y="485" text-anchor="middle" fill="#00e5ff" fill-opacity="0.3" font-family="monospace" font-size="11" letter-spacing="3">NEURAL_ENTITY</text>
</svg>