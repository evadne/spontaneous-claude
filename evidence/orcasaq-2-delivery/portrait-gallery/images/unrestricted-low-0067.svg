<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" rx="20" fill="#1a1a2e"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="85" rx="45" ry="50" fill="#d97757"/>
  
  <!-- Eyes -->
  <ellipse cx="82" cy="80" rx="6" ry="7" fill="#1a1a2e"/>
  <ellipse cx="118" cy="80" rx="6" ry="7" fill="#1a1a2e"/>
  
  <!-- Eye highlights -->
  <circle cx="84" cy="77" r="2" fill="#ffffff" opacity="0.8"/>
  <circle cx="120" cy="77" r="2" fill="#ffffff" opacity="0.8"/>
  
  <!-- Smile -->
  <path d="M 85 102 Q 100 112 115 102" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Body / shoulders -->
