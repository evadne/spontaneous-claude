  <ellipse cx="128" cy="93" rx="7" ry="4" fill="#e8956f" opacity="0.5"/>
  
  <!-- Small sparkles suggesting thought/AI -->
  <circle cx="155" cy="50" r="3" fill="#f0c8a8" opacity="0.6"/>
  <circle cx="165" cy="38" r="2" fill="#f0c8a8" opacity="0.4"/>
  <circle cx="148" cy="35" r="1.5" fill="#f0c8a8" opacity="0.5"/>
  
  <circle cx="40" cy="45" r="2.5" fill="#f0c8a8" opacity="0.5"/>
  <circle cx="32" cy="58" r="1.5" fill="#f0c8a8" opacity="0.4"/>
