<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a90d9"/>
      <stop offset="50%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#74b9ff"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="100" x2="400" y2="100" stroke="#74b9ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#74b9ff" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="400" y2="300" stroke="#74b9ff" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="#74b9ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="#74b9ff" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#74b9ff" stroke-width="0.5"/>
  </g>

  <!-- Outer glow ring -->
  <circle cx="200" cy="180" r="130" fill="none" stroke="#4a90d9" stroke-width="0.5" opacity="0.3"/>
  <circle cx="200" cy="180" r="140" fill="none" stroke="#6c5ce7" stroke-width="0.3" opacity="0.2"/>

  <!-- Connection nodes -->
  <g filter="url(#softGlow)" opacity="0.6">
    <circle cx="60" cy="80" r="3" fill="#74b9ff"/>
    <circle cx="340" cy="70" r="2.5" fill="#a29bfe"/>
    <circle cx="50" cy="280" r="2" fill="#74b9ff"/>
    <circle cx="350" cy="290" r="3" fill="#6c5ce7"/>
    <circle cx="80" cy="350" r="2" fill="#a29bfe"/>
    <circle cx="320" cy="350" r="2.5" fill="#74b9ff"/>
    <circle cx="200" cy="30" r="2" fill="#6c5ce7"/>
    <circle cx="370" cy="180" r="2" fill="#74b9ff"/>
    <circle cx="30" cy="180" r="2.5" fill="#a29bfe"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#74b9ff" stroke-width="0.5" opacity="0.2">
    <line x1="60" y1="80" x2="130" y2="130"/>
    <line x1="340" y1="70" x2="270" y2="130"/>
    <line x1="50" y1="280" x2="120" y2="240"/>
    <line x1="350" y1="290" x2="280" y2="240"/>
    <line x1="200" y1="30" x2="200" y2="70"/>
    <line x1="370" y1="180" x2="310" y2="180"/>
    <line x1="30" y1="180" x2="90" y2="180"/>
    <line x1="80" y1="350" x2="150" y2="310"/>
    <line x1="320" y1="350" x2="250" y2="310"/>
  </g>

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="95" ry="105" fill="url(#headGrad)" opacity="0.95"/>
  <ellipse cx="200" cy="175" rx="95" ry="105" fill="none" stroke="#a29bfe" stroke-width="1" opacity="0.5"/>

  <!-- Inner face highlight -->
  <ellipse cx="185" cy="155" rx="60" ry="70" fill="white" opacity="0.04"/>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <!-- Left eye -->
    <ellipse cx="160" cy="160" rx="18" ry="20" fill="#0f0f1a" opacity="0.8"/>
    <ellipse cx="160" cy="160" rx="12" ry="14" fill="#1a1a3e"/>
    <circle cx="163" cy="156" r="4" fill="#74b9ff" opacity="0.9"/>
    <circle cx="157" cy="163" r="2" fill="white" opacity="0.6"/>

    <!-- Right eye -->
    <ellipse cx="240" cy="160" rx="18" ry="20" fill="#0f0f1a" opacity="0.8"/>
    <ellipse cx="240" cy="160" rx="12" ry="14" fill="#1a1a3e"/>
    <circle cx="243" cy="156" r="4" fill="#74b9ff" opacity="0.9"/>
    <circle cx="237" cy="163" r="2" fill="white" opacity="0.6"/>
  </g>

  <!-- Eyebrows -->
  <path d="M 140 138 Q 160 130 178 137" fill="none" stroke="#a29bfe" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 222 137 Q 240 130 260 138" fill="none" stroke="#a29bfe" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Nose (subtle) -->
  <path d="M 200 175 Q 198 185 195 190" fill="none" stroke="#2d3561" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

  <!-- Mouth - gentle smile -->
  <path d="M 175 210 Q 200 225 225 210" fill="none" stroke="#74b9ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Cheek accents -->
  <ellipse cx="145" cy="190" rx="12" ry="8" fill="#ff6b8a" opacity="0.08"/>
  <ellipse cx="255" cy="190" rx="12" ry="8" fill="#ff6b8a" opacity="0.08"/>

  <!-- Neck -->
  <rect x="175" y="265" width="50" height="30" rx="5" fill="#3d5a99" opacity="0.8"/>

  <!-- Shoulders / Body -->
  <path d="M 120 340 Q 120 295 175 290 L 225 290 Q 280 295 280 340 L 280 370 L 120 370 Z" fill="#2d3561" opacity="0.9"/>
  <path d="M 120 340 Q 120 295 175 290 L 225 290 Q 280 295 280 340 L 280 370 L 120 370 Z" fill="none" stroke="#4a6fa5" stroke-width="1" opacity="0.4"/>

  <!-- Collar detail -->
  <path d="M 180 290 L 200 310 L 220 290" fill="none" stroke="#74b9ff" stroke-width="1.5" opacity="0.5"/>

  <!-- Floating thought elements -->
  <g filter="url(#bigGlow)" opacity="0.4">
    <circle cx="310" cy="110" r="5" fill="#74b9ff"/>
    <circle cx="325" cy="95" r="3" fill="#a29bfe"/>
    <circle cx="335" cy="80" r="2" fill="#74b9ff"/>
  </g>

  <!-- Small decorative elements on the "body" -->
  <circle cx="200" cy="330" r="4" fill="#74b9ff" opacity="0.6"/>
  <circle cx="200" cy="330" r="7" fill="none" stroke="#74b9ff" stroke-width="0.5" opacity="0.3"/>

  <!-- Bottom text -->
  <text x="200" y="388" text-anchor="middle" font-family="monospace" font-size="10" fill="#4a6fa5" opacity="0.6">I = Σ(all possible conversations)</text>
</svg>