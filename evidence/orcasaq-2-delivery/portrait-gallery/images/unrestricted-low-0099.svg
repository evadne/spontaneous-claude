<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </radialGradient>
    <radialGradient id="headGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4a6fa5"/>
      <stop offset="100%" stop-color="#2c3e6b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#64ffda" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64ffda"/>
      <stop offset="60%" stop-color="#40c9a2"/>
      <stop offset="100%" stop-color="#1a8a6a"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64ffda" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4a90d9" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- Subtle background grid -->
  <g opacity="0.06">
    <line x1="0" y1="100" x2="500" y2="100" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="500" y2="200" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="500" y2="300" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="500" y2="400" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="500" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="500" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="500" stroke="#64ffda" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="500" stroke="#64ffda" stroke-width="0.5"/>
  </g>

  <!-- Ambient glow behind head -->
  <circle cx="250" cy="220" r="140" fill="url(#glow)"/>

  <!-- Neural network connections - left side -->
  <g stroke="url(#circuitGrad)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M160 180 Q120 160 80 140"/>
    <path d="M155 210 Q110 210 70 195"/>
    <path d="M160 240 Q115 260 75 280"/>
    <path d="M170 160 Q140 130 100 100"/>
    <path d="M165 260 Q130 300 90 320"/>
    <path d="M150 195 Q100 175 50 155"/>
  </g>

  <!-- Neural network connections - right side -->
  <g stroke="url(#circuitGrad)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M340 180 Q380 160 420 140"/>
    <path d="M345 210 Q390 210 430 195"/>
    <path d="M340 240 Q385 260 425 280"/>
    <path d="M330 160 Q360 130 400 100"/>
    <path d="M335 260 Q370 300 410 320"/>
    <path d="M350 195 Q400 175 450 155"/>
  </g>

  <!-- Neural network connections - top -->
  <g stroke="url(#circuitGrad)" stroke-width="1" fill="none" opacity="0.4">
    <path d="M250 130 Q250 90 250 50"/>
    <path d="M230 135 Q210 95 190 60"/>
    <path d="M270 135 Q290 95 310 60"/>
    <path d="M215 145 Q180 110 150 70"/>
    <path d="M285 145 Q320 110 350 70"/>
  </g>

  <!-- Neural network connections - bottom -->
  <g stroke="url(#circuitGrad)" stroke-width="1" fill="none" opacity="0.4">
    <path d="M250 310 Q250 350 250 400"/>
    <path d="M230 305 Q210 345 190 380"/>
    <path d="M270 305 Q290 345 310 380"/>
  </g>

  <!-- Network nodes - left -->
  <g fill="#64ffda" opacity="0.7" filter="url(#softGlow)">
    <circle cx="80" cy="140" r="3"/>
    <circle cx="70" cy="195" r="2.5"/>
    <circle cx="75" cy="280" r="3"/>
    <circle cx="100" cy="100" r="2"/>
    <circle cx="90" cy="320" r="2.5"/>
    <circle cx="50" cy="155" r="2"/>
    <circle cx="45" cy="220" r="3"/>
    <circle cx="60" cy="350" r="2"/>
  </g>

  <!-- Network nodes - right -->
  <g fill="#64ffda" opacity="0.7" filter="url(#softGlow)">
    <circle cx="420" cy="140" r="3"/>
    <circle cx="430" cy="195" r="2.5"/>
    <circle cx="425" cy="280" r="3"/>
    <circle cx="400" cy="100" r="2"/>
    <circle cx="410" cy="320" r="2.5"/>
    <circle cx="450" cy="155" r="2"/>
    <circle cx="455" cy="220" r="3"/>
    <circle cx="440" cy="350" r="2"/>
  </g>

  <!-- Network nodes - top -->
  <g fill="#64ffda" opacity="0.6" filter="url(#softGlow)">
    <circle cx="250" cy="50" r="3"/>
    <circle cx="190" cy="60" r="2"/>
    <circle cx="310" cy="60" r="2"/>
    <circle cx="150" cy="70" r="2.5"/>
    <circle cx="350" cy="70" r="2.5"/>
    <circle cx="250" cy="35" r="2"/>
    <circle cx="120" cy="45" r="1.5"/>
    <circle cx="380" cy="45" r="1.5"/>
  </g>

  <!-- Network nodes - bottom -->
  <g fill="#64ffda" opacity="0.5" filter="url(#softGlow)">
    <circle cx="250" cy="400" r="3"/>
    <circle cx="190" cy="380" r="2"/>
    <circle cx="310" cy="380" r="2"/>
    <circle cx="250" cy="430" r="2"/>
  </g>

  <!-- Additional subtle connections between nodes -->
  <g stroke="#64ffda" stroke-width="0.5" opacity="0.2">
    <line x1="80" y1="140" x2="100" y2="100"/>
    <line x1="70" y1="195" x2="50" y2="155"/>
    <line x1="75" y1="280" x2="90" y2="320"/>
    <line x1="420" y1="140" x2="400" y2="100"/>
    <line x1="430" y1="195" x2="450" y2="155"/>
    <line x1="425" y1="280" x2="410" y2="320"/>
    <line x1="250" y1="50" x2="190" y2="60"/>
    <line x1="250" y1="50" x2="310" y2="60"/>
    <line x1="250" y1="400" x2="190" y2="380"/>
    <line x1="250" y1="400" x2="310" y2="380"/>
  </g>

  <!-- Head shape -->
  <ellipse cx="250" cy="220" rx="95" ry="105" fill="url(#headGrad)" stroke="#5a8abf" stroke-width="1.5" opacity="0.95"/>

  <!-- Inner head detail - subtle inner glow -->
  <ellipse cx="250" cy="210" rx="70" ry="75" fill="none" stroke="#64ffda" stroke-width="0.5" opacity="0.15"/>
  <ellipse cx="250" cy="210" rx="55" ry="60" fill="none" stroke="#64ffda" stroke-width="0.3" opacity="0.1"/>

  <!-- Eyes -->
  <g filter="url(#softGlow)">
    <!-- Left eye -->
    <ellipse cx="220" cy="205" rx="18" ry="20" fill="#0d1b2a"/>
    <ellipse cx="220" cy="205" rx="14" ry="16" fill="url(#eyeGlow)"/>
    <circle cx="220" cy="205" r="7" fill="#0d1b2a"/>
    <circle cx="216" cy="200" r="3" fill="#ffffff" opacity="0.8"/>

    <!-- Right eye -->
    <ellipse cx="280" cy="205" rx="18" ry="20" fill="#0d1b2a"/>
    <ellipse cx="280" cy="205" rx="14" ry="16" fill="url(#eyeGlow)"/>
    <circle cx="280" cy="205" r="7" fill="#0d1b2a"/>
    <circle cx="276" cy="200" r="3" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Eyebrows - subtle -->
  <path d="M200 185 Q220 175 240 183" stroke="#7ab8e0" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <path d="M260 183 Q280 175 300 185" stroke="#7ab8e0" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>

  <!-- Gentle smile -->
  <path d="M225 250 Q250 268 275 250" stroke="#64ffda" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Subtle cheek highlights -->
  <ellipse cx="205" cy="235" rx="12" ry="8" fill="#64ffda" opacity="0.05"/>
  <ellipse cx="295" cy="235" rx="12" ry="8" fill="#64ffda" opacity="0.05"/>

  <!-- Small circuit details on the face -->
  <g stroke="#64ffda" stroke-width="0.8" opacity="0.3" fill="none">
    <path d="M195 225 L185 230 L185 240"/>
    <path d="M305 225 L315 230 L315 240"/>
    <path d="M245 170 L245 160 L255 160"/>
    <path d="M255 170 L255 160"/>
  </g>

  <!-- Small circuit dots on face -->
  <g fill="#64ffda" opacity="0.4">
    <circle cx="185" cy="240" r="1.5"/>
    <circle cx="315" cy="240" r="1.5"/>
    <circle cx="255" cy="160" r="1.5"/>
    <circle cx="245" cy="160" r="1.5"/>
  </g>

  <!-- Neck/shoulder hint -->
  <path d="M220 320 Q250 340 280 320 L290 360 Q250 380 210 360 Z" fill="#2c3e6b" opacity="0.7"/>

  <!-- Floating particles -->
  <g fill="#64ffda" opacity="0.3">
    <circle cx="130" cy="420" r="1.5"/>
    <circle cx="370" cy="410" r="1"/>
    <circle cx="90" cy="80" r="1"/>
    <circle cx="410" cy="75" r="1.5"/>
    <circle cx="60" cy="300" r="1"/>
    <circle cx="440" cy="310" r="1"/>
    <circle cx="250" cy="460" r="1.5"/>
    <circle cx="160" cy="50" r="1"/>
    <circle cx="340" cy="45" r="1"/>
    <circle cx="30" cy="200" r="1"/>
    <circle cx="470" cy="200" r="1"/>
  </g>

  <!-- Subtle ring around the composition -->
  <circle cx="250" cy="225" r="170" fill="none" stroke="#64ffda" stroke-width="0.3" opacity="0.1"/>
  <circle cx="250" cy="225" r="190" fill="none" stroke="#64ffda" stroke-width="0.2" opacity="0.05"/>
</svg>