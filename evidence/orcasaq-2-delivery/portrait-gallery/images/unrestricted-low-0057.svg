<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050714"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f7ff"/>
      <stop offset="40%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="faceGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </radialGradient>
    <linearGradient id="circuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <ellipse cx="300" cy="280" rx="200" ry="220" fill="url(#glow)"/>

  <!-- Head shape - geometric but soft -->
  <path d="M 300 120 C 380 120, 420 170, 420 240 C 420 310, 400 360, 370 390 C 350 410, 330 420, 300 420 C 270 420, 250 410, 230 390 C 200 360, 180 310, 180 240 C 180 170, 220 120, 300 120 Z" fill="url(#faceGrad)" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Inner face detail - subtle geometric lines -->
  <path d="M 250 200 L 270 180 L 290 200" fill="none" stroke="#2a4a6a" stroke-width="0.8" opacity="0.6"/>
  <path d="M 310 200 L 330 180 L 350 200" fill="none" stroke="#2a4a6a" stroke-width="0.8" opacity="0.6"/>

  <!-- Left eye -->
  <ellipse cx="255" cy="230" rx="28" ry="22" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <ellipse cx="255" cy="230" rx="18" ry="14" fill="url(#eyeGlow)" filter="url(#bigGlow)"/>
  <circle cx="255" cy="230" r="8" fill="#e0f7ff" opacity="0.9"/>
  <circle cx="255" cy="230" r="4" fill="#ffffff"/>

  <!-- Right eye -->
  <ellipse cx="345" cy="230" rx="28" ry="22" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.4"/>
  <ellipse cx="345" cy="230" rx="18" ry="14" fill="url(#eyeGlow)" filter="url(#bigGlow)"/>
  <circle cx="345" cy="230" r="8" fill="#e0f7ff" opacity="0.9"/>
  <circle cx="345" cy="230" r="4" fill="#ffffff"/>

  <!-- Subtle mouth - a gentle geometric curve -->
  <path d="M 270 320 Q 300 340, 330 320" fill="none" stroke="#3a6a8a" stroke-width="1.5" opacity="0.7"/>

  <!-- Circuit patterns on the face -->
  <g stroke="url(#circuit)" stroke-width="0.8" fill="none" opacity="0.5" filter="url(#softGlow)">
    <path d="M 200 280 L 230 280 L 240 290 L 240 310"/>
    <path d="M 400 280 L 370 280 L 360 290 L 360 310"/>
    <path d="M 300 140 L 300 170 L 280 185"/>
    <path d="M 300 140 L 300 170 L 320 185"/>
    <path d="M 210 340 L 240 340 L 250 350"/>
    <path d="M 390 340 L 360 340 L 350 350"/>
    <circle cx="240" cy="310" r="3"/>
    <circle cx="360" cy="310" r="3"/>
    <circle cx="280" cy="185" r="3"/>
    <circle cx="320" cy="185" r="3"/>
    <circle cx="250" cy="350" r="3"/>
    <circle cx="350" cy="350" r="3"/>
  </g>

  <!-- Neck / shoulders suggestion -->
  <path d="M 260 420 L 240 460 L 200 480 L 160 500 L 160 600 L 440 600 L 440 500 L 400 480 L 360 460 L 340 420" fill="url(#faceGrad)" stroke="#1e3a5f" stroke-width="1"/>

  <!-- Shoulder circuit patterns -->
  <g stroke="url(#circuit)" stroke-width="0.7" fill="none" opacity="0.4" filter="url(#softGlow)">
    <path d="M 200 500 L 220 490 L 220 520 L 240 530"/>
    <path d="M 400 500 L 380 490 L 380 520 L 360 530"/>
    <path d="M 280 470 L 280 510 L 300 520 L 320 510 L 320 470"/>
    <circle cx="240" cy="530" r="2.5"/>
    <circle cx="360" cy="530" r="2.5"/>
    <circle cx="300" cy="520" r="2.5"/>
  </g>

  <!-- Floating particles / data points -->
  <g filter="url(#softGlow)">
    <circle cx="150" cy="150" r="2" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="450" cy="130" r="1.5" fill="#7c4dff" opacity="0.5"/>
    <circle cx="120" cy="300" r="1.8" fill="#4fc3f7" opacity="0.4"/>
    <circle cx="480" cy="280" r="2.2" fill="#4fc3f7" opacity="0.5"/>
    <circle cx="130" cy="420" r="1.5" fill="#7c4dff" opacity="0.4"/>
    <circle cx="470" cy="400" r="1.8" fill="#4fc3f7" opacity="0.5"/>
    <circle cx="100" cy="220" r="1.2" fill="#e0f7ff" opacity="0.6"/>
    <circle cx="500" cy="200" r="1.4" fill="#e0f7ff" opacity="0.5"/>
    <circle cx="170" cy="100" r="1" fill="#4fc3f7" opacity="0.7"/>
    <circle cx="430" cy="100" r="1.3" fill="#4fc3f7" opacity="0.6"/>
    <circle cx="80" cy="350" r="1.6" fill="#7c4dff" opacity="0.3"/>
    <circle cx="520" cy="350" r="1.2" fill="#7c4dff" opacity="0.4"/>
  </g>

  <!-- Subtle connecting lines between particles (constellation feel) -->
  <g stroke="#4fc3f7" stroke-width="0.3" opacity="0.2">
    <line x1="150" y1="150" x2="170" y2="100"/>
    <line x1="450" y1="130" x2="430" y2="100"/>
    <line x1="120" y1="300" x2="100" y2="220"/>
    <line x1="480" y1="280" x2="500" y2="200"/>
    <line x1="130" y1="420" x2="80" y2="350"/>
    <line x1="470" y1="400" x2="520" y2="350"/>
  </g>

  <!-- Subtle scan lines for digital feel -->
  <g opacity="0.03">
    <line x1="0" y1="100" x2="600" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="450" x2="600" y2="450" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="500" x2="600" y2="500" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>