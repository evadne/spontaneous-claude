<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-label="Abstract self-portrait of Claude: a glowing neural network head with orbiting nodes and speech bubbles">
  <title>Claude — abstract neural network self-portrait</title>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241d3a"/>
      <stop offset="55%" stop-color="#31254e"/>
      <stop offset="100%" stop-color="#4b2a5c"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.28)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.12)"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ffb84d" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3e"/>
      <stop offset="55%" stop-color="#ffb84d"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <filter id="bloom" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="soft"/>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGrad)"/>
  <rect width="1200" height="800" fill="url(#vignette)"/>

  <!-- ambient glow -->
  <circle cx="980" cy="140" r="300" fill="url(#nodeGlow)" opacity="0.06"/>

  <!-- faint background dots -->
  <g fill="rgba(255,255,255,0.07)">
    <circle cx="200" cy="150" r="2"/>
    <circle cx="350" cy="120" r="2"/>
    <circle cx="550" cy="110" r="2"/>
    <circle cx="900" cy="150" r="2"/>
    <circle cx="1000" cy="180" r="2"/>
    <circle cx="950" cy="260" r="2"/>
    <circle cx="200" cy="240" r="2"/>
    <circle cx="300" cy="300" r="2"/>
    <circle cx="700" cy="140" r="2"/>
    <circle cx="850" cy="90" r="2"/>
    <circle cx="1050" cy="60" r="2"/>
    <circle cx="1100" cy="200" r="2"/>
    <circle cx="240" cy="560" r="2"/>
    <circle cx="380" cy="640" r="2"/>
    <circle cx="700" cy="300" r="2"/>
    <circle cx="950" cy="420" r="2"/>
    <circle cx="1050" cy="520" r="2"/>
    <circle cx="1150" cy="660" r="2"/>
    <circle cx="110" cy="660" r="2"/>
    <circle cx="60" cy="500" r="2"/>
    <circle cx="180" cy="480" r="2"/>
    <circle cx="520" cy="720" r="2"/>
    <circle cx="900" cy="660" r="2"/>
    <circle cx="1080" cy="700" r="2"/>
    <circle cx="300" cy="120" r="2"/>
  </g>

  <!-- node glows -->
  <g>
    <circle cx="460" cy="190" r="44" fill="url(#nodeGlow)"/>
    <circle cx="740" cy="170" r="44" fill="url(#nodeGlow)"/>
    <circle cx="880" cy="320" r="44" fill="url(#nodeGlow)"/>
    <circle cx="880" cy="520" r="44" fill="url(#nodeGlow)"/>
    <circle cx="750" cy="635" r="44" fill="url(#nodeGlow)"/>
    <circle cx="450" cy="650" r="44" fill="url(#nodeGlow)"/>
    <circle cx="330" cy="420" r="44" fill="url(#nodeGlow)"/>
    <circle cx="520" cy="560" r="44" fill="url(#nodeGlow)"/>
  </g>

  <!-- connections -->
  <g stroke="#7c6cb8" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round">
    <line x1="460" y1="190" x2="740" y2="170"/>
    <line x1="740" y1="170" x2="880" y2="320"/>
    <line x1="880" y1="320" x2="880" y2="520"/>
    <line x1="880" y1="520" x2="750" y2="635"/>
    <line x1="750" y1="635" x2="450" y2="650"/>
    <line x1="450" y1="650" x2="330" y2="420"/>
    <line x1="330" y1="420" x2="520" y2="560"/>
    <line x1="520" y1="560" x2="460" y2="190"/>
    <line x1="460" y1="190" x2="600" y2="370"/>
    <line x1="740" y1="170" x2="600" y2="370"/>
    <line x1="880" y1="320" x2="600" y2="370"/>
    <line x1="880" y1="520" x2="600" y2="370"/>
    <line x1="750" y1="635" x2="600" y2="370"/>
    <line x1="450" y1="650" x2="600" y2="370"/>
    <line x1="330" y1="420" x2="600" y2="370"/>
    <line x1="520" y1="560" x2="600" y2="370"/>
  </g>

  <!-- radiating arcs -->
  <g stroke="#4cc9f0" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 600,220 C 615,190 640,185 665,200"/>
    <path d="M 706,234 C 740,215 775,225 805,250"/>
    <path d="M 748,364 C 790,370 830,400 860,430"/>
    <path d="M 723,284 C 750,340 780,430 810,560"/>
    <path d="M 600,520 C 590,580 585,620 600,645"/>
    <path d="M 451,383 C 420,420 380,440 360,470"/>
    <path d="M 525,500 C 480,490 430,470 400,480"/>
    <path d="M 470,445 C 450,400 420,360 400,340"/>
  </g>

  <!-- nodes -->
  <g>
    <circle cx="460" cy="190" r="22" fill="#ffd166"/>
    <circle cx="740" cy="170" r="22" fill="#ffd166"/>
    <circle cx="880" cy="320" r="22" fill="#ffd166"/>
    <circle cx="880" cy="520" r="22" fill="#ffd166"/>
    <circle cx="750" cy="635" r="22" fill="#ffd166"/>
    <circle cx="450" cy="650" r="22" fill="#ffd166"/>
    <circle cx="330" cy="420" r="22" fill="#ffd166"/>
    <circle cx="520" cy="560" r="22" fill="#ffd166"/>
  </g>

  <!-- head -->
  <g filter="url(#bloom)">
    <circle cx="600" cy="370" r="150" fill="url(#headGrad)" stroke="#ffd166" stroke-width="6"/>
    <circle cx="600" cy="370" r="118" fill="none" stroke="#ff8a3e" stroke-opacity="0.35"/>
    <circle cx="600" cy="370" r="7" fill="#ffffff" fill-opacity="0.7"/>
    <circle cx="556" cy="340" r="8" fill="#ffffff" fill-opacity="0.45"/>
    <circle cx="644" cy="340" r="8" fill="#ffffff" fill-opacity="0.45"/>
    <circle cx="556" cy="400" r="6" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="644" cy="400" r="6" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="600" cy="332" r="9" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="600" cy="408" r="9" fill="#ffffff" fill-opacity="0.4"/>
  </g>

  <!-- speech bubbles -->
  <g>
    <rect x="60" y="620" width="180" height="90" rx="18" fill="#2a2238" stroke="#6b5ca8" stroke-width="2"/>
    <line x1="90" y1="660" x2="210" y2="660" stroke="#c9b3e6" stroke-width="4"/>
    <line x1="90" y1="690" x2="210" y2="690" stroke="#c9b3e6" stroke-width="4"/>
    <line x1="90" y1="720" x2="210" y2="720" stroke="#c9b3e6" stroke-width="4"/>
    <rect x="250" y="610" width="140" height="80" rx="18" fill="#2a2238" stroke="#6b5ca8" stroke-width="2"/>
    <line x1="285" y1="655" x2="365" y2="655" stroke="#c9b3e6" stroke-width="4"/>
  </g>

  <!-- name -->
  <text x="600" y="700" text-anchor="middle" font-size="46" font-weight="800" letter-spacing="6" fill="#ffd166" fill-opacity="0.9">claude</text>

  <!-- stars -->
  <path d="M128,58 L138,84 L170,86 L144,106 L150,132 L128,116 L106,132 L112,106 L88,86 L120,84 Z" fill="#ffd166" fill-opacity="0.85"/>
  <path d="M208,52 L215,72 L229,73 L216,86 L222,102 L208,92 L194,102 L200,86 L187,73 L201,72 Z" fill="#ff9a3e" fill-opacity="0.8"/>
</svg>