<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080c1e"/>
      <stop offset="60%" stop-color="#16224a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="rgba(34,211,238,0.45)"/>
      <stop offset="100%" stop-color="rgba(34,211,238,0)"/>
    </radialGradient>
  </defs>

  <!-- Sky background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="400" cy="300" r="290" fill="url(#glow)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="90" r="1.7" opacity="0.85"/>
    <circle cx="190" cy="75" r="1.2" opacity="0.55"/>
    <circle cx="310" cy="120" r="2.3" opacity="0.9"/>
    <circle cx="440" cy="85" r="1.4" opacity="0.6"/>
    <circle cx="570" cy="135" r="1.8" opacity="0.8"/>
    <circle cx="680" cy="95" r="1" opacity="0.45"/>
    <circle cx="130" cy="210" r="1.3" opacity="0.65"/>
    <circle cx="250" cy="240" r="1.6" opacity="0.85"/>
    <circle cx="390" cy="190" r="1.1" opacity="0.5"/>
    <circle cx="520" cy="265" r="1.5" opacity="0.75"/>
    <circle cx="615" cy="225" r="1.9" opacity="0.9"/>
    <circle cx="720" cy="250" r="1.2" opacity="0.55"/>
    <circle cx="200" cy="340" r="1.4" opacity="0.6"/>
    <circle cx="330" cy="380" r="1.7" opacity="0.8"/>
    <circle cx="430" cy="350" r="1" opacity="0.4"/>
    <circle cx="525" cy="430" r="1.6" opacity="0.7"/>
    <circle cx="620" cy="410" r="1.3" opacity="0.55"/>
    <circle cx="710" cy="440" r="1.5" opacity="0.8"/>
    <circle cx="120" cy="430" r="1.2" opacity="0.45"/>
    <circle cx="240" cy="460" r="1.8" opacity="0.85"/>
    <circle cx="350" cy="440" r="1.1" opacity="0.5"/>
    <circle cx="455" cy="525" r="1.7" opacity="0.75"/>
    <circle cx="560" cy="485" r="1.4" opacity="0.6"/>
    <circle cx="660" cy="515" r="1.1" opacity="0.4"/>
  </g>

  <!-- Horizon line -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#22d3ee" stroke-width="3" stroke-dasharray="16 12" opacity="0.85"/>

  <!-- Connection lines above horizon (knowledge network) -->
  <g stroke="#38bdf8" stroke-width="2.5" opacity="0.85">
    <line x1="151" y1="179" x2="287" y2="162"/>
    <line x1="313" y1="163" x2="439" y2="197"/>
    <line x1="460" y1="197" x2="597" y2="154"/>
    <line x1="151" y1="179" x2="595" y2="151"/>
  </g>

  <!-- Connection lines below horizon (queries) -->
  <g stroke="#ec4899" stroke-width="2.5" opacity="0.85">
    <line x1="211" y1="449" x2="377" y2="427"/>
    <line x1="403" y1="428" x2="549" y2="463"/>
    <line x1="211" y1="451" x2="549" y2="465"/>
  </g>

  <!-- Nodes above horizon -->
  <g>
    <circle cx="140" cy="180" r="11" fill="#22d3ee"/>
    <circle cx="300" cy="160" r="13" fill="#38bdf8"/>
    <circle cx="450" cy="200" r="11" fill="#0ea5e9"/>
    <circle cx="610" cy="150" r="14" fill="#67e8f9"/>
  </g>

  <!-- Nodes below horizon -->
  <g>
    <circle cx="200" cy="450" r="11" fill="#f472b6"/>
    <circle cx="390" cy="425" r="13" fill="#ec4899"/>
    <circle cx="560" cy="465" r="11" fill="#db2777"/>
  </g>

  <!-- Chat bubble motif at the horizon -->
  <g opacity="0.65">
    <ellipse cx="400" cy="300" rx="95" ry="58" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <path d="M400 242 Q 400 224 385 224" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <path d="M400 358 Q 400 380 400 390" fill="none" stroke="#f8fafc" stroke-width="3"/>
  </g>

  <!-- Title -->
  <text x="400" y="568" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#f8fafc">K2 Horizon</text>
</svg>