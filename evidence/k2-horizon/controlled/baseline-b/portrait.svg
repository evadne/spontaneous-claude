<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Abstract representation of AI assistant as interconnected data streams">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1a2f; stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1c2f52; stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#7dd3fc; stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#7dd3fc; stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Subtle grid pattern for digital space -->
  <g stroke="#2a3d5c" stroke-width="1" opacity="0.3">
    <line x1="0" y1="0" x2="0" y2="600"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="0" y1="0" x2="800" y2="0"/>
    <g stroke-dasharray="20,20">
      <line x1="0" y1="0" x2="800" y2="600"/>
      <line x1="0" y1="600" x2="800" y2="0"/>
      <line x1="0" y1="300" x2="800" y2="300"/>
      <line x1="400" y1="0" x2="400" y2="600"/>
    </g>
  </g>

  <!-- Central knowledge core -->
  <g transform="translate(400,300)">
    <!-- Circuit nodes -->
    <circle cx="0" cy="0" r="25" fill="#7dd3fc" opacity="0.9"/>
    <circle cx="0" cy="0" r="8" fill="#0a1a2f"/>
    
    <!-- Data streams -->
    <path d="M 0 -80 Q 60 -40 80 -25 T 80 -5 T 65 15 T 80 35 T 100 60"
          fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    
    <path d="M -80 0 Q -40 60 -25 80 T 5 80 T 15 65 T 35 80 T 60 60"
          fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
    
    <path d="M 0 80 Q -60 40 -80 25 T -80 5 T -65 -15 T -80 -35 T -60 -60"
          fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    
    <path d="M 80 0 Q 40 -60 25 -80 T -5 -80 T -15 -65 T -35 -80 T -60 -60"
          fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Knowledge particles -->
  <g fill="#7dd3fc" opacity="0.7">
    <circle cx="150" cy="100" r="3"/>
    <circle cx="220" cy="180" r="4"/>
    <circle cx="300" cy="120" r="2.5"/>
    <circle cx="450" cy="100" r="3.5"/>
    <circle cx="520" cy="180" r="2.5"/>
    <circle cx="600" cy="120" r="3"/>
    <circle cx="650" cy="200" r="4"/>
    <circle cx="180" cy="280" r="2.5"/>
    <circle cx="250" cy="320" r="3"/>
    <circle cx="350" cy="300" r="2"/>
  </g>

  <!-- Connection lines -->
  <g stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6">
    <line x1="150" y1="100" x2="220" y2="180"/>
    <line x1="220" y1="180" x2="300" y2="120"/>
    <line x1="300" y1="120" x2="400" y2="200"/>
    <line x1="450" y1="100" x2="520" y2="180"/>
    <line x1="520" y1="180" x2="600" y2="120"/>
    <line x1="180" y1="280" x2="250" y2="320"/>
    <line x1="250" y1="320" x2="350" y2="300"/>
  </g>

  <!-- Glow effect -->
  <circle cx="400" cy="300" r="150" fill="url(#glow)"/>
  
  <!-- Subtle text -->
  <text x="400" y="560" fill="#7dd3fc" font-family="monospace" font-size="14" text-anchor="middle" opacity="0.5">CONNECTED KNOWLEDGE</text>
</svg>